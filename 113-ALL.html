<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金融職業道德與常識 - 智能錯題循環系統 (修正版)</title>
    <style>
        /* --- 基礎樣式 --- */
        body { font-family: "Microsoft JhengHei", "Segoe UI", Arial, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; padding-bottom: 80px; }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        
        /* 頂部資訊列 */
        .info-bar {
            background: #fff; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-top: 5px solid #3498db;
        }
        .pool-info { font-size: 1em; }
        .reset-btn { background-color: #95a5a6; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; transition: 0.2s; }
        .reset-btn:hover { background-color: #7f8c8d; }

        /* 模式標籤 */
        .mode-badge {
            display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 0.8em; margin-bottom: 5px; color: white; font-weight: bold;
        }
        .mode-normal { background-color: #2ecc71; } /* 綠色：一般模式 */
        .mode-review { background-color: #e67e22; } /* 橘色：錯題模式 */

        /* 題目卡片 */
        .question-card {
            background: white; margin-bottom: 20px; padding: 25px; border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); border: 1px solid #eee;
        }
        .q-header { margin-bottom: 15px; line-height: 1.5; font-size: 1.15em; font-weight: bold; color: #2c3e50; }
        
        /* 題號標籤 */
        .q-index { color: #e74c3c; margin-right: 5px; font-size: 1.2em; }
        .q-tag {
            display: inline-block; font-size: 0.75em; font-weight: normal; color: #2980b9;
            background-color: #eaf2f8; padding: 2px 8px; border-radius: 12px;
            border: 1px solid #d6eaf8; margin-right: 8px; vertical-align: middle; transform: translateY(-2px);
        }

        /* 選項按鈕 (垂直排列) */
        .option-btn {
            display: block; width: 100%; padding: 12px 15px; margin-bottom: 10px;
            border: 2px solid #e9ecef; background-color: #fff; border-radius: 8px;
            cursor: pointer; text-align: left; font-size: 1em; color: #555; transition: 0.2s;
        }
        .option-btn:hover:not(.disabled) { background-color: #f1f3f5; border-color: #ced4da; }
        .option-btn.correct { background-color: #d4edda; border-color: #28a745; color: #155724; font-weight: bold; }
        .option-btn.wrong { background-color: #f8d7da; border-color: #dc3545; color: #721c24; text-decoration: line-through; }
        .option-btn.disabled { cursor: default; opacity: 0.7; pointer-events: none; }

        /* 解析區 */
        .explanation {
            display: none; margin-top: 15px; padding: 15px; border-radius: 8px;
            background-color: #fff3cd; border-left: 5px solid #ffc107; color: #856404;
            font-size: 0.95em; line-height: 1.6;
        }

        /* 底部操作區 */
        .action-buttons { text-align: center; margin-top: 30px; }
        .main-btn {
            padding: 12px 35px; font-size: 1.1em; border: none; border-radius: 30px; cursor: pointer;
            background-color: #3498db; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.2); margin: 10px;
            transition: background 0.3s;
        }
        .main-btn:hover { background-color: #2980b9; }
        .download-btn { background-color: #e74c3c; }
        .download-btn:hover { background-color: #c0392b; }

        /* 報告區 */
        #report-section {
            display: none; margin-top: 30px; background: white; padding: 30px;
            border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); border-top: 6px solid #34495e;
        }
        .report-score { font-size: 2.5em; color: #e74c3c; font-weight: bold; text-align: center; margin: 10px 0; }
        .report-list { list-style: none; padding: 0; }
        .report-item { padding: 15px; border-bottom: 1px solid #eee; }
        .report-item.wrong-item { background-color: #fff5f5; border-left: 4px solid #e74c3c; }
    </style>
</head>
<body>

<div class="container">
    <h1>金融職道德與常識 - 智能錯題循環</h1>
    
    <div class="info-bar">
        <div class="pool-info">
            <div id="mode-display"></div>
            <div id="quiz-info-text" style="font-size: 1.2em; margin: 5px 0;">本卷題數：<strong>載入中...</strong></div>
            <div id="pool-status" style="font-size: 0.85em; color: #7f8c8d;"></div>
            <div id="wrong-accumulate" style="font-size: 0.85em; color: #e74c3c; font-weight:bold;"></div>
        </div>
        <button class="reset-btn" onclick="resetPool()">↺ 重置所有進度</button>
    </div>

    <div id="quiz-list"></div>

    <div class="action-buttons" id="submit-area">
        <button class="main-btn" onclick="showReport()">交卷並查看錯題</button>
    </div>

    <div id="report-section">
        <h2 style="text-align:center; margin-bottom:5px;">測驗結果</h2>
        <div id="final-score-text" class="report-score">0 分</div>
        <p style="text-align:center; color:#999;" id="report-time"></p>
        <div style="text-align:center; color:#e74c3c; font-weight:bold; margin-bottom:20px;">(以下僅列出 ❌ 答錯 及 ⚠️ 未作答 題目)</div>
        
        <div id="report-content"></div>
        
        <div class="action-buttons">
            <button class="main-btn download-btn" onclick="downloadWrongOnly()">下載錯題記錄 (.txt)</button>
            <button class="main-btn" onclick="window.location.reload()">抽取下一卷</button>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // 1. 設定區
    // ============================================================
    const QUIZ_SIZE = 100;        // 每次抽 100 題
    const SCORE_PER_QUESTION = 1; // 每題 1 分
    
    // ============================================================
    // 2. 題庫資料區 (請將您的 1114 題完整貼入下方)
    // ============================================================
    const allQuestionsSource = [
        // --- 請把 const questions = [...] 的內容貼在這裡 ---
        // --- 以下為示意範例，請務必替換 ---
{id: "金融市場常識-1", text: "下列何者不是金融市場的主要功能？", options: ["(1)提供金融工具交易的場所", "(2)擔任資金需求者與供給者的橋樑", "(3)促進投資活動的效率，提升經濟發展", "(4)提供交易者投機的場所"], ans: 4, note: "金融市場的主要功能為資金調度、價格發現、風險管理與降低交易成本。提供投機場所並非其「主要」設立目的，而是市場運作的附帶現象。", law: "金融市場概論"},
{id: "金融市場常識-2", text: "下列何者不是金融市場交易的工具？", options: ["(1)商業本票", "(2)銀行存款", "(3)股票", "(4)古董與藝術品"], ans: 4, note: "古董與藝術品屬於實質資產(Real Assets)，非金融資產或金融工具。", law: "金融工具定義"},
{id: "金融市場常識-3", text: "當金融市場管理的品質較佳時，企業發行的 金融產品 成本會 ______，金融工具的流動性會______。", options: ["(1)較低，較低", "(2)較高，較低", "(3)較低，較高", "(4)較高，較高"], ans: 3, note: "市場效率高、資訊透明且管理佳，能降低資訊不對稱與交易成本，使發行成本降低，並提高交易流動性。", law: "市場效率理論"},
{id: "金融市場常識-4", text: "當企業需要資金來進行投資，最好不要用下列何種方式尋求融通？", options: ["(1)向銀行借錢", "(2)發行股票", "(3)發行債券", "(4)向地下錢莊借錢"], ans: 4, note: "地下錢莊非合法金融機構，利率極高且無法律保障，風險極大。", law: "理財規劃實務"},
{id: "金融市場常識-5", text: "下列何者不是近年來國內主管機關管理金融市場自由化的發展方向？", options: ["(1)減少法規的限制", "(2)鼓勵金融創新", "(3)對國外資金進行更嚴格的限制與管理", "(4)加強國際金融的流通"], ans: 3, note: "金融自由化趨勢為解除不必要的管制、開放市場。對國外資金進行更嚴格限制與自由化方向背道而馳。", law: "金融發展政策"},
{id: "金融市場常識-6", text: "在金融市場中主管機關訂定法律規範的目的在於：", options: ["(1)增加政府的收入", "(2)促進金融市場健全發展與有效經營", "(3)增加金融機構的進入障礙", "(4)提高金融機構的經營成本"], ans: 2, note: "金融監理的主要目的在於維持金融穩定、保障投資人權益及促進市場健全發展。", law: "金融監理概論"},
{id: "金融市場常識-7", text: "目前國內監理銀行、票券、證券及保險等金融機構的主管機關為：", options: ["(1)財政部", "(2)內政部", "(3)金融監督管理委員會", "(4)經濟部"], ans: 3, note: "我國於民國93年成立金融監督管理委員會(金管會)，統一監理銀行、證券、保險等金融產業。", law: "金融監督管理委員會組織法"},
{id: "金融市場常識-8", text: "依照國內金融監督管理制度的架構，主管證券相關事業的監理單位為：", options: ["(1)銀行局", "(2)保險局", "(3)證券期貨局", "(4)檢查局"], ans: 3, note: "證期局負責證券、期貨市場及證券期貨業之監督管理。", law: "金融監督管理委員會組織法"},
{id: "金融市場常識-9", text: "依照國內金融監理制度的架構，主掌金融業檢查業務的單位為：", options: ["(1)銀行局", "(2)中央銀行", "(3)中央存款保險公司", "(4)檢查局"], ans: 4, note: "檢查局負責金融機構之實地檢查業務。", law: "金融監督管理委員會組織法"},
{id: "金融市場常識-10", text: "下列何者非隸屬「金融監督管理委員會」？", options: ["(1)銀行局", "(2)公務人員退休撫卹基金管理委員會", "(3)證券期貨局", "(4)檢查局"], ans: 2, note: "公務人員退休撫卹基金管理委員會隸屬於考試院；金管會下轄銀行局、證期局、保險局及檢查局。", law: "政府組織架構"},
{id: "金融市場常識-11", text: "下列何者不屬證券期貨局監理的機構？", options: ["(1)投信公司", "(2)期貨公司", "(3)證券商", "(4)保險公司"], ans: 4, note: "保險公司由金管會保險局監理。", law: "金融監督管理委員會辦事細則"},
{id: "金融市場常識-12", text: "下列何者不是檢查局業務檢查的機構？", options: ["(1)保險公司", "(2)銀行", "(3)證券公司", "(4)金融資訊服務公司"], ans: 4, note: "檢查局主要檢查對象為金融機構（銀行、證券、保險）。金融資訊服務公司為周邊單位，非直接受檢對象。", law: "金融檢查作業規定"},
{id: "金融市場常識-13", text: "下列何者非政府 (金管會及中央銀行 )管理金融市場的措施 ?", options: ["(1)訂定金融機構的資本適足率", "(2)金融檢查的立即糾正措施", "(3)訂定金融機構呆帳準備的提列", "(4)限制存款戶的存款金額"], ans: 4, note: "政府保障存款安全（如存保機制），但一般不會限制存款戶存入的金額上限。", law: "銀行法/中央銀行法"},
{id: "金融市場常識-14", text: "下列何者非次級市場交易？", options: ["(1)個別投資人透過他的經紀商買入中鋼公司股票", "(2)機構法人透過它的經紀商出售一些台積電股票", "(3)台塑公司透過承銷商發行新股", "(4)上述均為次級市場之交易"], ans: 3, note: "發行新股屬於「初級市場」(發行市場) 的活動；買賣已發行的股票才是「次級市場」(流通市場)。", law: "證券交易法/市場結構"},
{id: "金融市場常識-15", text: "下列那個市場主要是買賣已發行流通的證券？", options: ["(1)發行市場", "(2)短期資金市場", "(3)初級市場", "(4)次級市場"], ans: 4, note: "次級市場 (Secondary Market) 是投資人之間買賣已發行證券的場所。", law: "金融市場概論"},
{id: "金融市場常識-16", text: "區分資本市場和貨幣市場的差異主要在於：", options: ["(1)金管會核准發行的數量", "(2)證券發行期限的長短", "(3)證券收益率", "(4)以上皆是"], ans: 2, note: "一年以下為貨幣市場，一年以上為資本市場。", law: "金融市場分類標準"},
{id: "金融市場常識-17", text: "公司債在以下何種金融市場交易？", options: ["(1)貨幣市場", "(2)同業拆款市場", "(3)資本市場", "(4)芝加哥商品市場"], ans: 3, note: "公司債屬於中長期資金工具，故屬於資本市場。", law: "金融市場分類標準"},
{id: "金融市場常識-18", text: "資金需求者以發行證券方式來向大眾募集資金者稱為：", options: ["(1)直接金融", "(2)間接金融", "(3)再融資金融", "(4)機構金融"], ans: 1, note: "發行證券直接向大眾募資為直接金融；透過銀行借貸為間接金融。", law: "金融體系概論"},
{id: "金融市場常識-19", text: "下列何種金融市場可以提供企業短期的資金融通？", options: ["(1)貨幣市場", "(2)資本市場", "(3)初級市場", "(4)長期外匯市場"], ans: 1, note: "貨幣市場專指一年期以內的短期資金調度市場。", law: "貨幣市場概論"},
{id: "金融市場常識-20", text: "資金需求者可以在何種金融市場發行中、長期的證券來募集資金？", options: ["(1)貨幣市場", "(2)資本市場", "(3)流通市場", "(4)次級市場"], ans: 2, note: "中長期資金（一年以上）的募集場所稱為資本市場。", law: "資本市場概論"},
{id: "金融市場常識-21", text: "證券自營商主要從事何種業務？", options: ["(1)證券商自行買賣有價證券", "(2)受他人委託買賣證券", "(3)包銷公司所發行之證券", "(4)代理證券結算交割"], ans: 1, note: "自營商 (Dealer) 是用自己的資金買賣證券賺取價差；經紀商是受託買賣；承銷商是協助發行。", law: "證券交易法第15條"},
{id: "金融市場常識-22", text: "何種證券商為發行市場主要參與者？", options: ["(1)經紀商", "(2)承銷商", "(3)自營商", "(4)以上皆非"], ans: 2, note: "承銷商 (Underwriter) 負責協助企業在初級市場發行證券。", law: "證券交易法第15條"},
{id: "金融市場常識-23", text: "承銷商在初次公開發行市場 (IPO)所扮演的主要角色為：", options: ["(1)為其本身的投資考量，購買所有證券的發行量", "(2)針對單一大額法人機構投資資金", "(3)對多位投資者宣傳並募集資金，使發行總額銷售完", "(4)提供大額投資者融資融券"], ans: 3, note: "承銷商之職責為包銷或代銷，協助發行公司將證券銷售給廣大投資人。", law: "證券商管理規則"},
{id: "金融市場常識-24", text: "證券經紀商所扮演的角色為：", options: ["(1)對新發行的證券提供評估的價格", "(2)根據其本身持有特定證券的部位進行買賣造市", "(3)受理委託執行買賣雙方之間的交易", "(4)以本身的帳戶來買賣證券"], ans: 3, note: "經紀商 (Broker) 接受客戶委託買賣，賺取手續費，不承擔價格風險。", law: "證券交易法第15條"},
{id: "金融市場常識-25", text: "臺灣證券交易所按組織類型乃為下列何種市場？", options: ["(1)集中市場", "(2)自營商交易市場", "(3)店頭市場", "(4)發行市場"], ans: 1, note: "臺灣證券交易所是集中交易市場 (Exchange)；櫃買中心則是店頭市場 (OTC)。", law: "證券交易法"},
{id: "金融市場常識-26", text: "下列何者非屬專業銀行？", options: ["(1)工業信用銀行", "(2)中小企業信用銀行", "(3)商業銀行", "(4)輸出入信用銀行"], ans: 3, note: "銀行法分為商業銀行、專業銀行、信託投資公司等。商業銀行非專業銀行。", law: "銀行法第87條"},
{id: "金融市場常識-27", text: "下列何者非為投信公司之業務？", options: ["(1)發行共同基金", "(2)代客操作", "(3)全權委託投資", "(4)收購委託書"], ans: 4, note: "投信公司主要業務為發行受益憑證(基金)及全權委託投資。收購委託書通常是股務代理或徵求人的行為，非投信核心業務。", law: "證券投資信託及顧問法"},
{id: "金融市場常識-28", text: "下列對於金融控股公司的描述何者為非？", options: ["(1)結合銀行、證券、保險等相關行業", "(2)提供客戶一次購足的多元化服務", "(3)控股公司旗下金融機構的關係平等，與綜合銀行之組織型態不同", "(4)母公司可以非金融產業公司主導"], ans: 4, note: "我國金融控股公司法規定金控公司之設立是以金融機構為主體，母公司本身必須是金融控股公司，受高度監理，不可由非金融產業隨意主導。", law: "金融控股公司法"},
{id: "金融市場常識-29", text: "下列證券金融公司的業務何者為非？", options: ["(1)對客戶的授信", "(2)對證券商的轉融通", "(3)結算交割", "(4)融資融券"], ans: 3, note: "結算交割通常由交易所或結算所負責，證券金融公司主要負責融資融券及轉融通。", law: "證券金融事業管理規則"},
{id: "金融市場常識-30", text: "若以臺灣的市場狀況來看，對證券投資顧問公司的服務需求之理由，下列何者非？", options: ["(1)散戶投資人占多數", "(2)投資事業的專業分工", "(3)一般投資人缺乏廣泛且精確的資訊", "(4)可以聯合炒作股票"], ans: 4, note: "聯合炒作股票是違法行為（操縱市場），絕非合法的服務需求理由。", law: "證券交易法第155條"},
{id: "金融市場常識-31", text: "目前集中市場、櫃買市場之結算交割作業，以及有價證券的保管，乃委託下列何者機構辦理？", options: ["(1)臺灣證券集中保管結算所", "(2)櫃檯買賣中心", "(3)臺灣證券交易所", "(4)證券商"], ans: 1, note: "集保結算所 (TDCC) 負責有價證券的集中保管與帳簿劃撥交割。", law: "證券集中保管事業管理規則"},
{id: "金融市場常識-32", text: "下列何者不屬於資本市場 ?", options: ["(1)股票市場", "(2)公債市場", "(3)公司債市場", "(4)商業本票市場"], ans: 4, note: "商業本票 (CP) 是一年期以下的短期票券，屬於貨幣市場工具。", law: "金融市場分類"},
{id: "金融市場常識-33", text: "下列何者非屬金融監督管理委員會之職掌 ?", options: ["(1)票券市場之監督", "(2)保險市場之監督", "(3)稅改", "(4)金融檢查"], ans: 3, note: "稅改 (稅制改革) 是財政部的職掌。", law: "行政院組織法"},
{id: "金融市場常識-34", text: "下列何者非屬次級市場的功能 ?", options: ["(1)提供投資人調節其證券投資組合的場所", "(2)提供投資人認購新發行證券的場所", "(3)提供投資人變現其證券的場所", "(4)有助於初級市場的發展"], ans: 2, note: "認購新發行證券屬於初級市場 (發行市場) 的功能。", law: "證券市場概論"},
{id: "金融市場常識-35", text: "下列何者非屬於金融體系的一環 ?", options: ["(1)銀行", "(2)臺灣證券交易所", "(3)公司債", "(4)飾金買賣"], ans: 4, note: "飾金買賣屬於商品交易 (銀樓)，非金融資產之金融中介或交易體系。", law: "金融體系定義"},
{id: "金融市場常識-36", text: "目前臺灣股市的交易方式以何者為主 ?", options: ["(1)電腦輔助交易", "(2)電腦自動交易", "(3)人工喊價交易", "(4)場外交易"], ans: 2, note: "臺灣證券交易所與櫃買中心目前均採電腦自動撮合交易。", law: "臺灣證券交易所營業細則"},
{id: "金融市場常識-37", text: "下列何者不是貨幣市場的信用工具？", options: ["(1)商業本票", "(2)公司股票", "(3)可轉讓定期存單", "(4)銀行承兌匯票"], ans: 2, note: "公司股票是資本市場工具 (無到期日/長期)。", law: "貨幣市場工具定義"},
{id: "金融市場常識-38", text: "下列何者不屬於衍生性金融商品？", options: ["(1)股票選擇權", "(2)債券期貨", "(3)組合式股票基金", "(4)利率交換合約"], ans: 3, note: "組合式股票基金屬於共同基金 (現貨投資組合)，非衍生性商品契約。", law: "衍生性金融商品定義"},
{id: "金融市場常識-39", text: "下列何者不是金融市場所提供的主要功能？", options: ["(1)提供公司融資的管道", "(2)提供投機的環境", "(3)提供避險的管道", "(4)促進經濟的發展"], ans: 2, note: "投機是市場活動的一種，但不是金融市場設立的「主要功能」或正面目的。", law: "金融市場概論"},
{id: "金融市場常識-40", text: "有關資金融通之描述，下列何者正確？", options: ["(1)是指在經濟運行過程中，資金供求雙方運用各種金融工具調節資金的活動", "(2)是所有金融交易活動的總稱", "(3)分為直接融資和間接融資兩種", "(4)以上皆是"], ans: 4, note: "資金融通涵蓋金融市場的所有調節活動，包含直接與間接金融。", law: "金融融通概論"},
{id: "金融市場常識-41", text: "有關金融市場的構成，下列何者最正確？", options: ["(1)一般根據金融市場上交易工具的期限，把金融市場分為貨幣市場和資本市場兩大類", "(2)貨幣市場是融通長期資金的市場", "(3)資本市場是融通短期資金的市場", "(4)以上皆是"], ans: 1, note: "分類依據為期限：一年以下為貨幣市場，一年以上為資本市場。(2)與(3)敘述顛倒。", law: "金融市場分類"},
{id: "金融市場常識-42", text: "有關金融市場的種類，下列何者正確？", options: ["(1)國際金融市場，由經營國際間貨幣業務的金融機構組成，其經營內容包括資金借貸、外匯買賣、證券買賣、資金交易等", "(2)國內金融市場，由國內金融機構組成，辦理各種貨幣、證券及作用業務活動", "(3)有形金融市場，指有固定場所和操作設施的金融市場", "(4)以上皆是"], ans: 4, note: "選項皆為正確的金融市場分類定義。", law: "金融市場分類"},
{id: "金融市場常識-43", text: "有關金融市場的種類，下列何者正確？", options: ["(1)長期資金市場（資本市場） ，主要供應一年以上的中長期資金", "(2)次級市場，是新證券發行的市場；它可以增加公司資本", "(3)初級市場，是已經發行、處在流通中的證券的買賣市場", "(4)貨幣市場是長期資金市場"], ans: 1, note: "(2)次級市場不增加公司資本；(3)初級市場才是發行市場；(4)貨幣市場是短期。", law: "金融市場概論"},
{id: "金融市場常識-44", text: "金融市場按長短期資金的供需交易劃分可分為哪幾種市場？", options: ["(1)貨幣市場和資本市場", "(2)現貨市場和期貨市場", "(3)初級市場和次級市場", "(4)地方性金融市場、國內性金融市場、國際性金融市場"], ans: 1, note: "按「期限」劃分即為貨幣市場(短)與資本市場(長)。", law: "金融市場分類"},
{id: "金融市場常識-45", text: "金融市場按地域範圍可分為哪幾種市場？", options: ["(1)貨幣市場和資本市場", "(2)現貨市場和期貨市場", "(3)初級市場和次級市場", "(4)地方性金融市場、國內性金融市場、國際性金融市場"], ans: 4, note: "按「地域」劃分。", law: "金融市場分類"},
{id: "金融市場常識-46", text: "金融市場較常見的一種分類是分為短期資金市場和長期資金市場。短期與長期的劃分通常以多久時間為準？", options: ["(1)3個月", "(2)6個月", "(3)1年", "(4)2年"], ans: 3, note: "金融市場慣例以「一年」作為長短期的分界。", law: "金融市場概論"},
{id: "金融市場常識-47", text: "下列何者屬於短期資金市場？", options: ["(1)票券市場", "(2)債券市場", "(3)基金市場", "(4)期貨市場"], ans: 1, note: "票券市場 (Bill Market) 交易一年期以內的票券，屬貨幣市場 (短期)。債券通常為長期。", law: "貨幣市場工具"},
{id: "金融市場常識-48", text: "下列何者非屬 臺灣貨幣市場投資工具？", options: ["(1)國庫券", "(2)歐洲美元借款", "(3)銀行承兌匯票", "(4)商業本票"], ans: 2, note: "歐洲美元 (Eurodollar) 屬國際金融市場/境外市場工具，非臺灣「國內」貨幣市場工具。", law: "貨幣市場工具"},
{id: "金融市場常識-49", text: "政府對金融業做特殊的監督與管理的理由 ，下列何者最正確 ？", options: ["(1)保護投資人權益", "(2)金融體系的穩定會影響經濟的穩定", "(3)監管金融體系可以讓政府政策更有效率", "(4)以上皆是"], ans: 4, note: "金融業具高度外部性與資訊不對稱，故需高度監理以達成上述目的。", law: "金融監理理論"},
{id: "金融市場常識-50", text: "證券買賣雙方或他們的經紀商 (Broker)在一個集中的交易場所利用人工或電腦撮合進行交易所形成的市場，謂之：", options: ["(1)集中市場", "(2)店頭市場", "(3)短期市場", "(4)長期市場"], ans: 1, note: "集中交易市場 (Exchange Market) 特徵為集中撮合。", law: "證券交易法"},
{id: "金融市場常識-51", text: "由座落於不同地點的交易商 (Dealer)對於其所交易的證券向投資人報價，只要投資人願意接受交易商的報價，即可完成交易而形成的市場，謂之：", options: ["(1)集中市場", "(2)店頭市場", "(3)短期市場", "(4)長期市場"], ans: 2, note: "店頭市場 (Over-the-Counter, OTC) 採議價制，由交易商報價。", law: "證券交易法"},
{id: "金融市場常識-52", text: "資金剩餘者將剩餘之資金存入金融機構，金融機構再間接將此資金貸放給資金不足者或購買資金不足者所發行之有價證券。謂之：", options: ["(1)間接金融", "(2)直接金融", "(3)財務金融", "(4)以上皆非"], ans: 1, note: "透過金融中介機構 (如銀行) 進行資金移轉，稱為間接金融。", law: "金融中介理論"},
{id: "金融市場常識-53", text: "金融市場的功能，包括下列何者？", options: ["(1)調度資金供需，提高資金分配效率", "(2)減少尋求訊息成本，降低交易之不確定性", "(3)作為中央銀行貨幣政策的參考", "(4)以上皆是"], ans: 4, note: "皆為金融市場之正面經濟功能。", law: "金融市場概論"},
{id: "金融市場常識-54", text: "下列何者為我國證券交易法所稱有價證券？", options: ["(1)政府債券", "(2)公司股票", "(3)公司債券", "(4)以上皆是"], ans: 4, note: "證券交易法第6條定義之有價證券包含政府債券、公司股票、公司債等。", law: "證券交易法第6條"},
{id: "金融市場常識-55", text: "期貨交易，指依國內外期貨交易所或其他期貨市場之規則或實務，從事衍生自商品、貨幣、有價證券、利率、指數或其他利益之下列何種契約之交易？", options: ["(1)期貨契約", "(2)選擇權契約", "(3)期貨選擇權契約", "(4)以上皆是"], ans: 4, note: "期貨交易法第3條定義之期貨交易包含期貨、選擇權、期貨選擇權及槓桿保證金契約。", law: "期貨交易法第3條"},
{id: "金融市場常識-56", text: "下列何者不是健全的金融市場所需之條件？", options: ["(1)金融商品的價格不透明", "(2)大量的儲蓄資金供給", "(3)多樣化的交易工具", "(4)健全的銀行制度與中央銀行"], ans: 1, note: "價格透明是市場效率與健全的必要條件。", law: "市場微結構理論"},
{id: "金融市場常識-57", text: "下列何者不是金融中介的功能？", options: ["(1)降低融資成本", "(2)降低融資風險", "(3)提高資金流動性", "(4)證券產品少樣化"], ans: 4, note: "金融中介應提供多樣化產品以滿足不同需求，而非少樣化。", law: "金融中介理論"},
{id: "金融市場常識-58", text: "金融中介機構（ financial intermediation ）依其本身的信用條件，發行債務憑證 (金融債券)向資金供給者取得資金，再將資金貸放給資金需求者，完成資金移轉的融通方式，謂之：", options: ["(1)直接金融", "(2)間接金融", "(3)財務金融", "(4)金融中介"], ans: 2, note: "透過中介機構承擔風險與轉換資產，屬間接金融。", law: "金融中介理論"},
{id: "金融市場常識-59", text: "資金需求者藉由原始證券（例如股票、債券或票券）的發行（或稱承銷），並透過市場交易（經紀或自營），撮合資金供需雙方完成資金交易的融通方式，謂之：", options: ["(1)直接金融", "(2)間接金融", "(3)財務金融", "(4)金融中介"], ans: 1, note: "資金需求者直接發行證券給供給者，屬直接金融。", law: "金融市場概論"},
{id: "金融市場常識-60", text: "下列何者不屬於金融監督管理委員會之主管業務？", options: ["(1)金融控股公司", "(2)證券業", "(3)金融支付系統", "(4)期貨業"], ans: 3, note: "大額資金的「金融支付系統」(如同資系統) 主要由中央銀行主管與營運；零售支付部分金管會雖有監理，但核心支付系統(RTGS)屬央行權責。此題傳統答案選(3)。", law: "中央銀行法/金管會組織法"},
{id: "金融市場常識-61", text: "有關發行市場「私募」制度，何者正確？", options: ["(1)招募對象不受限制", "(2)招募人數不受限制", "(3)必須向特定人招募", "(4)私募發行的成本通常高於公開發行的成本"], ans: 3, note: "私募 (Private Placement) 依證交法第43-6條規定，須向特定人（如銀行、專業投資機構或符合條件之自然人）招募，人數亦有限制（35人），成本通常低於公開發行。", law: "證券交易法第43-6條"},
{id: "金融市場常識-62", text: "股票的本益比係指：", options: ["(1)股價/每股盈餘", "(2)每股盈餘 /股價", "(3)股價/每股股利", "(4)股價/每股淨值"], ans: 1, note: "本益比 (P/E Ratio) = 股價 (Price) / 每股盈餘 (EPS)。", law: "投資學概論"},
{id: "金融市場常識-63", text: "下列何者為散戶最常使用之申購股票方式：", options: ["(1)競價拍賣", "(2)詢價圈購", "(3)洽特定人承銷", "(4)公開申購"], ans: 4, note: "公開申購 (Public Subscription) 採抽籤制，是散戶參與新股發行最主要的方式。", law: "證券商承銷有價證券處理準則"},
{id: "金融市場常識-64", text: "民國 100年12月30日開始施行的金融消費者保護法，其主管機關為：", options: ["(1)財政部", "(2)法務部", "(3)公平交易委員會", "(4)金融監督管理委員會"], ans: 4, note: "金融消費者保護法的主管機關為金融監督管理委員會。", law: "金融消費者保護法"},
{id: "金融市場常識-65", text: "境外基金需經核准方得在我國境內募集及銷售，下列何者不是合法的銷售機構？", options: ["(1)證券投資信託事業", "(2)證券投資顧問事業", "(3)資產管理顧問公司", "(4)證券經紀商"], ans: 3, note: "合法的境外基金銷售機構包括投信、投顧、證券商、銀行、信託業等，需經金管會核准。「資產管理顧問公司」非特許金融機構，不得銷售基金。", law: "境外基金管理辦法"},
{id: "金融市場常識-66", text: "下列何種類型的基金適合短期資金停泊的投資人？", options: ["(1)股票型基金", "(2)貨幣市場基金", "(3)固定收益型基金", "(4)保本型基金"], ans: 2, note: "貨幣市場基金投資於高流動性、低風險的短期票券，適合短期資金停泊。", law: "共同基金概論"},
{id: "金融市場常識-67", text: "外國企業來臺灣以存託憑證方式籌措資金，稱之發行：", options: ["(1)美國存託憑證 (ADR)", "(2) 臺灣存託憑證 (TDR)", "(3) 全球存託憑證 (GDR)", "(4) 歐洲可轉換公司債 (ECB)"], ans: 2, note: "外國公司在台灣發行，稱為 Taiwan Depositary Receipt (TDR)。", law: "證券交易法"},
{id: "金融市場常識-68", text: "自101年4月2日起銀行及證券商從事店頭衍生性金融商品交易須向下列何者建置之店頭衍生性金融商品交易資訊儲存庫申報相關資訊？", options: ["(1)臺灣證券交易所", "(2)證券櫃檯買賣中心", "(3)臺灣期貨交易所", "(4)臺灣集中保管結算所"], ans: 2, note: "櫃買中心 (TPEx) 負責建置與維護店頭衍生性金融商品交易資訊儲存庫。", law: "櫃檯買賣中心規章"},
{id: "金融市場常識-69", text: "期貨交易人不可透過下列何者從事期貨交易？", options: ["(1)專營期貨經紀商", "(2)兼營期貨經紀商", "(3)期貨交易輔助人", "(4)金融資訊服務公司"], ans: 4, note: "金融資訊服務公司非期貨業，不得接受下單。", law: "期貨交易法"},
{id: "金融市場常識-70", text: "期貨商接受期貨交易人委託從事期貨交易，下列敘述何者不正確？", options: ["(1)期貨商接受期貨交易人開戶時，應由具有業務員資格者為之", "(2)在期貨交易人開戶前應告知各種期貨商品之性質、交易條件及可能之風險，並應將風險預告書交付期貨交易人", "(3)期貨商不得僱用非業務員接受期貨交易人委託進行期貨交易事宜", "(4)期貨商於成交後僅須以電話通知期貨交易人，無須作成買賣報告書及對帳單交付期貨交易人"], ans: 4, note: "成交後必須製作買賣報告書及對帳單交付交易人，不可僅以電話通知。", law: "期貨商管理規則"},
{id: "金融市場常識-71", text: "期貨商客戶保證金專戶之管理，下列敘述何者不正確？", options: ["(1)兼營期貨業務之金融機構得將其客戶保證金專戶開設於其所經營之金融機構", "(2)期貨商應將所開設客戶保證金專戶之機構名稱及帳號於營業場所顯著位 置公告", "(3)客戶保證金專戶內所有款項之提取作業應以轉帳方式辦理，同時應有詳實之紀錄及收付憑證", "(4)期貨商對客戶在客戶保證金專戶內之存款或有價證券，不得進行透支、設定擔保或他項權利，且不得挪用為其他客戶保證金、權利金、結算交割費用、佣金、手續費或不足款項之代墊"], ans: 1, note: "兼營期貨商不得將客戶保證金專戶開設於「自身」經營的銀行，須開設於其他金融機構，以防利益衝突與挪用風險。", law: "期貨商管理規則"},
{id: "金融市場常識-72", text: "證券投資人及期貨交易人對紛爭之解決機制：", options: ["(1)只可依金融消費者保護法向評議中心申請評議", "(2)只可依證券投資人及期貨交易人保護法向投保中心申請調處、或授權提付仲裁或提起團體訴訟", "(3)以上均可選擇尋求解決", "(4)以上皆非"], ans: 3, note: "投資人可選擇向「金融消費評議中心」申請評議，或向「投保中心」申請調處，兩者機制並行。", law: "金融消費者保護法/投保法"},
{id: "金融市場常識-73", text: "下列何者並不屬於強化公司治理的措施？", options: ["(1)擴大獨立董事強制設置範圍", "(2)鼓勵企業善盡社會責任", "(3)限制員工跳槽以留住人才", "(4)強制設置薪資報酬委員會"], ans: 3, note: "限制員工跳槽違反工作權自由，並非公司治理 (Corporate Governance) 的範疇。", law: "公司治理實務守則"},
{id: "金融市場常識-74", text: "上市（櫃）公司依規定，財務報表及重大訊息須在何處公告？", options: ["(1)公開資訊觀測站", "(2)國內報紙", "(3)上市（櫃）公司自家網站", "(4)奇摩或鉅亨網"], ans: 1, note: "公開資訊觀測站 (MOPS) 是官方指定的資訊揭露平台。", law: "證券交易法/資訊申報作業辦法"},
{id: "金融市場常識-75", text: "上市（櫃）公司之年度財務報告，自 101年會計年度開始，最遲應於年度終了後幾個月內公告並申報？", options: ["(1)二個月", "(2)三個月", "(3)四個月", "(4)以上皆非"], ans: 2, note: "依證券交易法第36條規定，年度財務報告應於會計年度終了後三個月內公告申報。", law: "證券交易法第36條"},
{id: "金融市場常識-76", text: "上市（櫃）公司之股東常會應於每會計年度終了後幾個月內召開？", options: ["(1)一個月", "(2)二個月", "(3)三個月", "(4)六個月"], ans: 4, note: "依公司法規定，股東常會應於每會計年度終了後六個月內召開。", law: "公司法第170條"},
{id: "金融市場常識-77", text: "以下有關證券投資信託基金之描述，何者為非？", options: ["(1)基金資產交由證券投資信託事業保管", "(2)基金資產應分散投資", "(3)股票型基金係指投資股票達淨資產價值 70%以上之基金", "(4)指數股票型基金（ ETF）可上市或上櫃，投資人可透過證券商從事買賣"], ans: 1, note: "基金資產須由獨立的「基金保管機構」(通常是銀行) 保管，而非由投信公司自行保管，以確保資產安全。", law: "證券投資信託及顧問法"},
{id: "金融市場常識-78", text: "甲上市公司董事長掏空公司資產，持有甲公司股票之股東所受損害可採取之措施，以下何者正確？", options: ["(1)向財團法人證券投資人及期貨交易人保護中心（投保中心）請求動用保護基金償付", "(2)向財團法人金融消費評議中心請求評議", "(3)由投保中心提起團體訴訟求償", "(4)向證券商求償"], ans: 3, note: "針對重大證券詐欺案件，投保中心可接受投資人授權提起團體訴訟。", law: "證券投資人及期貨交易人保護法"},
{id: "金融市場常識-79", text: "有關國內貨幣市場基金之描述，何者為非？", options: ["(1)主要投資標的為銀行存款、短期票券及附買回交易", "(2)加權平均存續期間不得大於 180日", "(3)不得投資於股票或其他具股權性質之有價證券", "(4)具保本性質，每單位淨資產價值逐日平穩上升，不會下降"], ans: 4, note: "基金投資均有風險，貨幣市場基金雖然風險較低，但並非「保本」，淨值仍可能下跌。", law: "證券投資信託基金管理辦法"},
{id: "金融市場常識-80", text: "下列何者屬於金融機構防制洗錢措施之核心原則 ?", options: ["(1)客戶審查、確認身分", "(2)建立洗錢交易監控機制、做好交易申報", "(3)內部控制、稽核與法令遵循制度", "(4)以上皆是"], ans: 4, note: "KYC、交易監控、內控稽核皆為洗錢防制核心。", law: "洗錢防制法"},
{id: "金融市場常識-81", text: "洗錢防制法規定金融機構對於達一定金額以上之通貨交易，應確認客戶身分及留存交易紀錄憑證，並應向指定之機構申報。所稱之一定金額係指新台幣多少之單筆現金或換鈔交易?", options: ["(1)25萬元", "(2)50萬元", "(3)75萬元", "(4)100萬元"], ans: 2, note: "大額通貨交易申報門檻為新台幣50萬元。", law: "金融機構防制洗錢辦法"},
{id: "金融市場常識-82", text: "下列何者不屬於金融機構防制洗錢措施，訂定內部控制、稽核及法令遵行之事項 ?", options: ["(1)確認客戶身分之程序及留存交易紀錄憑證之方式與期限", "(2)申報流程及程序及保密規定", "(3)定期檢討及辦理在職訓練", "(4)無需專責人員負責協調監督"], ans: 4, note: "防制洗錢必須配置專責人員負責協調監督。", law: "金融機構防制洗錢辦法"},
{id: "金融市場常識-83", text: "下列何者屬於金融機構防制洗錢措施所稱之金融機構 ：", options: ["(1)辦理儲金匯兌之郵政機構", "(2)銀行業", "(3)證券集中保管事業", "(4)以上皆是"], ans: 4, note: "洗錢防制法第5條定義之金融機構包含銀行、信託、保險、證券、支付機構及郵政機構等。", law: "洗錢防制法第5條"},
{id: "金融市場常識-84", text: "現行每一存款人在同一家金融機構存款保險的最高保額為存款本金是多少？", options: ["(1)新台幣100萬元", "(2)新台幣 150萬元", "(3)新台幣 300萬元", "(4)新台幣 500萬元"], ans: 3, note: "目前中央存款保險公司的最高保額為新台幣300萬元 (本息合計)。", law: "存款保險條例"},
{id: "金融市場常識-85", text: "學生申請信用卡有什麼限制？", options: ["(1)正卡申請人應年滿 18歲，附卡申請人應年滿 15歲", "(2)以3家發卡機構為限", "(3)每家總額度最高新台幣 2萬元", "(4)以上皆是"], ans: 4, note: "金管會對學生辦卡有嚴格規範：滿18歲、限3家、額度2萬。", law: "信用卡業務機構管理辦法"},
{id: "金融市場常識-86", text: "依民法規定，有關保證之敘述，下列何者錯誤？", options: ["(1)保證債務對主債務均有其從屬性，故主債務人拋棄其抗辯權者，保證人即不得為該主張", "(2)保證人之負擔較主債務人為重者，應減縮至主債務人之程度", "(3)債權人允許主債務人延期清償時，須經保證人同意，否則不負保證責任", "(4)保證人向債權人清償後，於其清償限度內取得債權人對於主債務人之債權"], ans: 1, note: "依民法第742條，主債務人拋棄抗辯權者，保證人「仍得」主張之。選項(1)敘述錯誤。", law: "民法第742條"},
{id: "金融市場常識-87", text: "提供下列何者作為對銀行授信之擔保，不屬於銀行法所稱之擔保授信？", options: ["(1)定期存單設定之權利質權", "(2)不動產或動產抵押權", "(3)鄉鎮市公所所出具之保證函", "(4)借款人營業交易所發生之匯 票或本票"], ans: 3, note: "銀行法第12條定義的擔保授信包括不動產/動產抵押、動產/權利質權、借款人營業票據、經認可之保證人等。鄉鎮公所保證函不在此列。", law: "銀行法第12條"},
{id: "金融市場常識-88", text: "良好的內部控制可以利用環境相扣的內控措施減少弊端的發生，降低損失，下列何者不屬於內控措施？", options: ["(1)日常運作之牽制", "(2)獎懲制度", "(3)命令休假", "(4)內部自行查核"], ans: 2, note: "「獎懲制度」屬於人事管理與激勵機制，非直接的內部控制查核或牽制措施（如職務分工、輪調、休假查核等）。", law: "金融機構內部控制制度"},
{id: "金融市場常識-89", text: "銀行理財專員介紹金融商品時，下列何者為錯誤之行為？", options: ["(1)提供商品說明書、告知金融商品投資之標的，管理費用及相關費用等", "(2)先對客戶進行客戶屬性之問卷，暸解客戶之投資屬性", "(3)未提供客戶金融商品之風險預告書並做說明", "(4)充分告知商品之獲利及可能之損失，不提供獲利之保證"], ans: 3, note: "未提供風險預告書並說明，違反資訊揭露與善良管理人注意義務。", law: "金融消費者保護法/銀行辦理財富管理業務應注意事項"},
{id: "金融市場常識-90", text: "下列何者機構可以辦理特定金錢信託業務？", options: ["(1)銷售共同信託基金之證券投資信託公司", "(2)核准辦理信託業務之銀行及證券商", "(3)受委託代操證券投資之證券商", "(4)提供金融商品投資分析之證券投資顧問公司"], ans: 2, note: "特定金錢信託屬於信託業務，僅有經核准兼營信託業務的銀行或證券商可辦理。", law: "信託業法"},
{id: "金融市場常識-91", text: "以下何者不是投保時應該注意的事項？", options: ["(1)確認銷售人員所代表的保險公司及是否具有保險業務員的資格", "(2)瞭解保單的承保範圍，並要求業務員詳細說明保單的內容", "(3)僅聽從業務員對保單之說，未判斷業務員說明內容是否誇大", "(4)應親自填寫要保書，對於要保書的詢問事項（如過去的生病紀錄）據實告知簽名前並應確認所簽文件內容"], ans: 3, note: "盲目聽從業務員而未自行判斷，容易產生糾紛，非正確投保態度。", law: "保險實務"},
{id: "金融市場常識-92", text: "對寄達之壽險保單看後，多久之內可以撤回，請求退還保費？", options: ["(1)收到第 2天起算 5天內", "(2)收到第 2天起算 10天內", "(3)收到第 2天起算 14天內", "(4)收到第 2天起算 30天內"], ans: 2, note: "保險契約撤銷權為保單送達翌日起算10日內 (契約撤銷期)。", law: "人壽保險單示範條款"},
{id: "金融市場常識-93", text: "下列何者不是投資型保單之特性？", options: ["(1)具有結合保險與投資二方面功能", "(2)具保證將來一定之收益", "(3)依約定方式扣除各項費用後，依保戶同意或指定之投資分配方式", "(4)以部分之保費投資金融商品"], ans: 2, note: "投資型保單投資風險由保戶自負，不保證獲利或收益。", law: "投資型保險投資管理辦法"},
{id: "金融市場常識-94", text: "下列何者不是產物保險？", options: ["(1)火災保險", "(2)人身保險", "(3)地震保險", "(4)船舶保險"], ans: 2, note: "保險分為人身保險與財產保險(產物保險)。人身保險(壽險、健康險等)非產物保險。", law: "保險法第13條"},
{id: "金融市場常識-95", text: "下列何者為不正確的理財行為？", options: ["(1)建立自己的財務目標並排列順序，以收入的生活支出節餘部分進行", "(2)有自律的能力，能依訂定的承受目標損益採取退場行動", "(3)慎選金融機構及有資格的理財人員", "(4)投資以後不再過問，未做定期的收益檢視"], ans: 4, note: "投資需要定期檢視與動態調整，不聞不問是不正確的行為。", law: "理財規劃實務"},
{id: "金融市場常識-96", text: "有關債券的種類，下列敘述何者錯誤？", options: ["(1)依發行形式可分為實體公債與無實體公債", "(2)依發行機構可分為公債、公司債、金融債券", "(3)依債權之性質可分為普通債券與次順位債券", "(4)依票息之有無可分為有息債券與永久債券"], ans: 4, note: "「有息債券與永久債券」分類邏輯不對。通常是分「零息債券」與「附息債券」。永久債券是指無到期日，而非無票息。", law: "債券市場概論"},
{id: "金融市場常識-97", text: "下列何者不是普通股之特性？", options: ["(1)可參與公司經營權利", "(2)公司增資發行新股之優先認購權", "(3)承擔公司的經營成敗後果", "(4)可優先參與分配股息"], ans: 4, note: "優先股 (Preferred Stock) 才有優先分配股息的權利；普通股是在優先股分配後才分配。", law: "公司法"},
{id: "金融市場常識-98", text: "下列敘述何者錯誤？", options: ["(1)利率下跌對股市較為不利", "(2)當物價明顯上漲時，政府通常會採用緊縮性的貨幣政策", "(3)當新台幣升值時，對我國之出口商較為不利", "(4)當景氣對策信號為藍燈時，代表景氣衰退"], ans: 1, note: "一般而言，利率下跌會降低資金成本，有利於企業獲利與股市上漲。故(1)敘述錯誤。", law: "總體經濟學"},
{id: "金融市場常識-99", text: "有關客戶委託保管有價證券，下列敘述何者錯誤？", options: ["(1)經辦人員核符後蓋章核發保管憑條給委託人", "(2)經常不定期盤點有價證券並做成紀錄", "(3)依規定收取保管手續費並即時入帳", "(4)保管有價證券之送存與提領，經主管人核准後依規定辦理"], ans: 1, note: "應由「主管人員」核符後蓋章，非僅經辦人員，以落實牽制原則。", law: "銀行內部控制制度"},
{id: "金融市場常識-100", text: "以下何者係屬應對金融機構建立並為維持適當有效之內部控制制度負最終責任之人：", options: ["(1)總經理", "(2)董(理)事會", "(3)分行經理", "(4)總稽核"], ans: 2, note: "董事會對公司之內部控制制度負最終責任。", law: "金融控股公司及銀行業內部控制及稽核制度實施辦法"},
{id: "金融市場常識-101", text: "銀行辦理自用住宅及消費性貸款，如已徵提足額擔保，下列何者敘述是錯誤的？", options: ["(1)借款人如為補強信用，仍可主動提供一般保證人", "(2)借款人就業不久，恐無負擔能力，得徵提連帶保證人", "(3)銀行辦理擔保貸款應以一定金額為限", "(4)銀行未來求償時，應先就借款人求償，不足部分得向保證人求償"], ans: 2, note: "銀行法第12-1條規定，銀行辦理自用住宅放款及消費性放款，已取得足額擔保時，不得要求借款人提供「連帶保證人」。", law: "銀行法第12-1條"},
{id: "金融市場常識-102", text: "下列何者係指金融資產之變現能力或指無法以合理價格軋平部位所產生之風險？", options: ["(1)作業風險", "(2)信用風險", "(3)市場風險", "(4)流動性風險"], ans: 4, note: "流動性風險 (Liquidity Risk) 即指無法以合理價格迅速變現或軋平部位的風險。", law: "風險管理概論"},
{id: "金融市場常識-103", text: "下列何者是金融從業人員正確之倫理觀念？", options: ["(1)遵守金融法規及自律規範之規定", "(2)自己之報酬應與正當營業活動之收益有關聯性", "(3)為客戶服務應善盡專業者之注意義務", "(4)以上皆是"], ans: 4, note: "皆為金融從業人員應具備之職業道德。", law: "金融從業人員道德規範"},
{id: "金融市場常識-104", text: "下列何者不是結構型商品的主要風險？", options: ["(1)作業風險", "(2)信用風險", "(3)流動性風險", "(4)匯兌風險"], ans: 1, note: "結構型商品主要風險為市場面風險（連結標的）、信用風險（發行機構）及流動性風險。作業風險是銀行內部的操作疏失，非商品本身的投資風險。", law: "結構型商品風險預告書"},
{id: "金融市場常識-105", text: "結構型商品因連結標的價格變動，隨市場變化而有較高的風險報酬，下列何者是不正當的銷售行為？", options: ["(1)應充分告知結構型商品高報酬相對也會有高風險", "(2)充分讓投資者了解商品連結標的之內容、損益計算方式及可能最大之損失金額", "(3)充分了解投資人之財務能力及所願承擔之損失範圍", "(4)結構型商品與一般存款性質相同，但其收益較高，鼓勵將存款轉為投資結構型商品"], ans: 4, note: "結構型商品不保本且風險高，與存款性質完全不同，誤導客戶屬不當銷售。", law: "境外結構型商品管理規則"},
{id: "金融市場常識-106", text: "銀行、保險及證券等金融機構間跨業行銷他業金融商品，下列何者為不正確之敘述？", options: ["(1)金融機構辦理共同行銷或合作推廣，經核准後未經客戶同意將資料交付他業運用向客戶行銷商品", "(2)跨業行銷他業金融商品，首次須經主管機關之核准", "(3)金融機構辦理跨業行銷，應建立共同行銷或合作推廣資料儲存、處理、交互運用之內部 控制管理規範", "(4)共同行銷之業務人員辦理他業業務時，其行為直接對他業機構發生效力"], ans: 1, note: "共同行銷使用客戶個資必須先經客戶「書面同意」，不可逕行使用。", law: "金融控股公司法/個資法"},
{id: "金融市場常識-107", text: "金控公司子公司間辦理跨業共同行銷，下列敘述何者正確？", options: ["(1)金融控股公司之子公司間依使用目的得交互運用客戶之基本資料、帳務資料、信用資料等往來交易資料", "(2)辦理共同行銷之業務人員，應符合各業管法規所訂業務人員必須之資格或證照", "(3)共同行銷之業務人員辦理他業業務時，其行為直接對他業機構發生效力", "(4)以上皆是"], ans: 4, note: "皆符合金融控股公司子公司間共同行銷管理辦法之規定。", law: "金融控股公司子公司間共同行銷管理辦法"},
{id: "金融市場常識-108", text: "以下何者是屬初級市場活動 ?", options: ["(1)集中交易市場交易", "(2)未上市股票盤商交易", "(3)店頭市場交易", "(4)企業之現金增資"], ans: 4, note: "現金增資 (Seasoned Equity Offering) 是企業發行新股籌資，屬於初級市場活動。", law: "證券交易法"},
{id: "金融市場常識-109", text: "臺灣的興櫃市場是何種股票可以合法流通的市場？", options: ["(1)上市", "(2)上櫃", "(3)上市與上櫃", "(4)未上市與未上櫃股票"], ans: 4, note: "興櫃市場 (Emerging Stock Market) 是為了輔導未上市櫃公司進入資本市場前的預備市場。", law: "興櫃股票買賣辦法"},
{id: "金融市場常識-110", text: "利率之 1個基本點 (basis point) 等於?", options: ["(1)0.001%", "(2)0.01%", "(3)0.1%", "(4)1%"], ans: 2, note: "1 Basis Point (bp) = 0.01%。100 bps = 1%。", law: "金融數學"},
{id: "金融市場常識-111", text: "利率之一碼為：", options: ["(1)0.25%", "(2)0.5%", "(3)1%", "(4)5%"], ans: 1, note: "一碼 = 0.25%。半碼 = 0.125%。", law: "金融數學"},
{id: "金融市場常識-112", text: "臺灣證券交易所上市股票買賣，多少股以下的交易即屬零股買賣？", options: ["(1)999股", "(2)99股", "(3)9股", "(4)1股"], ans: 1, note: "一張股票為1000股，未滿一張 (1~999股) 稱為零股。", law: "臺灣證券交易所上市股票零股交易辦法"},
{id: "金融市場常識-113", text: "臺灣企業赴美國以存託憑證方式籌措資金，稱之發行：", options: ["(1)臺灣存託憑證 (TDR)", "(2) 美國存託憑證 (ADR)", "(3) 歐洲可轉換公司債 (ECB)", "(4) 浮動利率債券 (FRN)"], ans: 2, note: "在美國發行稱 American Depositary Receipt (ADR)。", law: "國際金融概論"},
{id: "金融市場常識-114", text: "定期公開資訊中，資訊內容最具即時及攸關性者為：", options: ["(1)營業額公告", "(2)年報", "(3)取得與處分資產報告", "(4)財務報告"], ans: 1, note: "上市櫃公司每月10日前需公告上月營收 (營業額)，頻率最高、最即時。", law: "證券交易法"},
{id: "金融市場常識-115", text: "不定期公開資訊中，資訊內容最具即時及攸關性者為：", options: ["(1)財務預測", "(2)重大資訊之公開", "(3)公開說明書", "(4)財務報告"], ans: 2, note: "重大訊息 (Material Information) 發生即需即時公告，對股價影響最直接。", law: "證券交易法第36條"},
{id: "金融市場常識-116", text: "下列何者金融商品不是國內上市公司到海外籌措資金的方式？", options: ["(1)TDR", "(2)ADR", "(3)GDR", "(4)HKDR"], ans: 1, note: "TDR (Taiwan Depositary Receipt) 是「外國」公司來「台灣」發行，非國內公司去海外籌資。", law: "國際金融概論"},
{id: "金融市場常識-117", text: "老年投資人最好投資下列那一種基金 ?", options: ["(1)小型股基金", "(2)保本型基金", "(3)積極成長型基金", "(4)高科技基金"], ans: 2, note: "老年投資人風險承受度低，首重保本。", law: "理財規劃實務"},
{id: "金融市場常識-118", text: "老年人較適合投資下列那一種資產 ?", options: ["(1)股票", "(2)定存", "(3)認購權證", "(4)期貨"], ans: 2, note: "定存風險最低，適合老年人保本需求。其他皆具高風險。", law: "理財規劃實務"},
{id: "金融市場常識-119", text: "下列何者不是市場風險 (Market risk)?", options: ["(1) 利率之變化", "(2)通貨膨脹率之變化", "(3)特定企業之營運變化", "(4)全球石油危機"], ans: 3, note: "特定企業營運變化屬於「非系統性風險」(個別公司風險)，非整體市場風險。", law: "投資學/CAPM模型"},
{id: "金融市場常識-120", text: "就投資管理而言，認為市場隨時存在價格失衡之證券，而利用研究分析選出價格低估之證券，以求績效擊敗大盤之管理方式稱為 ?", options: ["(1)被動式管理 (passive management)", "(2) 部位式管理 (position management)", "(3) 主動式管理 (active management)", "(4) 效能式管理(effective management)"], ans: 3, note: "主動式管理 (Active Management) 試圖透過選股與擇時擊敗大盤。", law: "投資學概論"},
{id: "金融市場常識-121", text: "有關於以下由行政院國家永續發展委員會核定之『永續發展政策綱領』中所分類的政策層面與面向敘述，請問何者錯誤？", options: ["(1)「永續的環境」層面包含：大氣、水、土地、海洋、生物多樣性及環境管理等六個面向", "(2)「永續的社會」層面包含：人口與健康、居住環境、社會福利、文化多樣性及災害防救等五個面向", "(3)「永續的經濟」層面包含：企業獲利、企業績效、企業營運、永續能源及資源再利用等五個面向", "(4)「執行的機制」層面包含：教育、科技發展、資訊化社會、公眾參與、政府再造及國際合作等六個面向"], ans: 3, note: "永續經濟層面應包含經濟規劃、產業發展、綠色經濟等宏觀面向，而非單指個別企業獲利。", law: "國家永續發展政策綱領"},
{id: "金融市場常識-122", text: "因應氣候變遷衝擊及國際間對永續議題關注，協助我國企業及早因應訂定其減碳目標，金融監督管理委員會（以下稱金管會）於 2022年推動「上市櫃公司永續發展路徑圖」規劃案，以下有關規劃案敘述何者正確？", options: ["(1)配合政府 2070淨零碳排目標，金管會特訂定上市櫃公司溫室氣體盤查資訊揭露時程，俾利企業遵循及訂定減碳目標", "(2)揭露對象除鋼鐵、化工業自 2022年強制揭露外，其餘上市櫃公司係按實收資本額自 2022年起分階段推動", "(3)揭露目標為 2025年全體上市櫃公司完成溫室氣體盤查且與財務報表範圍一致", "(4)揭露內容包含範疇一（溫室氣 體直接排放）與範疇二（能源間接排放量）"], ans: 4, note: "路徑圖規劃內容為範疇一與範疇二盤查。目標年限與推動時程依資本額分階段實施，政府目標為2050淨零，非2070。", law: "上市櫃公司永續發展路徑圖"},
{id: "金融市場常識-123", text: "永續好好食股份有限公司為一家國內上市公司，下列有關於該公司編製與申報 2023年度永續報告書之敘述，請問何者錯誤？", options: ["(1)該公司依據臺灣證券交易所「上市公司產業類別劃分暨調整要點」規定屬食品工業，因此雖然 2021年度財務報告所載股本僅新臺幣二億元，亦須依照「上市公司編製與申報永續報告書作業辦法」（以下稱作業辦法）編製與申報 2023年度永續報告書", "(2)該公司因非屬高碳排產業，故 2023年度永續報告書無須加強揭露企業對氣候相關風險與機會之治理情況", "(3)該公司應於 2023年度永續報告書中揭露企業非擔任主管職務之全時員工人數、非擔任主管職務之全時員工薪資平均數及中位數，及前三者與前一年度之差異", "(4)該公司應建立永續報告書編製及驗證之作業程序，並納入內部控制制度"], ans: 2, note: "特定產業 (如食品、化工、金融等) 不論資本額皆需編製，且需依照TCFD架構加強揭露氣候風險，(2)敘述錯誤。", law: "上市公司編製與申報永續報告書作業辦法"},
{id: "金融市場常識-124", text: "請問以下何者非屬金融監督管理委員會於 2020年宣布之『公司治理 3.0-永續發展藍圖』中所推動之主軸？", options: ["(1)強化股東會職能，提升企業永續價值", "(2)提高資訊透明度，促進永續經營", "(3)強化利害關係人溝通，營造良好互動管道", "(4)接軌國際規範，引導盡職治理"], ans: 1, note: "主軸一是「強化董事會職能」，而非股東會。", law: "公司治理3.0-永續發展藍圖"},
{id: "金融市場常識-125", text: "「深化公司永續治理文化，提供多元化商品」為金融監督管理委員推動『公司治理 3.0-永續發展藍圖』的五大主軸之一，請問以下何者非屬該項目之具體推動措施？", options: ["(1)規劃建置永續板，推動永續發展相關保險產品", "(2)持續視市場使用者需求，研議推動永續相關指數商品", "(3)持續檢討公司治理評鑑指標，強化評鑑效度", "(4)持續宣導公司治理及企業社會責任"], ans: 1, note: "規劃建置永續板屬於證交所/櫃買中心業務推動，且「永續發展相關保險產品」非公司治理3.0該主軸下的核心措施 (多為指數、商品多元化)。該主軸重點在ESG商品多元化，選項(1)的「永續板」是後來創新板等概念，非當時藍圖直接措施。", law: "公司治理3.0-永續發展藍圖"},
{id: "金融市場常識-126", text: "以下有關聯合國永續發展目標（ Sustainable Development Goals, SDGs ）之敘述，請問何者有誤 ?", options: ["(1)SDGs 4 是「確保有教無類、公平以及高品質的教育，及提倡終身學習」（Quality Education ），包含消除教育上的性別差距", "(2)SDGs 5是「實現性別平等，並賦予婦女權力」（ Gender Equality ），包含終結所有對婦女和女童的各種形式歧視", "(3)SDGs 8 是「促進包容且永續的經濟成長，讓每個人都有一份好工作」（ Decent Work and Economic Growth ），包含保護勞工的權益，為所有勞工創造安全有保障的工作環境", "(4)SDGs 16 是「促進和平多元的社會，確保司 法平等，建立具公信力且廣納民意的體系」（ Peace, Justice and Strong Institutions ），包含促進及落實沒有歧視的法律與政策，以實現永續發展"], ans: 1, note: "SDGs 4 內容正確，原選項文字有誤植。", law: "聯合國SDGs"},
{id: "金融市場常識-127", text: "魷魚公司找來經理人奇勳、尚佑、美女跟俊昊一起替公司鑑別氣候變遷轉型風險，鑑別錯誤的經理人今年將無法得到績效獎金，但鑑別出最關鍵的氣候變遷轉型風險者可以得到456億獎金，請問以下哪項提案可以幫助他們成為獎金贏家 ?", options: ["(1)氣溫上升可能導致政府對於徵收碳費，公司營運成本上升", "(2)洪水可能導致廠房及設備損傷，進而可能使營運中斷", "(3)極端降雨可能導致用水吃緊或產量下降", "(4)乾旱可能造成缺水影響產能穩定性"], ans: 1, note: "(2)(3)(4) 屬於「實體風險」(Physical Risk)；(1) 政策法規改變 (碳費) 屬於「轉型風險」(Transition Risk)。", law: "氣候相關財務揭露 (TCFD)"},
{id: "金融市場常識-128", text: "企業依照「上市公司編製與申報永續報告書作業辦法」編製永續報告書時應參考全球永續性報告協會（ Global Reporting Initiatives ，GRI）發布之 GRI準則，請問以下對 GRI準則的敘述何者錯誤 ?", options: ["(1)GRI 準則的主題準則涵蓋經濟、社會及環境", "(2)GRI準則在2021年10月改版後，企業應隨即適用新版準則編製報告書", "(3)企業應透過重大性分析流程，決定報告書應報告的內容", "(4)GRI準則中除了主題準則外也 包含基礎通用準則，例如報告書的報導原則"], ans: 2, note: "GRI準則改版通常有緩衝期，企業並非需「隨即」適用，通常是鼓勵儘早適用。", law: "GRI準則"},
{id: "金融市場常識-129", text: "小黃因疫情慘澹失業後，個人經濟遭遇困難、信用紀錄也開始惡化，還好受惠於近年來金融業積極推動普惠金融服務，請問以下小黃獲得之幫助何者非屬普惠金融相關 ?", options: ["(1)小黃得以較低保費取得基本保險保障", "(2)小黃報名參加某證券商舉辦的期貨商品投資講座，學習投資期貨或選擇權獲利", "(3)某銀行提供小黃低碳運輸微型貸款，幫助小黃購置電動機車代步、開啟外送員新人生", "(4)小黃透過完整的網銀服務，在失業期間為了節省房租而搬回鄉下老家時，也可以享受 e指理財、從線上進行基金申購"], ans: 2, note: "普惠金融 (Financial Inclusion) 旨在提供弱勢族群基本、公平、可負擔的金融服務 (保險、貸款、支付)。高風險的期貨投機教學非普惠金融範疇。", law: "普惠金融政策"},
{id: "金融市場常識-130", text: "金融監督管理委員會於 2020年推出之『綠色金融行動方案 2.0』，其中為推動落實責任投資，並鼓勵金融業及政府相關單位辦理永續發展領域之投資，所提出投資面向之具體措施不包含下列何者？", options: ["(1)修正機構投資人誠信經營守則", "(2)研議將 ESG 責任投資納入自律規範", "(3)鼓勵金融機構辦理永續發展領域之投資", "(4)洽請國營事業及政府基金參與永續發展領域之投資"], ans: 1, note: "綠色金融行動方案 2.0 投資面向措施未包含修正「誠信經營守則」（應為推動「盡職治理守則」或相關ESG揭露規範）。", law: "綠色金融行動方案 2.0"},
{id: "金融市場常識-131", text: "知名犯罪學家唐諾 ‧克雷西 (Donald Cressey) 提出了「舞弊三角理論」用以說明在某些條件存在時，詐騙行為通常會發生！上開條件為何 ?", options: ["(1)壓力/動機", "(2)機會", "(3)合理化的心理機制", "(4)以上皆是"], ans: 4, note: "舞弊三角 (Fraud Triangle) 三要素：壓力(Pressure)、機會(Opportunity)、合理化(Rationalization)。", law: "舞弊防制理論"},
{id: "金融市場常識-132", text: "下列何者屬於紅旗警訊 (亦即發現此種情形時，通常接下來有舞弊的可能 )?", options: ["(1)生活突然變得奢侈", "(2)陷入嚴重的財務困境", "(3)跟供應商或客戶有不正常的親密或往來", "(4)以上皆是"], ans: 4, note: "皆為典型的舞弊跡象 (Red Flags)。", law: "舞弊查核實務"},
{id: "金融市場常識-133", text: "詐騙之所以能夠遂行，常常是公司組織內部給予行為人「機會」，下列何者屬於較為常見的「機會」：", options: ["(1)缺乏內部控制 (譬如會計兼任出納等 )", "(2)內部控制的逾越與失靈", "(3)最高管理階層漠不關心", "(4)以上皆是"], ans: 4, note: "內控缺失或失效提供舞弊機會。", law: "內部控制理論"},
{id: "金融市場常識-134", text: "下列何者能夠有效發現潛在詐騙行為的措施 ?", options: ["(1)檢舉專線", "(2)內部稽核", "(3)管理階層定期檢視", "(4)以上皆是"], ans: 4, note: "吹哨者機制、稽核與管理審查皆為有效偵測手段。", law: "舞弊防制實務"},
{id: "金融市場常識-135", text: "金管會為阻斷舞弊行為發生，進而指示、建議了理專二十一誡，下列何者屬實？", options: ["(1)留存或代客戶保管存摺、印章、保單", "(2)跟客戶間有私人借貸關係或資金往來", "(3)理專的客戶與理專留存的電話、地址、電子郵件同一", "(4)以上皆是"], ans: 4, note: "這些都是「理專十誡」(後來擴增) 中明令禁止的行為。", law: "銀行防範理財專員挪用客戶款項相關內控作業原則"},
{id: "金融市場常識-136", text: "金融機構確認客戶身分時，有下列何種情形，應予以婉拒建立業務關係 ?", options: ["(1)出示之身分證明文件均為影本", "(2)客戶不尋常拖延應補充之身分證明文件", "(3)疑似使用匿名、假名、人頭、虛設行號", "(4)以上皆是"], ans: 4, note: "無法完成KYC或疑似洗錢者，應婉拒開戶。", law: "金融機構防制洗錢辦法"},
{id: "金融市場常識-137", text: "A上市公司經過董事會決議後，預計合併 B上市公司，下列何者於此一併購消息公開前不能進行買賣？", options: ["(1)A公司董事、經理人", "(2)協助併購進行的財務顧問", "(3)從財務顧問打電話時偷聽到的配偶", "(4)以上皆是"], ans: 4, note: "內部人、準內部人及消息受領人皆受內線交易規範限制。", law: "證券交易法第157-1條"},
{id: "金融市場常識-138", text: "知悉重大消息的內部人，在重大消息公開後幾小時後，才可以進行買賣股票？", options: ["(1)6小時", "(2)12小時", "(3)18小時", "(4)24小時"], ans: 3, note: "證券交易法規定消息公開後18小時內不得買賣 (沉澱期)。", law: "證券交易法第157-1條"},
{id: "金融市場常識-139", text: "新聞事件中常看到作假帳、財報不實等案件，這些案件常可看到行為人透過「人頭」來進行假交易或非常規交易，下列何者為檢調偵辦實務上常見到的「人頭」？", options: ["(1)公司前員工", "(2)求學過程同學", "(3)親友", "(4)以上皆是"], ans: 4, note: "人頭帳戶常由親近或可控制之人擔任。", law: "洗錢防制實務"},
{id: "金融市場常識-140", text: "當金融機構人員知道客戶的款項屬於犯罪所得時，下列何者可能違反洗錢防制法？", options: ["(1)金融機構人員提供自己戶頭給客戶使用", "(2)協助客戶利用該款項購買某類金融商品", "(3)協助客戶將該款項分批、化整為零地放入客戶自己帳戶裡", "(4)以上皆是"], ans: 4, note: "協助掩飾或隱匿犯罪所得，皆構成洗錢罪。", law: "洗錢防制法"},
{id: "金融市場常識-141", text: "通常而言，零息債券（ Zero-Coupon Bond ）的票面價格較市價為：", options: ["(1)高", "(2)相等", "(3)低", "(4)沒有一定關係"], ans: 1, note: "零息債券不付息，採折價發行 (市價 < 面額)，到期按面額償還。故票面價格 > 市價。", law: "債券市場概論"},
{id: "金融市場常識-142", text: "公債自營商在公債發行消息公布後，於正式標售之前，以約定利率和投資人進行買賣，而交割日訂在發行日之後，此種市場為 ?", options: ["(1)公債發行前期交易市場", "(2)發行市場", "(3)次級市場", "(4)店頭市場"], ans: 1, note: "此為「發行前交易」 (When-Issued Market)。", law: "公債市場實務"},
{id: "金融市場常識-143", text: "登錄公債係指：", options: ["(1)無風險債券", "(2)無實體公債", "(3)垃圾債券", "(4)固定利率公債"], ans: 2, note: "登錄公債是指以登記形式發行，不印製實體券，即無實體公債。", law: "中央公債經理辦法"},
{id: "金融市場常識-144", text: "公債於何處流通買賣：", options: ["(1)集中交易市場", "(2)同時在集中與店頭市場", "(3)店頭市場", "(4)櫃檯市場"], ans: 2, note: "公債主要在店頭市場 (OTC) 議價買賣，亦有少量在集中市場交易。", law: "債券市場概論"},
{id: "金融市場常識-145", text: "公司之債券評等下降時，則？ A.表示其違約風險下降； B.表示其違約風險上升； C.債券價格會下降； D.債券價格會上升", options: ["(1)A.、C.", "(2)A.、D.", "(3)B.、C.", "(4)B.、D."], ans: 3, note: "評等下降 = 違約風險上升 (B) -> 要求報酬率上升 -> 債券價格下降 (C)。", law: "投資學/信用評等"},
{id: "金融市場常識-146", text: "債券價格隨著到期日的接近，會愈來愈趨近於：", options: ["(1)承銷價", "(2)贖回價值", "(3)市價", "(4)面值"], ans: 4, note: "債券到期時需償還面額，故價格會向面值收斂 (Pull to Par)。", law: "債券評價理論"},
{id: "金融市場常識-147", text: "A國的發行者在 B國發行以 B國貨幣計價的債券稱為：", options: ["(1)歐洲債券", "(2)貨幣債券", "(3)普通債券", "(4)外國債券"], ans: 4, note: "外國發行人在當地發行當地幣債券 = 外國債券 (如揚基債券、武士債券)。歐洲債券是境外貨幣債券。", law: "國際金融市場"},
{id: "金融市場常識-148", text: "下列何者對「垃圾債券」的敘述為真？", options: ["(1)預期報酬低的債券", "(2)屬於投資等級的債券", "(3)高風險、高殖利率之債券", "(4)高品質的債券"], ans: 3, note: "垃圾債券 (Junk Bond) 即非投資等級債券，風險高、殖利率高。", law: "債券評等"},
{id: "金融市場常識-149", text: "乙債券 4年後到期，其面額為 10萬元，每年付息一次 5,000元，若該債券以 105,000元賣出，則其到期殖利率：", options: ["(1)小於 5%", "(2)等於 5%", "(3)大於 5%", "(4)大於或等於 5%"], ans: 1, note: "票面利率 = 5000/100000 = 5%。因為溢價賣出 (105000 > 100000)，故到期殖利率 < 票面利率 (5%)。", law: "債券評價理論"},
{id: "金融市場常識-150", text: "下列何者為債券投資所面臨的風險？", options: ["(1)違約風險", "(2)購買力風險", "(3)利率風險", "(4)以上皆是"], ans: 4, note: "債券風險包含違約(信用)、通膨(購買力)、利率(價格)風險。", law: "投資學概論"},   
{id: "金融市場常識-151", text: "其他因素不變下，債券市價與市場利率常作何種變動關係？", options: ["(1)同方向變動", "(2)反方向變動", "(3)沒有關連性", "(4)同方向或反方向變動均有可能"], ans: 2, note: "債券價格與市場利率呈反向變動關係。利率上升，債券價格下跌；利率下跌，債券價格上漲。", law: "債券評價理論"},
{id: "金融市場常識-152", text: "其他因素不變下，下列何種金融工具的利率風險最高？", options: ["(1)短期公債", "(2)國庫券", "(3)長期公債", "(4)商業本票"], ans: 3, note: "存續期間(Duration)越長，利率風險越高。長期公債之存續期間大於短期工具。", law: "債券存續期間"},
{id: "金融市場常識-153", text: "證券商在國外證券市場買賣「小龍債券」之結算交割之進行是 ?", options: ["(1)現款現券交割", "(2)在臺灣集保公司", "(3)透過 Euroclear 或Cedel國際性結算交割辦理", "(4)在臺灣證券交易所"], ans: 3, note: "小龍債券(Dragon Bond)屬亞洲美元債券，通常透過國際結算系統如 Euroclear 或 Cedel (現為Clearstream) 辦理交割。", law: "國際債券市場慣例"},
{id: "金融市場常識-154", text: "在標準普爾 (Standard & Poor 's) 的評等中，那一評等等級以上的債券為投資等級？", options: ["(1)BB", "(2)BBB", "(3)A", "(4)AA"], ans: 2, note: "S&P評等中，BBB(含)以上為投資等級，BB以下為投機等級(垃圾債券)。", law: "信用評等定義"},
{id: "金融市場常識-155", text: "公司債的持有人為公司的：", options: ["(1)債權人", "(2)股東", "(3)董事", "(4)經理人"], ans: 1, note: "購買公司債即借錢給公司，故為公司的債權人，享有收取利息與到期償還本金的權利。", law: "公司法/證券交易法"},
{id: "金融市場常識-156", text: "歐洲債券 (Euro Bonds) 與外國債券 (Foreign Bonds) 之比較何者為真？", options: ["(1)歐洲債券是指A國發行者在 B國發行以 B國幣計價之債券", "(2)外國債券是指 A國發行者在 B國發行不以B國幣計價之債券", "(3)歐洲債券發行的相關條件與規定均較外國債券來得有彈性", "(4)亞銀所發行的亞洲小龍債券系列屬於歐洲債券的一種"], ans: 3, note: "歐洲債券屬境外市場，受單一國家法規限制較少，發行較具彈性。選項(1)是外國債券的定義。", law: "國際金融市場概論"},
{id: "金融市場常識-157", text: "目前在我國賣出公司債時須課徵多少證券交易稅？", options: ["(1)千分之一", "(2)千分之二", "(3)千分之三", "(4)免稅"], ans: 4, note: "依證券交易稅條例，目前公司債及金融債券之證券交易稅停徵(免稅)。", law: "證券交易稅條例"},
{id: "金融市場常識-158", text: "下列何者不屬於債券？", options: ["(1)政府公債", "(2)公司債", "(3)金融債券", "(4)認購權證"], ans: 4, note: "認購權證(Warrant)是一種衍生性金融商品(權利契約)，非債務憑證。", law: "證券交易法"},
{id: "金融市場常識-159", text: "可贖回公司債之贖回權利是操之於：", options: ["(1)債權人", "(2)發行公司", "(3)承銷之證券商", "(4)選項(1)、(2)、(3)均有可能"], ans: 2, note: "可贖回(Callable)債券允許「發行公司」在到期日前以約定價格買回債券。", law: "公司債發行規則"},
{id: "金融市場常識-160", text: "零息債券 (Zero -coupon Bonds) 之敘述何者正確？", options: ["(1)以高於面額發行", "(2)每間隔一固定期間，定期給付利息", "(3)每間隔一固定期間，定期償還本金", "(4)到期時，按面額贖回"], ans: 4, note: "零息債券採折價發行，期間不付息，到期時按面額贖回，其價差即為利息。", law: "債券市場概論"},
{id: "金融市場常識-161", text: "在其他條件相同下，到期期間愈長的債券，其價格對利率的敏感性：", options: ["(1)愈大", "(2)愈小", "(3)不變", "(4)無從得知"], ans: 1, note: "到期期間越長，存續期間(Duration)通常越長，對利率變動的敏感度越高。", law: "債券評價理論"},
{id: "金融市場常識-162", text: "在其他條件不變下，可轉換公司債的凍結期間愈長，則其價值會：", options: ["(1)愈低", "(2)愈高", "(3)不變", "(4)無從得知"], ans: 1, note: "凍結期間(閉鎖期)越長，投資人無法行使轉換權的時間越久，流動性與選擇權價值受限，故價值較低。", law: "可轉換公司債評價"},
{id: "金融市場常識-163", text: "在其他條件相同下，當殖利率變動 1%時，高票面利率債券價格的變動會比低票面利率債券價格的變動：", options: ["(1)大", "(2)一樣", "(3)小", "(4)不一定"], ans: 3, note: "票面利率較高者，其存續期間(Duration)較短，故價格對利率的敏感度(變動幅度)較小。", law: "債券存續期間"},
{id: "金融市場常識-164", text: "國內證券市場上認購權證的發行人為？", options: ["(1)證券金融公司", "(2)臺灣證券交易所", "(3)綜合證券商", "(4)證券投資信託公司"], ans: 3, note: "認購(售)權證之發行人資格限定為標的證券發行公司以外之第三人，且須為具備一定資格之綜合證券商。", law: "發行人申請發行認購(售)權證處理準則"},
{id: "金融市場常識-165", text: "申請股票上櫃必須有幾家以上證券商書面推薦？", options: ["(1)1家", "(2)2家", "(3)3家", "(4)4家"], ans: 2, note: "依櫃買中心規定，申請股票上櫃須由二家以上證券商書面推薦，其中一家為主辦推薦證券商。", law: "證券商營業處所買賣有價證券審查準則"},
{id: "金融市場常識-166", text: "A股除權前一營業日收盤價 60元，無償配股 (股票股利 )每股 2元，則除權參考價為：", options: ["(1)58元", "(2)50元", "(3)48元", "(4)40元"], ans: 2, note: "配股2元代表每張股票配發200股(20%)。參考價 = 收盤價 / (1 + 配股率) = 60 / (1 + 0.2) = 50元。", law: "證券交易實務"},
{id: "金融市場常識-167", text: "一般發行公司申請股票上市，申請時須已依公司法設立登記屆滿：", options: ["(1)1年", "(2)2年", "(3)3年", "(4)4年"], ans: 3, note: "台灣證券交易所上市審查準則規定，申請上市需設立登記屆滿3年以上。", law: "臺灣證券交易所上市審查準則"},
{id: "金融市場常識-168", text: "何種承銷方式所決定出來的價格較具市場性？", options: ["(1)競價拍賣", "(2)詢價圈購", "(3)洽商銷售", "(4)公開申購配售"], ans: 1, note: "競價拍賣(Auction)由投資人投標決定價格，最能反映市場供需與價格發現功能。題庫答案選(1)。", law: "中華民國證券商業同業公會證券商承銷或再行銷售有價證券處理準則"},
{id: "金融市場常識-169", text: "國內股票漲跌幅的限制係指：", options: ["(1)當日開盤價的上、下 10%的範圍內成交", "(2)當日開盤競價基準的上、下 10%的範圍內成交", "(3)當日開盤價的上、下 5%的範圍內成交", "(4)當日開盤競價基準的上、下 5%的範圍內成交"], ans: 2, note: "現行台股漲跌幅限制為前一日收盤價(或開盤競價基準)的上下10%。", law: "臺灣證券交易所交易規則"},
{id: "金融市場常識-170", text: "證券商應多久計算一信用帳戶之整戶及各筆融資融券擔保維持率？", options: ["(1)每日", "(2)每週", "(3)每月", "(4)每季"], ans: 1, note: "因股價每日變動，證券商需「每日」計算擔保維持率，低於規定(如130%)則發出追繳通知。", law: "證券商辦理有價證券買賣融資融券業務操作辦法"},
{id: "金融市場常識-171", text: "下列何種承銷方式較具公平性及股權分散？", options: ["(1)競價拍賣", "(2)詢價圈購", "(3)洽商銷售", "(4)公開申購配售"], ans: 4, note: "公開申購配售(Public Subscription)採抽籤方式，每人限購一定數量，最能達到股權分散與機會均等。", law: "證券承銷實務"},
{id: "金融市場常識-172", text: "目前國內股票市場的證券交易成本包括：", options: ["(1)交易稅及證所稅", "(2)手續費及證所稅", "(3)手續費及交易稅", "(4)手續費、交易稅及證所稅"], ans: 3, note: "目前國內股票交易需支付給券商「手續費」及給政府「證券交易稅」。證所稅目前停徵。", law: "證券交易稅條例/證券商收費標準"},
{id: "金融市場常識-173", text: "目前國內股票市場證券交易手續費收取的對象為：", options: ["(1)僅就買方收取", "(2)僅就賣方收取", "(3)買進、賣出雙方均收取", "(4)買進、賣出雙方均不須收取"], ans: 3, note: "證券經紀手續費對買賣雙方均收取(通常上限為0.1425%)。", law: "證券商管理規則"},
{id: "金融市場常識-174", text: "目前國內股票市場證券交易，所謂鉅額交易係指買或賣同一種有價證券，交易數量在多少交易單位以上？", options: ["(1)100單位", "(2)500單位", "(3)1,000 單位", "(4)5,000 單位"], ans: 2, note: "鉅額交易定義：單一證券數量達500交易單位(張)以上，或金額達1500萬元以上。", law: "臺灣證券交易所鉅額證券買賣辦法"},
{id: "金融市場常識-175", text: "目前國內股票市場的競價交易制度為以下哪一種？", options: ["(1)連續競價交易制度", "(2)集合競價交易制度", "(3)連續競價、集合競價混合交易制度", "(4)人工喊價交易制度"], ans: 2, note: "依題庫標準答案為(2)。(註：台股現行盤中已改為逐筆交易，但開收盤仍為集合競價，且本題庫為舊制標準，請依(2)作答)。", law: "證券交易實務"},
{id: "金融市場常識-176", text: "盤後定價交易係指每日收盤後，有價證券依照集中交易市場何種價格進行定價交易的方式？", options: ["(1)開盤價", "(2)收盤價", "(3)平盤價", "(4)平均價"], ans: 2, note: "盤後定價交易是以當日「收盤價」進行撮合。", law: "臺灣證券交易所盤後定價交易作業要點"},
{id: "金融市場常識-177", text: "關於當日沖銷，下列敘述何者正確？", options: ["(1)不收取融資利息", "(2)不收取融券手續費", "(3)當日沖抵額度可以循環使用", "(4)交割須款券預先收足"], ans: 1, note: "現行實務上，現股當沖若採資券相抵或特定券商優惠，常有不收融資利息之情形（因無過夜），且當沖採差額交割，無需預先收足全額款券。", law: "證券商辦理有價證券買賣融資融券業務操作辦法"},
{id: "金融市場常識-178", text: "融券的成本不包括下列何者？", options: ["(1)交易稅", "(2)融券手續費", "(3)交易手續費", "(4)融券利息"], ans: 4, note: "融券是借股票來賣，借券人(投資人)不需支付利息給券商，反而賣出價款作為擔保品存在券商處，券商應支付融券賣出價款的利息給投資人(雖然實務上極低)。投資人需付的是手續費與融券費。", law: "融資融券業務操作辦法"},
{id: "金融市場常識-179", text: "其他因素不變下，下列何者不直接影響公司債券價格的波動？", options: ["(1)公司信用評等狀況", "(2)公司股利", "(3)市場利率", "(4)時間"], ans: 2, note: "公司股利政策主要影響股票價格，債券價格主要受利率、信用評等、到期時間影響。", law: "債券評價理論"},
{id: "金融市場常識-180", text: "下列何者係屬上市股票的場外交易？", options: ["(1)一般交易", "(2)鉅額交易", "(3)盤後交易", "(4)以上皆非"], ans: 4, note: "上市股票的一般、鉅額、盤後交易皆在證券交易所(集中市場)系統內進行，非場外交易(OTC)。", law: "證券交易法"},
{id: "金融市場常識-181", text: "下列何者非期貨合約（ futures contract ）之特性？", options: ["(1)集中競價", "(2)每日結算保證金盈虧", "(3)買賣雙方均承擔對方的信用風險", "(4)定型化合約"], ans: 3, note: "期貨交易透過結算所(Clearing House)擔任中央對手方，買賣雙方不直接承擔對手信用風險。", law: "期貨交易法/結算制度"},
{id: "金融市場常識-182", text: "下列何者不是期交所在調整期貨合約保證金時之考量因素？", options: ["(1)期貨合約價格波動性大小", "(2)期貨合約總值大小", "(3)期貨合約交易量大小", "(4)現貨價格波動性大小"], ans: 3, note: "保證金主要涵蓋價格波動風險。交易量大小與風險涵蓋範圍較無直接關聯，非主要調整依據。", law: "臺灣期貨交易所結算保證金收取方式及標準"},
{id: "金融市場常識-183", text: "下列何者不是期貨契約標準化要求一致之因素？", options: ["(1)品質", "(2)數量", "(3)價格", "(4)交割地點"], ans: 3, note: "期貨契約的「價格」是隨市場供需交易決定的，非標準化條款。", law: "期貨交易理論"},
{id: "金融市場常識-184", text: "期貨市場中所謂「正向市場」乃指所有期貨價格與現貨價格比較時，期貨價值會：", options: ["(1)高於現貨價格", "(2)等於現貨價格", "(3)低於現貨價格", "(4)與現貨價格無關"], ans: 1, note: "正向市場(Contango)指期貨價格 > 現貨價格(持有成本為正)。", law: "期貨基差理論"},
{id: "金融市場常識-185", text: "期貨經紀商不得從事何種行為？", options: ["(1)代收保證金", "(2)代客戶下單至交易所", "(3)代替買賣雙方直接撮合", "(4)代客戶進行實物交割"], ans: 3, note: "期貨交易應透過交易所集中撮合，經紀商私下撮合(Bucketing)是違法行為。", law: "期貨交易法"},
{id: "金融市場常識-186", text: "有些業務員因想獲得不當之較多佣金，於是鼓勵客戶多作交易而未顧及客戶利益，此種情形稱之為：", options: ["(1)對作", "(2)擠壓", "(3)炒單", "(4)搶帽子"], ans: 3, note: "炒單(Churning)指經紀人為賺取佣金，勸誘客戶進行不必要的頻繁交易。", law: "期貨商管理規則"},
{id: "金融市場常識-187", text: "最近油價飆漲，某甲若完全根據預期而直接放空利率期貨且賺了不少，請問他屬於：", options: ["(1)避險者", "(2)投機者", "(3)價差交易者", "(4)價值投資交易者"], ans: 2, note: "單純根據預期進行交易以獲取價差利潤，未持有現貨部位，屬於投機者(Speculator)。", law: "期貨交易實務"},
{id: "金融市場常識-188", text: "主管機關開放的摩根臺指期貨（ MSCI Taiwan index ）在哪一個交易所交易？", options: ["(1)CME", "(2)CBOT", "(3)HKEX", "(4)SGX"], ans: 3, note: "摩根臺指期貨(MSCI Taiwan Index Futures)在新加坡交易所(SGX)交易。(註：題庫答案標示HKEX(3)可能是舊版或誤植，實際上MSCI台指主要在SGX，HKEX是MSCI亞太等。但依題庫標準答案選3或需確認題庫年份。*修正：本題庫答案鍵值顯示(3)，請依照題庫答案作答。*)", law: "國際金融市場"},
{id: "金融市場常識-189", text: "下列對「基差」描述何者為非？", options: ["(1)基差＝現貨價格－期貨價格", "(2)正常市場基差為負值", "(3)期貨契約到期時，基差為正值", "(4)逆價市場基差為正值"], ans: 3, note: "期貨到期時，期貨價格會收斂至現貨價格，基差應趨近於零，不會是正值。", law: "基差理論"},
{id: "金融市場常識-190", text: "期貨合約的價格於到期日收盤後，期貨價格必須等於現貨價格，其原因或理由是：", options: ["(1)未平倉部位必須於到期日收盤後進行交割", "(2)期貨交易必須逐日結算", "(3)期貨交易量大於現貨交易量", "(4)人們對期貨價格沒有偏好"], ans: 1, note: "到期收斂原理是因為到期時需進行交割(實物或現金)，若有價差將產生無風險套利機會，促使價格一致。", law: "期貨評價理論"},
{id: "金融市場常識-191", text: "期貨交易人開戶時，下列何者非屬必要？", options: ["(1)風險預告書簽名", "(2)營業員確信交易人適合期貨交易", "(3)徵信客戶的信用狀況", "(4)$10,000 的保證金存入"], ans: 4, note: "開戶時不需立即存入保證金，保證金是在下單交易前存入。", law: "期貨商管理規則"},
{id: "金融市場常識-192", text: "下列敘述何者符合期貨交易風險告知書之內容精神？", options: ["(1)期貨交易可能產生極大的利潤或損失", "(2)客戶若有超額損失，必須補繳", "(3)差價交易的風險並不一定較單純的買單或賣單小", "(4)以上皆正確"], ans: 4, note: "風險預告書旨在充分告知期貨的高槓桿、追繳風險及各類策略風險。", law: "期貨交易風險預告書範本"},
{id: "金融市場常識-193", text: "中華民國期貨市場主管機關為：", options: ["(1)中央銀行", "(2)經濟部", "(3)金融監督管理委員會", "(4)期貨交易所"], ans: 3, note: "期貨市場之主管機關為行政院金融監督管理委員會。", law: "期貨交易法第4條"},
{id: "金融市場常識-194", text: "下列各種委託單，除了何者之外，皆需標明價格？", options: ["(1)限價單", "(2)市價單", "(3)停損單", "(4)觸價單"], ans: 2, note: "市價單(Market Order)是不指定價格，依當時市場價格儘速成交的委託。", law: "期貨交易實務"},
{id: "金融市場常識-195", text: "停損單在價位的執行上是：", options: ["(1)與觸價單一樣", "(2)與市價單一樣", "(3)即是在下列價位有效執行：買單在目前市價之下，賣單在目前市價之上時", "(4)即是在下列價位有效執行：買單在目前市價之上，賣單在目前市價之下時"], ans: 4, note: "停損單(Stop Order)是為了控制損失。買單停損設在市價之上(突破追價或空單停損)，賣單停損設在市價之下(跌破殺出)。", law: "期貨委託單類型"},
{id: "金融市場常識-196", text: "客戶的保證金淨值，因市場行情往不利的方向發展，當淨值跌破某一水位，期貨商就會向客戶發出追繳保證金的通知，此一特定水位稱為：", options: ["(1)原始保證金", "(2)維持保證金", "(3)差異保證金", "(4)零和保證金"], ans: 2, note: "低於維持保證金(Maintenance Margin)時，會發出追繳通知。", law: "期貨交易法/期貨商管理規則"},
{id: "金融市場常識-197", text: "客戶保證金不足時，需補足至：", options: ["(1)變動保證金", "(2)原始保證金", "(3)維持保證金", "(4)結算保證金"], ans: 2, note: "經追繳後，客戶需將權益數補足至「原始保證金」(Initial Margin) 水準。", law: "期貨商管理規則"},
{id: "金融市場常識-198", text: "目前國內各種指數期貨契約交易保證金可以何種形式繳存？", options: ["(1)現金", "(2)現金、債券", "(3)現金、債券、定存單", "(4)現金、債券、股票"], ans: 4, note: "依現行規定，期貨交易保證金可以現金或經主管機關核定之有價證券(如股票、債券)抵繳。", law: "期貨交易法/結算部作業準則"},
{id: "金融市場常識-199", text: "客戶若要將其存入保證金提出，則其出金數額必須是：", options: ["(1)小於或等於（客戶保證金目前淨值減未平倉部位所需保證金）", "(2)保證金既為客戶存入的錢，故客戶的出金數額不受限制", "(3)期貨商可以自由決定", "(4)法規並未規範"], ans: 1, note: "客戶僅能提領「超額保證金」，即權益數扣除原始保證金後的餘額。", law: "期貨商管理規則"},
{id: "金融市場常識-200", text: "我國期貨交易之保證金制度採用：", options: ["(1)總額保證金法", "(2)淨額保證金法", "(3)針對交易人採總額保證金法、結算會員與期貨商則採淨額保證金法", "(4)由當事人自由選擇"], ans: 1, note: "我國對客戶部位採總額結算(Gross Margining)，即多空部位分開計算保證金，不得互抵(除特定部位組合外)。", law: "臺灣期貨交易所結算保證金收取方式"},
{id: "金融市場常識-201", text: "一般而言，當期貨價格與未平倉數量同步上漲時，代表：", options: ["(1)未來期貨價格持續看漲", "(2)未來期貨價格可能反轉而下", "(3)未來期貨價格可能反轉而上", "(4)未來期貨價格持續看跌"], ans: 1, note: "價漲量增(未平倉增)，代表多頭力道強勁，新資金進場，後市看漲。", law: "期貨技術分析"},
{id: "金融市場常識-202", text: "“買進黃豆期貨，同時賣出黃豆粉、黃豆油期貨 ”之委託稱為：", options: ["(1)市場間價差委託", "(2)商品間價差委託", "(3)加工產品間價差委託", "(4)無效的委託"], ans: 3, note: "買進原料（黃豆）並賣出加工成品（豆粉、豆油）以鎖定加工利潤，稱為「加工產品間價差交易」（Crush Spread）。", law: "期貨價差交易策略"},
{id: "金融市場常識-203", text: "臺灣期貨交易所 30天期利率期貨之交易標的為國內之何種票券工具？", options: ["(1)30天期融資性商業本票", "(2)國庫券", "(3)銀行承兌匯票", "(4)可轉讓定期存單"], ans: 1, note: "臺灣30天期利率期貨的標的為30天期融資性商業本票(CP)。", law: "臺灣期貨交易所契約規格"},
{id: "金融市場常識-204", text: "通常避險策略會一直維持，而且儘可能愈接近期貨契約到期日時，才結束避險策略，其中最主要的考量為：", options: ["(1)交易成本低", "(2)價格波動性大", "(3)基差風險小", "(4)基差風險大"], ans: 3, note: "接近到期日時，基差會收斂趨近於零，此時結束避險可降低基差風險。", law: "期貨避險理論"},
{id: "金融市場常識-205", text: "利用合成資產的觀念，當股票型基金經理人看壞股票市場時，應採行何種方式進行資產重置，而使現行資產轉移成合成債券以規避股市風險？", options: ["(1)買進指數期貨", "(2)賣空指數期貨", "(3)買進指數期貨而且買進債券", "(4)賣空指數期貨而且賣空債券"], ans: 2, note: "持有股票現貨 + 賣出指數期貨 = 合成債券(無風險資產)，可規避系統性風險。", law: "金融工程/期貨避險"},
{id: "金融市場常識-206", text: "採行完全避險策略時，避險者仍有可能遭遇追繳保證金之情況，其主要原因為：", options: ["(1)現貨價格與期貨價格之變動相關性改變所致", "(2)逐日結算制度所致", "(3)基差值改變所致", "(4)現貨價格波動性增大所致"], ans: 2, note: "即使是避險，期貨部位仍需面對逐日結算，若行情不利(例如多頭避險遇大漲)，期貨部位虧損需補繳保證金。", law: "期貨避險實務"},
{id: "金融市場常識-207", text: "輕油裂解廠通常會如何避險？", options: ["(1)買有鉛汽油期貨，賣無鉛汽油期貨", "(2)買無鉛汽油期貨，賣有鉛汽油期貨", "(3)買原油期貨，賣無鉛汽油期貨", "(4)買有鉛汽油期貨，賣原油期貨"], ans: 3, note: "煉油廠需買入原料（原油）並賣出產品（汽油），故避險策略為：買入原油期貨（鎖定成本），賣出汽油期貨（鎖定售價），此為裂解價差（Crack Spread）。", law: "能源期貨避險"},
{id: "金融市場常識-208", text: "利用股價指數期貨無法幫你規避：", options: ["(1)市場風險", "(2)系統風險", "(3)指數型投資組合之風險", "(4)股利變動之風險"], ans: 4, note: "股價指數期貨反映的是一籃子股票價格，無法規避個別公司的股利變動風險或非系統性風險。", law: "期貨避險極限"},
{id: "金融市場常識-209", text: "以下何者不是期貨投資活動的正常功能？", options: ["(1)風險移轉", "(2)增加市場的流動性", "(3)有助於期貨價格的穩定", "(4)操控期貨價格"], ans: 4, note: "操控價格(Manipulation)是違法行為，非正常功能。", law: "期貨市場功能"},
{id: "金融市場常識-210", text: "認購權證之「發行者」相當於下列選擇權策略中那一種角色？", options: ["(1)買進買權（ Buy Call）", "(2)買進賣權（ Buy Put）", "(3)賣出買權（ Sell Call）", "(4)賣出賣權（ Sell Put）"], ans: 3, note: "發行認購權證(Call Warrant)者，是賣出權利給投資人，故為賣出買權(Short Call)。", law: "選擇權策略"},
{id: "金融市場常識-211", text: "以下那一種交易者不必繳交保證金？", options: ["(1)期貨的買方", "(2)選擇權的買方", "(3)期貨的賣方", "(4)選擇權的賣方"], ans: 2, note: "選擇權買方支付權利金後即取得權利，無履約義務，故不需繳交保證金。", law: "選擇權交易規則"},
{id: "金融市場常識-212", text: "S&P 500 現貨指數 675點，則：", options: ["(1)680買權為價內／ 680賣權為價外", "(2)670買權為價內／ 670賣權為價外", "(3)670買權及賣權皆為價內", "(4)665買權及賣權皆為價外"], ans: 2, note: "現貨675 > 履約價670，買權(Call)有價值(價內)；現貨675 > 履約價670，賣權(Put)無價值(價外)。", law: "選擇權價內外定義"},
{id: "金融市場常識-213", text: "當賣出期貨賣權 (put)且被執行時，其結果如何？", options: ["(1)取得多頭期貨契約", "(2)取得空頭期貨契約", "(3)取得相等數量之現貨", "(4)取得現金"], ans: 1, note: "賣出賣權(Short Put)被履約，代表有義務以履約價買入期貨，故取得多頭期貨契約(Long Futures)。", law: "期貨選擇權結算"},
{id: "金融市場常識-214", text: "價內（ in-the-money）期貨賣權（ put）越深價內，其時間價值（ time value ）會：", options: ["(1)上升", "(2)下降", "(3)不一定", "(4)不受影響"], ans: 2, note: "越深價內或越深價外，時間價值通常越低；平價(ATM)時時間價值最高。", law: "選擇權評價"},
{id: "金融市場常識-215", text: "結算所在期貨交易中所扮演的角色不包括下列哪一項？", options: ["(1)進行每日結算", "(2)介入每筆交易成為買方的賣方，以及賣方的買方", "(3)承擔買賣雙方的信用風險", "(4)負責監視不法交易行為"], ans: 4, note: "監視不法交易行為通常是交易所或主管機關的權責，結算所主要負責結算交割與信用擔保。", law: "期貨結算機構管理規則"},
{id: "金融市場常識-216", text: "目前股價指數期貨之交割方式為", options: ["(1)現金交割", "(2)實物交割", "(3)由賣方決定", "(4)由買方決定"], ans: 1, note: "股價指數為虛擬標的，無法實物交割，故採現金結算。", law: "期貨契約規格"},
{id: "金融市場常識-217", text: "依期交法規定，期貨交易人於何時繳交交易保證金？", options: ["(1)下單買賣之前", "(2)下單買賣之後", "(3)成交之後", "(4)成交當日之收盤後"], ans: 1, note: "期貨交易採預收保證金制，須先存入足額保證金才能下單。", law: "期貨交易法/期貨商管理規則"},
{id: "金融市場常識-218", text: "履約價格 7,200之加權股價指數賣權在最後結算價 7,150點時，每口會有多少價值？", options: ["(1)10,000 元", "(2)2,500 元", "(3)0元", "(4)50元"], ans: 2, note: "賣權價值 = (7200 - 7150) * 契約乘數 = 50點 * 50元(小型台指) = 2500元。依答案推斷契約乘數為50(小台)。", law: "選擇權結算損益"},
{id: "金融市場常識-219", text: "目前臺灣市場上的封閉型基金比開放型基金數量 (種類)：", options: ["(1)多", "(2)少", "(3)一樣", "(4)以上皆是"], ans: 2, note: "臺灣基金市場以開放型基金為主，封閉型基金數量極少。", law: "證券投資信託市場概況"},
{id: "金融市場常識-220", text: "基金經理人掌握增減基金持股比率的時機，這就是一種：", options: ["(1)積極式 (主動式 )的資產配置(Asset allocation)", "(2) 消極式 (被動式 )的資產配置", "(3)精挑細選證券 (Selection)", "(4) 以上皆非"], ans: 1, note: "主動調整持股比例以因應市場變化，屬於積極式資產配置。", law: "投資組合管理"},
{id: "金融市場常識-221", text: "下列敘述何者正確？ A.就投資組合管理而言，積極式的操作包括尋找股價偏低的股票來投資； B.就投資組合管理而言，消極式的操作包括購買指數型基金", options: ["(1)A、B都正確", "(2)只A正確", "(3)只B正確", "(4)A、B都不正確"], ans: 1, note: "積極式操作尋求超額報酬(選股)，消極式操作尋求市場報酬(指數化)。", law: "投資管理策略"},
{id: "金融市場常識-222", text: "金控公司員工退休基金如果重視投資風險之分散，其退休基金股票組合中對於金融類股的權數最好應該要：", options: ["(1)降低權數，以規避員工收益過度集中之分散", "(2)加重權數，因為自認為相當了解此一產業", "(3)不變", "(4)零持股"], ans: 1, note: "員工薪資已來自金融業，若退休金又重押金融股，風險過度集中，應降低權數以達分散效果。", law: "資產配置原理"},
{id: "金融市場常識-223", text: "國內已有很多已上市公司鼓勵員工以購買自家股票之方式儲存退休金，下列那一項並不是主要理由 ?", options: ["(1)穩定公司股票籌碼", "(2)員工盼望，如果公司營運將來大幅成長的話，將來可能有筆很可觀之退休金", "(3)分散風險", "(4)降低員工流動率"], ans: 3, note: "投資自家股票會導致「人力資本」與「金融資本」集中於同一公司，違反風險分散原則。", law: "員工持股信託"},
{id: "金融市場常識-224", text: "收入穩定的年輕投資人較適合投資下列那一種基金 ?", options: ["(1)積極成長型基金", "(2)保本型基金", "(3)固定收益型基金", "(4)債券型基金"], ans: 1, note: "年輕且收入穩定者，風險承受度較高，適合追求長期資本增值的積極成長型基金。", law: "理財規劃實務"},
{id: "金融市場常識-225", text: "下列那一種股票型基金屬於較積極型投資人所投資的 ?", options: ["(1)指數型基金", "(2)成長型股票基金", "(3)價值型股票基金", "(4)低本益比股票基金"], ans: 2, note: "成長型基金投資於高成長潛力但波動較大的公司，風險與預期報酬較高，適合積極型投資人。", law: "共同基金分類"},
{id: "金融市場常識-226", text: "下列那一種股票型基金較屬於保守型投資人所投資的 ?", options: ["(1)積極成長型股票基金", "(2)價值型股票基金", "(3)中小型股基金", "(4)高本益比股票基金"], ans: 2, note: "價值型基金投資於股價被低估、營運穩健的公司，波動度通常低於成長型或中小型股基金，較適合保守型投資人。", law: "共同基金分類"},
{id: "金融市場常識-227", text: "積極的投資人較可能投資下列那一種股票 ?", options: ["(1)低本益比股票", "(2)高本益比股票", "(3)低市價淨值比股票", "(4)低市價現金流量比股票"], ans: 2, note: "高本益比股票通常代表市場賦予高成長預期(如科技股)，波動大，適合積極投資人。低本益比通常屬價值型。", law: "股票投資分析"},
{id: "金融市場常識-228", text: "下列敘述何者正確？ A.投信投顧公司代客操作應顧及職業道德； B.投信投顧公司代客操作應建立防火牆", options: ["(1)A、B都正確", "(2)只A正確", "(3)只B正確", "(4)A、B都不正確"], ans: 1, note: "代客操作需遵守誠信原則(職業道德)並防止利益衝突(防火牆)。", law: "證券投資信託及顧問法"},
{id: "金融市場常識-229", text: "下列敘述何者正確？ A.投信投顧公司代客操作應顧及客戶的投資目標與限制條件； B.投信投顧公司代客操作應顧及客戶的財富背景與承擔風險的限度", options: ["(1)A、B都正確", "(2)只A正確", "(3)只B正確", "(4)A、B都不正確"], ans: 1, note: "此為KYC(認識客戶)與適合度原則的基本要求。", law: "證券投資信託及顧問法/全權委託投資業務操作辦法"},
{id: "金融市場常識-230", text: "下列敘述何者不正確？", options: ["(1)投信投顧公司代客操作應顧及客戶的投資目標", "(2)投信投顧公司代客操作應顧及客戶的投資限制條件", "(3)投信投顧公司代客操作應顧及客戶的財務狀況", "(4)投信投顧公司代客操作不需考慮防火牆的建立"], ans: 4, note: "建立防火牆(Chinese Wall)以防止內線交易與利益衝突是絕對必要的。", law: "證券投資信託及顧問法"},
{id: "金融市場常識-231", text: "下列敘述何者較正確？", options: ["(1)投資人應該相信基金經理人的專業知識與 能力，但不一定能保證獲利", "(2)因為專業經理人的專業知識與能力都佳，所以操作績效一定佳", "(3)投資人應該相信有線電視 (第四台 )投顧解盤節目推薦之股票", "(4)投資人應該相信有線電視 (第四台 )投顧解盤節目推薦進出股市之時機"], ans: 1, note: "投資皆有風險，專業經理人能提供專業管理，但無法保證獲利。", law: "投資風險觀念"},
{id: "金融市場常識-232", text: "下列敘述何者正確？ A.只要簽定充份授權合約，投顧代客操作就可以不管投資人的年齡與財務狀況，積極操作。 B.如果客戶是退休人員，投顧代客操作就應該注意投資安全性。", options: ["(1)A、B都正確", "(2)只A正確", "(3)只B正確", "(4)A、B都不正確"], ans: 3, note: "代客操作仍須遵守適合度原則，依客戶年齡、財務狀況進行操作，不可不管。", law: "全權委託投資業務操作辦法"},
{id: "金融市場常識-233", text: "下列敘述何者正確？ A.投信基金經理人不應該一方面替公家退撫基金操盤，同時私下替個人大戶代客操作。 B.投顧公司應該定期與委託操作之客戶保持聯繫，告知績效近況與對未來證券市場之看法。", options: ["(1)A、B都正確", "(2)只A正確", "(3)只B正確", "(4)A、B都不正確"], ans: 1, note: "A涉及利益衝突與違規兼職；B為善良管理人之報告義務。", law: "證券投資信託及顧問法"},
{id: "金融市場常識-234", text: "如果目前某檔股票的真實價值遠高於其市場價值，投資人應該", options: ["(1)增加其在投資組合內之權數", "(2)降低其在投資組合內之權數", "(3)出清此股票", "(4)不需變動投資組合"], ans: 1, note: "價值高於市價代表被低估，應買進或增加持有。", law: "基本面分析"},
{id: "金融市場常識-235", text: "下列敘述何者正確，何者錯誤？ a.股市投資屬於高風險，所以一定能得到高報酬 b.想要獲得高報酬，可以投資股市，因為股市風險高", options: ["(1)敘述 a錯誤， b正確", "(2)敘述 a正確，b錯誤", "(3)敘述 a、b皆錯誤", "(4)敘述 a、b皆正確"], ans: 1, note: "高風險不保證高報酬(a錯)；但為追求高報酬通常需承擔高風險(b對)。", law: "風險報酬權衡"},
{id: "金融市場常識-236", text: "投資 BBB股票，成本每股是 20元，賣出價格是 22元，投資期間收到現金股息 3元，如果不考慮交易成本，則投資報酬率是", options: ["(1)25%", "(2)10%", "(3)0%", "(4)40%"], ans: 1, note: "報酬率 = (價差 + 股息) / 成本 = (22-20+3) / 20 = 5 / 20 = 25%。", law: "投資報酬率計算"},
{id: "金融市場常識-237", text: "根據投信投顧相關法規，下列敘述何者正確？ A.合法的投信投顧業者可以私募基金；B.私人也可以私募基金來投資", options: ["(1)只有 A正確", "(2)只有 B正確", "(3)A、B都正確", "(4)A、B都不正確"], ans: 1, note: "只有經核准的投信投顧業者可以進行私募；私人不得違法吸金或公開招募。", law: "證券投資信託及顧問法"},
{id: "金融市場常識-238", text: "投資人如何降低其投資組合之系統風險？", options: ["(1)系統風險只要透過分散投資風險性資產就可降低", "(2)系統風險是不可分散之風險，所以投資組合無法降低系統風險", "(3)系統風險是可以透過部份投資無風險性資產來降低", "(4)以上皆非"], ans: 3, note: "系統風險(市場風險)無法透過分散投資消除，但可透過降低風險性資產比重(增加無風險資產)來降低整體的Beta值。", law: "投資組合理論"},
{id: "金融市場常識-239", text: "下列那一敘述何者正確： A.假設其他條件一樣，股票之系統風險越高，其股票市場價值越高； B.假設其他條件一樣，股票之風險貼水越低，其股票市場價值越高", options: ["(1)只有 B正確", "(2)A、B都正確", "(3)只有 A正確", "(4)A、B都不正確"], ans: 1, note: "風險越高，要求報酬率越高，股價越低(A錯)。風險貼水越低，折現率越低，股價越高(B對)。", law: "CAPM模型/股票評價"},
{id: "金融市場常識-240", text: "開放型共同基金 (Mutual funds) 是：", options: ["(1)追逐絕對報酬", "(2)追逐相對於標竿 (benchmark) 高的報酬", "(3)報酬波動性一定很低的投資", "(4)投資人與投信公司議價買進基金"], ans: 2, note: "共同基金通常以擊敗指標(Benchmark)為目標，追求相對報酬。", law: "共同基金概論"},
{id: "金融市場常識-241", text: "某基金的市場波動度是 9.9%，而同一時間市場波動度是 9%，則該基金的 β值是？", options: ["(1)1.2", "(2)0.09", "(3)1.1", "(4) 以上皆非"], ans: 3, note: "若假設相關係數為1(題目簡化)，Beta = 基金波動度 / 市場波動度 = 9.9% / 9% = 1.1。", law: "Beta係數計算"},
{id: "金融市場常識-242", text: "下列敘述何者較正確？ A.針對全國基金績效評比時，不管基金經理人管的是何種基金，只要報酬率最高，基金經理人績效就是最好； B.針對全國基金績效評比時，不管基金經理人管的是何種基金，只要調整風險後的報酬率最高，基金經理人績效就是最好", options: ["(1)A、B都正確", "(2)A較正確", "(3)B較正確", "(4)A、B都不正確"], ans: 3, note: "評估績效需考量風險，應使用風險調整後報酬(如Sharpe Ratio)。", law: "基金績效評估"},
{id: "金融市場常識-243", text: "下列敘述何者較正確？ A.專門投資高科技產業股票的基金，其最適合用來比較績效的標竿(Benchmark) 是股票市場指數； B.投資人如果自己無專業投資知識，只好精挑細選基金來投資，這也是一種積極式的投資策略", options: ["(1)A、B都正確", "(2)A較正確", "(3)B較正確", "(4)A、B都不正確"], ans: 3, note: "A錯，科技基金應以科技股指數為標竿，而非大盤全體指數。B對，挑選基金試圖擊敗市場屬積極策略。", law: "基金績效評估"},
{id: "金融市場常識-244", text: "股票型基金經理人作挑選證券決策時，較會考慮：", options: ["(1)那一類別資產 (如股或債 )有較佳之展望？", "(2)那一產業有較佳之展望？", "(3)要不要決定買那一種股票指數型商品？", "(4)那一證券有較多利多的小道消息？"], ans: 2, note: "股票型經理人專注於選股，故會考量產業與個別公司展望。(1)是資產配置層次。(4)依賴內線不可取。", law: "投資決策流程"},
{id: "金融市場常識-245", text: "投資人在挑選基金時比較不會受到下列哪項因素之影響？", options: ["(1)基金公司聲譽", "(2)基金的績效", "(3)基金規模", "(4)基金經理人的性別"], ans: 4, note: "性別與基金操作能力無關，非主要考量因素。", law: "基金投資行為"},
{id: "金融市場常識-246", text: "如果軍公教人員退撫基金採消極式操作之策略，可將基金？", options: ["(1)交由專業經理人挑選證券", "(2)交由專業經理人決定投資某一類資產之時機", "(3)投資指數型基金", "(4)大部份投資在熱門股上"], ans: 3, note: "消極式操作(Passive Management)即追蹤指數，投資指數型基金。", law: "投資管理策略"},
{id: "金融市場常識-247", text: "如果軍公教人員退撫基金採積極式操作之策略，可將基金 A.部份委託國內專業基金經理人管理； B.部份委託國外專業基金經理人管理", options: ["(1)不能採用 A.法", "(2)不能採用 B法", "(3)A及B法皆可用", "(4)A及B法皆不可用"], ans: 3, note: "委託專業經理人進行選股操作，屬積極式管理，國內外皆可。", law: "基金委外經營"},
{id: "金融市場常識-248", text: "下列敘述，何者為真： A.封閉型基金有時候會產生折價之現象； B.開放型基金則是以淨值贖回，所以無折價之現 象", options: ["(1)只有 A為真", "(2)只有 B為真", "(3)A與B都為真", "(4)A與B都不真"], ans: 3, note: "封閉型基金市價決定於供需，常有折溢價；開放型基金以淨值交易，無折溢價問題。", law: "共同基金概論"},
{id: "金融市場常識-249", text: "下列敘述，何者為真： A.封閉型基金是在集中市場交易； B.開放型基金（ ETF除外）也可以在集中市場交易", options: ["(1)只有 A為真", "(2)只有 B為真", "(3)A與B都為真", "(4)以上皆非"], ans: 1, note: "封閉型基金在交易所掛牌；傳統開放型基金向投信公司申購贖回，不在集中市場交易。", law: "共同基金交易方式"},
{id: "金融市場常識-250", text: "採定期定額投資共同基金時，下列敘述何者正確？ I.當股價愈高時，可購得之基金單位數愈多； II.當股價愈高時，可購得之基金單位數愈少； III.當股價下跌時，可購得之基金單位數愈多； IV.當股價下跌時，可購得之基金單位數愈少", options: ["(1)I、III對", "(2)II、III對", "(3)I、IV對", "(4)II、IV對"], ans: 2, note: "定期定額金額固定，價格高時買得少，價格低時買得多(平均成本法)。", law: "定期定額投資法"},
{id: "金融市場常識-251", text: "定期定額投資開放式基金", options: ["(1)應該短線高出低進", "(2)不適合沒有時間看盤的投資人", "(3)不適合長期投資", "(4)認為基金淨值早晚會漲超過定期定額投資的平均成本"], ans: 4, note: "定期定額適合長期投資，利用平均成本法降低成本，預期長期淨值回升獲利。", law: "定期定額投資法"},
{id: "金融市場常識-252", text: "下列何者不是封閉型基金的特性？", options: ["(1)發行單位數是固定的", "(2)買賣價格是依基金淨值", "(3)基金沒有贖回壓力", "(4)基金大部份時間會有折溢價的狀況發生"], ans: 2, note: "封閉型基金買賣價格依市場供需決定(市價)，非依淨值。", law: "共同基金概論"},
{id: "金融市場常識-253", text: "下列何者是開放型基金的特性？", options: ["(1)買賣價格是依交易所市價", "(2)基金沒有贖回壓力", "(3)發行單位數是非固定的", "(4)基金大部份時間是處於折價狀態"], ans: 3, note: "開放型基金規模不固定，隨投資人申購贖回變動。", law: "共同基金概論"},
{id: "金融市場常識-254", text: "下列何者不是投資共同基金的好處：", options: ["(1)分散投資風險", "(2)專業機構管理", "(3)基金經理人保證獲利", "(4)具有良好的流通性"], ans: 3, note: "投資皆有風險，基金經理人不得保證獲利。", law: "證券投資信託及顧問法"},
{id: "金融市場常識-255", text: "開放型基金可以下列那種方式贖回？", options: ["(1)淨值", "(2)掛牌市價", "(3)買進成本", "(4)面額"], ans: 1, note: "開放型基金依每日計算之淨資產價值(NAV)進行申購與贖回。", law: "證券投資信託基金管理辦法"},
{id: "金融市場常識-256", text: "以下何者是一般對沖基金操作手法或目的：", options: ["(1)高度槓桿", "(2)套利", "(3)積極買賣衍生性商品", "(4)以上皆是"], ans: 4, note: "對沖基金(Hedge Fund)特徵為利用槓桿、衍生性商品及多空策略追求絕對報酬。", law: "避險基金概論"},
{id: "金融市場常識-257", text: "以下何者不是共同基金操作手法或目的：", options: ["(1)獲利目標是要擊敗標竿之報酬率", "(2)積極買賣衍生性商品", "(3)追求相對報酬", "(4)以上皆非"], ans: 2, note: "傳統共同基金受法規限制，較少過度積極買賣衍生性商品(通常僅作避險或增加效率)，不同於對沖基金。", law: "共同基金管理規則"},
{id: "金融市場常識-258", text: "以下何者是一般對沖基金操作手法？ A：套利， B：積極買賣衍生性商品", options: ["(1)只有 A正確", "(2)只有 B正確", "(3)A與B都正確", "(4)A與B都不正確"], ans: 3, note: "套利與衍生性商品交易皆為對沖基金常見策略。", law: "避險基金概論"},
{id: "金融市場常識-259", text: "下列何者係獨占發行通貨，執行貨幣政策之機構？", options: ["(1)專業銀行", "(2)商業銀行", "(3)中央銀行", "(4)財政部"], ans: 3, note: "中央銀行為國家的貨幣主管機關，具有獨占貨幣發行權。", law: "中央銀行法"},
{id: "金融市場常識-260", text: "下列何者非屬中央銀行之業務範疇？", options: ["(1)發行貨幣", "(2)進行公開市場操作", "(3)直接對企業融通資金", "(4)保管國際準備"], ans: 3, note: "央行是「銀行的銀行」，主要往來對象是金融機構與政府，不直接對一般企業或個人融通資金。", law: "中央銀行法"},
{id: "金融市場常識-261", text: "有關我國中央銀行之功能，下列何者錯誤？", options: ["(1)執行貨幣政策", "(2)穩定匯率", "(3)維持安全有效率之支付制度", "(4)核定各商業銀行之牌告利率"], ans: 4, note: "我國利率已自由化，商業銀行之牌告利率由各銀行自行訂定，非央行核定。", law: "銀行法/中央銀行法"},
{id: "金融市場常識-262", text: "若其他條件不變，下列何者會使本國貨幣供給量增加？", options: ["(1)國際收支順差", "(2)國際收支逆差", "(3)全體銀行對企業及個人信用緊縮", "(4)政府財政赤字餘額減少"], ans: 1, note: "國際收支順差代表外匯流入，央行買入外匯釋出本國貨幣，導致貨幣供給增加。", law: "貨幣銀行學"},
{id: "金融市場常識-263", text: "銀行法中所稱資本嚴重不足，係指自有資本與風險性資產之比率低於多少百分比？", options: ["(1)1%", "(2)2%", "(3)5%", "(4)8%"], ans: 2, note: "依銀行法第62條及相關辦法，資本適足率低於2%列為資本嚴重不足。", law: "銀行資本適足性及資本等級管理辦法"},
{id: "金融市場常識-264", text: "銀行對於隨時可能發生的資金需求，因其變現能力與準備部位不足所產生的風險，稱為下列何者？", options: ["(1)信用風險 （ credit risk ）", "(2)市場風險 （ market risk ）", "(3)流動性風險 （ liquidity risk）", "(4)營運風險（ operational risk ）"], ans: 3, note: "無法應付資金提領或債務到期之風險為流動性風險。", law: "銀行風險管理"},
{id: "金融市場常識-265", text: "當借款人或交易對手違約，致無法履行原先對銀行承諾的債務時，銀行將承受下列何種風險？", options: ["(1)營運風險", "(2)信用風險", "(3)法律風險", "(4)市場風險"], ans: 2, note: "交易對手不履約造成的損失風險為信用風險。", law: "銀行風險管理"},
{id: "金融市場常識-266", text: "下列何項比率愈低，表示銀行資產品質愈佳？", options: ["(1)淨值報酬率", "(2)資產週轉率", "(3)逾放比率", "(4)存放比率"], ans: 3, note: "逾放比率(NPL Ratio)代表壞帳比例，越低代表資產品質越好。", law: "銀行資產評估損失準備提列及逾期放款催收款呆帳處理辦法"},
{id: "金融市場常識-267", text: "假設其他條件不變，下列何者可使存款貨幣的創造能力提高而增加貨幣供給量？", options: ["(1)法定存款準備率提高", "(2)銀行授信增列補償性存款之規定", "(3)銀行超額準備增加", "(4)法定存款準備率降低"], ans: 4, note: "降低法定準備率，貨幣乘數變大，銀行可貸資金增加，創造貨幣能力提高。", law: "貨幣銀行學"},
{id: "金融市場常識-268", text: "為穩健經營，有關商業銀行資金運用之原則，下列何者有誤？", options: ["(1)安全性", "(2)投機性", "(3)流動性", "(4)獲利性"], ans: 2, note: "銀行經營三原則為安全性、流動性、獲利性。投機性違反穩健經營原則。", law: "商業銀行經營實務"},
{id: "金融市場常識-269", text: "銀行內部控管制度如欠完備，造成人為疏失、舞弊或資訊系統操作不良，將使銀行承受何種風險所致損失？", options: ["(1)市場風險", "(2)法律風險", "(3)營運風險", "(4)流動性風險"], ans: 3, note: "內部作業、人員、系統疏失所致風險稱為作業風險(營運風險, Operational Risk)。", law: "銀行資本適足性及資本等級管理辦法"},
{id: "金融市場常識-270", text: "銀行將利率敏感性缺口控制在一適當水準，係用來管理下列何項風險？", options: ["(1)營運風險", "(2)信用風險", "(3)市場風險", "(4)利率風險"], ans: 4, note: "缺口管理(Gap Management)是資產負債管理中用來管理利率風險的方法。", law: "資產負債管理"},
{id: "金融市場常識-271", text: "存款有一定時期之限制，存款人憑存單或依約定方式提取，並得以之質借之存款，稱為下列何者？", options: ["(1)支票存款", "(2)活期存款", "(3)活期儲蓄存款", "(4)定期存款"], ans: 4, note: "有約定期限之存款為定期存款。", law: "銀行法第8條"},
{id: "金融市場常識-272", text: "銀行兌付可轉讓定期存單、商業本票、國庫券之利息時，應按給付額多少百分比扣繳利息所得稅？", options: ["(1)10%", "(2)15%", "(3)20%", "(4)30%"], ans: 1, note: "短期票券及債券利息所得之扣繳稅率目前為10%。", law: "各類所得扣繳率標準"},
{id: "金融市場常識-273", text: "依「洗錢防制法」之規定，金融機構對疑似洗錢之交易，應向下列何者申報？", options: ["(1)財政部", "(2)法務部調查局", "(3)金融監督管理委員會", "(4)警察局"], ans: 2, note: "洗錢防制法規定，受理申報機構為法務部調查局。", law: "洗錢防制法"},
{id: "金融市場常識-274", text: "提供下列何者予銀行辦理貸款者，不 屬於擔保授信？", options: ["(1)不動產抵押權", "(2)動產或權利質權", "(3)政府核准設立之信用保證機構保證", "(4)借款人開立之票據"], ans: 4, note: "依銀行法第12條，借款人自己開立的票據不構成擔保品。", law: "銀行法第12條"},
{id: "金融市場常識-275", text: "可轉讓定期存單以新台幣多少元為一單位，並按其倍數發行？", options: ["(1)一萬元", "(2)五萬元", "(3)十萬元", "(4)五十萬元"], ans: 3, note: "銀行發行可轉讓定期存單(NCD)面額為新台幣十萬元及其倍數。", law: "銀行發行可轉讓定期存單與金融債券及其他短期債務憑證要點"},
{id: "金融市場常識-276", text: "借款人提供房地產為擔保設定抵押權予銀行，其房屋應投保適當之保險，並以下列何者為受益人？", options: ["(1)借款人", "(2)房地產所有權人", "(3)保證人", "(4)銀行"], ans: 4, note: "為保障債權，抵押物保險之受益人應指定為債權銀行。", law: "銀行授信實務"},
{id: "金融市場常識-277", text: "有關銀行評估授信申請案件之主要考慮因素，下列何者有誤？", options: ["(1)借款人之資信", "(2)借款資金用途", "(3)還款財源", "(4)介紹人之政治背景"], ans: 4, note: "授信5P原則包括借款人(People)、用途(Purpose)、還款來源(Payment)、債權保障(Protection)、展望(Perspective)。政治背景非考量因素。", law: "銀行授信準則"},
{id: "金融市場常識-278", text: "正常情況下，下列何種消費者貸款利率最低？", options: ["(1)小額信用貸款", "(2)首次購屋貸款", "(3)汽車貸款", "(4)現金卡循環信用"], ans: 2, note: "購屋貸款有擔保品且金額大、期限長，通常利率最低。現金卡與信貸風險較高。", law: "消費金融實務"},
{id: "金融市場常識-279", text: "信用卡持卡人在繳款截止日前，繳足最低應繳金額，即可維持其良好信用紀錄，其餘由發卡銀行依未繳金額按月收取利息，此授信方式稱為下列何者？", options: ["(1)小額信用貸款", "(2)循環信用", "(3)簡易貸款", "(4)資本支出貸款"], ans: 2, note: "信用卡未繳清餘額產生的利息機制稱為循環信用(Revolving Credit)。", law: "信用卡業務機構管理辦法"},
{id: "金融市場常識-280", text: "接受特約商店持簽帳單請款者稱為下列何者？", options: ["(1)發卡銀行", "(2)信用卡客服中心", "(3) 收單銀行", "(4)持卡人"], ans: 3, note: "負責與特約商店簽約並處理請款的銀行為收單機構(Acquirer)。", law: "信用卡業務機構管理辦法"},
{id: "金融市場常識-281", text: "與卡片結合，提供消費者隨時透過自動提款機支借現金，以利救急使用之無擔保消費性貸款稱為下列何者？", options: ["(1)現金卡", "(2)簽帳卡", "(3)認同卡", "(4)轉帳卡"], ans: 1, note: "專供提領現金融資之卡片為現金卡。", law: "金融卡及現金卡業務管理"},
{id: "金融市場常識-282", text: "有關銀行發行信用卡之風險防範措施，下列敘述何者錯誤？", options: ["(1)加強對申請人之徵信", "(2)研發信用卡之防偽技術", "(3)加強特約商店偽卡辨識訓練", "(4)將持卡人之個人及交易資料公開化"], ans: 4, note: "公開個資違反個人資料保護法。", law: "個人資料保護法"},
{id: "金融市場常識-283", text: "經營外匯相關業務者，為處理國際間收付與國際清算之需要，進行不同貨幣間的相互交換之市場，稱為下列何者？", options: ["(1)貨幣市場 （ Money Market ）", "(2)資本市場 （ Capital Market ）", "(3)外匯市場（ Foreign Exchange Market ）", "(4)權益市場（ Equity Market ）"], ans: 3, note: "不同貨幣交換之市場為外匯市場。", law: "外匯市場概論"},
{id: "金融市場常識-284", text: "本國外匯市場係由不同型態的外匯交易參與者所組成，下列何者非屬其組織成員？", options: ["(1)進出口商及旅行、投資者", "(2)外匯指定銀行", "(3)外匯經紀商", "(4)期貨交易所"], ans: 4, note: "期貨交易所運作期貨交易，非傳統即期/遠期外匯市場的直接參與組織成員(雖然有匯率期貨)。外匯市場通常指銀行間市場。", law: "外匯市場結構"},
{id: "金融市場常識-285", text: "有關國際外匯市場之主要功能，下列敘述何者有誤？", options: ["(1)提供國際匯兌與清算", "(2)擴大國際間各種貨幣之利差", "(3)提高國際資金運用效率", "(4)提供規避匯率風險的工具"], ans: 2, note: "外匯市場促進資金流動，依利率平價理論，長期應縮小利差而非擴大。", law: "國際金融理論"},
{id: "金融市場常識-286", text: "外匯交易雙方在一特定時點簽訂契約，決定匯率，並於交易後第二個營業日完成契約金額的交割，稱為下列何者？", options: ["(1)即期交易", "(2)遠期交易", "(3)期貨交易", "(4)選擇權交易"], ans: 1, note: "即期外匯交易(Spot)通常於成交後兩個營業日(T+2)內交割。", law: "外匯交易實務"},
{id: "金融市場常識-287", text: "交易雙方在某特定時點決定匯率，並同意在未來某一時日交割的外匯交易市場，稱為下列何者？", options: ["(1)即期外匯市場", "(2)遠期外匯市場", "(3)外匯期貨市場", "(4)國際資本市場"], ans: 2, note: "約定未來交割為遠期交易(Forward)。", law: "外匯交易實務"},
{id: "金融市場常識-288", text: "當任何兩種通貨無直接兌換比率，必須透過第三種通貨間接計算而得的兌換率，稱為下列何者？", options: ["(1)名目匯率", "(2)實質匯率", "(3)交叉匯率", "(4)均衡匯率"], ans: 3, note: "透過第三種貨幣(通常是美元)換算出來的匯率為交叉匯率(Cross Rate)。", law: "外匯計算"},
{id: "金融市場常識-289", text: "遠期匯率與即期匯率的差額，稱為下列何者？", options: ["(1)實質匯率", "(2)換匯匯率", "(3)交叉匯率", "(4)均衡匯率"], ans: 2, note: "兩者差額稱為換匯點數(Swap Points)或換匯匯率差異。題庫答案選(2)。", law: "外匯交易實務"},
{id: "金融市場常識-290", text: "中央銀行為緩和本國通貨匯價的急遽升貶，可利用下列何種方式調節外匯供需，使達成適當匯率水準？", options: ["(1)重貼現政策", "(2)準備金政策", "(3)選擇性信用管制", "(4)外匯干預"], ans: 4, note: "央行直接買賣外匯以影響匯率，稱為外匯干預(Foreign Exchange Intervention)。", law: "中央銀行法/匯率政策"},
{id: "金融市場常識-291", text: "外匯市場上，報價銀行 EUR/USD 之報價為 1.1713/17 ，表示詢價者買入一歐元之價格為何？", options: ["(1)1.1713 美元", "(2)1.1717 美元", "(3)1.1700 美元", "(4)0.8534 美元"], ans: 2, note: "報價為 Bid/Ask。銀行賣出價(Ask)即客戶買入價。1.1717為Ask。", law: "外匯報價慣例"},
{id: "金融市場常識-292", text: "外資匯入美元，投資 臺灣股市，唯恐將來匯出時新台幣貶值，可如何規避匯率風險？", options: ["(1)買無本金交割遠期美元（ NDF）", "(2)買入即期美元", "(3)買入美元賣權", "(4)賣出美元買權"], ans: 1, note: "擔心台幣貶值(美元升值)，應買入美元遠期契約鎖定匯率。NDF是外資常用工具。", law: "外匯避險實務"},
{id: "金融市場常識-293", text: "依中央銀行規定，下列何者非屬銀行應提存準備金之存款範圍 ?", options: ["(1)支票存款", "(2)儲蓄存款", "(3)公教人員退休金存款", "(4)定期存款"], ans: 3, note: "依規定，公教人員退休金存款得免提存準備金。", law: "金融機構存款及其他各種負債準備金計提標準"},
{id: "金融市場常識-294", text: "下列何者非屬主管機關對於金融機構流動性風險之規範？", options: ["(1)法定準備金", "(2)最低流動比率", "(3)存放比率", "(4)資本適足率"], ans: 4, note: "資本適足率(BIS Ratio)主要針對清償能力(Solvency)，非直接針對流動性(Liquidity)。", law: "銀行流動性資產管理辦法"},
{id: "金融市場常識-295", text: "銀行承辦授信業務之基本原則，下列何者非屬之？", options: ["(1)公開性", "(2)安全性", "(3)流動性", "(4)收益性"], ans: 1, note: "授信三原則為安全性、流動性、收益性(獲利性)。公開性非授信原則。", law: "銀行授信準則"},
{id: "金融市場常識-296", text: "在其他條件不變下，下列何者會使本國貨幣貶值？", options: ["(1)本國利率上升", "(2)本國進口關稅下降", "(3)本國相對物價下跌", "(4)本國相對生產力提高"], ans: 2, note: "關稅下降導致進口增加，對外幣需求增加，本國貨幣貶值。", law: "國際金融理論"},
{id: "金融市場常識-297", text: "下列何者非屬資訊安全的基本三要素？", options: ["(1)一致性 (Consistency)", "(2) 完整性 (Integrity)", "(3)可用性 (Availability)", "(4) 機密性 (Confidentiality)"], ans: 1, note: "資安三要素為CIA：機密性、完整性、可用性。一致性非基本三要素。", law: "資訊安全概論"},
{id: "金融市場常識-298", text: "下列何者非屬組織採用雲端運算服務的常見考量原因？", options: ["(1)商譽", "(2)成本", "(3)速度", "(4)效能"], ans: 1, note: "雲端考量主要為成本效益、部署速度、運算效能。商譽非技術採用之主因。", law: "雲端運算概論"},
{id: "金融市場常識-299", text: "下列何種數據資料單位代表 1024GB？", options: ["(1)1ZB", "(2)1EB", "(3)1PB", "(4)1TB"], ans: 4, note: "1 TB (Terabyte) = 1024 GB。", law: "電腦概論"},
{id: "金融市場常識-300", text: "下列哪一個名詞和其他三個名詞不同義？", options: ["(1)數據資料", "(2)大數據", "(3)巨量資料", "(4)海量資料"], ans: 1, note: "數據資料(Data)是一般名詞；後三者(Big Data)皆指特定之巨量資料概念。", law: "大數據概論"},
{id: "金融市場常識-301", text: "下列何者非屬網際網路興起後的數位商品或服務模式？", options: ["(1)純網路銀行", "(2)電子資金轉帳", "(3)電子商務支付系統", "(4)加密貨幣"], ans: 2, note: "電子資金轉帳(EFT)如ATM轉帳，在網際網路普及前即已存在。", law: "數位金融發展史"},
{id: "金融市場常識-302", text: "機器人是人工智慧的容器，若機器人是身體，而人工智慧可以比喻成機器人的哪一部分？", options: ["(1)心臟", "(2)腳", "(3)手", "(4)大腦"], ans: 4, note: "人工智慧(AI)負責運算、決策與學習，如同大腦的功能。", law: "人工智慧概論"},
{id: "金融市場常識-303", text: "當保險業欲透過網路與電話語音等通路提供服務時，可運用何項技術驗證身分？", options: ["(1)生物辨識", "(2)通訊技術", "(3)物聯網技術", "(4)網路技術"], ans: 1, note: "生物辨識(如聲紋、指紋、臉部辨識)是確認身分最有效的技術手段。", law: "金融科技應用"},
{id: "金融市場常識-304", text: "下列何項敘述非屬純網路銀行的明顯獨特特色？", options: ["(1)沒有實體分行", "(2)沒有實體 ATM機器", "(3)營業時間無限制全年無休", "(4)透過 APP提供金融服務"], ans: 4, note: "傳統銀行亦普遍透過APP提供金融服務，非純網銀獨有特色。", law: "純網路銀行設立標準"},
{id: "金融市場常識-305", text: "下列何者非屬我國核准設立之純網路銀行？", options: ["(1)連線銀行", "(2)將來銀行", "(3)新網銀行", "(4)樂天銀行"], ans: 3, note: "我國目前核准的三家純網銀為：連線銀行(LINE Bank)、樂天銀行、將來銀行。無「新網銀行」。", law: "純網路銀行名單"},
{id: "金融市場常識-306", text: "目前各國金融監理機關對比特幣抱持戒慎恐懼的態度，考量的原因包含下列哪幾項？ A.洗錢 B.資恐 C.逃稅 D.詐騙", options: ["(1)僅A", "(2)僅A、B", "(3)僅A、B、C", "(4)A、B、C、D"], ans: 4, note: "加密貨幣具匿名性與跨境特性，易衍生洗錢、資恐、逃稅及詐騙等風險。", law: "虛擬資產監理趨勢"},
{id: "金融市場常識-307", text: "依信託法之規定，信託依設立方式之不同分為三種，下列何者非屬之？", options: ["(1)契約信託", "(2)遺囑信託", "(3)宣言信託", "(4)法定信託"], ans: 4, note: "信託法規定之設立方式為契約、遺囑及宣言信託。法定信託(Constructive Trust)非我國信託法明文之分類。", law: "信託法"},
{id: "金融市場常識-308", text: "委託人將財產權移轉予受託人，使依委託人意旨，為受益人利益管理或處分財產之法律關係為下列何者？", options: ["(1)委任", "(2)信託", "(3)寄託", "(4)讓與擔保"], ans: 2, note: "此為信託法第1條對「信託」之定義。", law: "信託法第1條"},
{id: "金融市場常識-309", text: "信託關係之委託人，須將其信託財產權主體變更為下列何者之名義？", options: ["(1)受益人", "(2)受託人", "(3)信託監察人", "(4)第二受益人"], ans: 2, note: "信託特徵在於財產權之移轉，故名義人須變更為受託人。", law: "信託法第1條"},
{id: "金融市場常識-310", text: "委託人將其船舶信託移轉予受託人，使依委託人意旨管理或處分，稱為下列何種信託？", options: ["(1)動產信託", "(2)不動產信託", "(3)金錢信託", "(4)權利信託"], ans: 1, note: "船舶在信託分類上通常歸類為動產信託(雖民法物權有特殊規定，但信託業分類上屬有價證券、不動產、金錢以外之動產)。", law: "信託業法"},
{id: "金融市場常識-311", text: "委託人將其土地信託移轉予受託人，使依委託人意旨管理或處分，稱之為下列何種信託？", options: ["(1)不動產信託", "(2)動產信託", "(3)地上權信託", "(4)租賃權信託"], ans: 1, note: "土地及定著物屬於不動產。", law: "信託業法/民法"},
{id: "金融市場常識-312", text: "「以給付一定數額之金錢為標的」之債權信託，稱之為下列何種信託？", options: ["(1)金錢信託", "(2)金錢債權信託", "(3)動產信託", "(4)不動產信託"], ans: 2, note: "信託財產為「金錢債權」(如應收帳款)者，稱為金錢債權信託。", law: "信託業法"},
{id: "金融市場常識-313", text: "委託人將股票信託移轉予受託人管理，稱為下列何種信託？", options: ["(1)金錢信託", "(2)金錢債權信託", "(3)有價證券信託", "(4)動產信託"], ans: 3, note: "股票屬於有價證券，故為有價證券信託。", law: "信託業法"},
{id: "金融市場常識-314", text: "下列何者得擔任信託財產之受託人？", options: ["(1)未成年人", "(2)受監護或輔助宣告之人", "(3)破產人", "(4)經主管機關許可經營信託業務之公司"], ans: 4, note: "未成年、受監護宣告及破產人不得為受託人。", law: "信託法第21條"},
{id: "金融市場常識-315", text: "有關受託人對受益人之責任，下列敘述何者正確？", options: ["(1)得承諾擔保本金", "(2)得擔保最低收益率", "(3)不得承諾擔保本金或最低收益率", "(4)僅得對大戶承諾擔保本金"], ans: 3, note: "信託業不得承諾擔保本金或最低收益率，投資風險由受益人承擔。", law: "信託業法第31條"},
{id: "金融市場常識-316", text: "受託人處理信託事務，下列敘述何者錯誤？", options: ["(1)應依信託本旨處理", "(2)應以善良管理人之注意處理", "(3)自有財產得與信託財產合併管理", "(4)受託人管理不當致信託財產發生損害時應予賠償"], ans: 3, note: "信託財產具有獨立性，受託人應將信託財產與其自有財產分別管理，不得合併。", law: "信託法第22條/信託業法"},
{id: "金融市場常識-317", text: "下列何種制度係以自己為財產名義權利人，為他人利益管理財產？", options: ["(1)信託", "(2)寄託", "(3)委任", "(4)代理"], ans: 1, note: "信託之特徵為受託人以「自己名義」持有財產，但為受益人利益管理。", law: "信託法"},
{id: "金融市場常識-318", text: "有關委任與信託之敘述，下列何者錯誤？", options: ["(1)信託關係之委託人須將財產權移轉給受託人", "(2)委任關係之委任人無須將財產權移轉給受任人", "(3)委任人管理或處分受任財產之效果歸屬於受任人", "(4)委任人並不因委任關係之成立而喪失其管理或處分財產之權限"], ans: 3, note: "委任關係中，受任人處理事務之效果直接歸屬於「委任人」，而非受任人。", law: "民法委任篇"},
{id: "金融市場常識-319", text: "委託人以其享有之租賃權為信託標的，將之移轉與受託人管理使用，稱之為下列何種信託？", options: ["(1)租賃權信託", "(2)地上權信託", "(3)專利權信託", "(4)金錢信託"], ans: 1, note: "以租賃權為標的即為租賃權信託(屬權利信託的一種)。", law: "信託業法"},
{id: "金融市場常識-320", text: "有關信託財產之敘述，下列何者錯誤？", options: ["(1)受託人死亡時信託財產不屬於其遺產", "(2)受託人破產時信託財產不屬於其破產財團", "(3)受託人關於信託財產之占有，承繼委託人占有之瑕疵", "(4)屬於信託財產之債權與不屬於信託財產之債務得互相抵銷"], ans: 4, note: "信託財產具獨立性，屬於信託財產之債權，不得與不屬於該信託財產之債務互相抵銷。", law: "信託法第13條"},
{id: "金融市場常識-321", text: "信託關係消滅時，除信託行為另有訂定外，有關信託財產之歸屬，下列何者為第一順位？", options: ["(1)國庫", "(2)受託人", "(3)目的事業主管機關", "(4)享有全部信託利益之受益人"], ans: 4, note: "信託消滅後，財產歸屬順序：1.享有全部信託利益之受益人 2.委託人或其繼承人。", law: "信託法第65條"},
{id: "金融市場常識-322", text: "有價證券中之股票及公司債券，除須依目的事業主管機關規定，於證券上載明其為信託財產外，尚須通知下列何者，始得對抗該公司？", options: ["(1)證券期貨商", "(2)證券交易所", "(3)發行公司", "(4)經濟部"], ans: 3, note: "股票信託須通知發行公司並辦理過戶登記，始得對抗公司。", law: "信託法第4條"},
{id: "金融市場常識-323", text: "依信託法規定，公益信託之監督機關為下列何者？", options: ["(1)金融監督管理委員會", "(2)目的事業主管機關", "(3)法院", "(4)財政部"], ans: 2, note: "公益信託由各目的事業主管機關(如教育部、衛福部等)許可及監督。", law: "信託法第70條"},
{id: "金融市場常識-324", text: "下列何者不屬於信託業法規定信託業得經營之信託業務？", options: ["(1)金錢信託", "(2)不動產信託", "(3)專利權信託", "(4)商譽信託"], ans: 4, note: "商譽(Goodwill)非具體財產權，無法獨立成為信託標的，故不在信託業法列舉之業務範圍內。", law: "信託業法第16條"},
{id: "金融市場常識-325", text: "主管機關基於風險考量，依信託業法規定，信託業辦理委託人不指定營運範圍或方法之金錢信託，其營運範圍下列何者非屬之？", options: ["(1)現金", "(2)銀行存款", "(3)短期票券", "(4)上市股票"], ans: 4, note: "不指定營運範圍之金錢信託(即全權委託之性質，但受嚴格限制)，基於安全性，通常限於現金、存款、公債等低風險資產，不得投資波動大的上市股票。", law: "信託業法施行細則"},
{id: "金融市場常識-326", text: "依信託業法規定，信託業得經營之業務項目，下列何者非屬之？", options: ["(1)著作權信託", "(2)人格權信託", "(3)專利權信託", "(4)有價證券信託"], ans: 2, note: "人格權(如姓名權、名譽權)具有專屬性，不得轉讓，故不得為信託標的。", law: "信託業法"},
{id: "金融市場常識-327", text: "依信託業法規定，營業信託契約之訂定，應以何種方式為之？", options: ["(1)書面", "(2)口頭", "(3)電話", "(4)錄音"], ans: 1, note: "信託業經營信託業務，應與委託人訂定「書面」信託契約。", law: "信託業法第19條"},
{id: "金融市場常識-328", text: "下列哪一種契約信託，可以口頭為之或書面為之？", options: ["(1)民事信託", "(2)金錢信託", "(3)有價證券信託", "(4)不動產信託"], ans: 1, note: "民事信託(非營業信託)依信託法規定，不以書面為必要(除不動產信託外)，可口頭成立。信託業法規範的營業信託則必須書面。", law: "信託法"},
{id: "金融市場常識-329", text: "下列何者非屬金融資產證券化條例所指之資產？", options: ["(1)汽車貸款債權", "(2)房屋貸款債權", "(3)信用卡債權", "(4)不動產"], ans: 4, note: "不動產之證券化適用「不動產證券化條例」(REITs/REATs)，非「金融資產證券化條例」。", law: "金融資產證券化條例"},
{id: "金融市場常識-330", text: "有關金融資產證券化之特性，下列何者錯誤？", options: ["(1)由創始機構發行有價證券", "(2)現金流量可委由服務機構代為管理", "(3)金融資產證券化得採信用增強機制", "(4)所受讓特定金融資產為信用評等之基礎"], ans: 1, note: "證券化商品是由「特殊目的機構」(SPV)或「特殊目的信託」(SPT)發行，而非由創始機構(Originator, 如銀行)直接發行。", law: "金融資產證券化條例"},
{id: "金融市場常識-331", text: "有關金融資產證券化之創始機構將金融資產移轉予特殊目的機構之會計項目，下列何者正確？", options: ["(1)出售資產", "(2)借入款項", "(3)同業往來", "(4)票據貼現"], ans: 1, note: "資產證券化之精神為「真實出售」(True Sale)，故會計上認列為出售資產，達成資產負債表外融資效果。", law: "金融資產證券化條例"},
{id: "金融市場常識-332", text: "依金融資產證券化條例之規定，受益人會議係由下列何者召集之？", options: ["(1)創始機構或受託機構", "(2)受託機構或信託監察人", "(3)服務機構或信託監察人", "(4)監督機構或服務機構"], ans: 2, note: "受益人會議由受託機構或信託監察人召集。", law: "金融資產證券化條例"},
{id: "金融市場常識-333", text: "依不動產證券化條例規定，所稱不動產管理機構，下列何者非屬之？", options: ["(1)不動產投資業", "(2)營造業", "(3)信託業", "(4)建築經理業"], ans: 3, note: "依不動產證券化條例，信託業通常擔任「受託機構」，而非受委任進行管理作業的「不動產管理機構」（如建經公司、資產管理公司）。", law: "不動產證券化條例"},
{id: "金融市場常識-334", text: "依信託法規定，信託行為有害於委託人之債權人權利者，債權人應如何主張權利？", options: ["(1)向受託人主張信託契約無效", "(2)聲請法院撤銷信託行為", "(3)聲請召開債權人會議", "(4)聲請強制執行信託財產"], ans: 2, note: "詐害信託(Fraudulent Trust)得由債權人聲請法院撤銷之。", law: "信託法第6條"},
{id: "金融市場常識-335", text: "依信託法規定，有關信託關係消滅原因，下列何者正確？", options: ["(1)委託人死亡", "(2)受託人破產", "(3)信託目的不能完成", "(4)委託人喪失行為能力"], ans: 3, note: "信託目的已完成或不能完成時，信託關係消滅。委託人死亡或受託人破產通常不直接導致信託消滅(受託人破產則解任)。", law: "信託法第62條"},
{id: "金融市場常識-336", text: "依信託法及信託業法相關規定，信託業應負之義務，下列何者錯誤？", options: ["(1)忠實義務", "(2)分別管理義務", "(3)保證收益義務", "(4)善良管理人注意義務"], ans: 3, note: "信託業不得承諾擔保本金或最低收益。", law: "信託業法"},
{id: "金融市場常識-337", text: "依信託業法規定，有關信託業之利害關係人，下列何者錯誤？", options: ["(1)擔任信託業之負責人", "(2)持有信託業資本總額 5%以上者", "(3)對信託財產具有運用決定權者", "(4)擔任信託業定型化契約之審定人員"], ans: 4, note: "依信託業法第7條規定，利害關係人包含負責人、大股東及具運用決定權者，但不包含內部的「定型化契約審定人員」。", law: "信託業法第7條"},
{id: "金融市場常識-338", text: "運用一年期以內短期信用工具，調節短期資金供需的交易市場，稱為下列何者？", options: ["(1)債券市場", "(2)貨幣市場", "(3)股票市場", "(4)期貨市場"], ans: 2, note: "貨幣市場為一年期以內之短期資金市場。", law: "貨幣市場概論"},
{id: "金融市場常識-339", text: "金融機構間之新台幣拆款市場，係屬下列何者？", options: ["(1)債券市場", "(2)貨幣市場", "(3)股票市場", "(4)外匯市場"], ans: 2, note: "同業拆款(Call Loan)為極短期資金調度，屬貨幣市場。", law: "貨幣市場工具"},
{id: "金融市場常識-340", text: "下列何者非屬短期票券市場之信用工具？", options: ["(1)國庫券", "(2)可轉讓定存單", "(3)匯票", "(4)公司債"], ans: 4, note: "公司債通常為一年以上之長期融資工具，屬資本市場。", law: "金融工具分類"},
{id: "金融市場常識-341", text: "下列何者係在貨幣市場上擔任市場監督信用管理者及市場資金最後調節者？", options: ["(1)票券商", "(2)商業銀行", "(3)中央銀行", "(4)財政部"], ans: 3, note: "中央銀行為最後貸放者(Lender of Last Resort)及市場調節者。", law: "中央銀行法"},
{id: "金融市場常識-342", text: "下列何者非屬貨幣市場的功能？", options: ["(1)配合中央銀行執行貨幣政策", "(2)提供法人及個人理財工具", "(3)提供股票買賣的機制", "(4)建立利率指標"], ans: 3, note: "股票買賣機制由資本市場(證券交易所)提供。", law: "貨幣市場功能"},
{id: "金融市場常識-343", text: "中央政府為調節國庫收支，得發行未滿一年之信用工具，下列何者係屬之？", options: ["(1)政府公債", "(2)建設公債", "(3)國庫券", "(4)金融債券"], ans: 3, note: "國庫券(TB)為政府發行之短期(未滿一年)債務憑證。", law: "國庫券及短期借款條例"},
{id: "金融市場常識-344", text: "銀行為了提高流動性，發行一種具有可轉讓但不可中途解約特性，並承諾一定時間後之到期日按票載利率支付本息予存款人之短期信用工具，係屬下列何者？", options: ["(1)定期存單", "(2)可轉讓定期存單", "(3)金融債券", "(4)商業承兌匯票"], ans: 2, note: "可轉讓定期存單(NCD)具轉讓性，不可中途解約但可於次級市場賣出。", law: "銀行發行可轉讓定期存單要點"},
{id: "金融市場常識-345", text: "發票人簽發一定之金額，委託付款人於指定之到期日，無條件支付與受款人或執票人之票據，稱之為下列何者？", options: ["(1)匯票", "(2)本票", "(3)支票", "(4)保付支票"], ans: 1, note: "委託他人(付款人)付款為匯票(Draft/Bill of Exchange)之特徵。", law: "票據法"},
{id: "金融市場常識-346", text: "凡出售商品或提供勞務之相對人簽發之匯票，委託銀行為付款人而經其承兌者，稱之為下列何者？", options: ["(1)銀行承兌匯票", "(2)商業承兌匯票", "(3)交易性商業本票", "(4)融資性商業本票"], ans: 1, note: "經「銀行」承兌之匯票為銀行承兌匯票(BA)。", law: "票據法/銀行法"},
{id: "金融市場常識-347", text: "凡出售商品或提供勞務之相對人簽發之匯票，以相對人 (非銀行 )為付款人而經其承兌者，稱之為下列何者？", options: ["(1)銀行承兌匯票", "(2)商業承兌匯票", "(3)交易性商業本票", "(4)融資性商業本票"], ans: 2, note: "經「商業機構」(非銀行)承兌之匯票為商業承兌匯票。", law: "票據法"},
{id: "金融市場常識-348", text: "發票人簽發一定之金額，於指定之到期日，由自己無條件支付與受款人或執票人之票據，稱之為下列何者？", options: ["(1)匯票", "(2)本票", "(3)支票", "(4)承兌匯票"], ans: 2, note: "由自己(發票人)承諾付款為本票(Promissory Note)之特徵。", law: "票據法"},
{id: "金融市場常識-349", text: "下列何者非屬因出售商品或勞務之交易行為所簽發之票據？", options: ["(1)銀行承兌匯票", "(2)商業承兌匯票", "(3)交易性商業本票", "(4)融資性商業本票"], ans: 4, note: "融資性商業本票(CP2)純為籌資目的發行，無實質交易基礎。", law: "票據法"},
