{id: "金融市場常識-350", text: "下列貨幣市場的短期信用工具中，何者簡稱為 RP？", options: ["(1)附買回協議", "(2)附賣回協議", "(3)可轉讓定存單", "(4)國庫券"], ans: 1, note: "RP (Repurchase Agreement) 即附買回協議。", law: "貨幣市場術語"},
{id: "金融市場常識-351", text: "下列何者為間接金融？", options: ["(1)發行股票", "(2)發行短期票券", "(3)發行公司債", "(4)向銀行借款"], ans: 4, note: "向銀行借款需透過金融中介機構，屬間接金融。發行證券(1,2,3)屬直接金融。", law: "金融體系概論"},
{id: "金融市場常識-352", text: "短期票券集中保管結算機構應以幾家為限？", options: ["(1)一家", "(2)二家", "(3)三家", "(4)四家"], ans: 1, note: "依票券金融管理法，短期票券之集中保管、結算機構以一家為限(目前為臺灣集中保管結算所)。", law: "票券金融管理法"},
{id: "金融市場常識-353", text: "票券交割作業中，有關買賣雙方款項部分的清算作業，係由下列何者負責？", options: ["(1)臺灣銀行", "(2)財金資訊網路", "(3)央行同資系統", "(4)聯徵中心"], ans: 3, note: "大額票券款項清算透過中央銀行同業資金調撥清算系統(CIFS)辦理。", law: "中央銀行同業資金調撥清算作業規定"},
{id: "金融市場常識-354", text: "下列何者為票券次級市場之交割方式？", options: ["(1)無實體化", "(2)實體化", "(3)無實體化與實體化", "(4)人工作業"], ans: 1, note: "短期票券已全面採行無實體化發行與交易。", law: "票券金融管理法"},
{id: "金融市場常識-355", text: "下列何者為票券集中保管之結算交割方式？", options: ["(1)款券同步交割", "(2)款先券後交割", "(3)券先款後交割", "(4)與券商協議而定"], ans: 1, note: "為降低交割風險，採款券同步交割(DVP)機制。", law: "短期票券集中保管結算機構作業規章"},
{id: "金融市場常識-356", text: "下列何者之利息所得非採分離課稅方式扣繳，須依規定將利息所得併入綜合所得總額申報所得稅？", options: ["(1)國庫券", "(2)可轉讓定存單", "(3)銀行承兌匯票", "(4)活期存款"], ans: 4, note: "一般銀行存款(活存、定存)利息所得併入綜所稅申報(有27萬免稅額)；短期票券(1,2,3)採分離課稅。", law: "所得稅法"},
{id: "金融市場常識-357", text: "目前短期票券之利息所得採分離課稅，按給付額扣繳多少？", options: ["(1)百分之十", "(2)百分之二十", "(3)百分之二十五", "(4)百分之三十"], ans: 1, note: "短期票券利息所得分離課稅稅率目前為10%。", law: "各類所得扣繳率標準"},
{id: "金融市場常識-358", text: "投資人購買一張可轉讓定存單，假設其利息所得為十萬元，請問採分離課稅後，其實際淨利息所得為多少？", options: ["(1)七萬元", "(2)七萬五仟元", "(3)八萬元", "(4)九萬元"], ans: 4, note: "100,000 * (1 - 10%) = 90,000元。", law: "稅法計算"},
{id: "金融市場常識-359", text: "下列何種信用工具之承銷價格非採貼現方式計算？", options: ["(1)國庫券", "(2)商業本票", "(3)銀行承兌匯票", "(4)可轉讓定存單"], ans: 4, note: "NCD通常載明利率，發行時可為面額發行；其他票券(TB, CP, BA)多為貼現發行。", law: "貨幣市場慣例"},
{id: "金融市場常識-360", text: "票券商接受發行人之委託，依約定包銷或代銷票券之行為，稱為下列何者？", options: ["(1)保證", "(2)簽證", "(3)承銷", "(4)標售"], ans: 3, note: "包銷或代銷即為承銷(Underwriting)。", law: "票券金融管理法"},
{id: "金融市場常識-361", text: "下列何者亦稱為初級市場？", options: ["(1)發行市場", "(2)流通市場", "(3)期貨市場", "(4)拆款市場"], ans: 1, note: "初級市場即新證券發行之市場。", law: "金融市場概論"},
{id: "金融市場常識-362", text: "下列何者非屬我國貨幣市場流通之主要信用工具？", options: ["(1)可轉讓定存單", "(2)國庫券", "(3)商業本票", "(4)股票"], ans: 4, note: "股票為資本市場工具。", law: "貨幣市場工具"},
{id: "金融市場常識-363", text: "下列哪一種固定收益的信用工具，其信用風險最大？", options: ["(1)政府公債", "(2)商業本票", "(3)垃圾債券", "(4)國庫券"], ans: 3, note: "垃圾債券為非投資等級債券，違約風險最高。", law: "投資風險比較"},
{id: "金融市場常識-364", text: "在貨幣市場上，我們常聽到「利率上升一碼」的說詞，請問「一碼」是多少？", options: ["(1)0.01%", "(2)0.125%", "(3)0.25%", "(4)0.5%"], ans: 3, note: "一碼 = 0.25%。", law: "金融術語"},
{id: "金融市場常識-365", text: "國庫券之發行、買回及還本付息等業務，係委由下列何者經理？", options: ["(1)財政部", "(2)中央銀行", "(3)臺灣銀行", "(4)商業銀行"], ans: 2, note: "國庫券由財政部發行，委由中央銀行經理。", law: "國庫券及短期借款條例"},
{id: "金融市場常識-366", text: "國庫券的競標者，其投標利率低於底標利率時，下列敘述何者正確？", options: ["(1)由低至高依次得標", "(2)由高至低依次得標", "(3)由投標時間先後依次得標", "(4)由投標金額大小依次得標"], ans: 1, note: "利率競標採低利得標(價格較高者得標)。利率低於底標(政府願意支付的最高利率)者，由低至高依序得標。", law: "國庫券發行標售作業"},
{id: "金融市場常識-367", text: "國庫券的非競標者，其申購價格係按下列何者計算？", options: ["(1)競標發行價格", "(2)競標最低價格", "(3)競標最高價格", "(4)競標最高價與最低價之平均價"], ans: 1, note: "非競標申購價格通常按競標之加權平均得標利率(或價格)計算。", law: "國庫券發行標售作業"},
{id: "金融市場常識-368", text: "銀行發行可轉讓定期存單可按月發行或指定到期日，其最低天期為何？", options: ["(1)七天", "(2)十四天", "(3)二十一天", "(4)一個月"], ans: 4, note: "NCD發行期限最短為一個月，最長為一年。", law: "銀行發行可轉讓定期存單要點"},
{id: "金融市場常識-369", text: "銀行為資金調度需要，發行可轉讓定期存單，其發行天期最長為多久？", options: ["(1)六個月", "(2)一年", "(3)二年", "(4)三年"], ans: 2, note: "NCD屬於貨幣市場工具，最長期限為一年。", law: "銀行發行可轉讓定期存單要點"},
{id: "金融市場常識-370", text: "金融機構經營拆款業務所得之利息收入，應繳納多少營業稅？", options: ["(1)5%", "(2)20%", "(3)25%", "(4) 免徵"], ans: 4, note: "為降低銀行間資金調度成本，同業拆款利息收入免徵營業稅。", law: "加值型及非加值型營業稅法"},
{id: "金融市場常識-371", text: "目前拆款市場的交割清算，大多採用下列何種方式辦理？", options: ["(1)央行支票", "(2)央行同資系統", "(3)財金網路系統", "(4)ATM轉帳"], ans: 2, note: "銀行間拆款透過中央銀行同業資金調撥清算系統(CIFS)即時清算。", law: "中央銀行同業資金調撥清算作業規定"},
{id: "金融市場常識-372", text: "下列何者不得作為流動準備？", options: ["(1)超額準備", "(2)金融業互拆借差", "(3)國庫券", "(4)股票"], ans: 4, note: "流動準備資產需具高度流動性與低風險，股票價格波動大，不得列為法定流動準備。", law: "銀行流動性資產管理辦法"},
{id: "金融市場常識-373", text: "下列何者非屬金融機構合併法所定義之銀行業？", options: ["(1)證券金融事業", "(2)信用合作社", "(3)票券金融公司", "(4)信用卡業務機構"], ans: 1, note: "金融機構合併法定義之銀行業包括銀行、信合社、農漁會信用部、票券商、信用卡公司等。證金公司不在此列。", law: "金融機構合併法"},
{id: "金融市場常識-374", text: "下列何者於購買短期票券時，其利息收入免予扣繳所得稅？", options: ["(1)教育機構", "(2)個人", "(3)上市公司", "(4)合夥事業"], ans: 1, note: "公私立學校等教育文化公益慈善機關或團體，符合規定者免納所得稅。", law: "所得稅法"},
{id: "金融市場常識-375", text: "下列何者非屬中央銀行執行貨幣政策的工具？", options: ["(1)公開市場操作", "(2)重貼現率政策", "(3)存款準備率政策", "(4)調整稅率政策"], ans: 4, note: "調整稅率屬於財政部的財政政策，非央行貨幣政策。", law: "總體經濟學"},
{id: "金融市場常識-376", text: "下列何者為我國中央銀行作為經常性信用控管的一項政策工具，其在執行貨幣政策時，較具時效性、機動性及主動性？", options: ["(1)公開市場操作", "(2)重貼現率政策", "(3)存款準備率政策", "(4)財政政策"], ans: 1, note: "公開市場操作(OMO)可由央行主動發起，調整金額靈活，最具機動性。", law: "貨幣政策工具"},
{id: "金融市場常識-377", text: "中央銀行如欲採取寬鬆貨幣政策，則應採取下列何項措施？", options: ["(1)提高存款準備率", "(2)提高重貼現率", "(3)買進可轉讓定存單", "(4)賣出可轉讓定存單"], ans: 3, note: "買進NCD(或公債)將資金釋放到市場，增加貨幣供給，屬寬鬆政策。賣出則回收資金。", law: "貨幣政策實務"},
{id: "金融市場常識-378", text: "下列何者係中央銀行實施公開市場操作的短期目標？", options: ["(1)影響貨幣數量及利率水準", "(2)實現穩定物價", "(3)經濟成長", "(4)充分就業"], ans: 1, note: "操作目標(Operating Target)通常是準備金數量或短期利率；穩定物價是最終目標。", law: "貨幣銀行學"},
{id: "金融市場常識-379", text: "依票券金融管理法規定，融資性商業本票之發行，需委由經信用評等機構評等之金融機構保證，下列何者非屬前述所稱之金融機構？", options: ["(1)銀行", "(2)投顧公司", "(3)信託投資公司", "(4)票券金融公司"], ans: 2, note: "投顧公司僅提供諮詢，無資本能力提供保證業務。", law: "票券金融管理法"},
{id: "金融市場常識-380", text: "下列何者非屬票券商辦理簽證作業之內容？", options: ["(1)核驗發行人簽章", "(2)核驗保證人簽章", "(3)核驗票面額、發行日及到期日", "(4)洽定交易條件"], ans: 4, note: "簽證(Authentication)是核驗票據形式要件的真實性；洽定交易條件是承銷或經紀業務。", law: "票券金融管理法"},
{id: "金融市場常識-381", text: "發行人所發行之商業本票，票券商承諾全數買入，並於承銷當日給付價款的方式，稱之為下列何者？", options: ["(1)包銷", "(2)代銷", "(3)寄售", "(4)委辦"], ans: 1, note: "包銷(Firm Commitment)即承銷商承擔銷售風險，先全數買入。", law: "票券商管理規則"},
{id: "金融市場常識-382", text: "中央銀行可轉讓定期存單之發行面額分為三種，下列何者非屬之？", options: ["(1)新台幣一百萬元", "(2)新台幣五百萬元", "(3)新台幣一千萬元", "(4)新台幣一億元"], ans: 1, note: "央行NCD面額通常為500萬、1000萬、1億元。100萬元非標準面額。", law: "中央銀行發行可轉讓定期存單作業要點"},
{id: "金融市場常識-383", text: "發行人運用融資性商業本票籌集資金，其需經過之程序，下列何者錯誤？", options: ["(1)保證", "(2)簽證", "(3)承銷", "(4)兌償"], ans: 4, note: "兌償(Redemption)是到期還款，非發行籌資階段的程序。", law: "商業本票發行實務"},
{id: "金融市場常識-384", text: "「損失的不確定性」指的是下列何者 ?", options: ["(1)風險", "(2)風險因素", "(3)風險事故", "(4)風險標的"], ans: 1, note: "風險(Risk)的定義即為損失發生之不確定性。", law: "風險管理概論"},
{id: "金融市場常識-385", text: "人的健康狀況屬於下列那一個名詞？", options: ["(1)風險標的", "(2)風險程度", "(3)風險因素", "(4)風險事故"], ans: 3, note: "身體健康狀況是影響死亡或生病機率的條件，稱為風險因素(Hazard)。", law: "風險管理概論"},
{id: "金融市場常識-386", text: "下列何者敍述不正確？", options: ["(1)風險事故會影響風險因素", "(2)風險因素會影響損失幅度", "(3)風險事故為造成損失的意外事故", "(4)損失指非自願性的經濟價值減少"], ans: 1, note: "因果關係應為：風險因素(Hazard)增加風險事故(Peril)發生的機率或幅度。事故不會回頭影響因素(除特定情形外，一般理論方向相反)。", law: "風險管理概論"},
{id: "金融市場常識-387", text: "下列何者屬於純粹風險？", options: ["(1)外匯風險", "(2)生產風險", "(3)信用風險", "(4)政治風險"], ans: 3, note: "在本測驗題庫邏輯中，信用風險(違約與否)被視為純粹風險(只有損失或沒損失)。外匯、生產屬投機/動態風險。(註：學理上Credit Risk亦可視為投機，但依題庫答案為準)", law: "風險管理分類"},
{id: "金融市場常識-388", text: "會影響整個群體或大部份人的風險屬何種風險？", options: ["(1)純粹風險", "(2)客觀風險", "(3)特定風險", "(4)基本風險"], ans: 4, note: "基本風險(Fundamental Risk)影響範圍廣大(如天災、戰爭、景氣)，非個人能控制。", law: "風險管理分類"},
{id: "金融市場常識-389", text: "下列何者屬於風險控制措施？", options: ["(1)損失抑制", "(2)風險自留", "(3)投保保險", "(4)提撥準備金"], ans: 1, note: "風險管理分控制(Control)與理財(Financing)。損失抑制是控制；自留、保險、準備金是理財。", law: "風險管理措施"},
{id: "金融市場常識-390", text: "針對損失頻率小但損失幅度大的風險，採何種風險管理方法較適宜？", options: ["(1)損失抑減", "(2)風險避免", "(3)自己保險", "(4)保險"], ans: 4, note: "低頻率、高嚴重度的風險(如火災)，最適合移轉給保險公司。", law: "風險管理矩陣"},
{id: "金融市場常識-391", text: "對於損失幅度不大，且損失成本較能精確估計的風險，最宜採用下列何種風險管理方法？", options: ["(1)損失預防", "(2)風險自留", "(3)風險避免", "(4)保險"], ans: 2, note: "損失小且可預測，可視為經營成本，採自留(Retention)最符合成本效益。", law: "風險管理矩陣"},
{id: "金融市場常識-392", text: "下列何種風險管理方法可以完全將損失發生之頻率降為零？", options: ["(1)損失預防", "(2)損失抑減", "(3)風險避免", "(4)風險隔離"], ans: 3, note: "風險避免(Avoidance)是完全不接觸風險源，故頻率為零。", law: "風險管理措施"},
{id: "金融市場常識-393", text: "下列何種風險管理方法具有降低損失頻率的功能？", options: ["(1)損失預防", "(2)風險隔離", "(3)計劃性風險自留", "(4)自己保險"], ans: 1, note: "損失預防(Loss Prevention)旨在降低發生頻率；損失抑減(Reduction)旨在降低幅度。", law: "風險管理措施"},
{id: "金融市場常識-394", text: "下列何者屬於損失抑減措施？", options: ["(1)投保汽車保險", "(2)檢修汽車", "(3)搶救車禍傷患", "(4)賣掉汽車"], ans: 3, note: "事故發生後搶救傷患，目的是減少損失擴大(幅度)，屬損失抑減。", law: "風險管理措施"},
{id: "金融市場常識-395", text: "保險所承保的風險，一般僅限於：", options: ["(1)動態風險", "(2)純粹風險", "(3)投機風險", "(4)基本風險"], ans: 2, note: "商業保險主要承保只有損失機會的純粹風險(Pure Risk)。", law: "保險學概論"},
{id: "金融市場常識-396", text: "下列何者為可保風險？", options: ["(1)創新風險", "(2)行銷風險", "(3)財產風險", "(4)生產風險"], ans: 3, note: "財產風險屬純粹風險，為可保風險。創新、行銷、生產多涉投機風險或商業判斷，通常不可保。", law: "可保風險要件"},
{id: "金融市場常識-397", text: "下列何者不是可保風險之要件 ?", options: ["(1)損失機率須可以預測", "(2)損失須為明確且可衡量", "(3)須有大量異質性風險單位", "(4)須有釀成個別經濟單位重大損失之可能"], ans: 3, note: "大數法則要求大量且「同質性」(Homogeneous)的風險單位，而非異質性。", law: "可保風險要件"},
{id: "金融市場常識-398", text: "保險契約的當事人為：", options: ["(1)被保險人與要保人", "(2)被保險人與保險人", "(3)要保人與保險人", "(4)要保人與受益人"], ans: 3, note: "保險法規定契約當事人為要保人(提出申請者)與保險人(承保者)。被保險人是關係人。", law: "保險法第2條"},
{id: "金融市場常識-399", text: "在保險事故發生時，保險人支付給被保險人或受益人的補償金額稱為：", options: ["(1)保險金額", "(2)保險價額", "(3)保險費", "(4)保險金"], ans: 4, note: "賠償的金額稱為保險金(Indemnity/Benefit)；保費是成本；保險金額是理賠上限。", law: "保險法名詞定義"},
{id: "金融市場常識-400", text: "保險契約的關係人指：", options: ["(1)保險人與被保險人", "(2)被保險人與受益人", "(3)要保人與受益人", "(4)要保人與被保險人"], ans: 2, note: "保險契約當事人為保險人與要保人；關係人則為被保險人與受益人。", law: "保險法"},
{id: "金融市場常識-401", text: "我國保險法將保險分為：", options: ["(1)財產保險與人壽保險", "(2)產物保險與人壽保險", "(3)財產保險與人身保險", "(4)產物保險與人身保險"], ans: 3, note: "保險法第13條將保險分為財產保險及人身保險兩大類。", law: "保險法第13條"},
{id: "金融市場常識-402", text: "一般人壽保險屬於：", options: ["(1)費用保險", "(2)損害保險", "(3)定值保險", "(4)定額保險"], ans: 4, note: "人身無價，無法客觀評估損害額，故人壽保險多採定額給付。", law: "人壽保險原理"},
{id: "金融市場常識-403", text: "下列何者不屬於人壽保險之性質？", options: ["(1)保險期間長", "(2)多屬個人保險", "(3)保險價額高", "(4)屬定額保險"], ans: 3, note: "「保險價額」是財產保險的概念（標的物的價值），人身保險無價，故無保險價額之概念，只有「保險金額」。", law: "保險法概論"},
{id: "金融市場常識-404", text: "產險公司不得經營下列何種保險？", options: ["(1)年金保險", "(2)健康保險", "(3)傷害保險", "(4)旅行平安保險"], ans: 1, note: "產險公司經核准可經營健康險與傷害險，但年金保險與人壽保險屬於壽險公司專營。", law: "保險法第138條"},
{id: "金融市場常識-405", text: "下列何者不是我國保險法上財產保險的分類之一？", options: ["(1)火災保險", "(2)陸空保險", "(3)責任保險", "(4)汽車保險"], ans: 4, note: "保險法第13條列舉之財產保險為：火災、海上、陸空、責任、保證及其他。汽車保險屬於陸空保險或責任保險的範疇，非第一層分類。", law: "保險法第13條"},
{id: "金融市場常識-406", text: "下列何者不屬於財產保險之性質？", options: ["(1)保險事故之發生相當規則", "(2)保險金額差距甚大", "(3)保險期間通常為一年或少於一年", "(4)依賴再保險程度較深"], ans: 1, note: "財產保險事故（如火災、地震）發生具不確定性且不規則，不像人壽保險之死亡率具高度規律性（生命表）。", law: "財產保險性質"},
{id: "金融市場常識-407", text: "財產保險不承保下列何種標的？", options: ["(1)建築物", "(2)動產", "(3)土地", "(4)收益"], ans: 3, note: "土地通常不因火災等事故滅失，故一般不列為火災保險標的。", law: "火災保險實務"},
{id: "金融市場常識-408", text: "人壽保險是依約給付一定金額的一種：", options: ["(1)定值保險", "(2)生存保險", "(3)定額保險", "(4)死亡保險"], ans: 3, note: "人壽保險因生命無價，採約定金額給付，稱為定額保險。", law: "人壽保險原理"},
{id: "金融市場常識-409", text: "人身保險不包括下列那一險種？", options: ["(1)健康保險", "(2)傷害保險", "(3)旅行平安保險", "(4)信用保險"], ans: 4, note: "信用保險屬於財產保險（保證保險類）。", law: "保險法第13條"},
{id: "金融市場常識-410", text: "下列何者是人壽保險的主要特徵？", options: ["(1)保險給付不確定", "(2)保險事故較不確定", "(3)僅是利己的單純投保動機", "(4)保險期間長"], ans: 4, note: "人壽保險多為長期契約，期間可達數十年或終身。", law: "人壽保險性質"},
{id: "金融市場常識-411", text: "貸款購買房屋最好配合下列何種保險 ?", options: ["(1)遞增型定期保險", "(2)生存保險", "(3)可變更型定期保險", "(4)遞減型定期保險"], ans: 4, note: "房貸餘額會隨時間減少，遞減型定期保險的保額隨之減少，保費較便宜，剛好覆蓋房貸風險（房貸壽險）。", law: "人壽保險商品"},
{id: "金融市場常識-412", text: "下列有關定期保險之敘述何者為非？", options: ["(1)期滿仍生存，保障全失", "(2)中途退保保費不能退還", "(3)適合債權人購買", "(4)被保人於保險期間內死亡，保險人應退還大部份保險費"], ans: 4, note: "定期保險若被保險人死亡，保險人是給付「保險金額」，而非「退還保費」。", law: "人壽保險商品"},
{id: "金融市場常識-413", text: "就保障目的而論，年輕夫妻養育子女期間應購買何種人壽保險？", options: ["(1)遞增型定期保險", "(2)生存保險", "(3)生死合險", "(4)年金保險"], ans: 1, note: "隨著子女成長與責任增加，保障需求可能上升，且定期險保費較低，適合預算有限的年輕家庭。(*註：本題庫標準答案選1，實務上亦常建議定期壽險或遞減型，視需求而定，依題庫為準)", law: "理財規劃實務"},
{id: "金融市場常識-414", text: "依我國保險法規定，人壽保險契約如涉及死亡給付之情況，發生保險事故之被保險人應年滿幾歲？", options: ["(1)1歲", "(2)15歲", "(3)67歲", "(4)80歲"], ans: 2, note: "保險法第107條規定，未滿15歲之未成年人，其死亡給付於年滿15歲之日起發生效力（15歲前僅退還保費或帳戶價值）。", law: "保險法第107條"},
{id: "金融市場常識-415", text: "依我國保險法規定，人壽保險之保險費到期未交付者，除契約另有訂定外，經催告到達後屆多少日仍不交付時，保險契約之效力停止？", options: ["(1)2日", "(2)一年", "(3)30日", "(4)五年"], ans: 3, note: "保險法第116條規定，催告到達後屆三十日仍不交付時，契約效力停止。", law: "保險法第116條"},
{id: "金融市場常識-416", text: "依我國保險法規定，保險契約載有被保險人故意自殺，保險人仍應給付保險金額之條款者，其條款於訂約多久後始生效力？", options: ["(1)2年", "(2)5年", "(3)10年", "(4)20年"], ans: 1, note: "保險法第109條規定，被保險人故意自殺者，保險人不負給付責任。但契約訂定二年後自殺者，不在此限。", law: "保險法第109條"},
{id: "金融市場常識-417", text: "生存保險主要之目的為：", options: ["(1)保障", "(2)保障加儲蓄", "(3)儲蓄", "(4)生存"], ans: 3, note: "生存保險是活著才領錢，主要功能為儲蓄（如養老）。", law: "人壽保險種類"},
{id: "金融市場常識-418", text: "人壽保險公司給付之生存保險金，來自：", options: ["(1)被保人在保險期間屆滿前死亡者所繳付之保費", "(2)要保人所繳付保費之累積儲存生息", "(3)被保人在保險期間屆滿前死亡者所繳付之保費與要保人所繳付保費之累積儲存生息", "(4)保險公司的投資收入"], ans: 3, note: "生存保險金來源包含生存者自繳保費的累積生息，以及死亡者保費移轉過來的金額（死亡率收益）。", law: "人壽保險數理"},
{id: "金融市場常識-419", text: "所謂養老保險在性質上是一種 ?", options: ["(1)生存保險", "(2)定期保險", "(3)生存保險與定期保險", "(4)終身保險"], ans: 3, note: "養老保險（Endowment，生死合險）結合了定期死亡保險與生存保險。", law: "人壽保險種類"},
{id: "金融市場常識-420", text: "保險期間較長的生死合險，其主要用途為 ?", options: ["(1)組合工作年齡保障與晚年生活準備", "(2)為子女預備學費", "(3)為未來債務預為償還準備", "(4)年輕人初入社會所需之基本保障"], ans: 1, note: "生死合險兼具保障（工作期間死亡）與儲蓄（滿期養老），適合規劃退休。", law: "保險規劃"},
{id: "金融市場常識-421", text: "下列何者屬於健康保險之範疇？", options: ["(1)失業保險", "(2)專門職業責任保險", "(3)失能保險", "(4)傷害保險"], ans: 3, note: "健康保險承保疾病或傷害導致的醫療或失能。失能保險（Disability Income）屬健康險範疇。", law: "保險法"},
{id: "金融市場常識-422", text: "影響傷害保險之保險費率最大的因素是 ?", options: ["(1)年齡大小", "(2)婚姻狀況", "(3)性別", "(4)職業類別"], ans: 4, note: "傷害保險（意外險）費率主要依據「職業類別」（工作危險程度）計算，與年齡性別較無關。", law: "傷害保險費率結構"},
{id: "金融市場常識-423", text: "下列何者非傷害保險事故之「意外事故」，之構成要件？", options: ["(1)內在原因觸發", "(2)意外事故所致", "(3)外在原因觸發", "(4)以上皆非"], ans: 1, note: "意外事故需具備：外來、突發、非疾病三大要素。內在原因（如疾病）不屬意外。", law: "傷害保險單示範條款"},
{id: "金融市場常識-424", text: "傷害保險失能保險金主要決定因素為：", options: ["(1)住院長短", "(2)保險事故", "(3)失能級數", "(4)職業種類"], ans: 3, note: "失能保險金依據「失能程度與保險金給付表」之等級（級數）按比例給付。", law: "傷害保險單示範條款"},
{id: "金融市場常識-425", text: "下列何種年金旨在照顧基本經濟生活？", options: ["(1)公共年金保險", "(2)企業年金保險", "(3)商業年金保險", "(4)個人年金保險"], ans: 1, note: "公共年金（社會保險，如勞保年金、國保）旨在提供國民基本經濟安全保障。", law: "社會保險原理"},
{id: "金融市場常識-426", text: "下列何者不屬於社會年金保險之範疇？", options: ["(1)老年年金", "(2)失能年金", "(3)遺屬年金", "(4)延期年金"], ans: 4, note: "社會保險年金通常包含老年、失能、遺屬年金。「延期年金」是商業年金的一種商品分類（相對於即期年金）。", law: "社會保險原理"},
{id: "金融市場常識-427", text: "保險人於被保險人生存期間或特定期間內，依照契約負一次或分期給付一定金額之責，此種保險稱為：", options: ["(1)年金保險", "(2)退休金保險", "(3)死亡保險", "(4)養老保險"], ans: 1, note: "此為年金保險之定義，主要解決長壽風險。", law: "保險法第135-1條"},
{id: "金融市場常識-428", text: "年金保險契約中，如規定有保證給付金額，年金受領人死亡之時，如有一部份尚未支領，此時保險人應將該差額", options: ["(1)繳交國庫", "(2)保留一定年限成為公司盈餘", "(3)給付給年金受領人之身故受益人", "(4)成為其他受領人之分紅"], ans: 3, note: "保證期間或保證金額內的剩餘價值，應給付給身故受益人。", law: "年金保險單示範條款"},
{id: "金融市場常識-429", text: "下列何者為投資型保險的特點？", options: ["(1)主要功能為提供保障", "(2)仍具有保障與投資雙重功能", "(3)風險全由被保險人承擔", "(4)要保人領取保單紅利"], ans: 2, note: "投資型保險結合了保險保障與投資帳戶的功能。", law: "投資型保險商品介紹"},
{id: "金融市場常識-430", text: "下列變額壽險之敘述何者為正確之敘述？", options: ["(1)保費固定", "(2)保險金不固定", "(3)投資方式採用分離帳戶", "(4)以上皆是"], ans: 4, note: "變額壽險特徵：固定繳費、保額隨投資績效變動、資產置於分離帳戶。", law: "投資型保險商品介紹"},
{id: "金融市場常識-431", text: "下列萬能變額壽險之敘述何者為是？", options: ["(1)現金價值不固定", "(2)較低的保證利率", "(3)保險保障彈性較大", "(4)以上皆是"], ans: 4, note: "萬能變額壽險（VUL）結合萬能壽險的彈性繳費與變額壽險的投資分離帳戶，現金價值隨投資波動，通常僅有極低或無保證利率。", law: "投資型保險商品介紹"},
{id: "金融市場常識-432", text: "下列有關團體人壽保險的敘述何者錯誤？", options: ["(1)承保時僅簽發一張總保險單", "(2)要保人為企業負責人", "(3)被保險人須接受體檢", "(4)核保簡單"], ans: 3, note: "團體保險基於大數法則與防止逆選擇（如依職務投保），通常免體檢。", law: "團體保險實務"},
{id: "金融市場常識-433", text: "依我國團體一年定期人壽保單示範條款規定，所謂「團體」，其最低人數通常為多少？", options: ["(1)5人", "(2)100人", "(3)500人", "(4)1,000 人"], ans: 1, note: "現行規定團體保險最低人數門檻為5人。", law: "團體一年定期人壽保險單示範條款"},
{id: "金融市場常識-434", text: "下列何者非團體傷害保險之保險費考慮因素？", options: ["(1)年齡", "(2)職業", "(3)工作環境", "(4)意外事故發生率"], ans: 1, note: "傷害保險（意外險）費率主要看職業風險，與年齡無關。", law: "傷害保險費率"},
{id: "金融市場常識-435", text: "下列何者非屬團體保險之險種？", options: ["(1)定期保險", "(2)信用人壽保險", "(3)傷害保險", "(4)職業責任保險"], ans: 4, note: "職業責任保險屬於財產保險中的責任險，通常個別投保或以責任險形式，非屬「團體人身保險」類別。(*註：此分類較細，責任險是對第三人賠償，團體保險多指雇主幫員工保的福利)", law: "保險分類"},
{id: "金融市場常識-436", text: "我國公教人員保險的主管機關為：", options: ["(1)內政部", "(2)考試院銓敘部", "(3)行政院", "(4)金融監督管理委員會"], ans: 2, note: "公教人員保險法之主管機關為銓敘部。", law: "公教人員保險法"},
{id: "金融市場常識-437", text: "下列何者非我國公教人員保險給付項目之一？", options: ["(1)醫療給付", "(2)養老給付", "(3)死亡給付", "(4)育嬰留職停薪"], ans: 1, note: "醫療給付已移至全民健康保險（健保），公保目前僅提供現金給付（如養老、死亡、育嬰津貼等）。", law: "公教人員保險法"},
{id: "金融市場常識-438", text: "下列何者非我國勞工保險承保的給付項目之一？", options: ["(1)生育給付", "(2)傷病給付", "(3)失業給付", "(4)眷屬喪葬津貼"], ans: 3, note: "失業給付已獨立於「就業保險法」中，不屬於勞工保險條例之給付項目。", law: "勞工保險條例/就業保險法"},
{id: "金融市場常識-439", text: "下列何者為我國勞工保險中職業災害保險的承保項目？", options: ["(1)傷病給付", "(2)生育給付", "(3)失業給付", "(4)以上皆是"], ans: 1, note: "職災保險提供職災傷病給付。生育是普通事故；失業是就業保險。", law: "勞工保險條例"},
{id: "金融市場常識-440", text: "下列何者為我國勞工保險中普通事故保險與職業災害保險二者均會給付之項目？", options: ["(1)生育給付", "(2)傷病給付", "(3)失業給付", "(4)以上皆是"], ans: 2, note: "普通傷病與職災傷病皆有傷病給付（但給付標準不同）。生育僅普通事故有。", law: "勞工保險條例"},
{id: "金融市場常識-441", text: "我國勞工保險主管機關在中央為：", options: ["(1)財政部", "(2)勞動部", "(3)金融監督管理委員會", "(4)保險局"], ans: 2, note: "勞工保險之主管機關為勞動部。", law: "勞工保險條例"},
{id: "金融市場常識-442", text: "我國勞工保險規定，被保險人的年齡限制為：", options: ["(1)15歲以上 65歲以下", "(2)20歲以上 65歲以下", "(3)18歲以上 60歲以下", "(4)16歲以上 65歲以下"], ans: 1, note: "勞工保險條例第6條規定，年滿15歲以上，65歲以下之勞工應強制投保。", law: "勞工保險條例"},
{id: "金融市場常識-443", text: "我國就業保險之中央主管機關為：", options: ["(1)勞動部", "(2)財政部", "(3)金融監督管理委員會", "(4)勞工保險局"], ans: 1, note: "就業保險法之主管機關為勞動部。", law: "就業保險法"},
{id: "金融市場常識-444", text: "下列何者非我國就業保險之給付項目？", options: ["(1)失業給付", "(2)提早就業獎助津貼", "(3)職業訓練生活津貼", "(4)身心障礙給付"], ans: 4, note: "身心障礙給付（失能給付）屬於勞工保險，非就業保險。", law: "就業保險法"},
{id: "金融市場常識-445", text: "我國就業保險規定，被保險人包括：", options: ["(1)公教人員", "(2)受雇之外國籍勞工", "(3)受雇之本國籍勞工", "(4)以上皆是"], ans: 3, note: "就業保險適用對象主要為本國籍勞工（及依法結婚之陸港澳外籍配偶），一般外籍移工及公教人員不適用。", law: "就業保險法"},
{id: "金融市場常識-446", text: "下列何者非我國農民健康保險承保的給付項目之一？", options: ["(1)生育給付", "(2)失業給付", "(3)身心障礙給付", "(4)喪葬津貼"], ans: 2, note: "農保無失業給付（農民無失業問題定義）。", law: "農民健康保險條例"},
{id: "金融市場常識-447", text: "下列何者非我國農民健康保險承保的危險事故之一種？", options: ["(1)生育", "(2)身心障礙", "(3)老年", "(4)死亡"], ans: 3, note: "農保無老年給付（由老農津貼或農民退休儲金制度涵蓋）。", law: "農民健康保險條例"},
{id: "金融市場常識-448", text: "我國農民健康保險的被保險人不包括：", options: ["(1)自耕農", "(2)佃農", "(3)農業學校畢業從事農業推廣工作者", "(4)農業學校職員"], ans: 4, note: "農業學校職員應參加公教人員保險或勞保，非農民。", law: "農民健康保險條例"},
{id: "金融市場常識-449", text: "我國軍人保險中所稱「軍人」，係指：", options: ["(1)現役軍人", "(2)退役軍人", "(3)後備軍人", "(4)以上皆是"], ans: 1, note: "軍人保險條例適用對象為現役軍人。", law: "軍人保險條例"},
{id: "金融市場常識-450", text: "我國軍人保險之給付項目之種類不包括：", options: ["(1)死亡", "(2)身心障礙", "(3)退伍", "(4)育嬰留職留薪津貼"], ans: 4, note: "軍人保險目前給付項目為死亡、身心障礙、退伍、育嬰留職停薪。Wait. 題目是「不包括」且答案選(4)？軍保條例修正後已包含育嬰津貼。但依本題庫舊有標準答案為(4)，可能題庫尚未更新修法資訊。(*註：軍人保險條例已於104年增訂育嬰留職停薪津貼，但考試若依舊題庫，請選4)", law: "軍人保險條例"},
{id: "金融市場常識-451", text: "我國軍人保險之主管機關為：", options: ["(1)國防部", "(2)臺灣銀行", "(3)行政院", "(4)勞保局"], ans: 1, note: "軍人保險主管機關為國防部。", law: "軍人保險條例"},
{id: "金融市場常識-452", text: "我國軍人保險退伍及身心障礙給付，受益人為：", options: ["(1)被保險人本人", "(2)被保險人之配偶", "(3)被保險人之子女", "(4)被保險人之父母"], ans: 1, note: "退伍與殘廢（身心障礙）給付由本人具領。", law: "軍人保險條例"},
{id: "金融市場常識-453", text: "我國全民健康保險承保的危險事故不包括：", options: ["(1)疾病", "(2)傷害", "(3)生育", "(4)失能"], ans: 4, note: "健保提供醫療服務，不提供「失能」現金給付（那是勞保/公保的範圍）。", law: "全民健康保險法"},
{id: "金融市場常識-454", text: "我國全民健康保險第一類的保險對象不包括：", options: ["(1)公教人員", "(2)榮民", "(3)專門職業人員", "(4)私校教職員"], ans: 2, note: "榮民屬於健保第六類被保險人。", law: "全民健康保險法第10條"},
{id: "金融市場常識-455", text: "我國全民健康保險規定第一類被保險人負擔其眷屬之保險費，最高以幾口為限？", options: ["(1)三口", "(2)六口", "(3)九口", "(4)十二口"], ans: 1, note: "眷屬超過三口者，以三口計。", law: "全民健康保險法"},
{id: "金融市場常識-456", text: "設(甲)全民健康保險， (乙)商業性健康保險，則下列敘述何者為非：", options: ["(1)甲之投保方式為強制性", "(2)乙之給付按法律規定", "(3)甲之經營主體為政府機關", "(4)甲乙之保險成本均賴精算原理"], ans: 2, note: "商業保險(乙)之給付是按「保險契約」約定，非法律強制規定。", law: "保險比較"},
{id: "金融市場常識-457", text: "廠房因火災而遭燒毀，則此損失屬：", options: ["(1)直接損失", "(2)間接損失", "(3)從屬損失", "(4)連帶營業中斷損失"], ans: 1, note: "實體財產毀損為直接損失。", law: "風險管理"},
{id: "金融市場常識-458", text: "下列何者為間接損失保險？", options: ["(1)火災保險", "(2)營業中斷保險", "(3)營造綜合保險", "(4)汽車保險"], ans: 2, note: "營業中斷保險承保因財產受損導致停工之利潤損失，屬間接損失。", law: "產物保險種類"},
{id: "金融市場常識-459", text: "一般財產保險通常不承保下列何種危險事故？", options: ["(1)地震", "(2)颱風洪水", "(3)航空器墜落及機動車輛碰撞", "(4)核子輻射"], ans: 4, note: "核子風險通常為除外不保項目（需透過核能保險共保組織）。", law: "保險除外責任"},
{id: "金融市場常識-460", text: "下列何種保險之保險標的，無保險價額之概念？", options: ["(1)火災保險", "(2)海上貨物保險", "(3)責任保險", "(4)工程保險"], ans: 3, note: "責任保險標的為「被保險人之民事賠償責任」，責任無預定價值（只有賠償上限），故無保險價額。", law: "責任保險原理"},
{id: "金融市場常識-461", text: "下列何種標的物投保時採定值保險單方式？", options: ["(1)古董或藝術品", "(2)廠房", "(3)傢俱衣李", "(4)機器設備"], ans: 1, note: "古董藝術品價值難以市價衡量，通常約定價值承保（定值保險）。", law: "保險法第73條"},
{id: "金融市場常識-462", text: "以一個保險金額，承保多數標的物之保險單稱為：", options: ["(1)個別保險單", "(2)集合保險單", "(3)總括保險單", "(4)複數保險單"], ans: 3, note: "總括保險單（Blanket Policy）以單一保額涵蓋多處或多種財產。", law: "保險實務"},
{id: "金融市場常識-463", text: "財產保險之保險利益一般須在何時存在？", options: ["(1)要保時", "(2)保險契約訂立時", "(3)保險事故發生時", "(4)保險期間屆滿時"], ans: 3, note: "保險法規定，財產保險之要保人於「保險事故發生時」須有保險利益，否則契約失效。", law: "保險法第17條"},
{id: "金融市場常識-464", text: "我國財產保險遇有複保險情形時，大都採何種賠款分攤方式？", options: ["(1)獨立責任比例分攤法", "(2)保險金額比例分攤法", "(3)超額賠償法", "(4)優先賠償法"], ans: 2, note: "保險法第38條規定，善意複保險各保險人按保險金額比例分攤。", law: "保險法第38條"},
{id: "金融市場常識-465", text: "下列何者不是企業財產保險的重要功能？", options: ["(1)維持企業利潤", "(2)保障企業經營安全", "(3)提高企業信用", "(4)保障員工生命安全"], ans: 4, note: "員工生命安全是人身保險或勞安範疇，財產保險保障的是財產與責任。", law: "財產保險功能"},
{id: "金融市場常識-466", text: "下列何者不是財產保險對個人之功能？", options: ["(1)填補財產之損失", "(2)保障家庭生活安定", "(3)提升生活品質", "(4)減少對財產損失危險之憂慮"], ans: 3, note: "保險是被動的補償損失，維持現狀，而非主動「提升」生活品質（那是投資或消費的功能）。", law: "保險功能"},
{id: "金融市場常識-467", text: "下列何者不是財產保險對國家社會的功能？", options: ["(1)累積政治資源", "(2)促進經濟發展", "(3)提供國家建設資金", "(4)保障社會安定"], ans: 1, note: "累積政治資源非保險之經濟或社會功能。", law: "保險功能"},
{id: "金融市場常識-468", text: "我國商業火災保險之基本承保事故不包括：", options: ["(1)閃電雷擊", "(2)爆炸", "(3)爆炸引起之火災", "(4)竊盜後之縱火"], ans: 2, note: "商業火險基本承保範圍為「火災」及「閃電雷擊」。單純的「爆炸」非基本承保事故（除非爆炸引起火災，或另行加保爆炸險）。竊盜後縱火仍屬火災事故。", law: "商業火災保險單條款"},
{id: "金融市場常識-469", text: "我國商業火災保險之保險金額，除另有約定外，以下列何者為基礎？", options: ["(1)實際價值", "(2)重置成本", "(3)原始價格", "(4)會計價值"], ans: 1, note: "商業火險預設為實際價值（Actual Cash Value，扣折舊）。住宅火險才採重置成本。", law: "商業火災保險單條款"},
{id: "金融市場常識-470", text: "下列何者非商業火災保險之承保標的？", options: ["(1)廠房", "(2)機器設備", "(3)汽車", "(4)貨物"], ans: 3, note: "汽車應投保汽車保險，商業火險條款通常將汽車列為除外或不保標的。", law: "商業火災保險單條款"},
{id: "金融市場常識-471", text: "我國商業火災保險附加之共保附加條款，其共保百分比為：", options: ["(1)60%", "(2)70%", "(3)80%", "(4)100%"], ans: 3, note: "商業火險常見共保條款比例為80%。", law: "商業火災保險實務"},
{id: "金融市場常識-472", text: "海上保險之查勘費及公證費為：", options: ["(1)損害防止費用", "(2)救助費用", "(3)額外費用", "(4)共同海損費用"], ans: 3, note: "查勘、公證費用屬於證明損失之費用，歸類為額外費用（Extra Charges）。(*註：題庫答案為3)", law: "海上保險實務"},
{id: "金融市場常識-473", text: "共同海損屬於下列何種損失？", options: ["(1)部分損失", "(2)單獨海損", "(3)實際全損", "(4)推定全損"], ans: 1, note: "共同海損是為了全體利益而犧牲部分，屬於部分損失（Partial Loss）的一種。", law: "海商法"},
{id: "金融市場常識-474", text: "我國自用汽車保險單不包括：", options: ["(1)車體損失險", "(2)竊盜損失險", "(3)第三人責任保險", "(4)旅客責任險"], ans: 4, note: "自用汽車保單主體包含車體、竊盜、第三人責任。旅客責任險通常是營業用車或附加險。", law: "汽車保險實務"},
{id: "金融市場常識-475", text: "免自負額車對車碰撞損失保險即車體損失險：", options: ["(1)甲式", "(2)乙式", "(3)丙式", "(4)丁式"], ans: 3, note: "丙式車體險僅承保「車對車碰撞」，通常免自負額。", law: "汽車保險種類"},
{id: "金融市場常識-476", text: "下列何者不是自用汽車保險第三人責任保險之附加被保險人？", options: ["(1)保險契約所載明之被保險人", "(2)列名被保險人之配偶", "(3)列名被保險人所僱用之駕駛人", "(4)列名被保險人之同居家屬"], ans: 1, note: "保險契約載明之被保險人為「列名被保險人」（主被保險人），非「附加」被保險人。", law: "自用汽車保險共同條款"},
{id: "金融市場常識-477", text: "對必須更換之零件，汽車車體損失險如何理賠？", options: ["(1)以舊品為準", "(2)以舊品加工資為準", "(3)以新品為準", "(4)以新品減折舊為準"], ans: 3, note: "車體損失險於修復時，更換零件通常「以新品為準」且不扣折舊（這與責任險賠償需扣折舊不同）。", law: "自用汽車保險條款"},
{id: "金融市場常識-478", text: "下列何者非車體損失險乙式之承保危險事故？", options: ["(1)抛擲物或墜落物", "(2)第三者非善意行為", "(3)碰撞及傾覆", "(4)閃電及雷擊"], ans: 2, note: "「第三者非善意行為」是甲式車體險的承保範圍，乙式不含。", law: "自用汽車保險條款"},
{id: "金融市場常識-479", text: "責任保險又稱為：", options: ["(1)第一人責任保險", "(2)第二人責任保險", "(3)第三人責任保險", "(4)第四人責任保險"], ans: 3, note: "責任保險賠償對象為被保險人對「第三人」之責任，故稱第三人責任險。", law: "責任保險原理"},
{id: "金融市場常識-480", text: "責任保險所承保的責任為：", options: ["(1)民事責任", "(2)刑事責任", "(3)行政責任", "(4)道義責任"], ans: 1, note: "保險承保的是損害賠償的民事責任，刑事與行政責任不可保。", law: "責任保險原理"},
{id: "金融市場常識-481", text: "下列何者不屬於員工誠實保證保險之被保證員工範圍？", options: ["(1)會計人員", "(2)業務人員", "(3)董監事", "(4)經理人員"], ans: 3, note: "董監事為資方（雇主），非員工，故非誠實保證保險之對象（應投保董監事責任險）。", law: "員工誠實保證保險"},
{id: "金融市場常識-482", text: "員工誠實保證保險不承保員工何種行為？", options: ["(1)過失", "(2)詐欺", "(3)侵占", "(4)竊盜"], ans: 1, note: "誠實保證保險承保員工之「不誠實行為」（如偷竊、侵占），「過失」非不誠實，不在承保範圍。", law: "員工誠實保證保險"},
{id: "金融市場常識-483", text: "現行現金保險所承保之現金不包括：", options: ["(1)紙幣", "(2)硬幣", "(3)支票", "(4)金銀條塊"], ans: 4, note: "金銀條塊非貨幣（現金），需另行約定或投保其他險種。", law: "現金保險"},
{id: "金融市場常識-484", text: "保障範圍包括被保險人之所有債務人在內的信用保險單，稱為：", options: ["(1)通用保單", "(2)特定保單", "(3)回溯保單", "(4)前伸保單"], ans: 1, note: "涵蓋所有客戶（債務人）的保單稱為通用保單（Whole Turnover Policy）。", law: "信用保險"},
{id: "金融市場常識-485", text: "下列何者不是我國強制汽車責任保險之性質？", options: ["(1)政府部份補貼", "(2)公辦民營", "(3)無盈無虧原則", "(4)包括軍用汽車"], ans: 1, note: "強制險保費由車主全額負擔，政府並未編列預算補貼保費。", law: "強制汽車責任保險法"},
{id: "金融市場常識-486", text: "強制汽車責任保險之死亡給付金額為新台幣 ：", options: ["(1)100萬元", "(2)120萬元", "(3)150萬元", "(4)200萬元"], ans: 4, note: "目前強制險死亡給付已調高至200萬元。", law: "強制汽車責任保險給付標準"},
{id: "金融市場常識-487", text: "強制汽車責任保險之給付項目不包括：", options: ["(1)傷害醫療給付", "(2)身心障礙給付", "(3)死亡給付", "(4)財損給付"], ans: 4, note: "強制險僅保障「人身」傷害亡故，不包含財產損失。", law: "強制汽車責任保險法"},
{id: "金融市場常識-488", text: "下列何種情形不可向特別補償基金請求補償？", options: ["(1)事故汽車全部或部分無須訂立強制汽車保險契約者", "(2)事故汽車可以查究者", "(3)事故汽車為未保險汽車", "(4)事故汽車係未經保險人同意使用之被保險汽車。"], ans: 2, note: "事故汽車若「可以查究」（且有保險），應直接向保險公司請求，而非向補償基金請求。", law: "強制汽車責任保險法第40條"},
{id: "金融市場常識-489", text: "強制汽車責任保險之保險人應於保險期間屆滿前何時以書面通知被保險人續保？", options: ["(1)2日前", "(2)3日前", "(3)30日前", "(4)55日前"], ans: 3, note: "應於屆滿30日前通知。", law: "強制汽車責任保險法"},
{id: "金融市場常識-490", text: "我國現行住宅火災及地震基本保險之承保危險事故不包括：", options: ["(1)颱風及洪水", "(2)航空器墜落", "(3)爆炸", "(4)閃電及雷擊"], ans: 1, note: "颱風洪水需另外加保，不包含在基本住宅火險內。", law: "住宅火災保險單條款"},
{id: "金融市場常識-491", text: "火災及地震基本保險承保之住宅建築物係以何種基礎約定保險金額？", options: ["(1)會計成本", "(2)原始取得成本", "(3)實際價值", "(4)重置成本"], ans: 4, note: "住宅火險採重置成本基礎。", law: "住宅火災保險單條款"},
{id: "金融市場常識-492", text: "我國現行住宅火災保險對承保之建築物適用何種比例之共保條款？", options: ["(1)5%", "(2)13%", "(3)18%", "(4)60%"], ans: 4, note: "住宅火險採60%共保條款（投保金額達重置成本60%以上視為足額）。", law: "住宅火災保險單條款"},
{id: "金融市場常識-493", text: "我國現行住宅火災及地震基本保險不承保下列何種標的？", options: ["(1)住宅玻璃", "(2)屋內傢俱", "(3)停放屋內之車輛", "(4)房屋之裝潢"], ans: 3, note: "機動車輛非住宅火險承保標的。", law: "住宅火災保險單條款"},
{id: "金融市場常識-494", text: "住宅地震基本保險對建築物之賠償限額為 ?", options: ["(1)2萬元", "(2)5萬元", "(3)10萬元", "(4)150萬元"], ans: 4, note: "目前住宅地震基本保險最高賠償限額為新台幣150萬元。", law: "住宅地震保險制度"},
{id: "金融市場常識-495", text: "一般而言 ,所謂高齡者，係指老年福利法第 2條規定的對象，其年齡是指在幾歲以上？", options: ["(1)65歲", "(2)70歲", "(3)80歲", "(4)90歲"], ans: 1, note: "老年福利法定義老人為年滿65歲以上者。", law: "老人福利法"},
{id: "金融市場常識-496", text: "下列何人常常可能是弱勢金融消費者？", options: ["(1)金融服務業商品銷售人員", "(2)大專院校教授財務投資課程的老師", "(3)身心障礙者", "(4)專業投資人"], ans: 3, note: "身心障礙者因生理或心理因素，較易在金融交易中處於弱勢。", law: "金融消費者保護"},
{id: "金融市場常識-497", text: "下列何人常常不是弱勢金融消費者？", options: ["(1)高齡者", "(2)低學歷者", "(3)身心障礙者", "(4)銀行理財專員"], ans: 4, note: "銀行理財專員具備專業金融知識，非弱勢消費者。", law: "金融消費者保護"},
{id: "金融市場常識-498", text: "業務員對於身心障礙者的投保要求應如何處理 ?", options: ["(1)一律拒絕受理", "(2)與一般非身心障礙者相同不得有所歧視", "(3)一律勸其改投保微型保險", "(4)告以公司核保不會通過予以勸退"], ans: 2, note: "金融服務業應公平待客，不得對身心障礙者有歧視待遇。", law: "保險業招攬及核保作業控管自律規範"},
{id: "金融市場常識-499", text: "業務員應如何規劃適合身心障礙者的保險商品 ?", options: ["(1)規劃高保費的商品，佣金也可領得多", "(2)公司核保手續較複雜，只要規劃年金保險就好", "(3)依其身心障礙種類、發生原因、目前障礙狀況等因素，規劃適當的保險商品", "(4)公司核保手續較複雜，規劃投保微型保險就好"], ans: 3, note: "應依客戶實際狀況與需求進行專業規劃（KYC）。", law: "保險業務員管理規則"},
{id: "金融市場常識-500", text: "業務員應如何規劃適合高齡者的保險商品 ?", options: ["(1)規劃高保費的商品，佣金也可領得多", "(2)容易因體況影響公司核保，只要規劃年金保險就好", "(3)多半有退休金，儘量為其規劃投資型保險以獲取較高收益", "(4)考量其生活、醫療、照護等各方面費用需求，規劃適當的保險商品"], ans: 4, note: "高齡者規劃應著重生活、醫療與長照需求，而非盲目推銷高風險或高佣金商品。", law: "保險業招攬及核保作業控管自律規範"},
{id: "金融市場常識-501", text: "下列何者是業務員招攬時應遵循的公平待客原則 ?", options: ["(1)訂約公平誠信原則", "(2)忠實與注意義務原則", "(3)廣告招攬真實原則", "(4)以上皆是"], ans: 4, note: "皆為公平待客原則之核心內容。", law: "金融服務業公平待客原則"},
{id: "金融市場常識-502", text: "下列何者不是普惠金融主要的照顧對象 ?", options: ["(1)高齡者", "(2)專業投資人", "(3)身心障礙者", "(4)經濟弱勢者"], ans: 2, note: "普惠金融旨在服務被傳統金融排斥或服務不足的族群，專業投資人已有充足資源。", law: "普惠金融政策"},
{id: "金融市場常識-503", text: "下列何者是現行處理金融消費爭議的專責機構 ?", options: ["(1)保險商業同業公會", "(2)保險事業發展中心", "(3)金融消費評議中心", "(4)保險職業工會"], ans: 3, note: "財團法人金融消費評議中心是依金消法設立之爭議處理機構。", law: "金融消費者保護法"},
{id: "金融市場常識-504", text: "下列何種商品是現行法令規定提供特定身分及經濟弱勢者投保的保險商品 ?", options: ["(1)微型保險", "(2)投資型保險", "(3)強制汽車責任保險", "(4)利率變動型保險"], ans: 1, note: "微型保險（Micro Insurance）專為經濟弱勢者設計，提供基本保障。", law: "保險業辦理微型保險業務應注意事項"},
{id: "金融職業道德-1", text: "金融從業人員從事保險招攬行為，下列那一項是錯的？", options: ["(1)解釋保險商品內容及保單條款", "(2)說明填寫要保書注意事項、轉送要保文件及保險單", "(3)經所屬公司授權從事保險招攬行為", "(4)可以向未經授權公司從事保險招攬行為"], ans: 4, note: "保險業務員只能為所屬公司或經授權之公司進行招攬，不得為未經授權之公司招攬業務。", law: "保險業務員管理規則"},
{id: "金融職業道德-2", text: "金融從業人員從事保險招攬所用文書、圖畫、廣告文宣，下列那一項是錯的？", options: ["(1)應標明所屬公司之名稱", "(2)所屬公司為代理人、經紀人者並應標明往來保險業名稱", "(3)保險代理人、經紀人所屬業務員所使用之文書、圖書、廣告文宣,應經往來保險業同意方可使用", "(4)廣告文宣之內容可任意將保險業報經主管機關審查通過之保單條款、費率及要保書文件予以更改"], ans: 4, note: "招攬文宣必須與主管機關核准之內容相符，不得任意更改、誇大或誤導。", law: "保險業招攬廣告自律規範"},
{id: "金融職業道德-3", text: "金融從業人員於保險業務員登錄後，應專為下列何者從事保險招攬？", options: ["(1)自己", "(2)要保人", "(3)所屬公司", "(4)保險人"], ans: 3, note: "業務員經登錄後，應專為其「所屬公司」從事保險招攬。", law: "保險業務員管理規則"},
{id: "金融職業道德-4", text: "金融從業人員從事保險業務招攬時，對不特定之第三人散播不實言論或文宣，擾亂金融秩序或其他公司營業、信譽，所屬公司如何處分？", options: ["(1)罰鍰處分", "(2)減薪處分", "(3)停止招攬1 年", "(4)不需再作其他處分"], ans: 3, note: "散播不實言論擾亂金融秩序，依規定應處停止招攬一年。", law: "保險業務員管理規則"},
{id: "金融職業道德-5", text: "金融從業人員，從事保險業務招攬時，將本人之登錄證提供他人進行招攬、掛名或其他使用者，會受到何處分？", options: ["(1)註銷保險業務員登錄", "(2)停止招攬6 個月", "(3)停止招攬10 個月", "(4)停止招攬1 年"], ans: 2, note: "將登錄證借予他人使用，依規定處停止招攬一年以下，實務常見為停止招攬6個月至1年，本題標準答案為(2)。", law: "保險業務員管理規則"},
{id: "金融職業道德-6", text: "金融從業人員應以公司專業、形象及服務等招攬客戶：", options: ["(1)不得惡意毀謗競爭者", "(2)不得惡意削價方式招攬", "(3)避免於報章雜誌刊登誇大不實廣告誘導客戶", "(4)以上敘述皆正確"], ans: 4, note: "公平競爭與誠信原則要求不得毀謗、削價或誇大不實。", law: "公平交易法/金融業自律規範"},
{id: "金融職業道德-7", text: "金融從業人員如有多年市場交易經驗", options: ["(1)可以與客戶簽署任何獲利保證之契約", "(2)可以逕自代客操作", "(3)可以多層次傳銷方式進行", "(4)以上皆不可為之"], ans: 4, note: "無論經驗多寡，均不得保證獲利、違法代客操作或以多層次傳銷招攬。", law: "證券投資信託及顧問法"},
{id: "金融職業道德-8", text: "金融從業人員為客戶開戶時，下列敘述何者正確：", options: ["(1)應確實徵信並了解客戶背景，對於不適合投資之客戶應予以拒絕", "(2)金融商品適合所有人士，只要有錢即可交易，所以不需了解客戶背景", "(3)期貨交易須先存入保證金，所以不需徵信並了解客戶背景", "(4)對於年收入達百萬的客戶，不需徵信並了解客戶背景"], ans: 1, note: "KYC (Know Your Customer) 是防制洗錢與適合度管理的核心，必須確實執行。", law: "洗錢防制法/金融機構開戶作業規定"},
{id: "金融職業道德-9", text: "金融從業人員招攬證券期貨相關業務時，對於客戶折讓之要求，何者可以接受：", options: ["(1)折讓至客戶本人帳戶", "(2)折讓至第三人帳戶", "(3)折讓至代理下單者之帳戶", "(4)不可削價競爭，故不可有折讓情事"], ans: 1, note: "手續費折讓須直接退回「客戶本人」帳戶，禁止退給第三人以防範洗錢或利益輸送。", law: "證券商管理規則"},
{id: "金融職業道德-10", text: "金融從業人員招攬業務時，不得以下列方式進行：", options: ["(1)向客戶作不實陳述，僅強調容易獲利未同時說明相對風險", "(2)以多層次傳銷方式進行", "(3)宣稱金融商品交易簡明易懂，適合所有人士", "(4)以上皆不得為之"], ans: 4, note: "應揭露風險、不得誤導、不得違法傳銷。", law: "金融消費者保護法"},
{id: "金融職業道德-11", text: "為提供多元化之服務，金融從業人員：", options: ["(1)得保管客戶之存摺及印章，以代其進行資金調度", "(2)得代客戶提領保證金以省卻客戶舟車勞頓之苦", "(3)得代領對帳單，並於日後面交客戶", "(4)應提供客戶多元化商品資訊"], ans: 4, note: "保管存摺印章、代領款項、代領對帳單皆為禁止之挪用或便宜行事行為。", law: "銀行法/證券商負責人與業務人員管理規則"},
{id: "金融職業道德-12", text: "金融從業人員為客戶辦理開戶作業時：", options: ["(1)應告知客戶金融商品之風險", "(2)毋須告知客戶交易風險", "(3)應告知客戶金融商品絕無風險", "(4)應告知客戶金融商品交易風險有限"], ans: 1, note: "風險預告是開戶與交易前最重要的法定程序。", law: "金融消費者保護法"},
{id: "金融職業道德-13", text: "金融服務業從事業務廣告及製發宣傳文件：", options: ["(1)不得製作易使客戶誤解金融商品交易與賭博雷同之廣告", "(2)僅使用對其有利之資料以誇大其績效", "(3)宣稱金融商品交易無風險適合所有人士", "(4)得僅強調獲利，但未同時說明相對風險"], ans: 1, note: "廣告內容不得誇大、偏頗或鼓勵投機賭博心態。", law: "投信投顧事業廣告及營業活動行為規範"},
{id: "金融職業道德-14", text: "為招攬投資人從事金融商品，金融服務業從事業務廣告及製發宣傳文件時：", options: ["(1)可以引用各種推薦書、感謝函、擷取報章雜誌之報導、為保證獲利或負擔損失之類似文字或表示", "(2)可以過去之操作績效為獲利保證", "(3)內容涉及誇大不實或虛偽陳述", "(4)以上敘述皆不得為之"], ans: 4, note: "金融廣告禁止保證獲利、禁止引用推薦函、禁止誇大不實。", law: "證券投資信託及顧問法"},
{id: "金融職業道德-15", text: "證券商之業務人員平常執行業務，下列敘述何者為正確？", options: ["(1)基於業務之便，可以任意調閱客戶資料", "(2)工作時無意間看見公司機密，基於服務客戶與利益共享，於是與客戶分享", "(3)關於客戶的基本資料或買賣證券資料，基於職業道德之保密原則，不對外洩漏", "(4)為了業務需要，業務人員可以自行製作誇大績效的文宣，以吸引並招攬客戶"], ans: 3, note: "保密原則是金融從業人員的基本職業道德。", law: "個人資料保護法/證券商管理規則"},
{id: "金融職業道德-16", text: "證券商從事證券相關的金融業務廣告或公開舉辦投資理財活動，下列何者符合規定？", options: ["(1)於廣告或活動資料中，僅揭示對公司本身有利之事項", "(2)利用傳播媒體從事金融商品販賣，私下自己卻反向操作", "(3)業務人員需盡量提供客戶完整且客觀的資訊，不得為了本身業績而作出傷害客戶的行為", "(4)直接推薦或勸誘客戶投資買賣個別金融商品"], ans: 3, note: "應提供客觀資訊，不得誤導或傷害客戶權益。直接勸誘買賣個股可能涉及非法投顧。", law: "證券商管理規則"},
{id: "金融職業道德-17", text: "證券商之業務人員從事業務招攬，下列何者為錯誤的業務招攬行為? ", options: ["(1)不得對過去投資分析之績效作誇大不實之宣傳", "(2)任意提供主觀性之投資情報", "(3)對有價證券之募集，不得提供未來投資成果之預告", "(4)不得對不特定人以收取不相當之對價參加理財投資分析活動，以招攬客戶"], ans: 2, note: "提供主觀且無依據的投資情報會誤導投資人，屬錯誤行為。", law: "證券商負責人與業務人員管理規則"},
{id: "金融職業道德-18", text: "證券商之業務人員辦理客戶開戶及徵信時，應該抱持何種態度？", options: ["(1)由於客戶與自己存在親戚關係，所以審查過程可以盡量寬鬆", "(2)由於客戶與自己有過節，所以採取嚴格的態度", "(3)為了提高客戶投資的意願，因此，本身可以代替其填全部資料，以省去作業程序", "(4)以上皆非"], ans: 4, note: "徵信應公正客觀，不可因親疏而寬嚴不一，亦不可代客填寫資料。", law: "證券商辦理徵信作業準則"},
{id: "金融職業道德-19", text: "證券商之業務人員招攬業務時，應該如何做，才能提高本身的業績？", options: ["(1)自己掏錢買禮物送給客戶", "(2)勤練話術，以博取客戶的信任", "(3)培養本身的專業，以專業與誠心來面對及服務客戶", "(4)提供上市上櫃公司內線消息給客戶"], ans: 3, note: "專業與誠信是業務長久經營的基礎。內線消息違法，送禮與話術非核心價值。", law: "職業道德規範"},
{id: "金融職業道德-20", text: "依證券交易法規定，證券商非加入同業公會不得開業，而加入證券商同業公會必須簽屬會員自律公約並承諾共同信守之。下列何者是屬於證券商會員應共同信守的基本要求？", options: ["(1)不得有破壞同業共同利益之情事", "(2)不得有破壞同業信譽之情事", "(3)不得以不當之方法直接或間接阻礙其他會員之業務發展或參與公平之競爭", "(4)以上皆是"], ans: 4, note: "公會自律公約旨在維護同業間的公平競爭與信譽。", law: "證券商同業公會會員自律公約"},
{id: "金融職業道德-21", text: "為促進證券業遵循法規及落實金融消費者保護，下列何者為證券經紀商及其業務人推介客戶買賣有價證券公平對待客戶之正確作法?", options: ["(1)考慮客戶之資金及收取佣金多寡", "(2)視向客戶收取佣金之多寡，依客戶委託資金規劃投資策略", "(3)應先評估客戶之投資能力及具備合理之資訊，並不得保證所推介有價證券之價值", "(4)使用特定利益或不實廣告利誘客戶購買不符客戶適切性的有價證券"], ans: 3, note: "此為「適合度原則」(Suitability) 之體現，需評估客戶能力且不保證價值。", law: "金融消費者保護法"},
{id: "金融職業道德-22", text: "證券商於開業前需加入證券商同業公會並簽署會員自律公約，下列何者是屬於證券商會員應共同信守的基本要求？", options: ["(1)不得以不當之方法直接或間接阻礙其他會員之業務發展或參與公平之競爭", "(2)為取得競爭優勢，不擇手段向同業大量挖角", "(3)為爭業績，採取不合理、不正當之價格競爭行為", "(4)為顧及同業和諧，對同業之違規行為，即使知情，亦不應主動檢舉"], ans: 1, note: "維護公平競爭是自律公約的核心，惡性挖角、價格戰或包庇違規皆違反公約。", law: "證券商同業公會會員自律公約"},
{id: "金融職業道德-23", text: "證券商之從業人員應該如何充實自己，以建立「證券專業」的形象，並以專業服務客戶？", options: ["(1)藉由培養閱讀專業報章雜誌的習慣、參加相關專業的教育訓練、取得專業證照，以充實自己的專業知識", "(2)多加利用自己本身獲取的內線消息，幫助客戶賺錢", "(3)以贈品來博取客戶對自己的好感", "(4)善用自己本身的人情攻勢，來行銷商品"], ans: 1, note: "專業來自知識的累積與訓練。內線消息違法，贈品與人情非專業表現。", law: "職業道德規範"},
{id: "金融職業道德-24", text: "證券商從事廣告、業務招攬及營業促銷活動，下列何者為正確？", options: ["(1)應依社會一般道德、誠實信用原則", "(2)應依保護投資人之精神", "(3)應維持公正之證券交易市場", "(4)以上皆是"], ans: 4, note: "廣告與招攬應符合誠信、保護投資人及維護市場公正。", law: "證券商管理規則"},
{id: "金融職業道德-25", text: "證券商從事廣告、業務招攬及營業促銷活動，應遵守下列何種原則？", options: ["(1)所製作之廣告，應審慎考量廣告對於投資大眾之影響，以免誤導投資大眾之判斷", "(2)廣告行為應注意維持合理競爭秩序", "(3)對於上市或上櫃、興櫃個別企業營運情況介紹之廣告，應避免過度或任意作主觀上之推斷", "(4)以上皆是"], ans: 4, note: "避免誤導、維持秩序、客觀陳述是廣告規範的重點。", law: "證券商管理規則"},
{id: "金融職業道德-26", text: "證券商從事廣告、業務招攬及營業促銷活動，下列何者為正確？", options: ["(1)違背或抵觸證券法規或損害證券業信譽之廣告", "(2)冒用或使用類似大眾所熟悉之他人名號以混淆投資人", "(3)在法令規定之下，以誠實信用原則，忠實告知客戶相關商品的內容", "(4)隱匿重要事實，或其他誇大、偏頗之情事，致有誤導或欺罔投資大眾之虞"], ans: 3, note: "誠實信用與忠實告知是唯一的正確行為。其他選項皆為禁止事項。", law: "證券商管理規則"},
{id: "金融職業道德-27", text: "證券商從事廣告、業務招攬及營業促銷活動，不得有下列何種情事？", options: ["(1)對個別證券提供上漲或下跌的預示或保證投資利益", "(2)截取報章雜誌不實之報導作為廣告內容", "(3)以獲利或投資績效為廣告者，未同時報導其風險，以作為平衡報導", "(4)以上皆是"], ans: 4, note: "禁止預測個股漲跌、禁止引用不實報導、禁止僅報喜不報憂。", law: "證券商管理規則"},
{id: "金融職業道德-28", text: "證券商及其業務人員從事有關投資型金融商品之廣告，下列敘述何者正確? ", options: ["(1)廣告中得以獲利為廣告，只要有事實或理論根據，不須同時報導其風險", "(2)未經主管機關核定的金融商品，可先行從事廣告活動測試市場", "(3)平面廣告應揭示警語，有聲廣告應以影像或聲音揭示警語", "(4)以上皆非"], ans: 3, note: "廣告必須揭示警語（風險預告）。(1)需平衡報導風險；(2)未經核准不得廣告。", law: "證券商管理規則"},
{id: "金融職業道德-29", text: "證券商從事廣告、業務招攬及營業促銷活動，不得有下列何種行為？", options: ["(1)違背或牴觸證券法規", "(2)藉主管機關核准，作為保證獲利之宣傳", "(3)為競爭目的，散布損害他人營業信譽之廣告", "(4)以上皆是"], ans: 4, note: "違法、誤導性宣傳（如藉核准保證獲利）、惡性競爭皆在禁止之列。", law: "證券商管理規則"},
{id: "金融職業道德-30", text: "證券商之業務人員使用個人部落格或網站聊天室等相關網站進行與營業活動相關之行為，證券商的態度應該如何？", options: ["(1)公司應負監督管理之責", "(2)公司不應干涉業務人員之個人行為", "(3)公司對業務人員個人行為不必負任何責任", "(4)公司應委託徵信公司偷偷監視"], ans: 1, note: "業務人員的網路行為若涉及招攬，公司有監督管理責任。", law: "證券商內部控制制度標準規範"},
{id: "金融職業道德-31", text: "金融從業人員推廣業務時，下列何種行為是錯誤的？", options: ["(1)推廣業務需考量客戶之投資風險承受度", "(2)推廣業務需了解客戶投資經驗", "(3)推廣經主管機關核准業務", "(4)推廣未經主管機關核准業務"], ans: 4, note: "推廣「未經核准」之業務是違法行為（如地下金融）。", law: "銀行法/證券交易法"},
{id: "金融職業道德-32", text: "金融從業人員推廣投資型業務時，下列何種行為是正確的？", options: ["(1)為提高客戶收益，應推薦有內線消息之明牌", "(2)推介經主管機關核准之商品", "(3)為達成業績目標，推介自己都無法了解之金融商品", "(4)雖沒有合法資格，仍然從事該項推廣業務"], ans: 2, note: "只能推介合法（經核准）的商品。推薦內線明牌、不了解商品或無照推廣皆違法。", law: "證券投資信託及顧問法"},
{id: "金融職業道德-33", text: "金融從業人員辦理充分瞭解客戶作業，以下何種態度是錯誤的？", options: ["(1)應由客戶所填資料充分知悉客戶狀況", "(2)應由客戶所填資料評估客戶狀況", "(3)請客戶隨便填一填以便歸檔備查", "(4)辦理充分瞭解客戶作業是推介商品非常重要程序"], ans: 3, note: "KYC不能流於形式，「隨便填填」無法落實適合度評估，嚴重違反職業道德與法規。", law: "洗錢防制法/金融服務業公平待客原則"},
{id: "金融職業道德-34", text: "金融從業人員辦理充分瞭解客戶作業，應充分知悉並評估客戶之狀況，下列何者為是？", options: ["(1)應充分知悉並評估客戶之投資知識及投資經驗", "(2)應充分知悉並評估客戶之財務狀況", "(3)應充分知悉並評估客戶之承受投資風險程度", "(4)以上皆是"], ans: 4, note: "KYC 包含投資知識、經驗、財務狀況及風險承受度。", law: "金融服務業確保金融商品或服務適合金融消費者辦法"},
{id: "金融職業道德-35", text: "以下何者為金融服務業向不特定多數人之銷售行為?", options: ["(1)透過發言人公佈商品內容", "(2)透過新聞稿通知媒體商品內容", "(3)於傳播媒體宣傳金融商品", "(4)以上皆是"], ans: 4, note: "透過大眾媒體或公開管道即屬向「不特定多數人」銷售或廣告。", law: "證券投資信託及顧問法"},
{id: "金融職業道德-36", text: "以下何者非為金融從業人員向不特定多數人之銷售行為？", options: ["(1)於街頭發放商品廣告DM", "(2)向已簽約客戶說明商品內容", "(3)於報章雜誌刊登商品廣告", "(4)向記者透漏商品內容並請其代為刊登"], ans: 2, note: "向「已簽約客戶」說明是針對特定人，非不特定多數人。", law: "證券投資信託及顧問法"},
{id: "金融職業道德-37", text: "金融從業人員招攬業務時，下列何種商品得以向不特定多數人銷售？", options: ["(1)經主管機關核准之公開募集金融商品", "(2)經主管機關核准之國內私募基金", "(3)信託集合管理運用帳戶", "(4)國內私募有價證券"], ans: 1, note: "「公開募集」商品才可向不特定多數人銷售；私募僅能向特定人銷售。", law: "證券交易法"},
{id: "金融職業道德-38", text: "金融從業人員招攬業務時，下列行為何者是正確的？", options: ["(1)得以電子郵件促銷未經主管機關核准的業務", "(2)得以網路向多數人推薦國內私募基金", "(3)為爭取業績，應極力推銷收益率最高的商品而避談風險", "(4)客戶簽約前應向客戶說明契約內容"], ans: 4, note: "簽約前說明內容是基本義務。(1)違法促銷；(2)私募不得公開招攬；(3)隱匿風險違法。", law: "金融消費者保護法"},
{id: "金融職業道德-39", text: "金融從業人員招攬業務時，下列行為何者不宜？", options: ["(1)說明財產之管理運用並非絕無風險", "(2)說明公司以往之經理績效無法保證最低收益", "(3)請客戶簽約前應詳閱說明書", "(4)片斷截取報章雜誌之報導作為促銷資料"], ans: 4, note: "片斷截取報導易斷章取義、誤導客戶，違反廣告規範。", law: "投信投顧事業廣告及營業活動行為規範"},
{id: "金融職業道德-40", text: "金融從業人員準備促銷資料，以下何者為是？", options: ["(1)引用數據、資料作為促銷資料內容時毋須註明出處", "(2)引用數據、資料作為促銷資料內容時故意隱匿不利客戶之資訊", "(3)促銷資料應載明公司相關資料", "(4)故意隱匿資料致誤導投資大眾或客戶"], ans: 3, note: "促銷資料應透明、正確，載明公司資料，並註明引用出處，不得隱匿。", law: "投信投顧事業廣告及營業活動行為規範"},
{id: "金融職業道德-41", text: "金融從業人員招攬業務時，下列何者不宜？", options: ["(1)作保證獲利或負擔損失之表示", "(2)以獲利招攬業務必須同時說明其風險", "(3)使用公司名稱應清楚、明確且不得誤導客戶", "(4)如涉及比較其他同業應為客觀公平之比較"], ans: 1, note: "嚴禁保證獲利或承擔損失。", law: "證券投資信託及顧問法"},
{id: "金融職業道德-42", text: "金融從業人員對於客戶開戶之相關文件，應為何種處理：", options: ["(1)可幫客戶作假", "(2)不須提供任何文件", "(3)應確實查核客戶提供相關文件之正確性", "(4)不須查證"], ans: 3, note: "開戶文件必須確實查核，防制偽造與洗錢。", law: "洗錢防制法"},
{id: "金融職業道德-43", text: "金融從業人員從事業務推廣與招攬時，應秉持之原則，下列何者為錯誤？", options: ["(1)誠實信用原則", "(2)客戶資料保密原則", "(3)利益迴避原則", "(4)利潤至高原則"], ans: 4, note: "應以客戶利益為優先，而非利潤至高（唯利是圖）。", law: "職業道德規範"},
{id: "金融職業道德-44", text: "有關金融從業人員之業務行為規範，下列何者為錯誤？", options: ["(1)應確實告知客戶之權利與義務", "(2)須與客戶簽訂相關之買賣契約書或相關文件以供日後糾紛之確認", "(3)得與客戶私自約定或提供特定利益、對價以促銷金融商品", "(4)須告知客戶買賣之金融商品可能面臨的風險與損失"], ans: 3, note: "禁止私下約定或提供不當利益（回扣）促銷。", law: "證券商負責人與業務人員管理規則"},
{id: "金融職業道德-45", text: "金融從業人員在進行商品銷售時，何者行為恰當？", options: ["(1)以個人銷售獎金之高低為依歸，隱匿該商品可能為客戶帶來之風險", "(2)未依客戶要求提供詳實充份之訊息，以誤導客戶進行較不利之商品交易", "(3)未事先告知客戶，即自行採取多種商品聯合銷售之行為", "(4)詳實告知各項商品之特性、風險與報酬"], ans: 4, note: "詳實告知是誠信原則的基本要求。", law: "金融消費者保護法"},
{id: "金融職業道德-46", text: "金融從業人員於執行業務時，下列何者為是？", options: ["(1)適時提供其他客戶相關的資料以供參考", "(2)應先向客戶收取保證金以避免客戶流失", "(3)向客戶提供有關公司之充分資料，應包括公司之營業地址、公司營業之種類與限制", "(4)為提供完善服務，儘可能保管客戶之有價證券、款項、印鑑或存摺"], ans: 3, note: "(1)洩露個資；(2)不當收取；(4)禁止保管挪用。僅(3)是正確揭露資訊。", law: "金融消費者保護法"},
{id: "金融職業道德-47", text: "在開發客戶時，下列何者行為不恰當？", options: ["(1)審慎客觀評估客戶之財務狀況", "(2)依客戶財務狀況，再推薦最適合客戶的商品", "(3)為積極開發客戶，忽略可能存在之風險", "(4)參酌客戶與其他金融機構往來的情形"], ans: 3, note: "忽略風險嚴重違反專業道德與適合度原則。", law: "金融消費者保護法"},
{id: "金融職業道德-48", text: "金融從業人員下列行為何者為非？", options: ["(1)主動提供商品相關資訊", "(2)私下接受客戶禮品及招待", "(3)寄送生日卡片", "(4)適時的電話問候"], ans: 2, note: "私下接受禮品招待可能涉及利益衝突或收受回扣，應依公司規定申報或拒絕。", law: "廉政倫理規範/公司內規"},
{id: "金融職業道德-49", text: "下列何者非為專業之金融從業人員應有之行為？", options: ["(1)提供客戶良好的服務品質", "(2)提供符合客戶需求之商品", "(3)確認並瞭解客戶之需求", "(4)以自己的利益優先考量，進而侵占客戶利益"], ans: 4, note: "客戶利益應優先，侵占更是犯罪行為。", law: "職業道德規範"},
{id: "金融職業道德-50", text: "金融從業人員向供應商或客戶建議或徵求業務時，下列何種行為是被禁止的？", options: ["(1)提出任何對等交換的建議", "(2)表示可能因為對方不接受而取消服務或業務", "(3)可能因為對方的接受而給予特別的服務或業務", "(4)以上皆是"], ans: 4, note: "不當利益交換、威脅或給予不公平待遇（差別待遇）皆被禁止。", law: "公平交易法/職業道德規範"},
{id: "金融職業道德-51", text: "金融從業人員與客戶維持良好關係，最主要的基礎是？", options: ["(1)有服務的熱誠與專業能力", "(2)經常送禮", "(3)提供內線消息", "(4)以上皆非"], ans: 1, note: "服務熱誠與專業能力是建立信賴的基礎。", law: "職業道德規範"},
{id: "金融職業道德-52", text: "金融從業人員在行銷商品時應考慮？", options: ["(1)行銷佣金或津貼較多的商品，以提高自己的收入", "(2)行銷高風險金融商品，以爭取業績", "(3)深入了解客戶需求，提供對客戶最有利最合適的商品", "(4)配合公司的營業方針，推展利潤高的商品"], ans: 3, note: "應以客戶利益與適合度為最優先考量。", law: "金融消費者保護法"},
{id: "金融職業道德-53", text: "金融從業人員提供客戶相關建議前，下列行為何者為非", options: ["(1)充分收集相關資料", "(2)審慎分析各種商品特性", "(3)無須做任何事先準備", "(4)考量客戶之經濟能力"], ans: 3, note: "專業建議需基於充分準備與分析。", law: "職業道德規範"},
{id: "金融職業道德-54", text: "金融從業人員從事業務推廣或招攬時，下列何者為非？", options: ["(1)應主動推銷", "(2)應加強服務", "(3)爲達到業績，可製作較為誇張的文宣給客戶看", "(4)態度應誠懇實在"], ans: 3, note: "文宣不得誇張不實。", law: "廣告及營業活動行為規範"},
{id: "金融職業道德-55", text: "金融從業人員行銷商品時應考慮", options: ["(1)公司的營業方針高低", "(2)顧客真正的需求", "(3)公司的獲利", "(4)自身的佣金"], ans: 2, note: "顧客需求優先。", law: "金融消費者保護法"},
{id: "金融職業道德-56", text: "金融從業人員於業務推廣與招攬時，要成為專業從業人員除須符合特定的專業技術認可外，尚須具備下列何一重要條件：", options: ["(1)崇高的道德水準", "(2)創造大量的業績", "(3)廣泛的人際關係", "(4)以上皆非"], ans: 1, note: "道德水準是專業的重要基石。", law: "職業道德規範"},
{id: "金融職業道德-57", text: "金融從業人員對於客戶於填寫相關資料時，若發現客戶有違反告知之情事應如何處理？", options: ["(1)事不關己，不要理他", "(2)即時向客戶求證其真實性", "(3)協助造假(4)自己改正"], ans: 2, note: "應求證並請客戶更正，不得協助造假或視而不見。", law: "保險法/最大誠信原則"},
{id: "金融職業道德-58", text: "金融從業人員若有發生所推薦產品與消費者需求衝突時應如何處理？", options: ["(1)以公司產品為優先", "(2)將產品說成與客戶需求相同", "(3)以客戶需求為最優先原則", "(4)以自己所獲報酬為優先考量"], ans: 3, note: "客戶需求優先，不應為了銷售而犧牲客戶利益。", law: "金融消費者保護法"},
{id: "金融職業道德-59", text: "金融從業人員從事行銷時，對於廣告文宣應遵守之規定？", options: ["(1)對過去的業績以誇大不實之方式宣導", "(2)只報導獲利而不報導風險", "(3)勸誘客戶提前解約或贖回", "(4)應以公司名義為之，其內容應經公司核可，並符合法令規定"], ans: 4, note: "文宣必須經公司核可並符合法規，不可個人私製。", law: "各類金融業招攬廣告規範"},
{id: "金融職業道德-60", text: "客戶得不到好的意見，錯買了非需要之金融商品，主要歸因於：", options: ["(1)從業人員欠缺必要的知識", "(2)從業人員欠缺專業倫理道德", "(3)客戶過於信任從業人員，未盡瞭解相關資訊內容", "(4)以上皆是"], ans: 4, note: "錯買商品通常是專業不足、道德缺失或溝通不良的綜合結果。", law: "職業道德規範"},
{id: "金融職業道德-61", text: "信用卡業務代表推廣卡片時，應遵守下列何種事項？", options: ["(1)注意服裝儀容", "(2)配帶名牌及名片且明確標示發卡機構名稱", "(3)應妥善保管申請人資料，不得挪作他用", "(4)以上皆是"], ans: 4, note: "服儀整潔、身分明確、保護個資皆為基本規範。", law: "信用卡業務機構管理辦法"},
{id: "金融職業道德-62", text: "發卡機構之行銷人員從事下列行為何者不正確？", options: ["(1)自行勾選未經客戶同意申請之卡片", "(2)確認客戶申請之卡片", "(3)確認客戶資料無誤才送件", "(4)確認客戶申請人本人身分，以免冒名申請"], ans: 1, note: "自行勾選未同意項目違反客戶意願，可能涉及偽造文書。", law: "信用卡業務機構管理辦法"},
{id: "金融職業道德-63", text: "銀行辦理現金卡業務時，下列敘述那一項是正確的？", options: ["(1)以卡辦卡", "(2)以名片辦卡", "(3)送贈品", "(4)審慎核給信用額度"], ans: 4, note: "應審慎核給額度，禁止以卡辦卡、名片辦卡或過度贈品誘導。", law: "金融機構辦理現金卡業務應注意事項"},
{id: "金融職業道德-64", text: "銀行受理開戶時，應實施雙重身分證明文件查核及留存該身分證明文件。若屬個人開戶，下列那些證件可以當作證明文件？", options: ["(1)戶口名簿", "(2)駕照", "(3)健保卡", "(4)以上皆是"], ans: 4, note: "雙證件查核中，第二證件可為戶口名簿、駕照、健保卡等。", law: "金融機構辦理國內匯款及無摺存款作業確認客戶身分原則"},
{id: "金融職業道德-65", text: "有關金融從業人員之行銷行為，下列何者有誤？", options: ["(1)應充分告知客戶產品之性質與內容", "(2)推廣文宣應清楚、公正及不誤導投資人", "(3)應遵守相關法令規定", "(4)可自行勾選未經客戶同意申請之事項"], ans: 4, note: "自行勾選未經同意事項是違規行為。", law: "金融消費者保護法"},
{id: "金融職業道德-66", text: "金融從業人員推廣業務時，應遵守下列何種事項？", options: ["(1)注意服裝儀容", "(2)配帶明確標示公司名稱之名牌及名片", "(3)應妥善保管申請人資料，不得挪作他用", "(4)以上皆是"], ans: 4, note: "專業形象、身分表明、個資保護缺一不可。", law: "職業道德規範"},
{id: "金融職業道德-67", text: "金融從業人員辦理授信案件時，應於何時辦理徵信？", options: ["(1)視客戶交情而定", "(2)應於核貸前先辦理徵信", "(3)不需辦理徵信", "(4)視客戶是否提供酬謝金而定"], ans: 2, note: "徵信是授信的基礎，必須在核貸「前」辦理。", law: "銀行法/授信準則"},
{id: "金融職業道德-68", text: "金融從業人員執行業務時，不應有下列何種行為？", options: ["(1)登載損害同業信譽之廣告", "(2)故意毀損同業之申請書架", "(3)故意破壞同業之各項宣傳品", "(4)以上皆是"], ans: 4, note: "惡意攻擊或破壞同業屬不正當競爭。", law: "公平交易法"},
{id: "金融職業道德-69", text: "金融從業人員執行業務時，下列陳述何者為非？", options: ["(1)與客戶洽談應保持懇切之態度", "(2)應秉持公正客觀立場審查", "(3)可使用類似大眾所熟悉之他人商標，以混淆客戶", "(4)充分告知客戶應徵提之資料"], ans: 3, note: "使用他人商標混淆視聽是違反商標法及公平交易法的行為。", law: "公平交易法"},
{id: "金融職業道德-70", text: "登載及製播廣告，應注意下列何款行為？", options: ["(1)避免誤導消費者不正確之價值及理財觀念", "(2)廣告應清楚、公正", "(3)不得使用類似大眾所熟悉之他人商標，以混淆消費者", "(4)以上皆是"], ans: 4, note: "廣告應真實、公正、不誤導。", law: "金融服務業廣告規範"},
{id: "金融職業道德-71", text: "金融服務業製播廣告，不得有下列何種行為？", options: ["(1)損害其他同業信譽之廣告", "(2)使用類似大眾所熟悉之他人商標，以混淆消費者", "(3)誤導消費者不正確之價值及理財觀念", "(4)以上皆是"], ans: 4, note: "損害同業、仿冒商標、誤導觀念皆禁止。", law: "金融服務業廣告規範"},
{id: "金融職業道德-72", text: "銀行受理開戶時，下列何者為非？", options: ["(1)應核對開戶人確為本人", "(2)由開戶人依約定當面親自簽名或蓋章", "(3)留存開戶人身分證影本", "(4)自行勾選未經客戶同意申請之事項"], ans: 4, note: "開戶須由本人親辦，不得代客擅自勾選。", law: "銀行開戶作業規定"},
{id: "金融職業道德-73", text: "有關金融從業人員之業務推廣文宣，下列何者為是？", options: ["(1)推廣文宣應清楚、公正及不誤導投資人", "(2)推廣文宣應讓投資人能適當瞭解產品所涉風險", "(3)推廣文宣應避免誤導消費者不正確之價值及理財觀念", "(4)以上皆是"], ans: 4, note: "清楚、公正、風險揭露、觀念正確是文宣四大原則。", law: "金融服務業廣告規範"},
{id: "金融職業道德-74", text: "一位投顧從業人員告訴投資人：「你應該買台鹽股票，這支股票保證六個月內給你100％的報酬。」他違反了以下哪一原則？", options: ["(1)禁止為獲利或損失負擔之保證", "(2)公平分配原則", "(3)忠實誠信原則", "(4)專業原則"], ans: 1, note: "投顧人員不得保證獲利。", law: "證券投資信託及顧問法"},
{id: "金融職業道德-75", text: "關於金融服務業從事投顧業務製發宣傳文件敘述，何者有誤？", options: ["(1)不得保證獲利或負擔損失", "(2)以非向公會登記之名稱為之", "(3)不得藉卜筮或怪力亂神方式為之", "(4)不得擾亂交易市場秩序"], ans: 2, note: "必須使用向主管機關或公會登記的正式名稱。", law: "證券投資顧問事業管理規則"},
{id: "金融職業道德-76", text: "金融服務業從事投顧業務時舉辦投資說明會時，若發表證券市場之投資意見涉及何種事項時應同時說明研判依據？", options: ["(1)市場分析", "(2)產業趨勢", "(3)行情研判", "(4)以上皆是"], ans: 4, note: "發表分析意見須有合理依據。", law: "證券投資顧問事業負責人與業務人員管理規則"},
{id: "金融職業道德-77", text: "金融從業人員於舉辦投顧業務投資分析活動時，可引用何者宣傳，保證推介投資標的獲利或承擔其損失？", options: ["(1)感謝函", "(2)雜誌報導", "(3)推薦書", "(4)以上皆非"], ans: 4, note: "嚴禁保證獲利，亦不得引用感謝函、推薦書來暗示保證獲利。", law: "證券投資信託及顧問法"},
{id: "金融職業道德-78", text: "金融服務業從事投信業務者，廣告宣傳方式，包括下列何者？(I) 投資說明書(II) 公開說明書(III) 傳單(IV) 電子郵件", options: ["(1)I、II", "(2)II、III、IV", "(3)I、II、IV", "(4)I、II、III、IV"], ans: 4, note: "凡是用於促進業務的傳播方式皆屬廣告宣傳。", law: "投信投顧事業廣告及營業活動行為規範"},
{id: "金融職業道德-79", text: "以下金融從業人員從事投信投顧之業務推廣與招攬行為，哪一項是明顯地違反所謂「公平競爭原則」？", options: ["(1)提供客戶基金申購手續費優惠來促銷新基金", "(2)散佈同業之不實資料", "(3)提供客戶有關同業與自己公司類似產品及手續費或經理費費率差異比較表", "(4)以上皆是"], ans: 2, note: "散佈不實資料攻擊同業違反公平競爭。", law: "公平交易法"},
{id: "金融職業道德-80", text: "金融服務業從事投信投顧之業務推廣招攬行為，下列何者不需標示警語？", options: ["(1)基金產品廣告", "(2)全權委託投資業務廣告", "(3)單純登載投資管理專門知識", "(4)以上皆非"], ans: 3, note: "單純知識分享不涉及商品推介，可免標示警語。", law: "投信投顧事業廣告及營業活動行為規範"},
{id: "金融職業道德-81", text: "下列何者不是境外基金投資人須知第一部份基金專屬資訊應涵蓋內容？", options: ["(1)基金運用狀況（如基金淨資產組成、最近十年度各年度基金報酬率、最近五年度各年度基金之費用率等）", "(2)基金基本資料（如基金名稱、基金成立日、基金型態、國內銷售金級別等）", "(3)有關申購、買回及轉換境外基金之方式", "(4)投資人應負擔費用之項目及其計算方式（含經理費、保管費、反稀釋費用等）"], ans: 3, note: "申購、買回及轉換方式屬於「一般資訊」，非「基金專屬資訊」。(依據境外基金投資人須知範本分類)", law: "境外基金管理辦法"},
{id: "金融職業道德-82", text: "依境外基金投資人須知第二部分規定，投資人因境外基金之募集及銷售業務與境外基金總代理人或銷售機構發生爭議時得以下列何種方式尋求協助？", options: ["(1)向金管會或中華民國證券投資信託暨顧問商業同業公會申訴", "(2)向證券投資人及期貨交易人保護中心申請調處", "(3)向財團法人金融消費評議中心申請評議", "(4)以上皆是"], ans: 4, note: "投資人可透過申訴、調處、評議等多元管道尋求協助。", law: "金融消費者保護法/投保法"},
{id: "金融職業道德-83", text: "金融服務業從事投顧業務舉辦投資講習會，應遵守那些原則？", options: ["(1)不提供涉及個股未來買賣價位研判", "(2)不散布誇大資料取信他人", "(3)不對不特定人涉及指數預期", "(4)以上皆是"], ans: 4, note: "講習會應客觀分析，不得預測價位或誇大。", law: "證券投資顧問事業負責人與業務人員管理規則"},
{id: "金融職業道德-84", text: "下列哪些金融從業人員從事投信投顧之業務推廣與招攬行為是明顯地違反所謂「公開原則」？(I) 向客戶說明與分析產品特性與報酬率，但相關風險、提前贖回罰金及費用成本卻一概省略；(II) 向客戶說明與分析產品特性；(III) 向客戶說明與分析產品特性，並強調如投資該產品得享有稅負上優惠，卻不仔細說明是基於何種理由及內容，始得享有是項優惠。", options: ["(1)I, II", "(2)II, III", "(3)I, III", "(4)I, II, III"], ans: 3, note: "隱匿風險、費用或稅負條件，即違反資訊公開透明原則。", law: "證券投資信託及顧問法"},
{id: "金融職業道德-85", text: "財神證券投資信託(股)公司發行之本國募集投資海外之證券投資信託基金，廣告宣傳可用下列何種方式？", options: ["(1)刊登從成立以來的全部績效資料", "(2)宣稱該區域經濟穩定成長，是絕對安全、無風險的投資環境", "(3)預計年投資報酬率可以達15%以上", "(4)預測新台幣未來還會貶值"], ans: 1, note: "揭露績效應完整；不可宣稱無風險、不可預測報酬率、不可臆測匯率。", law: "投信投顧事業廣告及營業活動行為規範"},
{id: "金融職業道德-86", text: "欣欣證券投資信託(股)公司如擬於平面刊登廣告，其警語表示方式應注意以下哪幾點？", options: ["(1)以粗體印刷顯著標示", "(2)不得小於廣告上其他部分之最小字體", "(3)一般人在快速閱覽相關廣告時，均顯而易見", "(4)以上皆是"], ans: 4, note: "警語必須顯著、清晰。", law: "投信投顧事業廣告及營業活動行為規範"},
{id: "金融職業道德-87", text: "下列有關證券投資信託事業以基金績效和業績數字為廣告或促銷內容之敘述，何者為非？", options: ["(1)保本型基金如須採用複雜計算機制者，可無須註明", "(2)任何基金績效及業績數字均需註明使用資料之來源和日期", "(3)不得為基金投資績效預測", "(4)成立滿三年的基金，應以最近三年全部績效為圖表或曲線表示"], ans: 1, note: "保本型基金若機制複雜，必須清楚註明，不可省略。", law: "投信投顧事業廣告及營業活動行為規範"},
{id: "金融職業道德-88", text: "大大證券投資信託(股)公司擬企劃廣告活動，下列何者非可引用之資料來源？", options: ["(1)財團法人中華民國證券暨期貨市場發展基金會評選之金彝獎", "(2)台北金融研究發展基金會評選之金鑽獎", "(3)嘉實資訊", "(4)網路部落格"], ans: 4, note: "引用資料須具公信力，網路部落格非具公信力之來源。", law: "投信投顧事業廣告及營業活動行為規範"},
{id: "金融職業道德-89", text: "有關會員及其銷售機構從事廣告及營業活動行為規範所稱之「廣告」，何項敘述不正確？", options: ["(1)以促進業務為目的", "(2)發佈新聞稿", "(3)基金收益分配公告", "(4)運用傳播媒體為工具"], ans: 3, note: "基金收益分配公告是法定的事實公告，非促銷性質的廣告。", law: "投信投顧事業廣告及營業活動行為規範"},
{id: "金融職業道德-90", text: "下列何者為不當的私募基金業務行為？", options: ["(1)向銀行業者進行私募", "(2)向一般投資人進行私募", "(3)不得進行一般型廣告", "(4)向金融控股公司進行私募"], ans: 2, note: "私募對象限制為特定人（如銀行、專業法人或符合財力之自然人），不得向「一般」不特定投資人私募。", law: "證券投資信託及顧問法"},
{id: "金融職業道德-91", text: "下列何者不是證券投信公司的基金銷售機構？", options: ["(1)票券業", "(2)證券經紀商", "(3)人身保險業", "(4)銀行"], ans: 1, note: "票券業非基金銷售機構。", law: "證券投資信託基金募集發行銷售及其申購或買回作業程序"},
{id: "金融職業道德-92", text: "證券投資信託基金銷售機構的責任包括？", options: ["(1)應充分知悉客戶之風險承受度", "(2)完成申購前交付簡式公開說明書", "(3)注意客戶疑似洗錢之行為", "(4)以上皆是"], ans: 4, note: "銷售機構需負責KYC、交付說明書及防制洗錢。", law: "證券投資信託基金銷售機構管理規則"},
{id: "金融職業道德-93", text: "何者非選擇基金公司的重要條件？", options: ["(1)投資研究能力強", "(2)良好的聲譽與操守", "(3)經常於媒體曝光", "(4)基金績效佳"], ans: 3, note: "媒體曝光率高不代表公司品質好，應重實質能力與操守。", law: "投資學/理財規劃"},
{id: "金融職業道德-94", text: "金融從業人員於登錄後，應於期滿前辦妥換發登錄證手續，未辦妥前不得為保險之招攬。下列何者為登錄證之有效期間？", options: ["(1)2 年", "(2)3 年", "(3)4 年", "(4)5 年"], ans: 4, note: "保險業務員登錄證有效期間為5年。", law: "保險業務員管理規則"},
{id: "金融職業道德-95", text: "保險經紀人，應基於下列何者利益，代向保險人洽訂保險契約？", options: ["(1)要保人", "(2)被保險人", "(3)受益人", "(4)保險人"], ans: 2, note: "保險法定義：保險經紀人係基於「被保險人」之利益。", law: "保險法第9條"},
{id: "金融職業道德-96", text: "金融從業人員從事保險業務招攬行為所生之損害，其應與誰負連帶賠償責任？", options: ["(1)自己", "(2)所屬公司", "(3)介紹人", "(4)以上皆是"], ans: 2, note: "所屬公司對業務員招攬行為負連帶責任。", law: "保險業務員管理規則"},
{id: "金融職業道德-97", text: "金融從業人員從事保險業務招攬時依法有何義務？A.應出示登錄證B.應告知授權範圍C.提供名片", options: ["(1)AC", "(2)AB", "(3)BC", "(4)ABC"], ans: 2, note: "法定義務為出示登錄證及告知授權範圍。提供名片雖常見但非核心法定強制義務。", law: "保險業務員管理規則"},
{id: "金融職業道德-98", text: "客戶投保傷害險後由公務員退休轉為從事建築臨時工維生，金融從業人員得知後應如何正確處理？", options: ["(1)與保險無關不必理會", "(2)工作辛苦危險，應規勸另覓良職", "(3)立即要求客戶向保險公司提出工作變更批改申請", "(4)立即請客戶退保"], ans: 3, note: "職業變更影響傷害險費率與風險，應通知保險公司辦理變更。", law: "保險法第59條"},
{id: "金融職業道德-99", text: "客戶投保後提出終止保險契約之申請，金融從業人員應如何正確處理？", options: ["(1)提出違約之告訴", "(2)可拒絕之", "(3)從業人員僅從事招攬工作，故不在服務範圍之內", "(4)強制汽車責任保險除有法定原因外，不得終止契約，其他保險則應儘力解說保險重要，如仍欲終止，應同意並協助辦理"], ans: 4, note: "除強保法限制外，客戶有權終止契約，業務員應予以協助。", law: "保險法/強制汽車責任保險法"},
{id: "金融職業道德-100", text: "客戶投保住宅火險後，為增加收入而將客廳兼營火鍋小吃店，金融從業人員得知後應如何正確處理？", options: ["(1)客戶仍有居住事實，故不影響", "(2)立即要求客戶向保險公司提出使用性質變更批改申請", "(3)投保當時是住宅，故只能等到保險契約到期後再說", "(4)當作不知而不處理，因不知者無罪"], ans: 2, note: "使用性質變更（住宅變商業）增加風險，應通知保險公司。", law: "保險法第59條"},
{id: "金融職業道德-101", text: "以下何者是根據契約或授權書，向保險公司收取費用，並代理經營業務之金融從業人員？", options: ["(1)保險經紀人", "(2)保險公證人", "(3)保險代理人", "(4)以上皆是"], ans: 3, note: "代理人是代理保險公司；經紀人是代表被保險人；公證人是查勘理算。", law: "保險法第8條"},
{id: "金融職業道德-102", text: "以下何者為不得從事保險業招攬之金融從業人員？", options: ["(1)保險業務員", "(2)保險公證人", "(3)保險代理人", "(4)保險經紀人"], ans: 2, note: "保險公證人負責理賠公證，不得從事招攬。", law: "保險法"},
{id: "金融職業道德-103", text: "曉華有一筆定存到期，想要運用從事期貨交易，但礙於常常出差無法注意行情變化，金融從業人員可以：", options: ["(1)建議她僅買選擇權，最多損失權利金", "(2)建議她授權給其他營業員代理下單交易", "(3)建議她找合法的期經公司代操", "(4)建議並介紹她授權給期貨作手"], ans: 3, note: "代客操作（全權委託）必須找合法的期貨經理事業。", law: "期貨經理事業管理規則"},
{id: "金融職業道德-104", text: "金融從業人員於執行業務時，下列敘述何者較適當：", options: ["(1)以大戶為優先服務的對象，其他客戶有時間再受理", "(2)了解你的客戶，對於不適合的客戶應拒絕之", "(3)損及客戶權益之事項如為客戶授權，仍應忠實執行不需要告知交易風險", "(4)為牟取客戶最大利益，經紀商可逕行為客戶設定獲利、停損點"], ans: 2, note: "KYC與適合度原則要求拒絕不適合的客戶。", law: "金融消費者保護法"},
{id: "金融職業道德-105", text: "金融從業人員受託買賣時應依下列何者確實迅速執行：", options: ["(1)依客戶全年貢獻額之多寡為執行優先順序", "(2)依客戶委託時間之先後為執行優先順序", "(3)依客戶交易金額之大小為執行優先順序", "(4)以現場客戶為優先，餘依委託時間之先後為執行優先順序"], ans: 2, note: "公平對待原則要求依時間先後順序執行。", law: "證券商管理規則"},
{id: "金融職業道德-106", text: "金融從業人員於受理客戶買賣時：", options: ["(1)不可以有進行對作或跟單之行為", "(2)同意客戶不需要出具授權書，可以提供帳戶供他人使用", "(3)為規避繳稅，提供自己或他人帳戶供客戶使用", "(4)為牟取客戶最大利益，逕行為客戶設定獲利、停損點"], ans: 1, note: "禁止對作（Bucketing）與跟單。", law: "證券/期貨交易法"},
{id: "金融職業道德-107", text: "金融從業人員當知悉客戶有操縱金融市場之意圖時：", options: ["(1)仍可接受其委託進行金融商品交易", "(2)不可接受其委託進行金融商品交易", "(3)有條件地接受其委託進行金融商品交易", "(4)經主管同意即可接受其委託進行金融商品交易"], ans: 2, note: "操縱市場違法，從業人員應拒絕配合。", law: "證券交易法"},
{id: "金融職業道德-108", text: "當知悉客戶是利用他人名義而無授權書時，從事金融商品交易：", options: ["(1)如果客戶承諾補具授權書，可先接受其委託進行金融商品交易", "(2)應拒絕接受其委託進行金融商品交易", "(3)有條件地接受其委託進行金融商品交易", "(4)報經主管同意，即可接受其委託進行金融商品交易"], ans: 2, note: "禁止利用他人名義交易，無授權書更應拒絕。", law: "洗錢防制法/證券商管理規則"},
{id: "金融職業道德-109", text: "喬大公司為做期貨避險，找上金融從業人員開戶買賣，下列何者為是：", options: ["(1)法人不需徵信", "(2)因為期貨交易為保證金交易，不需徵信", "(3)不論證券或期貨等，業務員受託前應先對客戶辦理徵信，了解客戶背景", "(4)客戶交易目的為避險，就不需再徵信"], ans: 3, note: "所有客戶開戶前皆需徵信。", law: "期貨商管理規則"},
{id: "金融職業道德-110", text: "張三的客戶因期貨交易失利，決定全數出金，張三應如何交付客戶剩餘的權利金：", options: ["(1)以轉帳方式撥款至與客戶書面約定之存款帳戶", "(2)以轉帳方式撥款至客戶來電時指示之存款帳戶", "(3)以現金方式請客戶親臨期貨商簽收確認", "(4)以支票禁背方式請客戶親臨期貨商簽收確認"], ans: 1, note: "出金必須撥入原約定帳戶，不可隨意變更。", law: "期貨商管理規則"},
{id: "金融職業道德-111", text: "如客戶對金融商品無交易意願，金融從業人員為業績考量應：", options: ["(1)將其從客戶名單刪除，不再提供服務", "(2)了解客戶的需求，找尋適合客戶的商品", "(3)與客戶約定損失共同承擔，勸誘交易", "(4)將客戶轉由其他從業人員服務"], ans: 2, note: "應以客戶需求為導向，而非強推。", law: "金融消費者保護法"},
{id: "金融職業道德-112", text: "證券商之業務人員從事法令規定證券業務所為之行為，下列敘述何者為正確？", options: ["(1)證券商之業務人員所為之行為屬於該業務人員個人之行為，與證券商無關", "(2)證券商之業務人員所為之行為不屬於該證券商授權範圍內之行為", "(3)證券商之業務人員所為之行為，視為該證券商授權範圍內之行為", "(4)證券商之業務人員所為之行為是否為該證券商授權範圍，應由法院判定"], ans: 3, note: "業務人員執行職務行為視為公司授權，公司需負連帶責任。", law: "證券交易法"},
{id: "金融職業道德-113", text: "關於證券商及其業務人員從事證券業務之行為，下列何者為正確？", options: ["(1)為提供客戶完整之服務，替委任人客戶保管印鑑與存摺", "(2)同意他人使用第三者之名義執行業務", "(3)與委任人客戶為投資金融商品收益共享或損失分擔之約定", "(4)以上皆非"], ans: 4, note: "(1)(2)(3)皆為禁止事項。", law: "證券商負責人與業務人員管理規則"},
{id: "金融職業道德-114", text: "關於證券商及其業務人員從事證券業務之行為，下列何者為正確？", options: ["(1)與委任人客戶為投資商品標的收益共享或損失分擔之約定", "(2)以真實姓名為客戶提供市場分析資訊", "(3)與委任人客戶有金錢借貸的來往", "(4)反向買賣其推介予客戶之金融商品"], ans: 2, note: "提供資訊應具名負責；其他選項皆違規。", law: "證券商負責人與業務人員管理規則"},
{id: "金融職業道德-115", text: "證券商受託買賣非集中交易市場且具衍生性商品性質之外國有價證券時，應確認及注意何種事項？", options: ["(1)應了解委託人客戶之所得與資金來源、風險偏好及投資目的與需求等，以確認其足以承擔該商品之相關風險", "(2)不得受理非專業投資人委託買賣超過其適合等級之商品", "(3)考量商品之特性、保本程度、商品設計之複雜度、投資地區市場風險、及商品期限等事項，將商品至少分為三個風險等級", "(4)以上皆是"], ans: 4, note: "複雜商品需落實KYC、KYP（認識產品）及分級管理。", law: "證券商受託買賣外國有價證券管理規則"},
{id: "金融職業道德-116", text: "證券商經營營業處所衍生性金融商品業務，為提昇交易業務品質，並確保交易相對人權益，下列證券商的行為何者為正確？", options: ["(1)交易相對人應承擔各種風險，證券商提供各種等級之商品供客戶選擇", "(2)交易相對人自行決定及承擔風險，不必預告商品之險", "(3)應依據個別衍生性金融商品交易之風險特性、設計複雜度及期限等因素，評定其風險等級", "(4)各種客戶皆可為交易相對人，開完戶即可提供衍生性金融商品供客戶選擇"], ans: 3, note: "必須評定商品風險等級，並匹配客戶屬性。", law: "證券商辦理衍生性金融商品業務規範"},
{id: "金融職業道德-117", text: "證券商經營營業處所衍生性金融商品交易業務，為提昇其交易業務品質，並確保交易相對人權益，下列證券商的行為何者為正確？", options: ["(1)所有證券商從業人員皆可推薦衍生性金融商品給客戶", "(2)不得對其商品說明書等行銷文件誇大報酬或隱匿相關交易風險", "(3)隨時報告其交易帳戶的資產增減的狀態", "(4)不必對一般資深客戶進行評估"], ans: 2, note: "不得誇大報酬或隱匿風險。人員需具資格，客戶需評估。", law: "證券商辦理衍生性金融商品業務規範"},
{id: "金融職業道德-118", text: "依現行法令規定，證券商辦理財富管理業務，提供接受高淨值客戶執行資產配置之服務，是基於何種法律關係及基礎辦理此項業務？", options: ["(1)以信託方式辦理", "(2)以相互信任方式辦理", "(3)完全依客戶指示方式辦理", "(4)任由業務人員自由決定方式辦理"], ans: 1, note: "財富管理業務中之資產配置服務，多以信託架構進行。", law: "證券商辦理財富管理業務應注意事項"},
{id: "金融職業道德-119", text: "證券經紀商接受委託人客戶開戶及委託買賣有價證券，下列敘述何者為正確？", options: ["(1)任何委託人客戶皆可接受其開戶並買賣有價證券", "(2)必須先與委託人客戶辦妥受託契約及開戶相關手續，才可接受其委託買賣有價證券", "(3)接受委託人客戶訂立委託契約及受託買賣，得由未登記合格之負責人、經理人及業務人員承辦之", "(4)可代替委託人客戶決定下單買賣有價證券"], ans: 2, note: "先開戶簽約，後受理交易。承辦人須合格。", law: "證券商管理規則"},
{id: "金融職業道德-120", text: "證券商辦理客戶開戶買賣有價證券，要注意事項為何？", options: ["(1)與客戶簽訂受託買賣有價證券契約並辦妥開戶手續", "(2)應指派專人作契約內容之說明及有關證券買賣程序之講解", "(3)對客戶辦理徵信並詳實評估客戶的投資能力", "(4)以上皆是"], ans: 4, note: "開戶、說明、徵信缺一不可。", law: "證券商管理規則"},
{id: "金融職業道德-121", text: "證券商之業務人員接受客戶委託買賣有價證券，應注意是否有涉及違法洗錢情事，下列何者為不正常的交易態樣？", options: ["(1)由同一客戶代替或透過多個其他客戶名義或帳戶執行買賣", "(2)由客戶本人親自用電話委託買賣", "(3)客戶在營業場所當面委託買進或賣出", "(4)客戶自行以電子下單系統下單委託買賣"], ans: 1, note: "一人操控多戶是典型的疑似洗錢或炒作態樣。", law: "洗錢防制法"},
{id: "金融職業道德-122", text: "金融從業人員與客戶以簽約方式受託執行業務，以下何者為是？", options: ["(1)應依主管口頭指示辦理", "(2)應依業務績效考量辦理", "(3)應依與客戶簽訂契約之本旨辦理", "(4)應依公司之最大利益辦理"], ans: 3, note: "應依「契約本旨」辦理，保障客戶權益。", law: "民法/金融法規"},
{id: "金融職業道德-123", text: "金融從業人員與客戶以簽約方式受託執行業務，以下何者為是？", options: ["(1)應依契約所定運用範圍執行投資或交易", "(2)雖非為契約約定投資範圍，應爭取市場先機先行投資", "(3)如違反契約約定，應經客戶口頭同意才可執行", "(4)如逾越契約運用範圍得於事後通知客戶"], ans: 1, note: "必須嚴格遵守契約約定的範圍。", law: "證券投資信託及顧問法"},
{id: "金融職業道德-124", text: "金融從業人員與客戶訂定契約內容，以下何者為是？", options: ["(1)無論是否違法，應依客戶需求訂定契約", "(2)契約內容不得違反主管機關業務相關規定", "(3)為爭取考績，契約內容應完全依照主管要求", "(4)無論是否違法，為達到業績要求應說服客戶簽約"], ans: 2, note: "契約不得違法。", law: "民法/金融法規"},
{id: "金融職業道德-125", text: "金融從業人員受託管理運用財產時，以下何者為是？", options: ["(1)應依相關規定登記財產", "(2)財產應登記於從業人員名下", "(3)財產應登記於主管名下", "(4)財產應登記於公司名下"], ans: 1, note: "財產應依規定登記（如信託財產應登記為信託財產），不可登記在個人名下。", law: "信託法"},
{id: "金融職業道德-126", text: "金融從業人員受託執行業務時所應秉持之原則，以下何者是錯誤？", options: ["(1)應以達成主管交付業績目標為優先原則", "(2)應盡善良管理人注意義務", "(3)應以專業及謹慎態度處理事務", "(4)應忠實執行業務"], ans: 1, note: "應以客戶利益與法規為優先，非業績目標。", law: "職業道德規範"},
{id: "金融職業道德-127", text: "金融從業人員受託管理運用財產時，以下何者為非？", options: ["(1)將客戶之存款移轉至員工存款以提高收益率", "(2)挪用客戶之資金以補足其他客戶之交易損失", "(3)未經客戶同意以客戶之資產提供作為交易保證金", "(4)以上皆是"], ans: 4, note: "挪用、私自移轉、未經同意設質皆為重大違規。", law: "銀行法/刑法"},
{id: "金融職業道德-128", text: "金融從業人員受託管理運用財產時，以下何者為是？", options: ["(1)應與自有財產共同管理", "(2)應與自有財產分別管理", "(3)應與自有財產共同記帳", "(4)應將較有利交易價格給自有財產"], ans: 2, note: "受託財產與自有財產應「分別管理」，避免混同與利益衝突。", law: "信託法"},
{id: "金融職業道德-129", text: "金融從業人員受託執行業務時，應如何紀錄客戶資料？", options: ["(1)應就各客戶分別保存完整且正確紀錄", "(2)幫助客戶保管存摺", "(3)由稽核人員抽寄對帳單，再與客戶對帳", "(4)以上皆非"], ans: 1, note: "保存完整紀錄是基本義務。", law: "證券商管理規則"},
{id: "金融職業道德-130", text: "金融從業人員受客戶委託從事投資時，不得有以下何種行為？", options: ["(1)故意誤導客戶所投資運用標的之風險", "(2)對投資產品之價值故意為錯誤之記錄", "(3)故意誤導受益人有關所投資運用商品應收取之費用", "(4)以上皆是"], ans: 4, note: "誤導風險、價值、費用皆屬欺罔行為。", law: "金融消費者保護法"},
{id: "金融職業道德-131", text: "金融從業人員受客戶委託執行業務，以下何種行為不正確？", options: ["(1)為客戶保管存摺或存單", "(2)執行投資人員不得兼任保管投資財產(3)製作正確或適當記錄", "(4)提供存摺、存單或定期投資報告"], ans: 1, note: "禁止代客保管存摺存單。", law: "銀行法"},
{id: "金融職業道德-132", text: "金融從業人員受客戶委託執行業務，如具有投資運用決定權，不得兼任以下何種業務？", options: ["(1)兼任投資執行人員", "(2)兼任投資資產保管人員", "(3)兼任投資交割人員", "(4)以上皆是"], ans: 4, note: "決策、執行、保管、交割應職能分工，避免弊端。", law: "證券投資信託及顧問法"},
{id: "金融職業道德-133", text: "金融從業人員辦理管理運用客戶資產應如何處理會計報告？", options: ["(1)應依照主管指示作定期報告", "(2)應依照業績考量編製獲利報告", "(3)應依照契約約定及主管機關規定作定期報告", "(4)應推測客戶預期獲益率編製會計報告"], ans: 3, note: "報告應依法規與契約製作。", law: "會計法/金融法規"},
{id: "金融職業道德-134", text: "以下何者是正確的？", options: ["(1)客戶不得請求閱覽其帳戶明細", "(2)客戶不得請求對事務處理情形提供說明", "(3)經客戶請求，應於合理營業時間內對事務之處理情形提供說明", "(4)客戶財產帳冊屬於業務機密，客戶不得請求閱覽"], ans: 3, note: "客戶有權了解自身財產狀況。", law: "信託法/委任契約"},
{id: "金融職業道德-135", text: "以下何種行為是正確的？", options: ["(1)勸誘客戶以融資方式取得資金，轉為信託財產進行運用", "(2)要求客戶辦信用卡否則不與之簽信託契約", "(3)要求客戶填寫瞭解客戶作業相關資料", "(4)要求客戶與子公司開立證券戶否則無法接受委託投資"], ans: 3, note: "填寫KYC資料是正確且必要的。搭售（2、4）或勸誘融資（1）皆不當。", law: "金融消費者保護法"},
{id: "金融職業道德-136", text: "金融從業人員之職責要求，下列何者正確？", options: ["(1)只照顧自己親朋好友", "(2)只照顧行員", "(3)公平對待所有客戶，而不偏袒某一客戶", "(4)只照顧VIP 客戶"], ans: 3, note: "公平待客原則。", law: "金融服務業公平待客原則"},
{id: "金融職業道德-137", text: "金融從業人員受託執行業務時，下列何者為非？", options: ["(1)客戶利益置於公司或個人的利益之上", "(2)受託人必須揭露與客戶的利益衝突", "(3)受託人應公平對待所有客戶，不得偏袒某一客戶", "(4)受託人應以公司之利益為最高利益"], ans: 4, note: "應以「客戶利益」為優先，非公司利益。", law: "證券投資信託及顧問法"},
{id: "金融職業道德-138", text: "金融從業人員提供客戶服務並維持必要的知識及技能，此為下列何者原則？", options: ["(1)誠信原則", "(2)忠實義務原則", "(3)保密原則", "(4)專業原則"], ans: 4, note: "專業原則要求具備並維持專業能力。", law: "職業道德規範"},
{id: "金融職業道德-139", text: "辦理客戶資產或財物的保管時應依下列何項原則辦理？", options: ["(1)善良管理原則", "(2)追求利潤原則", "(3)強制公開原則", "(4)互惠原則"], ans: 1, note: "保管資產應盡善良管理人注意義務。", law: "信託法/民法"},
{id: "金融職業道德-140", text: "接受客戶受託執行之業務，何者得為之？", options: ["(1)明顯違反相關法令規定者", "(2)收受客戶酬庸，而未損及公司利益者", "(3)未經主管機關核准承辦之業務活動", "(4)符合相關法令規定，且業經主管機關核准之業務"], ans: 4, note: "僅得執行合法且經核准之業務。", law: "金融法規"},
{id: "金融職業道德-141", text: "下列何者行為有誤？", options: ["(1)將客戶私下轉介於其他同業或交易商", "(2)依公司及相關法令規範，執行客戶所託之業務", "(3)事先與客戶簽訂受託執行業務範圍之約定書", "(4)誠實告知客戶受託業務執行之結果"], ans: 1, note: "私下轉介可能涉及利益輸送或未經授權業務。", law: "職業道德規範"},
{id: "金融職業道德-142", text: "金融從業人員不應該有下列何種行為？", options: ["(1)以職務上所知悉消息，告知第三人", "(2)不得利用客戶名義或帳戶，為自己或第三人買賣", "(3)不得有隱瞞、利誘客戶之行為", "(4)接受客戶委託買賣時，不得以自己之計算為買入或賣出之相對行為"], ans: 1, note: "題目問不該有之行為，選項(1)洩密是不該有的。選項(2)(3)(4)是法規禁止事項的描述（即「不得...」是正確的規範），而(1)是直接描述錯誤行為。", law: "保密原則"},
{id: "金融職業道德-143", text: "溢收客戶新台幣壹佰元，但是已聯絡不到客戶，請問下列處置何者正確？", options: ["(1)捐給慈善機構", "(2)交給主管", "(3)充當公費", "(4)掛在帳上"], ans: 4, note: "溢收款應列帳（如其他應付款），待客戶領回，不可挪用或捐贈。", law: "會計法/內部控制制度"},
{id: "金融職業道德-144", text: "金融從業人員進行徵授信業務時，下列何者為非？", options: ["(1)徵信時須詳實審查客戶財務及信用狀況", "(2)利害關係人授信須符合法令規定", "(3)定期辦理覆審", "(4)為達成自身績效，可忽視授信客戶可能潛藏之倒帳風險"], ans: 4, note: "忽視風險將損害公司權益。", law: "銀行授信準則"},
{id: "金融職業道德-145", text: "金融從業人員於受託執行業務時，下列何者正確？", options: ["(1)盡一切可能確認並瞭解客戶的需求，如同處理自己業務一般", "(2)盡全力持守榮譽及廉潔以維護所屬公司之信譽", "(3)應遵守專業行為規範", "(4)以上皆是"], ans: 4, note: "同理心、榮譽、專業皆是應有態度。", law: "職業道德規範"},
{id: "金融職業道德-146", text: "在接受客戶委託時，應將誰的利益置於其他利益之上？", options: ["(1)委託的客戶", "(2)公司", "(3)自己", "(4)其他大客戶"], ans: 1, note: "客戶利益優先。", law: "證券投資信託及顧問法"},
{id: "金融職業道德-147", text: "金融從業人員基於職業道德應如何對待客戶，下列何者行為是不對的？", options: ["(1)公平對待所有的客戶", "(2)將客戶的利益置於公司利益或員工利益之上", "(3)將公司利益或員工利益置於客戶的利益之上", "(4)以客戶最高利益行事"], ans: 3, note: "客戶利益優先。", law: "職業道德規範"},
{id: "金融職業道德-148", text: "下列何者屬善良管理人之原則？", options: ["(1)為客戶適度分散投資風險", "(2)集中購買單一投資商品", "(3)以高獲利高風險商品為推介目標", "(4)未告知投資風險"], ans: 1, note: "分散風險、適合度配置屬善良管理人注意義務。", law: "民法/信託法"},
{id: "金融職業道德-149", text: "金融從業人員應以自己的專業知識替客戶選擇合適的商品，在執行時應遵守之原則為？", options: ["(1)最大誠信原則", "(2)從業人員利益最大化原則", "(3)金融商品風險最大化原則", "(4)以上皆是"], ans: 1, note: "最大誠信原則。", law: "職業道德規範"},
{id: "金融職業道德-150", text: "金融商品風險高低不同，對屬於保守型之客戶，從業人員應推薦之商品為何？", options: ["(1)穩健保守型商品", "(2)高風險高報酬商品", "(3)目前公司主力推薦之商品", "(4)公司所有之商品"], ans: 1, note: "適合度原則：保守客戶配保守商品。", law: "金融消費者保護法"},
{id: "金融職業道德-151", text: "金融從業人員幫客戶遞送契約或申請書時，發現客戶於文件上遺漏簽名，下列行為何者為非？", options: ["(1)通知客戶至公司營業場所親自補簽", "(2)不用通知，自行幫客戶簽名", "(3)親自送自客戶家中，請客戶親自補簽", "(4)與客戶於約定地點，送請客戶親自補簽"], ans: 2, note: "代客戶簽名涉及偽造文書，為絕對禁止之行為。", law: "偽造文書罪/金融從業人員業務規範"},
{id: "金融職業道德-152", text: "金融從業人員辦理投資型金融商品之推介或銷售業務時，應遵循下列何者事項？", options: ["(1)應廣泛了解客戶，以期精確銷售或推介適合客戶之商品", "(2)應以從業人員自身利益為優先考量", "(3)儘量使用類似大眾所熟悉之他人商標，混淆客戶以提升業績", "(4)可利用公司內部資訊擅自為自己進行交易而謀取利益"], ans: 1, note: "了解客戶(KYC)是推介適合商品(Suitability)的前提。", law: "投資型保險商品銷售應注意事項"},
{id: "金融職業道德-153", text: "金融從業人員辦理衍生性商品業務時，應本持下列何項原則？", options: ["(1)誠信原則", "(2)守法原則", "(3)善良管理原則", "(4)以上皆是"], ans: 4, note: "辦理複雜高風險的衍生性商品，須兼顧誠信、守法與善良管理。", law: "銀行辦理衍生性金融商品業務內部作業制度及程序管理辦法"},
{id: "金融職業道德-154", text: "有關金融從業人員辦理全權委託業務，下列陳述何者有誤?", options: ["(1)不得從事足以損害委任人權益之交易", "(2)得對無權過問之同仁洩漏客戶資料", "(3)不得違反契約、內部作業規範、內部控制等行為", "(4)不得為與委任人有利益衝突之第三人從事代客操作業"], ans: 2, note: "客戶資料應嚴守秘密，不得洩漏給無關人員。", law: "證券投資信託及顧問法/保密原則"},
{id: "金融職業道德-155", text: "金融從業人員辦理衍生性商品業務時，應遵循下列何者事項？", options: ["(1)可幫助客戶遞延、隱藏損失", "(2)可幫助客戶粉飾財務報表", "(3)可幫助客戶提前認列收入", "(4)不得利用衍生性商品幫助客戶遞延、隱藏損失或虛報、提前認列收入等"], ans: 4, note: "協助客戶作假帳或隱匿損失違反會計法規與職業道德。", law: "商業會計法/職業道德規範"},
{id: "金融職業道德-156", text: "有關金融從業人員辦理衍生性商品業務，下列陳述何者有誤?", options: ["(1)應充分告知投資人產品所涉風險", "(2)應向投資人說明產品之可能最大損失", "(3)應加強對非專業善意投資人之保護措施", "(4)應以從業人員自身利益為優先考量"], ans: 4, note: "應以客戶利益優先，而非從業人員利益。", law: "職業道德規範/客戶利益優先原則"},
{id: "金融職業道德-157", text: "金融從業人員辦理催收業務時，下列行為何者為非？", options: ["(1)應對債務人表明身分", "(2)不得有脅迫、辱罵債務人之不當收債行為", "(3)不得對第三人進行催討", "(4)得向債務人收取額外費用"], ans: 4, note: "催收僅能收取合法債務及費用，不得巧立名目收取額外費用。", law: "金融機構辦理應收債權催收作業委外處理要點"},
{id: "金融職業道德-158", text: "金融從業人員辦理催收業務時，下列何者為應遵守之事項？", options: ["(1)不得違反公共利益", "(2)僅能對債務人本人及其保證人催收", "(3)不得對非債務之第三人干擾或催討", "(4)以上皆是"], ans: 4, note: "催收行為受嚴格規範，不得騷擾第三人或違反公序良俗。", law: "金融機構辦理應收債權催收作業委外處理要點"},
{id: "金融職業道德-159", text: "下列那一項為金融從業人員辦理投資型金融商品之推介或銷售業務時，應遵守之事項？", options: ["(1)應避免不當銷售或推介之行為", "(2)不得誤導消費者不正確之價值及理財觀念", "(3)不得使用類似大眾所熟悉之他人商標，以混淆消費者", "(4)以上皆是"], ans: 4, note: "銷售應遵循公平、誠信、不誤導原則。", law: "投資型保險商品銷售應注意事項"},
{id: "金融職業道德-160", text: "金融從業人員辦理衍生性商品業務時，不應有下列何種行為？", options: ["(1)於交易契約中揭示可能發生之風險", "(2)對客戶善盡風險告知義務", "(3)誤導客戶之情事", "(4)提醒客戶承作商品之重要注意事項"], ans: 3, note: "誤導客戶是嚴重違規。", law: "金融消費者保護法"},
{id: "金融職業道德-161", text: "下列關於金融從業人員辦理投資型金融商品之推介或銷售業務時，應遵守之事項何者正確？", options: ["(1)應揭露商品的各項特性及風險", "(2)商品設計應符合客戶之風險偏好", "(3)推介適合客戶之商品", "(4)以上皆是"], ans: 4, note: "揭露、適合度、KYC皆為必要。", law: "投資型保險商品銷售應注意事項"},
{id: "金融職業道德-162", text: "金融從業人員執行業務時，應本持下列何者原則？", options: ["(1)善良管理原則", "(2)保密原則", "(3)誠信公正原則", "(4)以上皆是"], ans: 4, note: "善良管理、保密、誠信是基本原則。", law: "職業道德規範"},
{id: "金融職業道德-163", text: "下列陳述何者為金融從業人員應遵守之事項？", options: ["(1)不可利用客戶名義為自己從事交易", "(2)可利用客戶名義為自己從事交易", "(3)可利用客戶名義供他人從事交易", "(4)以上皆非"], ans: 1, note: "禁止利用客戶帳戶（人頭戶）進行交易，防範利益衝突與洗錢。", law: "證券商負責人與業務人員管理規則"},
{id: "金融職業道德-164", text: "金融從業人員受理開戶時應由客戶提供應備之證件核驗，如客戶拒絕提供者，下列何者行為是不被允許的？", options: ["(1)應予婉拒受理", "(2)仍予受理以提升業績", "(3)經確實查證身分屬實後始予辦理", "(4)應與客戶充分溝通，請客戶配合證件核驗"], ans: 2, note: "客戶拒絕提供身分證明文件，應拒絕開戶（婉拒建立業務關係）。", law: "洗錢防制法/金融機構防制洗錢辦法"},
{id: "金融職業道德-165", text: "金融從業人員辦理全權委託業務，為期精確銷售或推介適合客戶之商品，應廣泛了解客戶之：", options: ["(1)家庭背景", "(2)生涯規劃", "(3)風險偏好", "(4)以上皆是"], ans: 4, note: "KYC越詳盡，越能落實適合度管理。", law: "證券投資信託及顧問法"},
{id: "金融職業道德-166", text: "金融從業人員辦理全權委託業務，下列何者行為是不被允許的？", options: ["(1)從事足以損害委任人權益之交易", "(2)從事逾越委任人授權範圍之交易", "(3)違反契約、內部作業規範、內部控制等行為", "(4)以上皆是"], ans: 4, note: "損害客戶、越權、違規皆禁止。", law: "證券投資信託及顧問法"},
{id: "金融職業道德-167", text: "下列所述金融從業人員辦理全權委託業務應廣泛了解客戶之事項，何者有誤？", options: ["(1)投資需求", "(2)投資經驗", "(3)是否提供餽贈", "(4)財務狀況"], ans: 3, note: "是否提供餽贈非KYC必要事項，且收受餽贈可能違反廉潔規範。", law: "證券投資信託及顧問法"},
{id: "金融職業道德-168", text: "有關金融從業人員辦理全權委託業務，下列敘述何者為非？", options: ["(1)對於客戶資料，沒有保密之義務", "(2)不可誤導客戶不正確之價值及理財觀念", "(3)應充分告知客戶產品之性質與內容", "(4)應避免不當銷售或推介之行為"], ans: 1, note: "對客戶資料有絕對保密義務。", law: "證券投資信託及顧問法"},
{id: "金融職業道德-169", text: "辦理投資型金融商品推介或銷售業務時，應於受理前進行下列何項程序，以瞭解客戶並幫助客戶瞭解自身投資屬性及適合商品或投資組合？", options: ["(1)請客戶填具客戶資料表，建檔並妥為保存", "(2)瞭解客戶投資經驗及風險偏好", "(3)瞭解客戶預計投資期限及期望報酬", "(4)以上皆是"], ans: 4, note: "KYC程序包含了解經驗、風險偏好、投資目的等。", law: "投資型保險商品銷售應注意事項"},
{id: "金融職業道德-170", text: "金融從業人員遇有存戶遺忘或未及時領回銀行存摺時，應採取下列何措施？", options: ["(1)可代客保管存摺", "(2)應即設簿登記，交指定主管人員集中保管", "(3)不發函或電告通知客戶僅需等待洽領", "(4)以上皆非"], ans: 2, note: "嚴禁行員私自代客保管存摺，應依遺留物處理程序列管。", law: "銀行內部控制制度"},
{id: "金融職業道德-171", text: "有關金融從業人員辦理全權委託業務，下列敘述何者為非？", options: ["(1)應遵守相關法令規定", "(2)不可利用委任人之交易帳戶，為自己交易", "(3)可將委任操作契約，轉讓他人", "(4)不可將已成交之買賣委託，由委任人名義改為其他第三人"], ans: 3, note: "全權委託契約具專屬性，非經客戶同意不得任意轉讓。", law: "證券投資信託及顧問法"},
{id: "金融職業道德-172", text: "客戶申辦業務檢附之文件內含瑕疵時，下列敘述何者正確？", options: ["(1)應確實檢視，審慎評估處理方式", "(2)應視與客戶之交情決定受理與否", "(3)仍照常予辦理，並向客戶示意要求其提供酬謝金或封口費", "(4)以上皆非"], ans: 1, note: "文件瑕疵可能涉及法律效力或詐欺，應審慎處理，不可視交情或索賄。", law: "銀行作業準則"},
{id: "金融職業道德-173", text: "王大明是一位證券分析人員，因為在餐廳吃飯時偶然聽到日日紅公司員工的談話，回辦公室後就把分析報告中對日日紅公司股票的建議由買進改為賣出。王大明違反了什麼原則？", options: ["(1)保密原則", "(2)公平原則", "(3)專業原則", "(4)忠實誠信原則"], ans: 3, note: "分析師提出建議應有合理依據及查證（勤勉盡責），僅憑路邊聽來的消息即修改建議，違反專業原則(Professionalism)。", law: "證券投資顧問事業負責人與業務人員管理規則"},
{id: "金融職業道德-174", text: "金融從業人員為提供投資人良好的服務，下列敘述何者有誤？", options: ["(1)應瞭解並遵守相關法令之規定，不得有違反或幫助他人違反法令之行為", "(2)應確實掌握客戶之資力、投資經驗與目的，以提供適當之服務，謀求客戶之最大利益", "(3)應盡善良管理之責任及注意，代客戶保管有價證券或其他資產", "(4)應妥慎保管客戶資料，禁止洩露機密資訊或有不當使用之情事"], ans: 3, note: "金融從業人員「不得」私自代客戶保管有價證券或資產（挪用風險）。", law: "證券商負責人與業務人員管理規則"},
{id: "金融職業道德-175", text: "金融從業人員從事全權委託投資業務，不得為下列何種行為？", options: ["(1)直接或間接提供或接受金錢或其他利益", "(2)無故洩漏公司基金或全權委託帳戶之機密", "(3)使人誤信能保證本金之安全或保證獲利者", "(4)以上皆是"], ans: 4, note: "收受回扣、洩密、保證獲利皆為禁止事項。", law: "證券投資信託及顧問法"},
{id: "金融職業道德-176", text: "金融從業人員從事全權委託投資業務，如發現客戶（委任人）有下列何種情形時，應拒絕簽訂全權委託投資契約？", options: ["(1)係未成年人未有法定代理人者", "(2)受破產之宣告未經復權者", "(3)係法人或其他機構，卻未能提出該法人或該機構出具之授權證明者", "(4)以上皆是"], ans: 4, note: "簽約對象需具備完全行為能力或合法授權。", law: "全權委託投資業務操作辦法"},
{id: "金融職業道德-177", text: "金融從業人員欲從事全權委託投資業務者，於簽訂全權委託投資契約前，下列敘述何者為正確？", options: ["(1)指派專人與客戶討論，充分瞭解其資力、投資經驗、投資目的或需求", "(2)向客戶告知相關法令限制並詳細說明全權委託投資之相關事項，並交付全權委託投資說明書", "(3)如擬從事證券相關商品交易，應再交付客戶全權委託期貨暨選擇權交易風險預告書", "(4)以上皆是"], ans: 4, note: "簽約前須完成KYC、說明與風險預告。", law: "全權委託投資業務操作辦法"},
{id: "金融職業道德-178", text: "天心證券投資信託公司簽訂全權委託契約時，應於契約載明？", options: ["(1)負有保密義務", "(2)盡善良管理人之注意義務", "(3)對委任事務之報告義務", "(4)以上皆是"], ans: 4, note: "保密、善良管理、報告義務皆為全委契約之必要條款。", law: "全權委託投資業務操作辦法"},
{id: "金融職業道德-179", text: "金融從業人員從事保險業務招攬時，於下列何者情形不負通知義務?", options: ["(1)為他方所知者", "(2)為他方所不知者", "(3)已發生者", "(4)自己所知者"], ans: 1, note: "依保險法第62條，事項為他方所知者，不負通知義務。", law: "保險法第62條"},
{id: "金融職業道德-180", text: "保險商品銷售時，下列何者應於保險商品簡介及要保書首頁之明顯處，以鮮明字體標示？", options: ["(1)查閱公司資訊公開說明文件之方式", "(2)公司總經理", "(3)公司地址", "(4)保險費率"], ans: 1, note: "應標示資訊公開說明文件之查閱方式，以利消費者審閱。", law: "保險商品銷售前程序作業準則"},
{id: "金融職業道德-181", text: "下列何者屬於金融從業人員招攬保險，利用其身分從事業務上的不當行為？", options: ["(1)招攬過程對客戶有恐嚇、威脅之言語或行動，或有肢體上暴行，經查證屬實者", "(2)協助要求醫師開立錯誤或內容不實之診斷及處置證明，或不當誘使要保人或被保險人要求醫師開立錯誤或內容不實診斷及處置證明", "(3)未親晤客戶致未能取得保戶親簽之要保相關文件", "(4)以上皆是"], ans: 4, note: "恐嚇、造假診斷書、未親晤保戶皆為嚴重違規。", law: "保險業務員管理規則"},
{id: "金融職業道德-182", text: "金融從業人員在從事保險招攬時應充分瞭解要保人及被保險人之事項，其內容至少應包含？", options: ["(1)要保人及被保險人之基本資料", "(2)要保人與被保險人及被保險人與受益人之關係", "(3)要保人及被保險人是否符合投保之條件", "(4)以上皆是"], ans: 4, note: "KYC應包含身分、關係、投保條件。", law: "保險業招攬及核保作業控管自律規範"},
{id: "金融職業道德-183", text: "就身心障礙人士的投保需求，逕行拒絕受理、拒絕協助送件或勸退，會受到何種處分？", options: ["(1)停止招攬3 個月", "(2)停止招攬6 個月", "(3)停止招攬10 個月", "(4)停止招攬1 年"], ans: 1, note: "歧視身心障礙人士，依保險業務員管理規則處停止招攬3個月。", law: "保險業務員管理規則"},
{id: "金融職業道德-184", text: "金融從業人員招攬保險時不應告知要保人下列那些事項？", options: ["(1)可延欠保費", "(2)可退佣", "(3)可折讓", "(4)以上皆是"], ans: 4, note: "不得承諾延欠保費、退佣或折讓（不當利益）。", law: "保險業招攬廣告自律規範"},
{id: "金融職業道德-185", text: "金融從業人員招攬保險業務時應告知要保人投保應注意事項，下列何者為非？", options: ["(1)要保人親自填寫並簽章", "(2)如何逃稅", "(3)若要保人或被保險人為未成年人，需經其法定代理人同意，並於要保書上簽章", "(4)應據實說明"], ans: 2, note: "教唆逃稅違法。", law: "稅捐稽徵法/保險法"},
{id: "金融職業道德-186", text: "金融從業人員對保險要保書的各項詢問說明，應如何要求客戶？", options: ["(1)可避重就輕", "(2)就個人隱私可不必回答", "(3)可任由其自由回答", "(4)應據實說明"], ans: 4, note: "據實說明義務（最大誠信原則）。", law: "保險法第64條"},
{id: "金融職業道德-187", text: "金融從業人員從事保險招攬時，有誠實填寫招攬報告書的義務，下列何者為招攬報告書應包含的內容：", options: ["(1)招攬經過", "(2)要保人及被保險人是否投保其他商業保險", "(3)家中主要經濟來源者", "(4)以上皆是"], ans: 4, note: "業務員報告書應詳實記載招攬經過與客戶狀況。", law: "保險業招攬及核保作業控管自律規範"},
{id: "金融職業道德-188", text: "金融從業人員有下列哪種情況之一時，不可登錄為保險業務員；如果已登錄者，所屬公司應通知各有關公會註銷其登錄：", options: ["(1)申請登錄之文件有虛偽之記載者", "(2)曾犯偽造文書、侵占、詐欺、背信罪，經宣告有期徒刑以上之刑確定，尚未執行完畢，或執行完畢、緩刑期滿或赦免後尚未逾三年者", "(3)受破產之宣告，尚未復權者", "(4)以上皆是"], ans: 4, note: "消極資格限制。", law: "保險業務員管理規則"},
{id: "金融職業道德-189", text: "金融從業人員為客戶解說開戶文件時，以下敘述何者正確?", options: ["(1)避免提及交易風險，以免嚇跑客戶", "(2)必須告知相關交易流程", "(3)先請客戶簽署開戶契約，日後有機會再向客戶詳細解說", "(4)告知客戶交易的最大風險僅限於手續費"], ans: 2, note: "應告知流程與風險，不可隱匿。", law: "金融消費者保護法"},
{id: "金融職業道德-190", text: "金融從業人員在向客戶預告交易風險時，以下敘述何者正確?", options: ["(1)買空賣空交易最適合家徒四壁的人，因為可以一夕致富", "(2)建議客戶萬一面臨追繳時，可以先以信用卡預借現金向銀行週轉應急", "(3)告知客戶交易的最大風險僅限於手續費的損失", "(4)提醒客戶當行情劇烈波動時，其本金有可能完全損失"], ans: 4, note: "應誠實預告本金可能完全損失（甚至超過本金）的風險。", law: "期貨/證券交易風險預告書"},
{id: "金融職業道德-191", text: "金融從業人員在向客戶辦理開戶作業時，應告知下列那些事項?", options: ["(1)相關費用", "(2)相關交易流程", "(3)相關的交易風險", "(4)以上皆是"], ans: 4, note: "費用、流程、風險皆須告知。", law: "金融消費者保護法"},
{id: "金融職業道德-192", text: "交易人張三於週一透過某金融服務業完成一筆金融商品交易，以下敘述何者正確?", options: ["(1)該金融服務業應依規定製作一份對帳資料，寄送給張三", "(2)可由該金融服務機構業務員代領交易報告書再轉交客戶", "(3)為節省作業成本，未經約定一律以電子方式寄送交易報告書", "(4)依客戶要求決定寄送與否"], ans: 1, note: "成交後應主動寄送交易報告書/對帳單，且不得由業務員代領。", law: "證券商管理規則"},
{id: "金融職業道德-193", text: "交易人張三以電話委託某金融服務業進行金融商品交易，以下敘述何者正確?", options: ["(1)為避免錯誤，接單之業務員可在電話中覆誦張三的委託內容，無誤後再填寫委託書交付執行", "(2)成交後，由該金融服務業接單之業務員，以電話向張三進行成交回報並錄音即可，毋須再寄送交易報告書給張三", "(3)該金融服務業應將張三之交易報告書，依張三之電話指示交付或寄送，不必依契約約定方式進行", "(4)該金融服務業已向張三進行成交回報及寄送交易報告書，善盡充分告知之義務，因此毋須再定期交付或寄送對帳資料給張三，避免浪費資源"], ans: 1, note: "電話委託需覆誦確認並錄音；仍須寄送書面或電子報告書。", law: "證券商管理規則"},
{id: "金融職業道德-194", text: "金融服務業對客戶有告知義務與通知責任，下列敘述何者正確?", options: ["(1)應對須告知及通知事項儘速忠實告知", "(2)可自行事先與客戶約定代為處理，毋須另行通知", "(3)若主管指示毋須告知，則不告知客戶", "(4)只告知有利於客戶之事項"], ans: 1, note: "忠實告知是基本義務。", law: "金融消費者保護法"},
{id: "金融職業道德-195", text: "金融從業人員向客戶進行顧問業務招攬行為時，下列敘述何者妥適?", options: ["(1)提供精美贈品，勸誘客戶當場簽約及繳付顧問費用", "(2)應提供客戶合理之契約審閱期間", "(3)可向客戶提供金融商品明確之價位預測，以博取客戶之好感，有利於日後簽訂委任契約", "(4)以某位簽約客戶最近1 星期內獲利20﹪之個案，作為宣傳之主要訴求"], ans: 2, note: "依法應提供合理審閱期（通常為7日）。(1)(3)(4)皆為違規招攬。", law: "金融消費者保護法"},
{id: "金融職業道德-196", text: "金融服務業於接受客戶委任簽訂全權委託契約前，下列那一事項毋須先向客戶說明?", options: ["(1)公司之背景", "(2)每一位交易決定人員之學經歷與操作績效", "(3)某位客戶控告公司不當運用其所存入之委任資金，一審判處公司勝訴，但客戶不服上訴，目前仍在法院審理中", "(4)金融商品於特定價位買賣保證獲利"], ans: 4, note: "「保證獲利」是禁止事項，當然不應向客戶說明（承諾）。其他如公司背景、人員資歷、重大訴訟皆應揭露。", law: "證券投資信託及顧問法"},
{id: "金融職業道德-197", text: "某金融服務業甲之交易決定人員李經理，預計於農曆年後跳槽至乙公司任職，下列敍述何者正確?", options: ["(1)李經理通知所有委任客戶，與甲公司辦理解約，並於過完年後委由乙公司全權處理交易事宜", "(2)李經理直接將所有委任客戶之帳務，轉交另一位交易決定人員吳經理繼續處理", "(3)甲公司事先告知委任客戶，並由委任客戶決定是否與甲公司解約，或同意委由其他交易決定人員繼續操作", "(4)李經理將所有委任客戶之留倉部位予以平倉，結算損益，並靜待委任客戶決定是否解約或同意委由其他交易決定人員繼續操作"], ans: 3, note: "經理人變更屬契約重大事項，應通知客戶並由客戶決定去留。", law: "全權委託投資業務操作辦法"},
{id: "金融職業道德-198", text: "若原服務客戶之業務員離職，但客戶仍有未完成之委託事項，則接任之業務員，何者作為較適當?", options: ["(1)告知客戶，由其處理未完成之委託事項", "(2)不須通知客戶，自行處理未完成之委託事項", "(3)待客戶察覺再告知，否則毋須告知", "(4)客戶察覺亦毋需告知，以避免客戶流失"], ans: 1, note: "業務員變更應通知客戶，並接手服務。", law: "職業道德規範"},
{id: "金融職業道德-199", text: "依證券投資人及期貨交易人保護法規定，證券投資人有下列何種情形，保護機構財團法人證券投資人及期貨交易人保護中心得動用保護基金償付之？", options: ["(1)證券投資人買賣有價證券違約交割而受有損失者", "(2)證券投資人於所委託之證券商因財務困難失卻清償能力而違約時，其於證券交易市場買賣有價證券並已完成交割義務者", "(3)證券投資人買賣有價證券受有損失者", "(4)證券投資人買賣有價證券因重大損失而要求精神補償者"], ans: 2, note: "保護基金主要償付因「證券商違約」（如倒閉）導致投資人受損之情形，而非投資損失。", law: "證券投資人及期貨交易人保護法"},
{id: "金融職業道德-200", text: "證券商辦理財富管理業務，為防範內線交易及利益衝突，對於辦理財富管理業務人員之規範，下列何者為正確？", options: ["(1)不得接受客戶不合法交易", "(2)從客戶獲知其買賣某標的商品之相關訊息，有利益衝突或不當得利之虞者，不得從事該等標的之買賣", "(3)應明確告知客戶執行財富管理業務人員之所屬部門，不得有混淆客戶之行為", "(4)以上皆為正確"], ans: 4, note: "防範利益衝突與內線交易是財管業務核心規範。", law: "證券商辦理財富管理業務應注意事項"},
{id: "金融職業道德-201", text: "為防範利益衝突及保護營業秘密，證券商之董事、監察人及受僱人員等內部人員獲悉承銷部門出售其包銷取得之股票或自營部門欲為買賣股票種類者，下列敘述何者為正確？", options: ["(1)於承銷部門出售或自營部門買賣前，不得為同種類股票之買賣委託", "(2)為服務客戶，立刻將此消息告知主要客戶先為買賣同種類股票", "(3)自己或通知親朋好友先為買賣同種類股票", "(4)立刻報告直屬主管因應處理"], ans: 1, note: "這是防範「搶先交易」(Front Running) 的規定。", law: "證券商內部控制制度標準規範"},
{id: "金融職業道德-202", text: "證券商之業務人員發現客戶的交易資料有異常時，應該如何處理？", options: ["(1)為了避免上級責怪，自己私下改正", "(2)一方面告知主管，另一方面則與客戶做確認", "(3)與客戶確認即可", "(4)若不影響整體作業的流程，為了避免麻煩，可以忽略它"], ans: 2, note: "異常交易可能涉及錯誤或洗錢，應通報主管並確認。", law: "證券商內部控制制度"},
{id: "金融職業道德-203", text: "對於證券商之業務人員執行業務而言，下列敘述何者正確？", options: ["(1)為了自己前途著想，可以把A 公司機密帶去B 公司，以獲取更高的職位", "(2)只要不要太張揚，可以利用公司未公開的資訊，以家人的戶頭投資來獲利", "(3)若遇總體經濟環境不佳等因素，使得客戶資產的規模縮水，基於善良管理原則，仍要告知客戶", "(4)有時接受供應商的招待，也算是一種正常的交際活動"], ans: 3, note: "誠實告知資產狀況是善良管理人的義務。其他皆為違規行為。", law: "職業道德規範"},
{id: "金融職業道德-204", text: "證券商辦理財富管理業務，對客戶之收費應如何處理？", options: ["(1)列為公司機密", "(2)提供財富管理服務實際收取之手續費、推介銷售商品獲取之佣金及其他名義費用向客戶充分告知", "(3)將牌告之收費標準充分揭露", "(4)客戶有詢問時才告知大概情形"], ans: 2, note: "費用與佣金應充分揭露，避免利益衝突。", law: "證券商辦理財富管理業務應注意事項"},
{id: "金融職業道德-205", text: "證券經紀商接受客戶委託買賣有價證券，於成交後，證券業務人員應即時回報客戶，作成買賣報告書交付客戶，每月編製對帳單分送客戶，其主要目的為：", options: ["(1)增加公司員工的工作內容", "(2)創造社會的工作機會", "(3)確認交易及買賣委託之完成", "(4)維持與客戶的友好關係"], ans: 3, note: "確保交易正確性與確認委託完成。", law: "證券商管理規則"},
{id: "金融職業道德-206", text: "金融從業人員執行事務明知有下列事項應告知客戶，何者為是？", options: ["(1)對於契約之重大條款認知錯誤", "(2)對於業務執行之重大事項認知錯誤", "(3)對於財產管理之重大事項認知錯誤", "(4)以上皆是"], ans: 4, note: "發現客戶有重大認知錯誤時，應盡告知義務予以釐清。", law: "金融消費者保護法"},
{id: "金融職業道德-207", text: "金融從業人員處理事務應盡善良管理人之注意義務，下列何者為錯誤的行為？", options: ["(1)告知客戶投資運用之風險", "(2)告知客戶應給付相關款項及費用", "(3)未告知客戶處理業務有利益衝突", "(4)告知客戶公司相關資料"], ans: 3, note: "利益衝突必須告知（揭露），未告知違反忠實義務。", law: "職業道德規範"},
{id: "金融職業道德-208", text: "金融從業人員處理管理運用業務如涉及有價證券之投資應揭露風險，以下何者為錯誤的？", options: ["(1)應依產品特性揭露投資風險", "(2)屬信託財產運用範圍無須揭露風險", "(3)應於交付客戶之公開說明書中揭露風險", "(4)應揭露業務所涉及之各類風險"], ans: 2, note: "信託財產運用仍有風險，必須揭露。", law: "信託業法"},
{id: "金融職業道德-209", text: "金融從業人員告知客戶投資風險，以下何者為是？", options: ["(1)無須提供相關書面資料", "(2)應代為填寫瞭解客戶作業之資料", "(3)以招攬業務必須同時說明其風險", "(4)太複雜之投資風險無須告知"], ans: 3, note: "招攬時必須說明風險，不可只講獲利。", law: "金融消費者保護法"},
{id: "金融職業道德-210", text: "金融從業人員辦理業務，對於報酬及費用之告知，以下何者是錯誤的？", options: ["(1)無法說明之報酬及費用，應由客戶詢問再行告知", "(2)應告知客戶各項相關報酬及費用及其收取方式", "(3)相關報酬及費用之收取應秉公平與誠信原則", "(4)辦理業務前或同時應告知客戶"], ans: 1, note: "費用應「主動」且「事先」告知，不可等客戶問才說。", law: "金融消費者保護法"},
{id: "金融職業道德-211", text: "金融從業人員辦理業務如需告知客戶公司相關資料，得以提供公司之相關資料為何？", options: ["(1)公司及其相關分支機構或代理機構之營業地址、聯絡電話", "(2)代表公司執行業務的人員之姓名或職稱", "(3)代表公司可能與客戶聯繫的人員之姓名或職稱", "(4)以上皆是"], ans: 4, note: "應充分揭露公司及人員資訊以建立信賴。", law: "金融消費者保護法"},
{id: "金融職業道德-212", text: "金融從業人員為客戶管理運用資產應告知客戶相關資訊，以下何者為錯誤的？", options: ["(1)應定期告知財產目錄", "(2)應將客戶之資產運用情形告知其他客戶", "(3)應定期告知財產損益情況", "(4)應定期告知財產管理運用紀錄"], ans: 2, note: "洩露客戶資訊給第三人（其他客戶）違反保密義務。", law: "個人資料保護法"},
{id: "金融職業道德-213", text: "金融從業人員處理管理運用業務之通知與報告義務為何？", options: ["(1)應就事務之處理情形定期報告客戶", "(2)應依契約約定為必要之通知", "(3)應公告事項應依相關規定辦理", "(4)以上皆是"], ans: 4, note: "通知與報告是受託人的基本義務。", law: "信託法/證券投資信託及顧問法"},
{id: "金融職業道德-214", text: "金融從業人員以電子媒體方式與客戶聯繫業務，下列何者是錯誤的？", options: ["(1)應逐案先經主管機關核准", "(2)應確保傳輸安全", "(3)應確保收受者確實收受聯繫之內容", "(4)應先取得客戶同意"], ans: 1, note: "電子聯繫通常依通則規範辦理（如個資法、電子簽章法），不需「逐案」報核。", law: "金融機構辦理電子銀行業務安全控管作業基準"},
{id: "金融職業道德-215", text: "依法令規定應於提供客戶相關文件中揭露風險警語，下列何者無須揭露警語？", options: ["(1)行銷文件", "(2)印鑑卡", "(3)公開說明書", "(4)投資說明書"], ans: 2, note: "印鑑卡是留存印鑑用，非行銷或說明文件，無須揭露風險警語。", law: "金融法規"},
{id: "金融職業道德-216", text: "金融從業人員與客戶簽訂契約，以下敘述何者為是？", options: ["(1)於訂約前並應先行提供契約或文件內容予客戶閱覽", "(2)應盡合理注意使客戶於簽訂契約前有充分機會考慮條款", "(3)應就客戶所提出疑義詳細說明之", "(4)以上皆是"], ans: 4, note: "契約審閱期與說明義務。", law: "金融消費者保護法"},
{id: "金融職業道德-217", text: "金融從業人員應提供客戶充足且必要之資訊，須告知客戶投資之風險及其所從事投資之決定或交易過程。此為以下何項原則？", options: ["(1)資訊公開原則", "(2)能力原則", "(3)保密原則", "(4)客觀性原則"], ans: 1, note: "提供充足資訊即為資訊公開原則。", law: "職業道德規範"},
{id: "金融職業道德-218", text: "金融從業人員應秉持下列何種原則以提供客戶充足必要之資訊，告知客戶投資之風險及從事投資決定或交易過程之相關資訊，並向客戶快速揭露最新之資訊？", options: ["(1)專業誠信原則", "(2)資訊公開原則", "(3)善良管理原則", "(4)守法原則"], ans: 2, note: "同上題，資訊揭露屬資訊公開原則。", law: "職業道德規範"},
{id: "金融職業道德-219", text: "金融從業人員面臨市場競爭時，何者不是正確的表現？", options: ["(1)告知承作短期票券或債券交易之客戶，市場利率近期之波動情形", "(2)誠實告知客戶，公司及同業之間金融商品報價之差異", "(3)為達公司獲利目標，不擇手段欺瞞客戶所有訊息", "(4)針對客戶屬性，建議其承作短期票券或債券之交易"], ans: 3, note: "欺瞞客戶違反誠信原則。", law: "職業道德規範"},
{id: "金融職業道德-220", text: "何者不是身為專業金融從業人員之表現？", options: ["(1)在考量公司及自身利益下，不須告知客戶其可能面臨之投資風險", "(2)客觀分析適合客戶屬性之投資商品", "(3)告知客戶所需之各項商品風險與報酬", "(4)當客戶投資標的產生劇幅波動時，主動告知"], ans: 1, note: "隱匿風險違反專業與道德。", law: "職業道德規範"},
{id: "金融職業道德-221", text: "若有客戶詢問某項商品資訊時，下列何者為不恰當行為？", options: ["(1)拒絕提供或隱瞞市場上相關商品之訊息", "(2)在自身專業能力內，提供客戶該項商品之完整資訊", "(3)客觀分析該項商品可能面臨的風險", "(4)主動積極提供相關商品之資訊"], ans: 1, note: "應盡力提供資訊，不得無故拒絕或隱瞞。", law: "職業道德規範"},
{id: "金融職業道德-222", text: "從業人員提供客戶充足必要的資訊，告知客戶投資的風險及從事投資決定或交易過程之實質資訊等，是屬於下列何種職業道德原則？", options: ["(1)客觀原則", "(2)資訊公開原則", "(3)利益衝突原則", "(4)保密原則"], ans: 2, note: "資訊公開原則。", law: "職業道德規範"},
{id: "金融職業道德-223", text: "有關公司之重大訊息，應：", options: ["(1)於公司未公開前提供給客戶", "(2)基於合法方式取得後提供給客戶", "(3)於公司未公開前促使他人利用該訊息獲私利", "(4)將此訊息運用於非法用途上"], ans: 2, note: "必須合法取得（公開後）才能使用，否則涉及內線交易。", law: "證券交易法"},
{id: "金融職業道德-224", text: "從業人員接受客戶的委託後應符合資訊公開原則來提供服務，何謂資訊公開原則？", options: ["(1)提供客戶充足必要、投資可能的風險及投資決定等相關資訊", "(2)為提供最佳的服務，可將所有的資訊均反應給客戶", "(3)將所有未公開的資訊提供給客戶作內線交易", "(4)將客戶的資料提供給相關合作廠商"], ans: 1, note: "資訊公開指揭露必要的產品與風險資訊。", law: "職業道德規範"},
{id: "金融職業道德-225", text: "金融從業人員行銷商品時，應", options: ["(1)一味地促銷商品", "(2)批評他公司之商品", "(3)重要事項先不予告知", "(4)主動並詳細說明此商品之特性及應注意事項"], ans: 4, note: "詳細說明特性與注意事項是正確作法。", law: "金融消費者保護法"},
{id: "金融職業道德-226", text: "目前金融商品多樣化，客戶做任何投資或購買各種金融商品，最需要的就是金融商品的資訊，我們應該如何做資訊揭露？", options: ["(1)提供給客戶足夠的資訊", "(2)提供給客戶從事投資決定或交易過程應有的資訊", "(3)告知客戶投資的風險，並快速揭露最新資訊", "(4)以上皆是"], ans: 4, note: "充分揭露是保護投資人的關鍵。", law: "金融消費者保護法"},
{id: "金融職業道德-227", text: "在提供專業服務過程中，從業人員不得有下列哪些行為？", options: ["(1)任何欺瞞、詐騙行為", "(2)不實陳述或故意做錯", "(3)誤導客戶", "(4)以上皆是"], ans: 4, note: "欺瞞、詐騙、誤導皆禁止。", law: "職業道德規範"},
{id: "金融職業道德-228", text: "下列何者行為是金融從業人員的職責？", options: ["(1)讓客戶充分了解商品內容", "(2)隱瞞不利銷售的條件", "(3)特別強調商品的獲利率", "(4)避談商品的風險"], ans: 1, note: "充分說明是職責。", law: "金融消費者保護法"},
{id: "金融職業道德-229", text: "金融從業人員提供充足必要之資訊，告知客戶投資之風險及從事投資決定或交易過程之資訊，不包括？", options: ["(1)交易標的投資風險", "(2)交易標的之市場流通性", "(3)其他銷售公司之獲利能力", "(4)投資所收取之費用"], ans: 3, note: "其他公司的獲利能力與本商品風險無直接關聯，且可能涉及同業競爭敏感資訊，非必要揭露項目。", law: "職業道德規範"},
{id: "金融職業道德-230", text: "於業務推廣與招攬時，從業人員向客戶應盡之告知義務，下列何者正確？", options: ["(1)依商品相關內容據實告知", "(2)為爭取業績，隱匿部分應告知內容", "(3)於告知時，可加入從業人員主觀之想法", "(4)以上皆是"], ans: 1, note: "據實告知。", law: "金融消費者保護法"},
{id: "金融職業道德-231", text: "各上市上櫃公司金融服務業應於何處揭露其所訂定之道德行為準則？", options: ["(1)年報", "(2)公開說明書", "(3)公開資訊觀測站", "(4)以上皆是"], ans: 4, note: "道德行為準則應充分揭露。", law: "上市上櫃公司訂定道德行為準則參考範例"},
{id: "金融職業道德-232", text: "下列何者屬金融從業人員之資訊公開原則？", options: ["(1)告知客戶投資風險", "(2)告知客戶從事投資決定之相關資訊", "(3)告知客戶交易過程之相關資訊", "(4)以上皆是"], ans: 4, note: "風險、決策資訊、交易過程皆屬資訊公開。", law: "職業道德規範"},
{id: "金融職業道德-233", text: "有關金融從業人員辦理衍生性操作業務之風險告知，下列何者正確？", options: ["(1)提前解約風險", "(2)商品條件變更風險", "(3)利率風險", "(4)以上皆是"], ans: 4, note: "衍生性商品風險多樣，皆須告知。", law: "銀行辦理衍生性金融商品業務內部作業制度及程序管理辦法"},
{id: "金融職業道德-234", text: "信用卡發卡機構在接獲被害人反映，發現有冒名申請信用卡案件時，應如何處理？", options: ["(1)不作任何通報", "(2)儘速通報相關單位，避免損害擴大", "(3)要求被害人負擔損失", "(4)以上皆非"], ans: 2, note: "應通報聯徵中心及相關單位，防止偽冒擴大。", law: "信用卡業務機構管理辦法"},
{id: "金融職業道德-235", text: "金融從業人員辦理全權委託業務，下列何者有助於避免糾紛之發生？", options: ["(1)推廣文宣應清楚、公正及不誤導投資人", "(2)充分告知產品所涉風險之性質與內容", "(3)向投資人說明產品之可能最大損失", "(4)以上皆是"], ans: 4, note: "清楚溝通與充分揭露是避免糾紛不二法門。", law: "全權委託投資業務操作辦法"},
{id: "金融職業道德-236", text: "金融從業人員辦理全權委託業務，為避免糾紛，應遵守下列何種事項？", options: ["(1)充分揭露商品所涉及風險之性質與內容", "(2)不得有誤導客戶之情事", "(3)提醒客戶於交易前應充分審度本身財務狀況及風險承受度，始決定是否進行投資", "(4)以上皆是"], ans: 4, note: "同上，充分揭露與適合度評估。", law: "全權委託投資業務操作辦法"},
