{id: "金融職業道德-237", text: "金融從業人員於推介或銷售投資型金融商品時，應採取下列何者作為，以確保客戶了解商品性質與可能面臨之風險？", options: ["(1)應充分了解客戶，審酌客戶年齡等情況予以推介或銷售適當之金融商品，並善盡充分告知投資風險內容之職責", "(2)誇大金融商品之可能報酬，並勸誘客戶以借款、舉債等方式從事理財投資以增加業績", "(3)待客戶要求再告知投資商品可能之風險，否則毋須主動告知", "(4)為避免客戶流失，僅告知投資可能之利益，毋需告知投資風險"], ans: 1, note: "KYC + 適合度 + 風險告知。", law: "投資型保險商品銷售應注意事項"},
{id: "金融職業道德-238", text: "金融從業人員遇有客戶遺留印鑑、存摺及已蓋章之空白取款條等憑證文件時，應如何處理？", options: ["(1)私自代客保管", "(2)立即交由金融機構指定人員妥善保管", "(3)為避免糾紛，不予處理", "(4)逕行銷燬"], ans: 2, note: "應交由主管或指定人員保管並通知客戶，不可私自保管。", law: "銀行內部控制制度"},
{id: "金融職業道德-239", text: "金融從業人員在向客戶推介或銷售投資型金融商品時，應告知下列那些事項？", options: ["(1)金融商品名稱及主要投資標的內容", "(2)客戶須支付之各項費用說明", "(3)可能承受之風險說明", "(4)以上皆是"], ans: 4, note: "標的、費用、風險缺一不可。", law: "投資型保險商品銷售應注意事項"},
{id: "金融職業道德-240", text: "金融從業人員遇客戶臨櫃提領現金(含由他人領款及陪同領款)，經行員判斷有異常者，應如何處理？", options: ["(1)詢問客戶辦理動機與目的", "(2)詢問客戶是否認識陪同提款的人", "(3)經研判客戶顯屬遭詐騙者，應撥打警政署防範詐騙專線或逕向「110」報案", "(4)以上皆是"], ans: 4, note: "臨櫃關懷提問（KYC）是防詐的重要防線。", law: "金融機構辦理臨櫃作業關懷客戶提問作業程序"},
{id: "金融職業道德-241", text: "金融從業人員受理存款開戶作業，下列敘述何者正確？", options: ["(1)依據主管機關規定辦理身分證明文件查核", "(2)受理開戶時應向客戶宣導，如提供帳戶供非法使用應負法律責任", "(3)開戶後發現可疑之客戶，應以電話、書面或實地查訪等方式再確認，並做適當處理", "(4)以上皆是"], ans: 4, note: "開戶審查與警示帳戶宣導。", law: "存款帳戶及其疑似不法或顯屬異常交易管理辦法"},
{id: "金融職業道德-242", text: "金融從業人員接受客戶委任，提供證券投資顧問服務前，應先向客戶揭露何種資訊，並與客戶簽訂書面證券投資顧問契約，以確定雙方之權利義務?", options: ["(1)過去業績", "(2)收費之基準及數額", "(3)介紹未經主管機關核備之投資商品", "(4)以上皆非"], ans: 2, note: "費用透明化是簽約前必要告知事項。", law: "證券投資顧問事業管理規則"},
{id: "金融職業道德-243", text: "投信事業從事基金管理業務，有何種告知客戶義務？", options: ["(1)提供有關公司之充份資料，包括公司及其分公司之營業地址、公司經營業務之種類與限制，以及代表公司執行業務並可能與客戶有所聯繫的人員之身分和職位", "(2)客戶得要求公司揭露其財務狀況，公司應提供可公開之財務報表資料，不得拒絕", "(3)向客戶揭露其收費之基準及數額，所有會影響對客戶的收費、相關費用或將費用調高之做法，應符合公平與誠信原則；調高費用者，應於與客戶協議書中揭露，並於定期表件中彙報。", "(4)以上皆是"], ans: 4, note: "公司資訊、財務狀況、收費標準皆應告知。", law: "證券投資信託及顧問法"},
{id: "金融職業道德-244", text: "金融服務業從事全權委託投資業務，下列哪些事項必須告知客戶？", options: ["(1)報酬與收費方式", "(2)如有從事證券相關商品交易，其交易風險、交易特性與法律限制", "(3)簽約後可要求解約之事由及期限", "(4)以上皆是"], ans: 4, note: "全委契約重要條款。", law: "全權委託投資業務操作辦法"},
{id: "金融職業道德-245", text: "金融服務業從事基金管理業務，下列哪些事項必須告知客戶？", options: ["(1)收費基準及數額", "(2)研究或分析報告與投資結果", "(3)公司經營業務之種類與限制", "(4)以上皆是"], ans: 4, note: "應告知所有與客戶權益相關之事項。", law: "證券投資信託及顧問法"},
{id: "金融職業道德-246", text: "發發投顧公司透過電腦選股每日提供前五大飆股名單給客戶而不告知任何理由或原因。發發公司有無違反告知義務？", options: ["(1)有", "(2)無，因為報告只對特定人提供", "(3)無，因為系統經多年驗證，並非怪力亂神", "(4)無，因為涉及公司之智慧財產權，可不提供給客戶"], ans: 1, note: "投顧提供建議應有「合理分析依據」並告知客戶，不可僅給名單不給理由。", law: "證券投資顧問事業負責人與業務人員管理規則"},
{id: "金融職業道德-247", text: "以下有關金融服務業從事投信業務對客戶收費資訊之陳述，何者有誤？", options: ["(1)應向客戶揭露收費之基準及數額", "(2)所有會影響對客戶之收費或將調高之做法，都應符合公平誠信原則", "(3)向所有客戶收取的費用都必須一樣", "(4)調高費用者，應於與客戶協議書中揭露，並於定期表件中彙報"], ans: 3, note: "費用可依客戶類別、規模等有差異化訂價（如法人優惠），但需公平合理，並非「必須完全一樣」。", law: "證券投資信託及顧問法"},
{id: "金融職業道德-248", text: "購買基金之客戶要求投資信託公司揭露其財務狀況，公司人員應採取何者措施？", options: ["(1)得拒絕提供任何資料", "(2)不得拒絕提供可公開之財務報表資料", "(3)公司人員視情況隨興提供資料", "(4)只提供口頭說明資料"], ans: 2, note: "投信公司是特許行業，財務資訊應公開透明，客戶要求時不得拒絕提供可公開部分。", law: "證券投資信託及顧問法"},
{id: "金融職業道德-249", text: "基金通路報酬之揭露原則為何？", options: ["(1)依基金別揭露", "(2)依公司別揭露", "(3)依註冊地別揭露", "(4)不必揭露"], ans: 1, note: "通路報酬（銀行賣基金收的佣金）需按「基金別」揭露，讓投資人知道銀行從這檔基金賺多少。", law: "銀行辦理衍生性金融商品業務內部作業制度及程序管理辦法(參照通路報酬揭露規範)"},
{id: "金融職業道德-250", text: "基金通路報酬揭露內容之通知方式為？", options: ["(1)公開網站", "(2)電子郵件", "(3)對帳單", "(4)以上皆可"], ans: 4, note: "可以透過網站、電郵或書面方式通知。", law: "基金通路報酬揭露原則"},
{id: "金融職業道德-251", text: "金融從業人員於保險業務招攬時，對於被保險人所填要保書，下列何者正確？", options: ["(1)於空白要保書簽名即可", "(2)要求被保險人親自填寫並簽名", "(3)實務上可代填不用簽名", "(4)口頭允諾即可不用填寫"], ans: 2, note: "親簽是保險契約生效與防偽的關鍵。", law: "保險法"},
{id: "金融職業道德-252", text: "金融從業人員從事保險業務招攬時，對被保險人因連續高額投保，與其固定收入顯不相當時，應如何處理？", options: ["(1)盡速收取保費", "(2)維護客戶投保權益", "(3)了解其動機，若有不良企圖應予以規勸導正", "(4)只要保險公司同意即可"], ans: 3, note: "收入顯不相當之高額投保為道德危險（詐保）警訊，應了解動機並通報。", law: "保險業招攬及核保作業控管自律規範"},
{id: "金融職業道德-253", text: "金融從業人員收取保險費後下列何者行為是正確的？", options: ["(1)立即繳交保險公司", "(2)累積一定數量後整批繳交可提升效率", "(3)避免遺失可以轉用自己支票或信用卡繳交", "(4)可由賠款扣抵"], ans: 1, note: "代收保費應「立即」繳回，不得挪用或延遲。", law: "保險業務員管理規則"},
{id: "金融職業道德-254", text: "金融從業人員從事保險業務招攬時，下列何者行為或觀念是錯誤的？", options: ["(1)業務人員對於商品應充分了解", "(2)惡性殺價是市場競爭正常行為", "(3)對被保險人應作適當的商品規劃", "(4)各項權利義務須詳細說明清楚"], ans: 2, note: "惡性殺價（退佣）違反法規與職業道德，非正常行為。", law: "公平交易法/保險法"},
{id: "金融職業道德-255", text: "金融從業人員從事保險招攬業務時，下列何種行為是正確的？", options: ["(1)為節省客戶費用，提供錯價、放佣", "(2)詳實說明客戶依保險契約的權利義務", "(3)為增加業務人力，無須所屬公司同意即可招聘人員", "(4)其他國家的商品對客戶較為有利，因此雖然未經我國主管機關核准或備查，仍可向客戶推銷"], ans: 2, note: "詳實說明權利義務。放佣、私自招聘、銷售地下保單皆違法。", law: "保險業務員管理規則"},
{id: "金融職業道德-256", text: "金融從業人員提供保險理賠服務下列何者是正確的？", options: ["(1)提供專業之服務協助，並請申請人據實填寫理賠申請書", "(2)提供專業之服務協助，並代填寫理賠申請書", "(3)理賠金額可任由申請人要求給付", "(4)允諾客戶一定可獲公司理賠"], ans: 1, note: "協助申請，要求據實。不可代填、不可保證理賠（理賠由核保理賠部門決定）。", law: "保險業招攬及核保作業控管自律規範"},
{id: "金融職業道德-257", text: "發現保險契約錯誤記載時，金融從業人員應如何處理才屬正確的？", options: ["(1)只要要保書填寫正確即可", "(2)立即送回保險公司更正或重新製作保單", "(3)保險從業人員於錯誤處更正後，簽名即可", "(4)錯誤處未達三個，可不必更正"], ans: 2, note: "保單內容有誤應送回公司正式更正（批註），不可私自塗改。", law: "保險實務"},
{id: "金融職業道德-258", text: "金融從業人員於保險業務招攬時，不慎對商品作出不正確之解釋，應如何正確處理？", options: ["(1)不影響，因口說無憑", "(2)口述僅供參考，一切以要保書或文宣為準", "(3)立即對客戶提出更正及正確解釋說明", "(4)認知不同，難以斷定錯誤與否"], ans: 3, note: "發現錯誤應立即更正說明，以免誤導客戶。", law: "最大誠信原則"},
{id: "金融職業道德-259", text: "金融從業人員從事保險業務招攬應以何種態度經營及建立客戶群？", options: ["(1)專業誠信之態度", "(2)得過且過之態度", "(3)業績至上", "(4)自身利益優先"], ans: 1, note: "專業誠信。", law: "職業道德規範"},
{id: "金融職業道德-260", text: "金融從業人員發現客戶需求與其公司所提供保險商品有落差時，應採取下列何種作為？", options: ["(1)不擇手段，爭取業務", "(2)避重就輕，轉移焦點", "(3)誠實面對，據實說明", "(4)藉巧妙說詞掩蓋事實"], ans: 3, note: "據實說明產品限制，不可硬推不適合的商品。", law: "金融消費者保護法"},
{id: "金融職業道德-261", text: "金融從業人員於保險業務招攬時，得要求要保人履行據實說明義務，係屬下列何種原則？", options: ["(1)損害補償原則", "(2)保險利益原則", "(3)主力近因原則", "(4)最大誠信原則"], ans: 4, note: "據實說明義務源於最大誠信原則。", law: "保險法第64條"},
{id: "金融職業道德-262", text: "金融從業人員於保險業務招攬時，得約束要保人或被保險人的事項有告知、通知、保證，是基於何種原則？", options: ["(1)最大誠信原則", "(2)利益衝突原則", "(3)損害賠償原則", "(4)以上皆非"], ans: 1, note: "同上，最大誠信原則。", law: "保險法"},
{id: "金融職業道德-263", text: "下列何者是金融從業人員於保險業務招攬時的不當行為？", options: ["(1)客戶外觀明顯可見或業務員明知應告知事項而惡意隱匿或唆使客戶隱匿。", "(2)協助、任憑客戶偽造、變造或做不實之登載於要保書、理賠申請文件或其他文件", "(3)唆使(誘導)客戶對應告知事項做不實之告知。", "(4)以上皆是"], ans: 4, note: "唆使隱匿、協助偽造皆為嚴重違法行為。", law: "保險法/刑法"},
{id: "金融職業道德-264", text: "金融從業人員不得與客戶作獲利保證，係因：", options: ["(1)任何交易皆有風險", "(2)職業道德", "(3)法令禁止", "(4)以上皆是"], ans: 4, note: "市場有風險，且法規（如證交法、投信顧法）明文禁止保證獲利。", law: "證券投資信託及顧問法"},
{id: "金融職業道德-265", text: "金融從業人員張三與客戶李四是青梅竹馬，因此張三可以：", options: ["(1)代領李四的對帳單再親手交付", "(2)和李四約定利益分享、損失共同承擔", "(3)代為保管李四的存摺、印鑑", "(4)以上皆非"], ans: 4, note: "即使親近關係，從業人員仍須遵守法規，不得代領、代管或約定損益。", law: "證券商負責人與業務人員管理規則"},
{id: "金融職業道德-266", text: "金融從業人員張三因疏忽未依客戶指示買賣，結帳時才發現錯誤，下列哪一種處理方式較正確?", options: ["(1)請客戶念在多年交情，承認該筆交易", "(2)視損益情況，如果獲利可不用處理", "(3)誠實告知客戶及公司,協商解決方法", "(4)將錯就錯，等客戶發現再處理"], ans: 3, note: "錯帳應依公司程序申報處理，並誠實告知客戶。", law: "證券商內部控制制度"},
{id: "金融職業道德-267", text: "金融從業人員面臨客戶交易虧損時，如何處理才適當?", options: ["(1)保證與客戶共同承擔損失", "(2)竄改客戶交易資料、美化帳單", "(3)為免責備、避不見面", "(4)以誠懇的態度告知客戶實際狀況"], ans: 4, note: "誠實告知。", law: "職業道德規範"},
{id: "金融職業道德-268", text: "金融從業人員因個人疏忽，未在申購截止日前向公司提出客戶之商品申購書，下列何者敘述為正確處理態度?", options: ["(1)銷毀客戶的申購書,假裝沒有這回事", "(2)誠實告知客戶及公司,協商解決方法", "(3)宣稱已繳件，推諉是收件經辦遺失申購書", "(4)視客戶態度來決定避不見面或告知協商"], ans: 2, note: "疏失應誠實面對並尋求補救，不可隱瞞。", law: "職業道德規範"},
{id: "金融職業道德-269", text: "金融從業人員應忠實執行客戶之委託，下列敘述何者正確?", options: ["(1)客戶的委託損及其權益，仍然忠實執行不用告知", "(2)A 客戶口頭表示想跟隨B 客戶的買賣，即應確實代A跟單", "(3)未經確認客戶之委託內容即逕行代其買賣", "(4)確實明白客戶的指示內容才執行委託，避免犯錯"], ans: 4, note: "確認指令後執行，避免錯帳爭議。跟單與盲目執行皆不當。", law: "證券商管理規則"},
{id: "金融職業道德-270", text: "金融從業人員於受託執行業務時，下列何者非禁止行為?", options: ["(1)教育客戶利用電子系統買賣，以爭取買賣時間", "(2)如客戶業務繁忙，請其事先在委託書蓋章，再代理買賣", "(3)代客戶領取密碼", "(4)為節省時間，先替客戶買賣，結帳後再請客戶填寫買賣委託書"], ans: 1, note: "推廣電子下單是正常服務。(2)(3)(4)皆為禁止行為（預先蓋章、代領密碼、事後補單）。", law: "證券商管理規則"},
{id: "金融職業道德-271", text: "金融從業人員為能使客戶儘速交易，下列行為何者可接受?", options: ["(1)可先行交易，開戶文件後補即可", "(2)事先告知客戶備妥開戶所需證明文件", "(3)接受未經授權之代理開戶", "(4)熟識的客戶免辦理開戶作業即可交易"], ans: 2, note: "告知備妥文件是專業表現。未完成開戶不得交易。", law: "證券商管理規則"},
{id: "金融職業道德-272", text: "下列何者為金融服務業之開戶經辦應有之服務態度?", options: ["(1)依當天心情決定是否完成客戶開戶手續", "(2)只幫交情好的業務員辦理客戶開戶", "(3)將自行來開戶的客戶介紹給業務員代操", "(4)為客戶詳細解說開戶程序並交付相關文件"], ans: 4, note: "公平服務、詳細解說。", law: "職業道德規範"},
{id: "金融職業道德-273", text: "客戶李四有一筆定存500 萬元到期，欲從事商品投資，金融從業人員應：", options: ["(1)建議李四申購高額手續費之商品為自己賺取獎金", "(2)依李四需求，建議客戶申購適合自己的商品", "(3)視公司本月主推商品為何，建議李四申購該商品", "(4)如這個月已達到業績目標，勸誘李四下個月再申購"], ans: 2, note: "適合度原則：依客戶需求推薦。", law: "金融消費者保護法"},
{id: "金融職業道德-274", text: "下列何者是證券商之業務人員執行業務公平對待客戶應秉持的原則？", options: ["(1)優先考慮自己的業績", "(2)協助客戶炒作股價", "(3)應本誠實及信用原則", "(4)完全維護公司利益"], ans: 3, note: "誠實信用原則。", law: "證券商負責人與業務人員管理規則"},
{id: "金融職業道德-275", text: "證券商辦理財富管理業務，下列敘述何者為正確？", options: ["(1)係指針對高淨值客戶，透過業務人員，依據客戶需求，提供資產配置或財務規劃等顧問諮詢或金融商品銷售業務，以及以信託方式為客戶進行財務規劃、執行或辦理資產配置", "(2)證券商經營財富管理業務應符合規定資格條件並經證券主管機關核准", "(3)證券商人員辦理財富管理業務，應具備財富管理業務人員之資格條件；如涉及其他金融特許事業之規範者，其人員之資格條件，應另依各業之規定辦理", "(4)以上皆是"], ans: 4, note: "財管業務定義、資格、人員規範皆正確。", law: "證券商辦理財富管理業務應注意事項"},
{id: "金融職業道德-276", text: "證券商辦理財富管理業務，下列何者為證券商為防範內線交易及利益衝突之機制？", options: ["(1)有關業務人員直接或間接接受客戶或第三人之饋贈應訂定規範標準或管理措施", "(2)辦理財富管理業務之人員，不得接受客戶不合法交易，從客戶獲知其買賣某標的商品之相關訊息，有利益衝突或不當得利之虞者，不得從事該等標的之買賣", "(3)加強控管辦理財富管理業務之人員，不得與客戶約定分享利益或承擔損失，直接或間接要求、期約或收受不當之金錢、財物或其他利益，致影響其專業判斷與職務執行之客觀性", "(4)以上皆是"], ans: 4, note: "包含饋贈規範、迴避利益衝突、禁止不當得利。", law: "證券商辦理財富管理業務應注意事項"},
{id: "金融職業道德-277", text: "證券商辦理財富管理業務推廣時，下列敘述何者為正確？", options: ["(1)加強對客戶宣導金融常識，提升客戶風險辨識能力，俾利建立正確理財觀念", "(2)證券商宜採防止財富管理業務人員收受佣金回扣，或接受招待等不當利益之措施", "(3)證券商宜採防止財富管理業務人員未經客戶授權，擅自為客戶進行交易，或私自挪用客戶款項之措施", "(4)以上皆是"], ans: 4, note: "教育宣導、防弊措施皆為必要。", law: "證券商辦理財富管理業務應注意事項"},
{id: "金融職業道德-278", text: "對於證券商之業務人員而言，下列敘述何者正確？", options: ["(1)由於獲悉某上市公司內部未公開訊息，然受限於在證券商上班，因此，只能利用人頭戶來買賣該公司股票以獲取利益", "(2)對於客戶資產帳面價值的增減，為了不讓客戶壓力太大，善意的謊言是必要的", "(3)若客戶答應，除了公司契約外，私下亦可與客戶另訂一份", "(4)以上皆非"], ans: 4, note: "1, 2, 3皆為嚴重違規（內線交易、欺瞞、私下契約）。", law: "證券交易法/職業道德規範"},
{id: "金融職業道德-279", text: "證券商之業務人員執行業務應本誠實及信用原則，下列何者為其本於職業道德而不得有之行為？", options: ["(1)辦理受託買賣有價證券時，有隱瞞、詐欺或其他足以致人誤信之行為", "(2)以他人或親屬名義供客戶申購、買賣有價證券", "(3)接受客戶委託買賣有價證券時，同時以自己之計算為買入或賣出之相對行為", "(4)以上皆是"], ans: 4, note: "詐欺、人頭戶、對作皆禁止。", law: "證券商負責人與業務人員管理規則"},
{id: "金融職業道德-280", text: "一個具有誠信的證券商及其從業人員，其基本該遵守的行為規範為何？", options: ["(1)服務誠信", "(2)財務與公司的紀錄誠信", "(3)善盡保密之責", "(4)以上皆是"], ans: 4, note: "誠信涵蓋服務、紀錄與保密。", law: "職業道德規範"},
{id: "金融職業道德-281", text: "對證券商及其業務人員而言，下列何者屬於「正當利益」？", options: ["(1)佣金收入", "(2)私下收受一袋的黃金", "(3)私下收受供應商的回扣", "(4)與客戶間私下簽約的利益"], ans: 1, note: "合法的佣金收入是正當利益；其他皆為不當得利。", law: "職業道德規範"},
{id: "金融職業道德-282", text: "為促進證券業遵循法規及落實金融消費者保護，下列何者為證券業及其業務人員向客戶提供衍生性金融商品交易服務公平對待客戶應秉持之原則？", options: ["(1)應以善良管理人之注意義務及忠實義務，本誠實信用原則為之", "(2)客戶為自己的親朋好友，因此釋放出未公開資訊供其投資參考", "(3)對於與法律相關的文件，為保護客戶予以銷毀及竄改", "(4)為服務及保護客戶，提供客戶經過美化的績效報告"], ans: 1, note: "善良管理人、忠實義務、誠信。", law: "證券商辦理衍生性金融商品業務規範"},
{id: "金融職業道德-283", text: "證券商之業務人員執行業務應本誠實及信用原則，下列何者為其本於職業道德而不得有之行為？", options: ["(1)以職務上所知悉之消息，從事上市或上櫃有價證券買賣之交易活動", "(2)利用客戶名義或帳戶買賣有價證券", "(3)洩漏客戶委託事項及其他職務上所獲悉之秘密", "(4)以上皆是"], ans: 4, note: "內線交易、利用客戶帳戶、洩密皆禁止。", law: "證券商負責人與業務人員管理規則"},
{id: "金融職業道德-284", text: "證券商之業務人員執行業務應本誠實及信用原則下列敘述，何者為正確？", options: ["(1)考量客戶的身體不好，當管理資產發生減損時，選擇不告知", "(2)為了獲取更高利益，可以私下與客戶訂立契約", "(3)對客戶作贏利之保證或分享利益之證券買賣", "(4)受理辦妥受託契約之客戶買賣有價證券"], ans: 4, note: "(1)隱瞞；(2)私下契約；(3)保證獲利，皆違規。(4)是正常業務程序。", law: "證券商管理規則"},
{id: "金融職業道德-285", text: "證券商之業務人員執行業務應本誠實及信用原則，下列何者為其本於職業道德而不得有之行為？", options: ["(1)依據法令規定執行業務", "(2)招攬、媒介、促銷未經核准之有價證券或其衍生性商品", "(3)依據客戶委託事項及條件，執行有價證券之買賣", "(4)受理客戶本人開戶"], ans: 2, note: "銷售地下金融商品（未經核准）違法。", law: "證券交易法"},
{id: "金融職業道德-286", text: "證券商之業務人員執行業務應本誠實及信用原則，下列何者為其本於職業道德而不得有之行為？", options: ["(1)挪用或代客戶保管有價證券、款項、印鑑或存摺", "(2)向不特定多數人推介買賣特定之股票", "(3)利用客戶名義或帳戶買賣有價證券", "(4)以上皆是"], ans: 4, note: "挪用、公開推介個股、利用帳戶皆禁止。", law: "證券商負責人與業務人員管理規則"},
{id: "金融職業道德-287", text: "金融從業人員應忠實執行業務，以下何種行為是錯誤的？", options: ["(1)不得因執行業務而享有個人不當利益", "(2)故意設計交易行為以掩飾利害關係人交易", "(3)不得對客戶有虛偽、詐欺行為", "(4)不得對客戶有足致客戶誤信之行為"], ans: 2, note: "掩飾利害關係交易違反誠信與揭露義務。", law: "金融控股公司法/銀行法"},
{id: "金融職業道德-288", text: "金融從業人員從事信託業務，以下何種行為是錯誤的?", options: ["(1)具運用決定權人，如有不法之利益時，應拒絕投資運用", "(2)提供客戶內線交易訊息", "(3)明知不適當之投資，不得故意建議客戶投資", "(4)有不法利益，不得故意建議客戶進行交易"], ans: 2, note: "提供內線訊息違法。", law: "證券交易法"},
{id: "金融職業道德-289", text: "金融從業人員為客戶管理運用財產，管理運用之利益應如何處理？", options: ["(1)不得以任何名義享有利益", "(2)得與他人交換而享有利益", "(3)得與客戶以代付差旅費方式分享利益", "(4)得與客戶約定收益共享或損失分擔"], ans: 1, note: "除契約約定之合法報酬外，不得享有其他利益（禁止不當得利）。", law: "信託業法/證券投資信託及顧問法"},
{id: "金融職業道德-290", text: "金融從業人員執行業務，以下何種行為是正確的？", options: ["(1)有偽造之行為", "(2)有詐欺之行為", "(3)有足致客戶誤信之行為", "(4)應秉忠實信用原則處理事務"], ans: 4, note: "忠實信用原則。", law: "職業道德規範"},
{id: "金融職業道德-291", text: "金融從業人員不得有下列何者足致客戶誤信之行為？", options: ["(1)偽造相關文件", "(2)故意誤導客戶所投資運用標的之風險", "(3)故意誤導客戶收取之費用及其付款方式", "(4)以上皆是"], ans: 4, note: "偽造、誤導風險、誤導費用皆屬誤信行為。", law: "金融消費者保護法"},
{id: "金融職業道德-292", text: "金融從業人員執行業務何種行為符合誠實原則？", options: ["(1)對於客戶未來投資報酬，故意提供不適當之預測", "(2)誤導客戶可能之績效", "(3)對所投資產品之價值正確詳實記錄", "(4)誤導客戶所投資運用標的之風險"], ans: 3, note: "正確詳實記錄。", law: "職業道德規範"},
{id: "金融職業道德-293", text: "以下敘述何者為非？", options: ["(1)信託關係是高度信賴關係，客戶辦理業務首重公司信用", "(2)委託投資關係有賴客戶對公司管理資產能力之肯定", "(3)辦理業務應先爭取業績，無須告訴客戶相關風險", "(4)辦理業務應維護消費者權益"], ans: 3, note: "必須告知風險。", law: "金融消費者保護法"},
{id: "金融職業道德-294", text: "應以誠信之態度提供專業服務，誠信係由誠實與公正所組合，不能附屬於個人利益，以上敘述屬於何項原則？", options: ["(1)資訊公開原則", "(2)誠信原則", "(3)客觀性原則", "(4)能力原則"], ans: 2, note: "誠信原則。", law: "職業道德規範"},
{id: "金融職業道德-295", text: "金融從業人員對不當利益應：", options: ["(1)可接受招待", "(2)不可收現金，有價證券則不限", "(3)不得接受", "(4)可收禮品"], ans: 3, note: "不當利益應拒絕。", law: "廉政倫理規範"},
{id: "金融職業道德-296", text: "金融服務業稽核人員得兼任下列何種職務？", options: ["(1)銀行存款櫃檯人員", "(2)證券商債券交易員", "(3)保險公司核保人員", "(4)以上皆非"], ans: 4, note: "稽核人員應獨立超然，不得兼任營運職務。", law: "金融控股公司及銀行業內部控制及稽核制度實施辦法"},
{id: "金融職業道德-297", text: "下列何者為正當行為？", options: ["(1)利用本公司或個人名義與客戶間有款券借貸關係或挪用情事、為款券借貸之媒介", "(2)代理客戶保管存摺、印鑑或有價證券", "(3)未經核准，不得全權代理客戶買賣有價證券", "(4)利用為客戶操作金融商品之便，為自身利益作價"], ans: 3, note: "「不得全權代理」是法規限制，遵守此限制為正當行為。(1)(2)(4)皆為違規行為。", law: "證券商負責人與業務人員管理規則"},
{id: "金融職業道德-298", text: "下列何者為金融從業人員應有之行為？", options: ["(1)私自從事未經主管機關核准之業務", "(2)故意隱瞞有重大喪失債信情事", "(3)隱匿尚有未執行完畢之刑事責任", "(4)不得私自於同業兼任相關職務"], ans: 4, note: "競業禁止與專職原則。", law: "證券商負責人與業務人員管理規則"},
{id: "金融職業道德-299", text: "金融從業人員不得有下列何種行為？", options: ["(1)參加專業證照之考試以提昇自身素質", "(2)配合政府金融政策，促進經濟發展，善盡社會責任", "(3)利用客戶名義或帳戶，為自己從事交易", "(4)以上皆是"], ans: 3, note: "(1)(2)為鼓勵行為，(3)為禁止行為。", law: "證券商負責人與業務人員管理規則"},
{id: "金融職業道德-300", text: "金融從業人員與客戶間之往來：", options: ["(1)不得接受禮品或收取任何有價值物品", "(2)可收禮品", "(3)可收現金", "(4)可收現金及禮品"], ans: 1, note: "原則上不得收受，以免影響專業判斷或產生利益衝突（除依公司規定之小額禮品外，本題採嚴格標準）。", law: "職業道德規範"},
{id: "金融職業道德-301", text: "下列何者為金融從業人員爭取業務時之禁止行為？", options: ["(1)與往來客戶或相關人員有不當利益之約定", "(2)收受往來客戶或相關人員之不當利益", "(3)(1)、(2)皆是", "(4)(1)、(2)皆非"], ans: 3, note: "禁止賄賂、回扣或不當利益輸送。", law: "銀行法/證券商負責人與業務人員管理規則"},
{id: "金融職業道德-302", text: "金融從業人員應遵守忠實義務原則，故：", options: ["(1)仍可從事內線交易", "(2)禁止短線交易，禁止不當得利", "(3)應與客戶發生衝突", "(4)不一定要遵守法規"], ans: 2, note: "忠實義務包含避免利益衝突、禁止利用職務之便不當得利或進行短線交易。", law: "證券交易法/公司法"},
{id: "金融職業道德-303", text: "金融機構對交易對手承諾事項負有進行交易之義務，係基於下列何種原則？", options: ["(1)專業原則", "(2)保密原則", "(3)忠實誠信原則", "(4)管理謹慎原則"], ans: 3, note: "信守承諾為誠信原則之核心。", law: "民法/誠實信用原則"},
{id: "金融職業道德-304", text: "對公司有控制能力之法人股東，應訂定相關之執行職務守則以為遵循，此為擔任董事、監察人之何種義務？", options: ["(1)忠實與注意義務", "(2)保密義務", "(3)善良管理義務", "(4)守法義務"], ans: 1, note: "董監事對公司負有忠實義務與善良管理人注意義務。", law: "公司法第23條"},
{id: "金融職業道德-305", text: "對公司有控制能力之法人股東或其代表人，於參加股東會應本於何項原則，行使其投票權？", options: ["(1)誠信原則", "(2)能力原則", "(3)善良管理原則", "(4)守法原則"], ans: 1, note: "行使投票權應本於誠信，不得濫用權力損害公司或其他股東權益。", law: "上市上櫃公司治理實務守則"},
{id: "金融職業道德-306", text: "金融從業人員應遵守善良管理原則，故應盡善良管理人之責任及注意義務。以下何者為是？", options: ["(1)不管客戶風險", "(2)不提供客戶服務", "(3)對客戶說謊", "(4)為客戶適度分散風險，並提供最佳之專業服務"], ans: 4, note: "善良管理人應為客戶利益著想，包含風險管理與專業服務。", law: "民法/信託法"},
{id: "金融職業道德-307", text: "身為金融從業人員應保持尊嚴，不得有玷辱職業信譽之任何行為，且與委託人間應有之約定，應如何應對？", options: ["(1)可以違反", "(2)視情況違反", "(3)不得違反", "(4)以上皆非"], ans: 3, note: "信守約定，維護職業信譽。", law: "職業道德規範"},
{id: "金融職業道德-308", text: "下列何者係金融從業人員秉持誠實信用原則之行為？", options: ["(1)假借銀行存款名義招攬保險", "(2)以高預定利率作不實比較，誘使消費者抱持錯誤認知而購買保險", "(3)不以單獨強調或與其他金融商品比較之方式誤導消費者", "(4)以上皆是"], ans: 3, note: "誠信原則要求不誤導、不誇大、不進行不當比較。", law: "金融消費者保護法"},
{id: "金融職業道德-309", text: "客戶將資產委託給金融從業人員從事投資，身為一位優秀的金融從業人員，應為公司及客戶盡何種責任及義務？", options: ["(1)善良管理人之責任及注意義務", "(2)提供內線交易", "(3)隨時透露客戶財產狀況給其他人", "(4)以上皆非"], ans: 1, note: "受託人應盡善良管理人注意義務。", law: "民法/信託法"},
{id: "金融職業道德-310", text: "關於金融從業人員執行業務時，下列敍述何者正確？", options: ["(1)勸誘客戶解約他公司之商品", "(2)將他公司之商品作不公平之比較", "(3)不散播不實言論及文宣", "(4)販售非經主管機關核准之商品"], ans: 3, note: "誠信與公平競爭原則。", law: "公平交易法"},
{id: "金融職業道德-311", text: "金融從業人員若有代為收付金錢之行為者應遵守下列何項行為規範？", options: ["(1)收現但轉以自己之支票付款", "(2)收到客戶款項應馬上歸繳公司", "(3)收到隔幾天再給公司", "(4)存於自己帳戶再處理"], ans: 2, note: "代收款項應立即繳回，不得挪用或暫存個人帳戶。", law: "業務人員管理規則"},
{id: "金融職業道德-312", text: "金融從業人員銷售無形的金融商品，因商品無樣品可試用，必須透過從業人員說明，下列敘述何者為非？", options: ["(1)對商品內容應多做說明使客戶了解", "(2)應遵守誠實信用原則", "(3)商品已售出，可以不必再理會客戶", "(4)不斷地充實本身的專業知識，提供更好的服務"], ans: 3, note: "售後服務是專業與誠信的一環，不可售後不理。", law: "職業道德規範"},
{id: "金融職業道德-313", text: "有關忠實義務原則下列何者正確？", options: ["(1)客戶利益優先", "(2)衝突避免、禁止短線交易", "(3)禁止不當得利、公平處理", "(4)以上皆是"], ans: 4, note: "忠實義務涵蓋客戶優先、避免衝突、公平對待。", law: "證券投資信託及顧問法"},
{id: "金融職業道德-314", text: "金融從業人員對於公司之相關資產，不應採取何種態度？", options: ["(1)以非法手段取得後成為私人財產", "(2)使用於正當目的", "(3)無論有形或無形資產皆有責任加以保護", "(4)不得疏忽大意或浪費"], ans: 1, note: "侵占公司資產涉及刑責。", law: "刑法(業務侵占)"},
{id: "金融職業道德-315", text: "金融從業人員在銷售金融商品時，應對銷售之商品詳細說明，不得為業績而隱藏不告知金融商品應有之風險，係屬何種原則？", options: ["(1)誠實信用原則", "(2)內線交易原則", "(3)服務原則", "(4)善良風俗原則"], ans: 1, note: "隱匿風險違反誠實信用原則。", law: "金融消費者保護法"},
{id: "金融職業道德-316", text: "金融從業人員基於招攬業務時，應秉持誠實信用原則，下列行為何者不屬誠實信用原則？", options: ["(1)客戶對商品有不懂之處應再仔細說明", "(2)商品一旦售出，即使客戶對商品內容有疑問也置之不理", "(3)客戶交給我們的資料，不可隨意散播", "(4)以上皆是"], ans: 2, note: "拒絕解答客戶疑問違反誠信與服務原則。", law: "職業道德規範"},
{id: "金融職業道德-317", text: "金融從業人員對於客戶資料，不應有下列何種行為？", options: ["(1)妥為保管", "(2)不得出售", "(3)應有保密之義務", "(4)提供同業參考"], ans: 4, note: "洩漏資料給同業違反保密義務與個資法。", law: "個人資料保護法"},
{id: "金融職業道德-318", text: "信用卡發卡機構應約束業務代表不得從事下列行為？", options: ["(1)故意毀損同業之申請書架", "(2)故意破壞同業之各項宣傳品", "(3)洩露信用卡申請人之個人資料", "(4)以上皆是"], ans: 4, note: "破壞同業物品是不正當競爭；洩露個資違法。", law: "信用卡業務機構管理辦法"},
{id: "金融職業道德-319", text: "金融機構登載及製播廣告，不得有下列何款行為？", options: ["(1)損害同業信譽之廣告", "(2)使用類似大眾所熟悉之他人商標，以混淆消費者", "(3)誤導消費者不正確之價值及理財觀念", "(4)以上皆是"], ans: 4, note: "廣告應真實、公平、合法。", law: "金融服務業廣告規範"},
{id: "金融職業道德-320", text: "金融從業人員對於客戶資料處理方式，以下何者為非？", options: ["(1)不得對外任加討論", "(2)不得任意對外發表", "(3)得對無權過問之同仁洩漏", "(4)不得擅自利用客戶資料為自己進行交易而謀取利益"], ans: 3, note: "保密原則及於公司內部，非業務相關人員不得知悉（Need-to-know basis）。", law: "個人資料保護法"},
{id: "金融職業道德-321", text: "金融從業人員得以何種名義，向顧客收受不當佣金、酬金？", options: ["(1)個人", "(2)經理", "(3)主管機關", "(4)以上皆非"], ans: 4, note: "不得以任何名義收受不當利益。", law: "銀行法/證券交易法"},
{id: "金融職業道德-322", text: "金融從業人員不宜參與下列行為或交易？", options: ["(1)利用短線操作參與投機性之證券交易", "(2)與其他非個人財力所及之有關投機性之交易", "(3)藉親友之名義從事交易", "(4)以上皆是"], ans: 4, note: "從業人員應避免投機交易及利用人頭戶，以維持專業形象與避免利益衝突。", law: "職業道德規範"},
{id: "金融職業道德-323", text: "金融從業人員應依何項考量辦理徵信？", options: ["(1)誠信公正原則", "(2)個人好惡", "(3)公司規模大小", "(4)政商關係良好與否"], ans: 1, note: "徵信應客觀、公正、誠實。", law: "銀行授信準則"},
{id: "金融職業道德-324", text: "金融從業人員辦理全權委託業務應遵守事項，下列敘述何者為非？", options: ["(1)得向顧客收受不當佣金、酬金", "(2)應避免不當銷售或推介之行為", "(3)不得向他人出售、洩漏客戶資料", "(4)應遵守相關法令規定"], ans: 1, note: "收受不當佣金酬金是禁止的。", law: "證券投資信託及顧問法"},
{id: "金融職業道德-325", text: "金融從業人員應尊重消費者合法權益，當其權益受到侵害時，應如何處理？", options: ["(1)不予受理", "(2)請客戶自行負擔損失", "(3)秉誠信原則妥適處理", "(4)應視與客戶之交情決定受理與否"], ans: 3, note: "遇爭議應積極妥適處理。", law: "金融消費者保護法"},
{id: "金融職業道德-326", text: "金融從業人員辦理授信業務，以下敘述何者正確？", options: ["(1)與客戶洽談應保持懇切之態度", "(2)應本平等互惠及誠信公平原則", "(3)將有關約定事項載明於書面，並讓客戶充分瞭解", "(4)以上皆是"], ans: 4, note: "態度懇切、誠信公平、書面約定皆為授信業務規範。", law: "銀行公會授信準則"},
{id: "金融職業道德-327", text: "金融從業人員在向客戶推介或銷售金融商品時，以下敘述何者有誤？", options: ["(1)不得委託無相關金融證照之人員從事之", "(2)應審酌客戶年齡等情況予以推介或銷售適當之金融商品", "(3)善盡充分告知投資風險內容之職責", "(4)為賺取佣金，儘量勸誘客戶於短期間內，以多次贖回、再申購金融商品之方式"], ans: 4, note: "勸誘客戶短線進出（Churning）以賺取佣金是嚴重違規。", law: "金融消費者保護法/證券商管理規則"},
{id: "金融職業道德-328", text: "信用卡發卡機構辦理催收欠款業務時，以下敘述何者正確？", options: ["(1)不得違反公共利益", "(2)不得以損害他人為主要目的", "(3)應依誠實及信用原則行使權利", "(4)以上皆是"], ans: 4, note: "催收行為需合法合規。", law: "信用卡業務機構管理辦法"},
{id: "金融職業道德-329", text: "信用卡發卡機構對於信用卡業務需要所登載及製播廣告，應遵守下列何者事項？", options: ["(1)避免造成消費者有不當擴張個人信用之價值觀", "(2)必須依據法令規範確實登載規定警語", "(3)必須充分揭露費用及利率", "(4)以上皆是"], ans: 4, note: "廣告不得鼓勵過度消費，且需揭露資訊。", law: "信用卡業務機構管理辦法"},
{id: "金融職業道德-330", text: "金融從業人員於推介或銷售投資型金融商品時，應依下列原則辦理？", options: ["(1)應本最大誠信及充分揭露原則", "(2)不得藉主管機關對金融商品之核准、核備或備查，而使消費者認為政府已對該金融商品提供保證", "(3)不得對於過去之業績作誇大不實之宣傳，或對同業為攻訐之廣告", "(4)以上皆是"], ans: 4, note: "誠信、不保證獲利、不誇大攻訐。", law: "投資型保險商品銷售應注意事項"},
{id: "金融職業道德-331", text: "投信投顧從業人員為廣告、公開說明會及其他營業促銷活動時，不得有下列何種行為? ", options: ["(1)藉主管機關對某項產品或業務之核准，作為證實該申請事項或誤導投資人認為主管機關已保證投資價值或獲利之宣傳", "(2)提供贈品或其他利益以招攬客戶", "(3)對同業為攻訐之廣告", "(4)以上皆是"], ans: 4, note: "核准不代表保證；禁止贈品招攬；禁止攻訐同業。", law: "投信投顧事業廣告及營業活動行為規範"},
{id: "金融職業道德-332", text: "證券投信事業對於有業務往來的證券商，應採何種管理事項?", options: ["(1)應簽訂書面約定，將退還手續費捐予慈善機構", "(2)定期對財務、業務及服務品質作評比", "(3)除退還的手續費之外，得接受證券商的其它利益", "(4)以上皆是"], ans: 2, note: "應基於最佳執行原則（Best Execution）評選券商，而非基於退佣。", law: "證券投資信託基金管理辦法"},
{id: "金融職業道德-333", text: "依據忠實誠信原則，下列哪一項非投信投顧從業人員執行業務時應有的行為？", options: ["(1)遵守契約規定", "(2)以善良管理人之注意義務本誠實信用原則執行業務", "(3)考慮客戶的財務狀況適度分散投資", "(4)依所有人的最佳利益行事，包含客戶、公司及股東"], ans: 4, note: "忠實義務要求以「客戶」利益為優先，當客戶利益與公司股東利益衝突時，應以客戶為重。", law: "證券投資信託及顧問法"},
{id: "金融職業道德-334", text: "金融從業人員對誰負有忠實誠信義務？", options: ["(1)所有投資大眾", "(2)客戶", "(3)公司股東", "(4)以上皆是"], ans: 2, note: "對「客戶」負有忠實誠信義務（Fiduciary Duty）。", law: "證券投資信託及顧問法"},
{id: "金融職業道德-335", text: "發發證券公司向基金經理人小王表示，如果在該公司下單量三個月內成長兩成，將免費供其使用在陽明山的渡假別墅一星期。小王完整向公司報告了這件事，三個月後在發發證券的下單量成長達到了兩成，小王於是接受了這個渡假邀約。小王有違反忠實誠信原則嗎？", options: ["(1)有，小王是基金經理人不得接受證券商退還之手續費或其他利益", "(2)沒有，因為這不是金錢餽贈", "(3)沒有，因為他已經向公司報告", "(4)沒有，因為他可以接受第三人提供的間接利益"], ans: 1, note: "基金經理人不得收受退佣或任何利益（Soft Dollar需歸入基金），即使報告公司也不得私受。", law: "證券投資信託及顧問法"},
{id: "金融職業道德-336", text: "金融服務業從事投資顧問事業其從業人員應以善良管理人之注意處理受任事務，除應遵守主管機關發布之相關函令外，並應確實遵守何種事項？", options: ["(1)不得收受委託者資金，代理從事證券投資行為", "(2)除法令另有規定或委託者另有指示外，對因委任關係而得知委託者之財產狀況及其他之個別情況，應保守秘密，不得洩漏予任何第三人", "(3)不得另與委託者為證券投資收益共享、損失分擔之約定", "(4)以上皆是"], ans: 4, note: "投顧不可直接代操（收受資金）、需保密、不可約定損益。", law: "證券投資信託及顧問法"},
{id: "金融職業道德-337", text: "李四是一位證券分析師，於電視上向觀眾分析產業趨勢時，宣稱他取得國外某知名大學商學院MBA 學位，但事實上，李四僅於該校取得商學院學分課程，且真實學歷僅限於國內大學經濟系學士學位。試問李四違反以下哪一原則？", options: ["(1)專業原則", "(2)保密原則", "(3)公平競爭原則", "(4)忠實誠信原則"], ans: 4, note: "學歷造假違反誠實信用原則。", law: "誠實信用原則"},
{id: "金融職業道德-338", text: "忠實誠信義務原則之主要涵義為：", options: ["(1)客戶利益優先", "(2)公司利益優先", "(3)個人利益優先", "(4)以上皆是"], ans: 1, note: "忠實義務即Fiduciary Duty，核心為客戶利益優先。", law: "職業道德規範"},
{id: "金融職業道德-339", text: "金融從業人員發現保險商品條款涉及被保險人利益之解釋，如有爭議時，應如何處理？", options: ["(1)作有利保險公司之解釋", "(2)作有利被保險人之解釋", "(3)以訴訟方式處理", "(4)不需理會"], ans: 2, note: "保險法第54條：如有疑義時，以作有利於被保險人之解釋為原則。", law: "保險法第54條"},
{id: "金融職業道德-340", text: "金融從業人員從事保險業務招攬時，明知道保險標的之危險已消滅，仍要求客戶投保，則保險契約：", options: ["(1)無效", "(2)有效", "(3)不得解除", "(4)以上皆非"], ans: 1, note: "保險法第51條：保險契約訂立時，保險標的之危險已發生或已消滅者，其契約無效。", law: "保險法第51條"},
{id: "金融職業道德-341", text: "金融從業人員從事保險業務招攬時，其利益與客戶之利益無法兼顧面臨取捨時，從業人員應如何處理？", options: ["(1)以自身利益為重", "(2)給予客戶專業分析，爭取合理之利益", "(3)以達成公司要求為準則", "(4)以客戶意見為準，忽略自身之專業"], ans: 2, note: "應在專業基礎上，為客戶爭取合理利益（雙贏），並以誠信為原則。", law: "職業道德規範"},
{id: "金融職業道德-342", text: "金融服務業推動重點業務或專案，不符客戶或從業人員之利益時，從業人員應採取之態度？", options: ["(1)消極抵抗", "(2)設法將利益移轉給客戶", "(3)不合則去", "(4)勇於建言，提供個人專業意見"], ans: 4, note: "勇於建言是專業人員應有的態度。", law: "職業道德規範"},
{id: "金融職業道德-343", text: "金融從業人員招攬業務時遇市場對手競爭時，應保持如何態度？", options: ["(1)惡意攻訐同業", "(2)以平常心，給予客戶專業建議", "(3)刻意扭曲，陷人錯誤判斷", "(4)隱惡揚善，規避責任"], ans: 2, note: "公平競爭，不攻訐同業，專注專業服務。", law: "公平交易法/職業道德規範"},
{id: "金融職業道德-344", text: "金融從業人員從事保險業務招攬時，除考慮到自身利益外，以下哪一項更加必須顧到？", options: ["(1)公司利益", "(2)社會責任", "(3)業績成長", "(4)以上皆非"], ans: 2, note: "保險具有社會互助性質，從業人員應有社會責任感。", law: "企業社會責任"},
{id: "金融職業道德-345", text: "金融從業人員同時具有核保及理賠人員資格者，是否可同時擔任二者職務？", options: ["(1)可以", "(2)只要所屬保險公司允許則可", "(3)僅得擇一擔任，以避免利益衝突", "(4)依其個人意願"], ans: 3, note: "核保與理賠須職能分工，以避免利益衝突與弊端（球員兼裁判）。", law: "保險業內部控制及稽核制度實施辦法"},
{id: "金融職業道德-346", text: "金融從業人員同時兼有保險代理人、經紀人資格者，是否可同時申請二者執業證書？", options: ["(1)可以", "(2)為避免利益衝突，僅得擇一", "(3)視情況而定", "(4)依其個人意願"], ans: 2, note: "代理人代表公司，經紀人代表客戶，角色衝突，僅得擇一。", law: "保險代理人管理規則/保險經紀人管理規則"},
{id: "金融職業道德-347", text: "金融從業人員為公司內部人員執行證券期貨經紀業務時，為避免利益衝突：", options: ["(1)應優先執行公司內部人員之委託", "(2)應依公司內部人員及客戶委託時間之先後順序執行", "(3)應依委託金額多寡決定執行順序", "(4)應由金融從業人員自行決定"], ans: 2, note: "原則上應優先執行客戶，但若採時間優先原則（Price-Time Priority），則依先後順序。", law: "證券商內部控制制度"},
{id: "金融職業道德-348", text: "張三因職務得知公司即將與某公司合併為一則大利多消息，下列何種行為較適當：", options: ["(1)利用他人名義大筆買進公司股票", "(2)私下告知客戶該項訊息，使其蒙利", "(3)以配偶名義大筆買進公司股票", "(4)在消息未公開前或公開後18 小時內，不得自行或以他人名義買入公司股票"], ans: 4, note: "內線交易禁止規定。", law: "證券交易法第157-1條"},
{id: "金融職業道德-349", text: "金融服務機構之自營部門與經紀業務部門：", options: ["(1)應個別獨立作業，且業務資訊不可互為流用", "(2)不須個別獨立作業，惟業務資訊不可互為流用", "(3)應個別獨立作業，惟業務資訊可互為流用", "(4)不須個別獨立作業，且業務資訊可互為流用"], ans: 1, note: "防火牆機制（Chinese Wall），防止利益衝突與內線交易。", law: "證券商內部控制制度"},
{id: "金融職業道德-350", text: "當金融從業人員張三的客戶在未告知其不滿的情況下，轉向李四交易時，張三應：", options: ["(1)醜化客戶，告訴李四，該客戶是位麻煩人物", "(2)聯合其他同事排擠李四，讓李四離職", "(3)試圖了解原因並虛心改進，以提升服務品質", "(4)醜化李四，向主管告狀，宣稱李四行為惡劣"], ans: 3, note: "自我檢討與改進是專業態度。", law: "職業道德規範"},
{id: "金融職業道德-351", text: "金融從業人員張三這個月的業績只差500 萬元就達到業績目標，為能達到門檻領到目標獎金，張三應採用下列何種方式較為適當：", options: ["(1)勸誘客戶李四申購商品並保證獲利", "(2)商請另一位從業人員轉單給自己，約定獎金分享", "(3)借用客戶名義申購商品，領到獎金再贖回", "(4)積極拓展業務、爭取客戶，以達到業績目標"], ans: 4, note: "正當途徑爭取業績。", law: "職業道德規範"},
{id: "金融職業道德-352", text: "金融從業人員因職務關係獲悉足以影響金融商品價格未公開之重大消息時：", options: ["(1)應即以書面報告並列管保密", "(2)應廣為眾知，造福親朋好友", "(3)應立即為客戶交易，牟取其最大利益", "(4)應立即利用他人名義交易，牟取個人最大利益"], ans: 1, note: "通報並保密，防止內線交易。", law: "證券交易法"},
{id: "金融職業道德-353", text: "金融從業人員執行業務時，下列敘述何者不當?", options: ["(1)應善加利用職務所得訊息，為本身牟取利益", "(2)不以職務所得訊息，為本身牟取利益", "(3)應以客戶利益優先，不以個人業績為考量", "(4)不以本身利益仲介客戶從事非法交易"], ans: 1, note: "利用職務訊息牟利違反忠實義務。", law: "證券交易法"},
{id: "金融職業道德-354", text: "有關金融從業人員行為之敘述，何者正確?", options: ["(1)可要求客戶提供金錢餽贈或招待", "(2)可要求供應商提供金錢餽贈或招待", "(3)(1)及(2)皆可", "(4)以上皆非"], ans: 4, note: "皆不可要求不當餽贈。", law: "廉政倫理規範"},
{id: "金融職業道德-355", text: "金融從業人員獲悉已影響相關客戶利益之訊息時：", options: ["(1)依客戶之重要性決定是否通知", "(2)依與客戶之交情決定是否通知", "(3)不須做任何處理", "(4)應盡可能公平合理的通知每一位客戶"], ans: 4, note: "公平對待所有客戶。", law: "金融服務業公平待客原則"},
{id: "金融職業道德-356", text: "下列何者不是金融服務事業之從業人員關於職業道德的基本條件？", options: ["(1)法令規章遵循", "(2)專業之資格、技能、態度、與服務", "(3)擅長交際應酬", "(4)品德、誠信、責任、與保密"], ans: 3, note: "交際應酬非道德基本條件。", law: "職業道德規範"},
{id: "金融職業道德-357", text: "若發生金融服務業之業務人員對其與客戶之利益衝突或不同客戶間之利益衝突情事時，應如何處理：", options: ["(1)以個別客戶對公司之貢獻度為依據", "(2)以契約約定為依據", "(3)以多數客戶之利益為依據", "(4)以損益標準為處理原則"], ans: 2, note: "依契約約定處理，若無約定應以公平原則處理（通常避免衝突發生）。本題標準答案選(2)。", law: "證券投資信託及顧問法"},
{id: "金融職業道德-358", text: "金融服務業之業務人員面對本身業績與公司規定衝突時，應該如何面對？", options: ["(1)為了本身業績考量，可以忽略它", "(2)以公司的規定為主", "(3)先把公司提供的金融商品或服務銷售出去，再向上級反應", "(4)以上皆非"], ans: 2, note: "遵守公司規定與法規。", law: "職業道德規範"},
{id: "金融職業道德-359", text: "在證券業所提供的業務服務過程中，下列那種情事不屬於利益衝突的範圍？", options: ["(1)符合法令之受託買賣上市櫃股票交易", "(2)提供給客戶之金融商品或服務，與公司有直接或間接之不合規利益", "(3)未經公司同意，擅自雇用自己的親友在公司任職", "(4)未依公司規定在外自行開業或兼任其他職務"], ans: 1, note: "合法交易為正常業務，無利益衝突。", law: "證券交易法"},
{id: "金融職業道德-360", text: "防止利益衝突是從事金融服務業職業道德的要項，何謂利益衝突？", options: ["(1)各獨立的個體，會因某一方的利益被歸優先，而使另一方可能蒙受損失", "(2)利益衝突一定會造成雙方獲利", "(3)利益衝突一定是某一方觸犯法律", "(4)以上皆非"], ans: 1, note: "利益衝突定義：一方利益與另一方義務或利益相牴觸。", law: "利益衝突迴避法"},
{id: "金融職業道德-361", text: "防止利益衝突是從事金融服務業職業道德的要項，利益衝突若以代理制度來解釋，是指那兩方面的人發生利益衝突？", options: ["(1)受益人及受託人", "(2)受託人及委託人", "(3)受益人及委託人", "(4)受託人及經理人"], ans: 2, note: "代理人（受託人）與本人（委託人）之利益衝突。", law: "代理理論"},
{id: "金融職業道德-362", text: "防止利益衝突是從事金融服務業職業道德的要項，以下何項屬於利益衝突的含意？", options: ["(1)數種正當利益存在有彼此競爭矛盾的現象", "(2)利益衝突屬於一種狀態或情境", "(3)避免利益衝突亦屬道德範疇", "(4)以上皆是"], ans: 4, note: "利益衝突是一種情境，管理它屬於道德範疇。", law: "職業道德規範"},
{id: "金融職業道德-363", text: "防止利益衝突是從事金融服務業職業道德的要項，在利益衝突當中若與親屬牽涉到關係，當中的親屬不包括：", options: ["(1)子女", "(2)父母", "(3)配偶", "(4)房客"], ans: 4, note: "房客非親屬。", law: "公職人員利益衝突迴避法"},
{id: "金融職業道德-364", text: "防止利益衝突是從事金融服務業職業道德的要項，下列那種情況可能發生利益衝突？", options: ["(1)為個人私利竊取公司機密", "(2)透過公司財產或資訊以取得獲利", "(3)與公司為業務之競爭", "(4)以上皆是"], ans: 4, note: "竊密、私利、競業皆屬利益衝突。", law: "公司法/證券交易法"},
{id: "金融職業道德-365", text: "防止利益衝突是從事金融服務業職業道德的要項，下列何種狀況屬於利益衝突的問題？", options: ["(1)經辦人員常常接受供應商招待、私下收受回扣", "(2)員工有轉換跑道的打算", "(3)有親戚朋友在同業任職", "(4)參加同業聯誼活動"], ans: 1, note: "接受招待回扣影響公正性，屬利益衝突。", law: "廉政倫理規範"},
{id: "金融職業道德-366", text: "防止利益衝突是從事金融服務業職業道德的要項，關於利益衝突所謂之「利益」，若將利益分成財產上利益，及非財產上利益，下列何者屬非財產上的利益？", options: ["(1)汽車及房子", "(2)現金、存款、外幣、有價證券", "(3)利用公司資源，進而獲取跳槽機會", "(4)具有經濟價值或得以金錢交易取得之利益"], ans: 3, note: "職位、機會屬非財產利益。", law: "公職人員利益衝突迴避法"},
{id: "金融職業道德-367", text: "為了防範公司可能與客戶或員工發生利益衝突的問題，下列何者是公司的內部管理規章應規範的內容？", options: ["(1)組織架構與人員資格條件", "(2)風險管理制度", "(3)內部控制制度", "(4)以上皆是"], ans: 4, note: "內控、風管、組織皆需考量利益衝突。", law: "公開發行公司建立內部控制制度處理準則"},
{id: "金融職業道德-368", text: "證券商為因應金融消費者客戶申訴問題，公司內部應該建制何種機制？", options: ["(1)成立客戶申訴中心", "(2)加強對相關經辦及業務人員的教育宣導", "(3)強化售後服務", "(4)以上皆是"], ans: 4, note: "申訴處理機制。", law: "金融消費者保護法"},
{id: "金融職業道德-369", text: "在證券市場中，下列何者存在有利害衝突關係？", options: ["(1)公開發行公司與證券承銷商之間對於公司發行證券募集資金承銷價格之訂定", "(2)上市(櫃)公司與證券投資人之間對於公司資訊公開之期求", "(3)上市(櫃)公司經營者與股東之間對於公司利益之考量", "(4)以上皆是"], ans: 4, note: "發行價（高低）、資訊公開（多寡）、代理問題皆存在衝突。", law: "證券市場理論"},
{id: "金融職業道德-370", text: "以下何者之間於辦理業務時可能有利益衝突情事？", options: ["(1)行使投資運用時客戶與從業人員間", "(2)銷售商品時客戶與其他客戶間", "(3)辦理業務時客戶與金融集團其他子公司間", "(4)以上皆是"], ans: 4, note: "各方利益不一致時即可能產生衝突。", law: "金融控股公司法"},
{id: "金融職業道德-371", text: "金融從業人員辦理業務應防止利益衝突，下列所述何者為錯誤的？", options: ["(1)應注意業務特性不同所造成之利益衝突", "(2)應注意不同部門資產移轉產生利益衝突", "(3)應注意部門間資訊可以無限制互相交流", "(4)應注意利益不當輸送"], ans: 3, note: "部門間資訊交流應受限制（防火牆），不可無限制。", law: "金融控股公司及銀行業內部控制及稽核制度實施辦法"},
{id: "金融職業道德-372", text: "以下何種行為有利益衝突之虞？", options: ["(1)向放款客戶強力推銷無法賣出之金融商品", "(2)為全權委託客戶購入公司本身股票", "(3)將客戶之信託財產投資公司利害關係人發行之股票", "(4)以上皆是"], ans: 4, note: "搭售、自利交易、關係人交易皆有衝突。", law: "銀行法/證券投資信託及顧問法"},
{id: "金融職業道德-373", text: "以下何者不得參與投資決策？", options: ["(1)與業務相關人員有利害關係者", "(2)投資決策人員", "(3)具有運用決定權人", "(4)以上皆是"], ans: 1, note: "有利害關係者應迴避。", law: "證券投資信託及顧問法"},
{id: "金融職業道德-374", text: "應如何建置利害關係人檔案？", options: ["(1)隨便填填交差了事", "(2)應詳實提供資料並定期更新", "(3)稽核人員查到再提供", "(4)應參考其他同仁所填資料填寫"], ans: 2, note: "詳實建檔是管理關係人交易的基礎。", law: "銀行法/金融控股公司法"},
{id: "金融職業道德-375", text: "金融從業人員執行資產管理事務時，為避免與公司發生利益衝突，應避免以下何種行為？", options: ["(1)購買公司發行之有價證券", "(2)購買公司之不動產", "(3)由公司購買客戶委託管理的財產", "(4)以上皆是"], ans: 4, note: "自我交易（Self-dealing）禁止。", law: "信託法/證券投資信託及顧問法"},
{id: "金融職業道德-376", text: "金融從業人員與客戶間辦理利害關係交易行為時，得採取何種措施？", options: ["(1)告知利益衝突之情形並取得客戶書面同意", "(2)無須取得客戶之書面同意", "(3)不得拒絕接受有利益衝突之委託", "(4)應為公司積極爭取業務，接受委託"], ans: 1, note: "告知並取得同意是處理利益衝突的原則。", law: "信託業法"},
{id: "金融職業道德-377", text: "以下所述何者違反防止利益衝突？", options: ["(1)資訊交互運用應注意內部資訊控管流程", "(2)信託專責部門應指派專人負責內部資訊控管流程", "(3)客戶信託財產內容得提供其他部門分析運用", "(4)共用營業設備應注意內部資訊控管流程"], ans: 3, note: "信託財產具保密性，任意提供其他部門運用違反防火牆。", law: "信託業法"},
{id: "金融職業道德-378", text: "金融從業人員對於業務往來之公司，其董事、監察人或經理人無法以客觀及有效率的方式處理公務時：", options: ["(1)應特別注意前述人員所屬之關係企業資金貸與或為其提供保證、重大資產交易、進(銷)貨往來之情事", "(2)隨意由前述人員進行私人利益輸送之交易", "(3)隨意由前述人員利用職務之便進行投機交易", "(4)隨意由前述人員利用各種管道進行洗錢交易"], ans: 1, note: "應加強盡職調查（Due Diligence），防範掏空或不當利益輸送。", law: "銀行授信準則"},
{id: "金融職業道德-379", text: "擔任公司之董事、監察人或經理人：", options: ["(1)可使用公司之財產圖利自己", "(2)應避免圖私利之機會", "(3)以不正當之方法圖利自己", "(4)利用公司之財產圖利自己之親朋好友"], ans: 2, note: "忠實義務要求避免圖私利。", law: "公司法"},
{id: "金融職業道德-380", text: "金融服務業之董監事對與本公司有利害關係之交易，應採取下列何項原則辦理？", options: ["(1)善良管理原則", "(2)公平競爭原則", "(3)專業原則", "(4)利益迴避原則"], ans: 4, note: "利益迴避原則。", law: "公司法第206條"},
{id: "金融職業道德-381", text: "有關利益衝突，下列敘述何者為非？", options: ["(1)個人投資如可能對公司產生利益衝突，應避免之", "(2)金融從業人員得隨時擔任同業之負責人，不須任何同意", "(3)利用公司資源發現屬於公司的機會，不得據為己有", "(4)不得接受客戶提供之優惠待遇"], ans: 2, note: "競業禁止：擔任同業負責人須經公司同意。", law: "公司法/銀行法"},
{id: "金融職業道德-382", text: "客戶利益優先及禁止不當得利是屬於下列何者原則？", options: ["(1)公開原則", "(2)忠實義務原則", "(3)保密原則", "(4)能力原則"], ans: 2, note: "忠實義務原則。", law: "職業道德規範"},
{id: "金融職業道德-383", text: "下列就金融從業人員之敘述何者為非？", options: ["(1)與自身利益相關的業務應該迴避", "(2)因業務知悉公司股票將上漲，不可以事先買進", "(3)客戶的餽贈不能收受", "(4)只要對公司有益，所有法律規範可以先行放下"], ans: 4, note: "守法是底線，不可逾越。", law: "職業道德規範"},
{id: "金融職業道德-384", text: "公司董事、監察人或經理人，對下列何種行為應予避免？", options: ["(1)對於本身及客戶之資訊負有保密責任", "(2)透過使用公司資產、資訊或藉由職務之便以獲取私利", "(3)遵循法令規章", "(4)保護並適當使用公司資產"], ans: 2, note: "避免獲取私利。", law: "公司法"},
{id: "金融職業道德-385", text: "金融從業人員基於維護公司利益不應有何種表現？", options: ["(1)知悉授信客戶財務狀況惡化，應立即告知主管，並加以妥善處理", "(2)當利率可能出現巨幅波動而侵蝕公司獲利時，應主動告知主管", "(3)不得收受競爭對手之酬庸，以洩露公司內部機密", "(4)為了績效考量，隱瞞自身職務之缺失"], ans: 4, note: "隱瞞缺失損害公司長遠利益。", law: "職業道德規範"},
{id: "金融職業道德-386", text: "金融服務業董事對董事會所列議案如有涉其本身利害關係致損及該公司利益之虞時，應採行下列何種措施？", options: ["(1)自行迴避，不加入表決", "(2)加入表決", "(3)本身不加入表決，但代理其他董事行使其表決權", "(4)依其自由意志為之"], ans: 1, note: "利益迴避，不得加入表決，亦不得代理他人。", law: "公司法第206條"},
{id: "金融職業道德-387", text: "金融服務業應注意下列哪些人，會因其在公司擔任董事、監察人或經理人職務之便而獲得不當利益，為避免利益衝突，應予迴避？", options: ["(1)本人及配偶", "(2)父母及子女", "(3)兄弟姐妹", "(4)以上皆是"], ans: 4, note: "關係人範圍包含二親等內血親等。", law: "銀行法/公職人員利益衝突迴避法"},
{id: "金融職業道德-388", text: "若某項活動、利益或關係可能妨礙從業人員追求公司及客戶之最高利益行事之能力時，應保持警覺，此屬何種行為？", options: ["(1)能力原則", "(2)防範利益衝突行為", "(3)客觀性原則", "(4)誠信原則"], ans: 2, note: "防範利益衝突。", law: "職業道德規範"},
{id: "金融職業道德-389", text: "金融服務業董事、監察人或經理人在公司擔任職務時應避免下列何人獲得不當利益？", options: ["(1)配偶", "(2)父母", "(3)子女", "(4)以上皆是"], ans: 4, note: "同上，防範關係人獲取不當利益。", law: "銀行法"},
{id: "金融職業道德-390", text: "金融服務業應避免董事、監察人或經理人進行以下何者行為？", options: ["(1)透過使用公司財產、資訊或藉由職務之便而有圖私利之機會", "(2)透過使用公司財產、資訊或藉由職務之便以獲取實質利益", "(3)與公司競爭", "(4)以上皆是"], ans: 4, note: "禁止圖利、競業。", law: "公司法"},
{id: "金融職業道德-391", text: "為避免與客戶之利益衝突，下列何者不正確？", options: ["(1)於法律許可範圍內為客戶之利益執行專業判斷", "(2)視客戶之忠誠度再決定執行業務之程度", "(3)不受客戶忠誠與否之影響", "(4)不受個人利益、其他客戶利益或任何其他人意願之影響"], ans: 2, note: "應公平對待，不因忠誠度而有差別待遇（除非是合法的會員分級）。本題意指不應大小眼。", law: "金融服務業公平待客原則"},
{id: "金融職業道德-392", text: "有關利益衝突原則，下列何者正確？", options: ["(1)公司得要求員工不得擁有非公開資訊而從事任何事業體或個人之交易", "(2)公司得要求員工不得有內線交易行為", "(3)公司得要求員工避免以非法套裝商品強迫客戶購買", "(4)以上皆是"], ans: 4, note: "內控規範應包含上述事項。", law: "證券商內部控制制度"},
{id: "金融職業道德-393", text: "金融從業人員處理某項業務時，若與公司之利益發生衝突應採取何種方式？", options: ["(1)基於利益衝突原則應予以迴避", "(2)仍應繼續辦理", "(3)因對自己有利，更應加強爭取該業務", "(4)將該業務轉移給自己的配偶來執行"], ans: 1, note: "迴避。", law: "職業道德規範"},
{id: "金融職業道德-394", text: "金融從業人員銷售對自己有利益的商品，如果該商品不符合客戶的需求，將會違反什麼原則？", options: ["(1)能力原則", "(2)利益衝突原則", "(3)損失原則", "(4)以上皆是"], ans: 2, note: "自身利益與客戶利益衝突。", law: "職業道德規範"},
{id: "金融職業道德-395", text: "金融從業人員辦理全權委託業務應遵守事項，下列敘述何者有誤？", options: ["(1)應公正對待客戶避免糾紛之發生", "(2)應確實瞭解客戶之財務狀況", "(3)應確實瞭解客戶投資需求及承擔潛在損失的能力", "(4)可利用客戶資料為自己謀取利益"], ans: 4, note: "禁止利用客戶資料謀利。", law: "證券投資信託及顧問法"},
{id: "金融職業道德-396", text: "金融從業人員辦理全權委託業務，為避免利益衝突，應遵守下列何種事項？", options: ["(1)不得與委任人有利益衝突之第三人從事全權委託業務，以及從事足以損害委任人權益之交易", "(2)可利用委任人之交易帳戶，為自己從事交易", "(3)可利用委任人之交易帳戶，為委任人以外之第三人從事交易", "(4)以上皆是"], ans: 1, note: "避免與利益衝突之第三人交易。", law: "全權委託投資業務操作辦法"},
{id: "金融職業道德-397", text: "有關金融從業人員辦理全權委託業務，下列敘述何者有誤？", options: ["(1)不得與客戶約定分享利益或共同承擔損失", "(2)不得利用客戶帳戶或名義為自己從事交易", "(3)不得利用他人或自己名義供客戶從事交易", "(4)得任意對外發表客戶資料"], ans: 4, note: "洩漏客戶資料違規。", law: "證券投資信託及顧問法"},
{id: "金融職業道德-398", text: "有關金融從業人員辦理全權委託業務，下列敘述何者正確？", options: ["(1)應避免利益衝突", "(2)得與客戶約定分享利益", "(3)得對外任加討論客戶資料", "(4)得將已成交之買賣委託，由委任人名義改為其他第三人"], ans: 1, note: "應避免利益衝突。禁止分享利益、洩密、改帳。", law: "證券投資信託及顧問法"},
{id: "金融職業道德-399", text: "下列關於金融從業人員辦理投資型金融商品推介或銷售業務時，應遵守之事項何者有誤？", options: ["(1)可與客戶約定分享利益或共同承擔損失", "(2)應妥為保管客戶資料", "(3)應避免不當銷售或推介之行為", "(4)不可利用客戶帳戶或名義為自己謀取不當利益"], ans: 1, note: "禁止約定分享利益或共擔損失。", law: "投資型保險商品銷售應注意事項"},
{id: "金融職業道德-400", text: "為維持市場交易之公平性，金融從業人員可否利用公司內部資訊擅自為自己或相關人員進行交易而謀取利益？", options: ["(1)可以", "(2)不可以", "(3)客戶同意即可", "(4)視交易金額高低而定"], ans: 2, note: "禁止內線交易。", law: "證券交易法"},
{id: "金融職業道德-401", text: "下列何者不符合投信管理基金的利益衝突處理原則?", options: ["(1)管理一個以上基金的經理人，不得對同一支股票及具有股權性質之債券，有同時或同日作相反投資決定", "(2)公司進行自有資金交易時，應優先執行基金買賣，並以利於公司之成交價格分配予客戶", "(3)經手人員知悉公司管理基金或全權委託帳戶為同一種股票或其衍生性商品的易時，不得於該買賣前後7 個營業日內進行個人交易", "(4)經手人員買入某種股票及具股權之衍生性商品須持有至少30 日"], ans: 2, note: "公司進行自有資金交易時，應優先執行基金買賣，但不得以「利於公司」之成交價格分配予客戶，應以公平或利於客戶之原則分配。自有資金不得佔客戶便宜。", law: "證券投資信託事業管理規則"},
{id: "金融職業道德-402", text: "依據投信投顧公會會員自律公約，會員對其與客戶間或不同客戶之間的利益衝突情事，處理原則為?", options: ["(1)應避免之", "(2)以口頭約定作為依據", "(3)以多數客戶之利益為依據", "(4)以損益標準作為處理原則"], ans: 1, note: "利益衝突之處理原則首重「避免」。", law: "投信投顧公會會員自律公約"},
{id: "金融職業道德-403", text: "依據投信投顧公會訂定之投資顧問從業人員行為準則規定，經手人員為本人帳戶投資何項商品，應事先以書面報經督察主管或所屬部門主管核准?", options: ["(1)國內上市股票", "(2)國內上櫃公司股票", "(3)國內具股權性質之衍生性商品", "(4)以上皆是"], ans: 4, note: "投顧經手人員買賣台股及相關衍生性商品皆需事前核准，以防利益衝突。", law: "證券投資顧問事業負責人與業務人員管理規則"},
{id: "金融職業道德-404", text: "當一個基金經理人管理一個以上基金時，應遵守那些事項？", options: ["(1)公司應建立「中央集中下單制度」", "(2)將投資決策及交易過程予以獨立", "(3)落實職能區隔之「中國牆」制度", "(4)以上皆是"], ans: 4, note: "為防止不同基金間之利益輸送或衝突，需有集中下單、決策獨立及防火牆機制。", law: "證券投資信託事業管理規則"},
{id: "金融職業道德-405", text: "投資顧問事業從業人員行為準則針對經手人員及利害關係人帳戶往來有所規範。所謂的利害關係人不包括：", options: ["(1)未成年子女", "(2)本人", "(3)配偶利用他人名義投資衍生性金融商品而間接受有利益者", "(4)以上皆非"], ans: 4, note: "選項(1)(2)(3)皆屬於利害關係人範圍，故選(4)。", law: "證券投資顧問事業從業人員行為準則"},
{id: "金融職業道德-406", text: "林莉莉轉換生涯跑道，從銀行財務部主管轉任投信基金經理人，依據證券投資信託事業經理守則，就林莉莉的個人交易資料下列敘述何者為正確？", options: ["(1)不用申報，因為是到職前所為的交易", "(2)股票交易不用申報", "(3)只有以自己名義進行之交易投資必須申報", "(4)以上皆非"], ans: 4, note: "到職後應申報其持有之有價證券，且任職期間之交易皆須申報，包含本人、配偶、未成年子女及利用他人名義者。", law: "證券投資信託事業負責人與業務人員管理規則"},
{id: "金融職業道德-407", text: "發發公司向全權委託經理人張三表示，如果該公司的全權委託績效報酬三個月內成長兩成，將免費提供其使用在林口高爾夫球場的公司會員證為期一個月。三個月後發發公司的委託資金代操績效如期成長達到了兩成，張三應該：", options: ["(1)不顧公司主管反對，仍執意接受該邀約", "(2)未向公司報告逕自接受該邀約", "(3)接受該邀約，因為這不是金錢餽贈", "(4)應拒絕，並依公司所訂規範辦理"], ans: 4, note: "應拒絕客戶之額外饋贈，並依公司利益衝突規範申報。", law: "證券投資信託及顧問法"},
{id: "金融職業道德-408", text: "基金銷售時有關贈品之規範為何？", options: ["(1)可以送贈品", "(2)不可以送贈品", "(3)可以送贈品但不能超過新台幣200 元", "(4)無規範"], ans: 2, note: "基金銷售禁止提供贈品或其他利益以招攬客戶。", law: "證券投資信託事業管理規則"},
{id: "金融職業道德-409", text: "下列何種人員不得以特定身分取得初次上市之股票？", options: ["(1)基金經理人", "(2)交易部主管", "(3)全權委託投資經理人", "(4)以上皆是"], ans: 4, note: "為避免利益衝突，相關投資決策與執行人員不得利用職務之便獲取IPO配售。", law: "證券投資信託事業負責人與業務人員管理規則"},
{id: "金融職業道德-410", text: "圓滿投信招待光明證券新竹分公司人員五天四夜泰國之旅作為基金銷售目標達成之獎勵，請問是否可行？", options: ["(1)可以接受，因為非金錢報酬", "(2)不能接受", "(3)經主管機關核准即可", "(4)向分公司主管報備即可"], ans: 2, note: "投信不得直接或間接提供不當利益（如旅遊招待）給銷售機構人員。", law: "證券投資信託事業管理規則"},
{id: "金融職業道德-411", text: "金融從業人員從事保險業務招攬後，擅自將所蒐集客戶之個人資料，轉交給第三人，該行為如何？", options: ["(1)正常行為", "(2)異常行為", "(3)適法行為", "(4)違法行為"], ans: 4, note: "未經客戶同意轉交個資予第三人，違反個人資料保護法。", law: "個人資料保護法"},
{id: "金融職業道德-412", text: "金融從業人員得否蒐集或利用他人個人資料？", options: ["(1)不可以", "(2)視情況而定", "(3)可以", "(4)可以，但須依相關法規辦理"], ans: 4, note: "須符合個資法之特定目的、告知義務及當事人同意等規範。", law: "個人資料保護法"},
{id: "金融職業道德-413", text: "金融從業人員違反相關法律之規定，致當事人權益受損者，應負之責任為何？", options: ["(1)損害賠償責任", "(2)道義責任", "(3)不需負責", "(4)以上皆是"], ans: 1, note: "違法侵害他人權益，須負民事損害賠償責任。", law: "民法/個人資料保護法"},
{id: "金融職業道德-414", text: "下列何者是金融從業人員從事保險業務招攬的不當行為？", options: ["(1)代客戶簽章", "(2)未經客戶同意或授權填寫有關保險契約文件", "(3)未經授權而代收保險費或代收保險費未依規定交付保險業開發之正式收據", "(4)以上皆是"], ans: 4, note: "代簽、擅填文件、挪用保費皆為重大違規。", law: "保險業務員管理規則"},
{id: "金融職業道德-415", text: "金融從業人員從事保險業務招攬，於下列何時，應對客戶資料盡保密之義務？", options: ["(1)業務員在職時或離職後", "(2)僅於業務員招攬業務時", "(3)僅於業務員將資料歸檔時", "(4)以上皆非"], ans: 1, note: "保密義務不因離職而終止。", law: "營業秘密法/個人資料保護法"},
{id: "金融職業道德-416", text: "下列何者為金融從業人員從事保險業務招攬時，應注意之事項？", options: ["(1)除非有法律規定，否則不得洩露客戶資料", "(2)妥善保管客戶資料，避免讓不相關的第三人取得", "(3)不得銷售或販賣客戶資料", "(4)以上皆是"], ans: 4, note: "資料保密、安全維護、禁止販售。", law: "個人資料保護法"},
{id: "金融職業道德-417", text: "金融從業人員於業務上獲取客戶之個人資料，應以何種態度面對？", options: ["(1)不得隨意直接或間接對第三人洩露", "(2)只要非出於故意之揭露，即無庸負責", "(3)以漠不關心態度面對", "(4)基本資料可以洩露無妨"], ans: 1, note: "嚴守保密義務。", law: "個人資料保護法"},
{id: "金融職業道德-418", text: "金融從業人員對於客戶資料之維護，應如何處理才算適當？", options: ["(1)客戶特別叮嚀時再注意就好", "(2)應盡善良管理人之注意義務", "(3)可用以換取利益", "(4)視與客戶關係而定"], ans: 2, note: "善良管理人注意義務。", law: "個人資料保護法"},
{id: "金融職業道德-419", text: "金融從業人員對於經手業務所得知之客戶訊息，應抱持如何態度始屬適當？", options: ["(1)可在市場上交換獲取利益", "(2)反正我不洩露，別人也會洩露", "(3)本於職業道德，應予維護", "(4)視狀況而定"], ans: 3, note: "維護客戶隱私是職業道德。", law: "職業道德規範"},
{id: "金融職業道德-420", text: "金融從業人員基於保密原則：", options: ["(1)應注意對帳單寄送時客戶資料之隱密性，以保障客戶權益", "(2)以電子郵件方式寄對帳單者，應比照網路交易認證機制，透過憑證機構之資料加密等功能，始得傳送予客戶", "(3)非依法令所為之查詢，不得洩露客戶委任事項及其他業務上所獲悉之秘密", "(4)以上皆是"], ans: 4, note: "寄送安全、加密傳輸、拒絕非法查詢。", law: "金融機構辦理電子銀行業務安全控管作業基準"},
{id: "金融職業道德-421", text: "金融服務業如經客戶同意以電子郵件方式寄送對帳單者：", options: ["(1)應比照網路交易認證機制，須透過憑證機構之資料加密等功能，始得傳送予期貨交易人", "(2)經客戶同意，不需網路交易認證機制，只需有客戶電子郵件信箱即可寄送", "(3)電子郵件寄送方式，只要能取得客戶的電子郵件閱讀回條，即可不需網路交易認證機制", "(4)為預防電腦駭客取得客戶資料，不可以電子郵件方式寄送對帳單"], ans: 1, note: "電子對帳單傳送須符合安全控管基準（加密/簽章）。", law: "金融機構辦理電子銀行業務安全控管作業基準"},
{id: "金融職業道德-422", text: "金融服務事業基於金控共同行銷策略：", options: ["(1)不須經客戶同意，可將客戶之基本資料、財務資料相互利用", "(2)必須經客戶同意，方可將客戶之基本資料、財務資料相互利用", "(3)若未經客戶同意，僅可將客戶之基本資料相互流利用，財務資料不可利用", "(4)若未經客戶同意，僅可將其客戶之財務資料相互流利用，基本資料不可利用"], ans: 2, note: "共同行銷使用個資須經客戶書面同意。", law: "金融控股公司法"},
{id: "金融職業道德-423", text: "對於客戶之申訴或檢舉案件，下列敘述何者適當?", options: ["(1)以積極主動的態度面對及妥善處理", "(2)對於申訴或檢舉人之姓名、地址須予以保密", "(3)以言詞提出申訴或檢舉之案件，應留存談話紀錄", "(4)以上皆是"], ans: 4, note: "積極處理、保密檢舉人、留存紀錄。", law: "金融消費者保護法"},
{id: "金融職業道德-424", text: "對於金融從業人員應有之態度，下列敘述何者正確?", options: ["(1)應妥慎保管客戶資料，除依法令所為之查詢外，不得洩露客戶委託事項", "(2)不得利用職務之便，洩露或利用公司及客戶之資料圖利", "(3)不得利用或竊用他人電子帳號及密碼，為任何業務或非業務行為", "(4)以上皆是"], ans: 4, note: "保密、不圖利、不竊用。", law: "職業道德規範"},
{id: "金融職業道德-425", text: "當金融從業人員知悉客戶未經授權利用他人名義從事商品交易時：", options: ["(1)應接受其委託並為其保守秘密", "(2)在客戶承諾補具授權書的情況下，先接受其委託進行交易", "(3)拒絕接受其委託進行交易", "(4)可有條件地接受其委託進行交易"], ans: 3, note: "違反洗錢防制法及開戶契約，應拒絕。", law: "洗錢防制法"},
{id: "金融職業道德-426", text: "金融服務業寄送客戶買賣報告書時，何者敘述適當?", options: ["(1)基於保密，應依約定方式交付客戶本人", "(2)基於保密，一律由客戶親至公司領取", "(3)可由業務員代領", "(4)以上皆非"], ans: 1, note: "依約交付（郵寄或電子），不可由業務員代領。", law: "證券商管理規則"},
{id: "金融職業道德-427", text: "金融服務業對於其客戶個人資料之處理方式，何者敘述有誤?", options: ["(1)依照個人資料保護法辦理", "(2)可放置公開場所，以便其他同仁隨時連絡服務", "(3)須經客戶同意，方可將客戶之基本資料、財務資料通用", "(4)資訊人員應對客戶資料具保密之義務"], ans: 2, note: "放置公開場所嚴重違反個資保護（未採行適當安全措施）。", law: "個人資料保護法"},
{id: "金融職業道德-428", text: "金融從業人員應本保密原則，忠實執行業務，何者敘述有誤?", options: ["(1)可提供客戶委託之事項予依法進行調查之主管機關或檢調單位", "(2)如經客戶同意，可將客戶之基本資料、財務資料互為通用", "(3)可為了保護個人隱私，以非真實姓名從事金融商品交易分析", "(4)未能出示身分證明文件者，可拒絕就其個人資料申請查詢"], ans: 3, note: "從業人員對外提供分析或業務執行需具名負責，不可用假名。", law: "證券投資顧問事業負責人與業務人員管理規則"},
{id: "金融職業道德-429", text: "金融服務業之委任客戶A 君之配偶，若未經授權要求提供A 君之買賣報告書供其參考：", options: ["(1)不可提供A 君之買賣報告書給其配偶", "(2)可提供A 君之買賣報告書給其配偶", "(3)需A 君之配偶填寫申請書並簽名才可以提供", "(4)僅能陪同A 君之配偶現場閱覽"], ans: 1, note: "配偶在法律上是獨立個體，未經授權不可查閱對方帳戶資料。", law: "個人資料保護法"},
{id: "金融職業道德-430", text: "下列何者不是金融服務業之從業人員必須禁止的行為？", options: ["(1)交付給客戶公司未公佈的財報", "(2)交付給客戶公司依法已公開的資訊", "(3)交付給客戶公司的商業機密", "(4)以上皆非"], ans: 2, note: "交付「已公開」資訊是合法的服務行為。(1)(3)為禁止。", law: "證券交易法"},
{id: "金融職業道德-431", text: "基於職務的關係而獲得的客戶資料，金融服務業之從業人員應該如何做才正確？", options: ["(1)由於大環境不佳，基於自己未來生活著想，可以將客戶資料轉賣給別人", "(2)必須忠於保密原則，絕不對外洩露", "(3)隨意丟棄，不整理", "(4)以上皆是"], ans: 2, note: "忠於保密原則。", law: "職業道德規範"},
{id: "金融職業道德-432", text: "證券商基於防制洗錢及打擊資恐目的，需要持續監控客戶之帳戶及其交易，下列何者屬於疑似洗錢、資恐或武擴客戶帳戶類的交易態樣？", options: ["(1)無正當理由開立多個帳戶，且實質受益人為同一人者", "(2)客戶係屬重要政治性職務人員，但意圖規避正確且完整的填寫申請表格，或未充分說明其資金或有價證券之來源正當性者", "(3)以不同公司名義但皆有相同之法定代表人或有權簽署人，開立數個帳戶者", "(4)以上皆是"], ans: 4, note: "皆為洗錢防制法規定之疑似洗錢表徵。", law: "金融機構防制洗錢辦法"},
{id: "金融職業道德-433", text: "證券商之從業人員，如發現公司內部有違反法令規章或職業道德之情事時，下列何者是最好的作法？", options: ["(1)與自己沒有利害關係，假裝沒有看到", "(2)私下告訴同業的朋友", "(3)立刻向公司總經理或董事長或其他適當人員呈報", "(4)直接向檢調機關檢舉"], ans: 3, note: "應先循內部檢舉制度（Whistleblowing）向上通報。", law: "上市上櫃公司誠信經營守則"},
{id: "金融職業道德-434", text: "證券商基於防制洗錢及打擊資恐目的，需要持續監控客戶之帳戶及其交易，下列何者屬於疑似洗錢、資恐或武擴交易類的交易態樣？", options: ["(1)新開戶或一定期間內無交易之帳戶突然大額交易者", "(2)客戶突然大額匯入或買賣冷門、小型或財務業務不佳之有價證券，且無合理原因者", "(3)無正當理由短期內連續大量買賣特定股票者", "(4)以上皆是"], ans: 4, note: "久未往來突然大額、交易冷門股、短期頻繁皆為疑似洗錢特徵。", law: "金融機構防制洗錢辦法"},
{id: "金融職業道德-435", text: "有關證券商管理相關法令對保密及不得為之行為規範，誰應該遵守？", options: ["(1)證券商之負責人", "(2)證券商之業務人員", "(3)證券商本身", "(4)以上皆是"], ans: 4, note: "全體從業人員及公司皆須遵守。", law: "證券商負責人與業務人員管理規則"},
{id: "金融職業道德-436", text: "下列何者屬於證券商的商業機密，身為公司的員工，不可對第三者透露？", options: ["(1)客戶及其買賣交易證券的相關資料", "(2)公司名稱、營業處所、聯絡電話、電子郵件信箱等資料", "(3)公司官方網站提供的資訊", "(4)以上皆是"], ans: 1, note: "客戶交易資料屬機密。(2)(3)為公開資訊。", law: "營業秘密法/個資法"},
{id: "金融職業道德-437", text: "關於證券之從業人員職業道德行為之保密規範，下列敘述何者為非？", options: ["(1)未經主管機關同意，不得對執行職務無關之人洩漏主管機關金融檢查報告", "(2)出席公司股東會領取該公司議事手冊或年報", "(3)不得洩漏或交付依洗錢防制法規定向法務部調查局申報疑似洗錢交易案件相關資料", "(4)證券商對於非應依法令所為之查詢，不得洩漏客戶委託事項及其他業務上所獲悉之秘密"], ans: 2, note: "領取公開的年報不涉及洩密。金檢報告、洗錢申報、客戶委託皆須保密。", law: "金融法規"},
{id: "金融職業道德-438", text: "金融從業人員辦理業務應予保密，下列何者為非?", options: ["(1)客戶資料", "(2)商品機密", "(3)公司業務機密", "(4)業務簡介"], ans: 4, note: "業務簡介是用來公開行銷的，無須保密。", law: "職業道德規範"},
{id: "金融職業道德-439", text: "金融從業人員辦理業務對客戶資料之保密，以下何者為非？", options: ["(1)客戶基本資料無須保密", "(2)客戶帳務資料應予保密", "(3)客戶信用資料應予保密", "(4)客戶投資及保險資料應予保密"], ans: 1, note: "客戶基本資料（如姓名、電話、住址）亦屬個資，須保密。", law: "個人資料保護法"},
{id: "金融職業道德-440", text: "為保護客戶資料，以下措施何者是錯誤的？", options: ["(1)應使用安全的軟硬體設備以安全傳輸", "(2)應建立防火牆機制防止非法存取", "(3)應限制客戶登錄公司網站", "(4)應依業務權責限制使用資料人員"], ans: 3, note: "應提供安全機制讓客戶登錄使用，而非限制其登錄。", law: "金融機構資訊安全規範"},
{id: "金融職業道德-441", text: "下列何種情況得運用客戶資料與子公司間進行共同行銷？", options: ["(1)與客戶簽訂契約", "(2)經客戶書面同意", "(3)選項(1)或(2)", "(4)以上皆非"], ans: 3, note: "須經客戶同意（通常在契約中約定或另簽同意書）。", law: "金融控股公司法"},
{id: "金融職業道德-442", text: "從事電話行銷行為時，應主動提供下列何訊息讓受話人知悉?", options: ["(1)所屬公司名稱", "(2)發話人可供識別的代碼及姓氏", "(3)發話目的", "(4)以上皆應提供"], ans: 4, note: "表明身分與目的是電話行銷的基本規範。", law: "金融業電話行銷應遵循事項"},
{id: "金融職業道德-443", text: "金融從業人員使用公司機密文件，以下何者有誤？", options: ["(1)如非必要應儘量免用或減少副本", "(2)機密文書誤繕誤印之廢紙應予回收再利用", "(3)非經權責主管人員核准，不得攜出辦公處所", "(4)會議使用之機密資料，會議結束應當場收回"], ans: 2, note: "機密廢紙應銷毀（如碎紙），不可回收再利用（背面當計算紙），以免洩密。", law: "文書處理保密規定"},
{id: "金融職業道德-444", text: "金融從業人員受託管理客戶財產時應注意保密事項，以下何者是錯誤的？", options: ["(1)管理決策執行過程應保守秘密", "(2)受託交易之執行應保守秘密", "(3)受託操作績效佳之交易決策應供自營部位參考", "(4)管理決策與交易之執行嚴禁洩露或不當使用"], ans: 3, note: "客戶交易決策供自營參考涉及利益衝突與搶先交易（Front Running），嚴重違規。", law: "證券投資信託及顧問法"},
{id: "金融職業道德-445", text: "公司委任第三人處理相關事務，受任第三人應注意下列保密事項，何者為錯誤？", options: ["(1)客戶資料得提供關係企業促銷業務", "(2)客戶資料不得外洩", "(3)客戶資料不得不當利用", "(4)客戶資料之使用應建立內部控制機制"], ans: 1, note: "未經客戶同意，受任第三人（如委外廠商）不得將資料提供給關係企業促銷。", law: "金融機構作業委託他人處理內部作業制度及程序辦法"},
{id: "金融職業道德-446", text: "以下所述有關客戶資訊之使用，何者是錯誤的？", options: ["(1)於公司內部應設置防火牆防止資訊外洩", "(2)為提高業務績效，得提供予非相關業務人員使用", "(3)拒絕提供予其他非辦理業務人員使用", "(4)應適當監管以防止客戶之資訊不當交流或不當共用"], ans: 2, note: "資訊使用應採最小權限原則（Need-to-know），非相關人員不得使用。", law: "個人資料保護法"},
{id: "金融職業道德-447", text: "妥慎保管客戶資料，確認與客戶相關資料及客戶隱私之保密性，屬下列何項原則？", options: ["(1)保密原則", "(2)能力原則", "(3)資訊公開原則", "(4)客觀性原則"], ans: 1, note: "保密原則。", law: "職業道德規範"},
{id: "金融職業道德-448", text: "金融從業人員對於客戶之相關資料：", options: ["(1)可任意放置", "(2)可隨便公開", "(3)不須保密", "(4)確實保密"], ans: 4, note: "確實保密。", law: "個人資料保護法"},
{id: "金融職業道德-449", text: "所謂保密原則，下列何者為非？", options: ["(1)對存款人的法定代理人不必保密", "(2)客戶的住址資料必須保密", "(3)存款餘額100 萬元以上才須保密，100 萬元以下請示主管即可", "(4)保密對象包含駐守銀行的警察"], ans: 3, note: "無論金額大小，皆須保密。", law: "銀行法"},
{id: "金融職業道德-450", text: "若有第三人欲索取當事人之帳戶資料，何者為非？", options: ["(1)須經當事人書面同意方可為之", "(2)須主動積極提供之，以表現金融從業人員之熱誠", "(3)經當事人之法定代理人書面同意方可為之", "(4)依保密原則，可直接拒絕對方之要求"], ans: 2, note: "未經同意提供資料是洩密，非服務熱誠。", law: "個人資料保護法"},
{id: "金融職業道德-451", text: "身為金融從業人員不得有下列何種行為？", options: ["(1)對客戶委託交易事項嚴加保密", "(2)對職務上所知悉之秘密，盡其保密之責", "(3)對外散播誇大、偏頗或不實之訊息，有礙金融市場之穩定", "(4)對於所擁有、使用、管理或交易之紀錄資料保持合理之正確性及完整性"], ans: 3, note: "散播不實訊息擾亂市場違法。", law: "證券交易法"},
{id: "金融職業道德-452", text: "從業人員對於自客戶取得之機密資料應盡保密義務，所謂保密原則下列何者正確？", options: ["(1)不得以任何方式洩露予與執行該業務無關之人", "(2)不得為交付目的以外之利用", "(3)應以善良管理人之注意義務管理之", "(4)以上皆是"], ans: 4, note: "保密原則包含不洩露、目的內利用、妥善管理。", law: "職業道德規範"},
{id: "金融職業道德-453", text: "基於職務關係而獲悉與業務相關尚未公開之重大消息，於該重大消息未公開前不得為誰使用？", options: ["(1)自己", "(2)客戶", "(3)其他第三者", "(4)以上皆是"], ans: 4, note: "內線交易禁止任何人使用未公開消息獲利。", law: "證券交易法"},
{id: "金融職業道德-454", text: "從業人員對於所屬公司之機密資料在下列何種情形下可不適用「保密原則」？", options: ["(1)於資料揭露前已為公眾所知", "(2)依相關法令要求被揭露者，非因從業人員違反保密義務者", "(3)(1)及(2)", "(4)以上皆非"], ans: 3, note: "已公開資訊或依法強制揭露者，無保密義務。", law: "營業秘密法"},
{id: "金融職業道德-455", text: "下列何人對於公司本身或客戶之資訊，除經授權或法律規定公開外，應負有保密責任？", options: ["(1)董事", "(2)監察人", "(3)經理人", "(4)以上皆是"], ans: 4, note: "公司內部人皆有保密責任。", law: "公司法/證券交易法"},
{id: "金融職業道德-456", text: "金融從業人員對於客戶的資料，應如何處理？", options: ["(1)予以保密", "(2)未經客戶同意，提供給關係企業做行銷", "(3)告知同事給予參考", "(4)讓其他客戶瞭解"], ans: 1, note: "予以保密。", law: "個人資料保護法"},
{id: "金融職業道德-457", text: "金融從業人員得知客戶個人資料，應如何處理？", options: ["(1)予以保密", "(2)可用於私人用途", "(3)販售給非法單位", "(4)隨意揭露給他人"], ans: 1, note: "予以保密。", law: "個人資料保護法"},
{id: "金融職業道德-458", text: "金融從業人員在公共場所不得有之行為：", options: ["(1)談論公司重要機密", "(2)談論國家大事", "(3)談論藝文趣事", "(4)談論個人未來計畫"], ans: 1, note: "公共場所談論機密易洩密。", law: "保密規定"},
{id: "金融職業道德-459", text: "金融從業人員為客戶辦理財富管理，對客戶本身的資產、各項資料及隱私都應該妥慎保管不得洩露或不當使用，以符合下列何種原則？", options: ["(1)利益衝突原則", "(2)保密原則", "(3)禁止原則", "(4)告知原則"], ans: 2, note: "保密原則。", law: "職業道德規範"},
{id: "金融職業道德-460", text: "金融從業人員對於取自客戶之相關資料或資訊應不得為下列之行為？", options: ["(1)公開", "(2)販售", "(3)複製", "(4)以上皆是"], ans: 4, note: "未經授權之公開、販售、複製皆違法。", law: "個人資料保護法"},
{id: "金融職業道德-461", text: "金融從業人員對公司或其客戶之資訊，除經授權或法律規定公開外，應負有保密義務，理由為何？", options: ["(1)可能為競爭對手所利用", "(2)洩露未公開資訊之後對公司有所損害", "(3)洩露未公開資訊之後對客戶有所損害", "(4)以上皆是"], ans: 4, note: "保密是為了保護公司與客戶利益。", law: "營業秘密法"},
{id: "金融職業道德-462", text: "妥善保管客戶資料，確保客戶相關資料及客戶隱私之保密性，是屬下列哪一原則之表現?", options: ["(1)守法原則", "(2)保密原則", "(3)能力原則", "(4)誠信原則"], ans: 2, note: "保密原則。", law: "職業道德規範"},
{id: "金融職業道德-463", text: "金融從業人員對客戶之資料，應盡到如何之注意義務？", options: ["(1)刑法第十三條過失之注意義務", "(2)自己之事務之注意義務", "(3)受僱人之注意義務", "(4)善良管理人之注意義務"], ans: 4, note: "金融業受高度信賴，應盡善良管理人（高標準）之注意義務。", law: "民法"},
{id: "金融職業道德-464", text: "有關銀行授信資料，下列敘述何者為正確？", options: ["(1)應有保密之義務", "(2)不得向他人出售、洩露", "(3)不得提供自己或他人使用", "(4)以上皆是"], ans: 4, note: "授信資料屬高度機密，嚴禁洩露或自用。", law: "銀行法"},
{id: "金融職業道德-465", text: "信用卡推廣人員與特約商店辦理簽約時所檢附之合約資料，應如何處理？", options: ["(1)妥為保管", "(2)不得移做他用", "(3)不將資料外洩給第三人", "(4)以上皆是"], ans: 4, note: "特約商店資料亦屬營業秘密及個資，須保密。", law: "信用卡業務機構管理辦法"},
{id: "金融職業道德-466", text: "金融從業人員對經辦業務所取得之客戶資料，下列行為何者是正確的？", options: ["(1)可販售予第三人", "(2)不可販售予其他客戶，但可以跟其他同業交換", "(3)可提供給自己親友開設的公司參考", "(4)除法律另有規定外，應保守秘密"], ans: 4, note: "應保守秘密。", law: "個人資料保護法"},
{id: "金融職業道德-467", text: "信用卡發卡機構之聘雇人員對於客戶資料，下列何者為正確？", options: ["(1)應有保密之義務", "(2)不得向他人出售、洩露", "(3)不得提供自己或他人使用", "(4)以上皆是"], ans: 4, note: "保密義務適用於所有聘雇人員。", law: "信用卡業務機構管理辦法"},
{id: "金融職業道德-468", text: "下列有關金融從業人員對於客戶資料之陳述，何者為是？", options: ["(1)得對外任加討論", "(2)不得任意對外發表", "(3)得對無權過問之同仁洩漏", "(4)沒有保密的之義務"], ans: 2, note: "不得任意發表。", law: "個人資料保護法"},
{id: "金融職業道德-469", text: "金融從業人員對於客戶資料處理方式，下列何者為正確？", options: ["(1)得提供他人使用", "(2)得向他人出售、洩露", "(3)不得出售或提供他人使用", "(4)可與同業交換使用"], ans: 3, note: "不得出售或非法提供。", law: "個人資料保護法"},
{id: "金融職業道德-470", text: "為強化客戶對金融機構的信賴，金融從業人員對客戶資料之處理，以下敘述何者正確？", options: ["(1)對於客戶資料之保密應依據相關主管機關之法令規定辦理，善盡對客戶資料保密之職責", "(2)對於客戶資料之保密，除法令規定外，未經客戶簽訂契約或書面表示同意前，不得以任何方式洩露往來客戶之相關業務資料", "(3)若發生客戶資料外洩時，應依內部之通報程序向相關主管報告，儘速研議緊急補救措施，並審酌案件內容通報主管機關或治安單位", "(4)以上皆是"], ans: 4, note: "包含依法辦理、客戶同意、外洩通報處理。", law: "個人資料保護法"},
{id: "金融職業道德-471", text: "投信投顧公會會員對於公司負責人與受僱人基於職務關係而獲悉公開發行公司尚未公開的重大消息，應如何規範？", options: ["(1)應訂定內部處理程序", "(2)獲悉消息者應立即向公司指定人員或部門提出書面報告", "(3)選項(1)及(2)", "(4)以上皆非"], ans: 3, note: "內線消息之內部控管機制。", law: "投信投顧公會會員自律公約"},
{id: "金融職業道德-472", text: "進行全權委託投資業務之金融從業人員得將客戶帳戶往來資料透露給誰？", options: ["(1)同集團的投顧公司", "(2)人事部門主管", "(3)投信旗下基金的經理人", "(4)以上皆非"], ans: 4, note: "非經客戶同意或法令規定，不得透露給任何人（包含集團子公司或同事）。", law: "證券投資信託及顧問法"},
{id: "金融職業道德-473", text: "下列對金融從業人員保密義務之敍述，何者正確？", options: ["(1)離開原職後即不受拘束", "(2)客戶因個人資料洩露所受損害全數由公司賠償，相關人員完全免責", "(3)只要不洩露客戶資訊，用來獲取財務利益無妨", "(4)以上皆非"], ans: 4, note: "離職仍須保密；洩密人員需負賠償與刑責；不可利用獲利。", law: "營業秘密法/民法"},
{id: "金融職業道德-474", text: "下列就金融從業人員對客戶資料之保密原則的陳述何者正確？", options: ["(1)不得透露予依法所進行調查行為之主管機關或司法人員", "(2)不得透露予公司指定之授權人員", "(3)應妥慎保管客戶資料", "(4)提供關係企業進行業務促銷"], ans: 3, note: "依法調查需配合（例外）；授權人員可查看（例外）；促銷需同意。唯妥善保管是通則。", law: "個人資料保護法"},
{id: "金融職業道德-475", text: "金融從業人員依財產保險損害補償原則，下列何者處理方式才屬正確？", options: ["(1)一分損失可獲二分補償", "(2)二分損失只獲一分補償", "(3)一分損失只獲一分補償", "(4)以上皆是"], ans: 3, note: "損害填補原則：不當得利禁止，損失多少補償多少。", law: "保險法"},
{id: "金融職業道德-476", text: "金融從業人員銷售保險商品之招攬廣告，應遵守下列那些法令？", options: ["(1)個人資料保護法", "(2)消費者保護法", "(3)保險法等相關法令", "(4)以上皆是"], ans: 4, note: "金融行銷需遵守多重法規。", law: "金融法規"},
{id: "金融職業道德-477", text: "金融從業人員從事保險業務招攬時，主張保險利益原則，主要是防止什麼危險發生？", options: ["(1)政治危險", "(2)倫理危險", "(3)職業危險", "(4)道德危險"], ans: 4, note: "保險利益原則防止賭博行為與道德危險（如謀財害命）。", law: "保險法"},
{id: "金融職業道德-478", text: "金融從業人員於保險業務招攬時，可否於保險契約中免除或減輕保險公司依保險法應負義務者？", options: ["(1)可以", "(2)不可以", "(3)可以，但需要保人同意", "(4)以上皆非"], ans: 2, note: "保險法第54條：免除或減輕保險人義務之特約，無效。", law: "保險法第54條"},
{id: "金融職業道德-479", text: "金融從業人員登錄為保險業務員後，依法令規定應如何加強教育訓練？", options: ["(1)每年參加所屬公司辦理的教育訓練", "(2)自我進修即可", "(3)閱讀其他業務員撰寫的行銷書籍", "(4)以上皆是"], ans: 1, note: "參加所屬公司教育訓練是法定義務。", law: "保險業務員管理規則"},
{id: "金融職業道德-480", text: "金融從業人員行為準則下列何者正確？", options: ["(1)在法律範圍內自由經營", "(2)在道德範圍內自由經營", "(3)不影響公眾利益自由經營", "(4)以上皆是"], ans: 4, note: "行為應兼顧法律、道德與公益。", law: "職業道德規範"},
{id: "金融職業道德-481", text: "保險契約簽訂後，契約雙方應遵守規範下列何者正確？", options: ["(1)遵守簽訂條件和條款", "(2)切實履行各自的義務和責任", "(3)明確被保險人利益受到法律保護", "(4)以上皆是"], ans: 4, note: "契約精神：遵守條款、履行義務、保障權益。", law: "保險法"},
{id: "金融職業道德-482", text: "無行為能力或限制行為能力之人申請登錄保險業務員下列處理何者正確？", options: ["(1)可予登錄", "(2)不予登錄", "(3)經特准可予登錄", "(4)可自由決定登錄"], ans: 2, note: "無行為能力或限制行為能力人不得登錄。", law: "保險業務員管理規則"},
{id: "金融職業道德-483", text: "有重大喪失債信情事尚未了結或了結後尚未逾三年之已登錄保險業務員，應作何處置？", options: ["(1)維持登錄", "(2)若申請登錄，應不予登錄；已登錄者，所屬公司應通知各有關公會註銷登錄", "(3)撤銷或維持登錄均可", "(4)經允許可維持登錄"], ans: 2, note: "喪失債信是消極資格，應註銷登錄。", law: "保險業務員管理規則"},
{id: "金融職業道德-484", text: "金融從業人員銷售保險商品之招攬廣告，除應遵守相關法令外，並應遵守什麼規定？", options: ["(1)商場守則", "(2)商場資訊", "(3)保險業相關自律規範", "(4)以上皆是"], ans: 3, note: "自律規範是業界共同遵守的準則。", law: "保險業招攬廣告自律規範"},
{id: "金融職業道德-485", text: "下列有關金融從業人員從事保險招攬所用的文宣、廣告、簡介、商品說明書及建議書等文書，何者為是？", options: ["(1)應標明所屬公司之名稱", "(2)內容應與保險公司報經主管機關審查通過之保險單條款、費率及要保書等文件相符", "(3)經所屬公司核可同意使用，其內容並應符合主管機關訂定之資訊揭露規範", "(4)以上皆是"], ans: 4, note: "標明名稱、內容相符、經核可。", law: "保險業招攬廣告自律規範"},
{id: "金融職業道德-486", text: "金融從業人員從事保險業務招攬，主張損害補償原則，主要理由為何？", options: ["(1)預防道德危險發生", "(2)預防損害發生", "(3)預防不當得利發生", "(4)以上皆是"], ans: 3, note: "損害補償原則旨在填補損失，防止被保險人因保險獲利（不當得利）。", law: "保險法"},
{id: "金融職業道德-487", text: "金融服務業及其受僱人員不得有下列何者行為?", options: ["(1)違反法令或相關規章之情事", "(2)違反公司內部規定之情事", "(3)破壞同業和諧及公共利益之情事", "(4)以上皆是"], ans: 4, note: "違法、違規、破壞公益皆禁止。", law: "職業道德規範"},
{id: "金融職業道德-488", text: "金融從業人員於執行業務時，下列敘述何者正確?", options: ["(1)不得同意或默許他人使用自己之名義執行業務", "(2)經主管要求，得同意他人使用自己之名義執行業務", "(3)為公司業績考量，得默許他人使用自己之名義執行業務", "(4)未考取執照前，得借用其他業務員名義執行業務"], ans: 1, note: "禁止借牌或借名。", law: "職業道德規範"},
{id: "金融職業道德-489", text: "金融從業人員為了吸引並留住客戶：", options: ["(1)應自我充實，提供專業服務", "(2)可以毀損其他同業商譽", "(3)可以惡性殺價，與同業競爭", "(4)可以幫客戶代墊款項"], ans: 1, note: "專業服務是正途。(2)(3)(4)皆違規。", law: "職業道德規範"},
{id: "金融職業道德-490", text: "金融服務業及其受僱人員，下列敘述何者有誤?", options: ["(1)對客戶不得有背信、詐欺或侵害客戶權益之行為", "(2)不得非法動支或挪用客戶資金", "(3)不得為業務之招攬，而為誇大不實、偏頗之廣告宣傳", "(4)為招攬業務，得與客戶約定分享利益或共同承擔損失"], ans: 4, note: "禁止約定分享利益或共擔損失。", law: "證券商負責人與業務人員管理規則"},
{id: "金融職業道德-491", text: "下列何者為金融從業人員應有的職業道德?", options: ["(1)對於內部業務人員之違規事件，應主動向主管報告", "(2)對於內部業務人員之違規事件，應代為掩護以維持同事情誼", "(3)對於內部業務人員之違規事發暗自竊喜並落井下石", "(4)對於同業之違規應大加韃伐，自家公司違規則無所謂"], ans: 1, note: "舉報違規是維護公司與客戶利益的道德義務。", law: "內部控制制度"},
{id: "金融職業道德-492", text: "關於金融服務業之敘述，下列何者為非?", options: ["(1)得秉持誠信公平原則，儘速處理交易糾紛", "(2)得從事地下金融活動以牟取客戶及公司之最大利益", "(3)得確實遵守洗錢防制法及相關規定", "(4)得建立完備的內控內稽制度並確實執行"], ans: 2, note: "地下金融違法。", law: "銀行法/洗錢防制法"},
{id: "金融職業道德-493", text: "金融服務業及其受僱人員不應以業績為優先考量，對於下列何者應拒絕其交易?", options: ["(1)未完成開戶手續者", "(2)經評估逾越其交易能力而無法提供適當擔保者", "(3)不適合該金融商品交易者", "(4)以上皆是"], ans: 4, note: "未開戶、信用不足、不適合皆應拒絕。", law: "金融消費者保護法"},
{id: "金融職業道德-494", text: "金融從業人員應確實遵守法令規範，如有觸法經主管機關發函要求暫停職務者，則下列行為何者適當?", options: ["(1)為不影響客戶權益，照常執行業務", "(2)依法暫停執行業務並自我改進", "(3)借用其他業務人員之名義執行業務", "(4)以未收到發函為藉口，拒絕暫停執行業務"], ans: 2, note: "依法執行行政處分，暫停業務。", law: "行政執行法"},
{id: "金融職業道德-495", text: "金融從業人員於執行工作時，如發現其他人員有不法情事，何者敘述適當?", options: ["(1)應通報內部權責單位處理", "(2)基於保密原則，假裝若無其事", "(3)當機立斷，直接請其改正", "(4)與其交換條件，牟取自身利益"], ans: 1, note: "通報內部稽核或法遵。", law: "內部控制制度"},
{id: "金融職業道德-496", text: "從事證券及金融相關專門職業，有那些特性? ", options: ["(1)維持高度職業倫理道德的承諾", "(2)強制性再教育訓練的專業要求", "(3)利他主義態度的普及", "(4)以上皆是"], ans: 4, note: "專業特徵：倫理、持續進修、利他。", law: "專業精神"},
{id: "金融職業道德-497", text: "對於一個證券或金融從業人員而言，下列何者為最重要的因素？", options: ["(1)服裝儀容", "(2)職業道德", "(3)人脈", "(4)家世背景"], ans: 2, note: "職業道德是金融業的基石（信賴產業）。", law: "職業道德規範"},
{id: "金融職業道德-498", text: "證券商之業務人執行務應本誠實及信用原則，下列何者是其本於職業道德而不得有之行為？", options: ["(1)約定與客戶共同承擔買賣有價證券之交易損失，而從事證券買賣", "(2)對於客戶買賣證券之委託成交立刻回報", "(3)客戶開戶時必須向客戶說明契約內容的重要事項", "(4)以公司及業務人員之名義接受客戶委託買賣證券"], ans: 1, note: "共擔損失違法。", law: "證券商負責人與業務人員管理規則"},
{id: "金融職業道德-499", text: "下列何者為證券主管機關對於證券商負責人與業務人員管理的規範事項？", options: ["(1)證券商之業務人員應參加證券主管機關或其指定機構辦理之職前訓練與在職訓練", "(2)禁止證券商負責人與業務人員利用職務之機會，從事虛偽、詐欺或其他足致他人誤信之活動", "(3)執行業務之人員應符合主管機關規定之資格條件", "(4)以上皆是"], ans: 4, note: "訓練、資格、行為規範。", law: "證券商負責人與業務人員管理規則"},
{id: "金融職業道德-500", text: "為促進證券業遵守法規及落實金融消費者保護，證券商業務人銷售衍生性金融商品不得有下列何者行為？", options: ["(1)與客戶約定分享利益或承擔損失，直接或間接要求、期約或收受不當之金錢、財物或其他利益", "(2)擅自修改或製作相關標準文件交付予客戶", "(3)擅自為客戶進行交易，或私自挪用客戶款項", "(4)以上皆是"], ans: 4, note: "利益交換、竄改文件、挪用款項皆禁止。", law: "證券商辦理衍生性金融商品業務規範"},
{id: "金融職業道德-501", text: "下列何者是證券商訂定衍生性金融商品銷售人員之行為與操守準則應包含之事項?", options: ["(1)不得與客戶約定投資收益分享或損失分攤之承諾", "(2)規範禁止收受或提供不當報酬或饋贈", "(3)不得以任何方式向客戶提供建議買賣訊息", "(4)以上皆是"], ans: 4, note: "防弊規範。選項(3)是指不得提供「建議買賣訊息」（報明牌），與提供「市場資訊」不同，銷售人員應專注於商品說明與適合度，而非投顧行為。", law: "證券商辦理衍生性金融商品業務規範"},
{id: "金融職業道德-502", text: "為促進證券業遵循法規及落實金融消費者保護之公平對待客戶原則，證券商從事結構型商品之銷售或提供相關資訊及行銷文件不得有下列何種情形？", options: ["(1)使人誤信能保證本金之安全或保證獲利", "(2)提供贈品或以其他利益勸誘他人購買結構型商品", "(3)誇大過去之業績或攻訐同業之陳述", "(4)以上皆是"], ans: 4, note: "誤導保本、贈品勸誘、誇大攻訐皆禁止。", law: "境外結構型商品管理規則"},
{id: "金融職業道德-503", text: "下列何者是證券商及其從業人員執行業務關於職業道德的行為規範？", options: ["(1)對客戶提供金融商品與服務應注意誠信與公平交易", "(2)保護並適當使用公司資產", "(3)執行業務必須遵循法令規章", "(4)以上皆是"], ans: 4, note: "誠信公平、保護資產、法規遵循。", law: "職業道德規範"},
{id: "金融職業道德-504", text: "下列何者不是證券商及其從業人員執行業務關於職業道德的行為規範？", options: ["(1)執行業務避免利益衝突", "(2)下班後與親朋好友或同學餐敘", "(3)不洩露公司及客戶的機密資料", "(4)遵照法令及公司管理規章的規定執行業務"], ans: 2, note: "私人餐敘非執行業務之職業道德規範內容（除非涉及洩密或利益交換，但題目意指一般社交）。", law: "職業道德規範"},
{id: "金融職業道德-505", text: "下列關於職業道德的敘述何者為正確？", options: ["(1)消極的職業道德指的是，若有社會大眾或同事監督時能履行職業道德，無人監督或個人獨自承擔工作任務時就放鬆對自己職業道德的約束", "(2)被動地遵從職業道德，指的是在客觀行為人的思想深處或個人意識中有職業道德的約束，能夠在關鍵時候體現職業道德精神", "(3)主動地遵從職業道德，將職業道德作為自己的一種人生境界，一種人生價值，一種靈魂深處的“剛性”約束", "(4)以上皆是"], ans: 4, note: "描述職業道德的三種層次。", law: "倫理學"},
{id: "金融職業道德-506", text: "如何判斷證券商的業務人員是否具有職業道德？", options: ["(1)持有多種證券、期貨、或銀行、保險的專業證照", "(2)不論是否執行業務或在何時何地，均能遵守法規與自律原則", "(3)擁有高額的營業業績並領取高額的營業獎金", "(4)擁有廣闊的政商及人際關係"], ans: 2, note: "道德展現在隨時隨地的自律。", law: "職業道德規範"},
{id: "金融職業道德-507", text: "下列何者屬於證券商及其從業人員執行業務應遵守的執業道德規範？", options: ["(1)忠實執行工作，並以事實為根據", "(2)以政府的法令及公司內部管理規章的規定為準則，嚴明紀律，保守機密", "(3)公司與員工、員工與員工、公司與客戶、員工與客戶間互相尊重，相互配合", "(4)以上皆是"], ans: 4, note: "求真、守法、尊重。", law: "職業道德規範"},
{id: "金融職業道德-508", text: "證券商之從業人員日常執行業務應該遵守何種規定？", options: ["(1)遵守政府的相關法令規定", "(2)若遇到利益衝突事項，應主動向上級報告", "(3)遵守公司所制訂的內部管理規章制度", "(4)以上皆是"], ans: 4, note: "法令、內規、利益衝突通報。", law: "證券商內部控制制度"},
{id: "金融職業道德-509", text: "資本市場是信用市場，市場參與者相互間的信用是市場存在的基礎及價值，因此，證券交易法對於破壞市場信用的行為，通常會處以最嚴厲的處分，下列何者不屬於破壞市場信用的行為？", options: ["(1)內線交易", "(2)人為操縱股價", "(3)員工加班不依法給加班費", "(4)有價證券之募集、發行、私募或買賣有虛偽、詐欺或其他足致他人誤信之行為"], ans: 3, note: "勞資糾紛（加班費）違反勞基法，但不屬於證券交易法規範的「破壞資本市場信用」行為。", law: "證券交易法"},
{id: "金融職業道德-510", text: "下列何者非為充實與增進證券及金融業務人員專業的作法？", options: ["(1)參加軍事訓練", "(2)參加公司內部舉辦或外部專業機構辦理之職前訓練", "(3)持續定期參加公司內部舉辦及外部專業機構辦理之在職訓練", "(4)各種相關證券及金融業專業證照之取得"], ans: 1, note: "軍事訓練非金融專業訓練。", law: "專業訓練規範"},
{id: "金融職業道德-511", text: "下列何者為確保證券商從業人員在公司遵守法令執行業務的作法？", options: ["(1)設置法令遵循單位專責負責推動", "(2)對公司員工施以適當合宜的法規訓練", "(3)內部稽核單位將公司法令遵循制度執行情形列入查核", "(4)以上皆是"], ans: 4, note: "法遵制度包含專責單位、訓練與稽核。", law: "金融控股公司及銀行業內部控制及稽核制度實施辦法"},
{id: "金融職業道德-512", text: "以下敘述何者為是？", options: ["(1)法規過於專業，經辦人員毋須了解法規", "(2)公司主管要求時，經辦再更新法規即可", "(3)經辦人員應隨時注意業務相關法規之更新", "(4)以上皆非"], ans: 3, note: "隨時更新法規知識是專業義務。", law: "職業道德規範"},
{id: "金融職業道德-513", text: "下列何者須符合法定之人員資格條件？", options: ["(1)信託業務人員", "(2)信託管理人員", "(3)信託督導人員", "(4)以上皆是"], ans: 4, note: "信託業各級人員皆須具備法定資格。", law: "信託業負責人應具備資格條件暨信託專責部門人員重點優惠制度"},
{id: "金融職業道德-514", text: "有關人員資格之規定，以下所述何者為錯誤的？", options: ["(1)信託業僱用業務人員雖未符合資格得予試用", "(2)信託業僱用新員工時應考量是否具有資格", "(3)信託業應取得新進員工符合資格證明文件", "(4)未符合相關資格不得調派擔任信託業務人員"], ans: 1, note: "未具資格者不得執行業務，亦不得以試用名義執行。", law: "信託業法"},
{id: "金融職業道德-515", text: "以下何者非屬自律範圍？", options: ["(1)核准營業項目", "(2)廣告自律規範", "(3)會員財務或業務之查核及輔導", "(4)訂定各業自律公約"], ans: 1, note: "核准營業項目是主管機關（金管會）的行政權限，非公會自律範圍。", law: "公會章程"},
{id: "金融職業道德-516", text: "違反會員自律公約之處置，下列何者為非？", options: ["(1)先請示主管機關，核准後再處置", "(2)由各業公會依規定辦理", "(3)依自律公約規定處分", "(4)處分報經各公會理事會決議後執行並報知主管機關"], ans: 1, note: "公會自律處置依公約程序辦理，不需「先」請示主管機關，通常是事後報備。", law: "公會自律公約"},
{id: "金融職業道德-517", text: "違反會員自律公約之處分，以下何者為非？", options: ["(1)處以違約金", "(2)停止其應享有之部分或全部權益", "(3)責令會員對其所屬人員為適當之處分", "(4)終止會員營業執照"], ans: 4, note: "終止營業執照是主管機關權限，公會無權撤照。", law: "公會自律公約"},
{id: "金融職業道德-518", text: "金融從業人員基於職務關係而獲悉與業務相關，但尚未公開之重大消息時，應如何處理?", options: ["(1)可事前散發消息給客戶", "(2)只洩露給親朋好友", "(3)不得為自己、客戶、其他第三人利用該未公開之重大消息獲利", "(4)自己私下獲利"], ans: 3, note: "內線交易禁止。", law: "證券交易法"},
{id: "金融職業道德-519", text: "金融從業人員應遵守守法原則，故：", options: ["(1)可從事內線交易", "(2)不得有違反或幫助他人違反法令之行為", "(3)可洩露客戶資料", "(4)可違反相關規定"], ans: 2, note: "守法原則。", law: "職業道德規範"},
{id: "金融職業道德-520", text: "下列何者不得擔任票券金融公司之董事或經理人？", options: ["(1)該票券金融公司監察人二親等以內之血親", "(2)該票券金融公司監察人一親等姻親", "(3)該票券金融公司監察人之配偶", "(4)以上皆是"], ans: 4, note: "利益迴避，監察人與董經理不得有親屬關係。", law: "票券金融管理法"},
{id: "金融職業道德-521", text: "下列何者不屬於洗錢防制法所稱金融機構？", options: ["(1)票券金融公司", "(2)證券集中保管事業", "(3)人力銀行", "(4)信用卡公司"], ans: 3, note: "人力銀行非金融機構。", law: "洗錢防制法"},
{id: "金融職業道德-522", text: "金融從業人員在工作場所，下列何者行為不在限制範圍內？", options: ["(1)恐嚇", "(2)合作", "(3)歧視", "(4)騷擾"], ans: 2, note: "合作是正向行為，非限制行為。", law: "職場倫理"},
{id: "金融職業道德-523", text: "金融從業人員之職業道德不包含下列何者？", options: ["(1)保護公司資產", "(2)保守客戶秘密", "(3)個人利益至上", "(4)誠信、客觀"], ans: 3, note: "職業道德強調客戶利益與公司利益，非個人利益至上。", law: "職業道德規範"},
{id: "金融職業道德-524", text: "何者為金融從業人員應有之表現？", options: ["(1)知悉公司有重大舞弊案件，應循正當管道向上級通報", "(2)從事不當授信、涉及嚴重違反授信原則之業務", "(3)知悉公司財務及業務重大缺失，未向公司內部稽核部門報告", "(4)為自己或第三人不法之利益，損害公司之利益"], ans: 1, note: "揭弊（Whistleblowing）是應有表現。", law: "內部控制制度"},
{id: "金融職業道德-525", text: "身為金融從業人員應共同信守基本之職業道德不包括下列何者？", options: ["(1)守法原則", "(2)誠實原則", "(3)主觀性原則", "(4)保密原則"], ans: 3, note: "應為「客觀性」原則，而非主觀。", law: "職業道德規範"},
{id: "金融職業道德-526", text: "金融從業人員依據洗錢防制法之規定，不得有下列何種行為？", options: ["(1)掩飾或隱匿因自己或他人重大犯罪所得財物或財產上利益者", "(2)收受、搬運、寄藏或收買他人因重大犯罪所得財物或財產上利益者", "(3)洩露或交付關於申報疑似洗錢交易或洗錢犯罪嫌疑之文書、圖畫、消息或物品者", "(4)以上皆是"], ans: 4, note: "洗錢行為定義及洩密禁止。", law: "洗錢防制法"},
{id: "金融職業道德-527", text: "金融從業人員應如何強化自身之法律知識且養成自律精神？", options: ["(1)不定期檢視相關法令之規定，留意是否有更改與增訂之法律規範", "(2)參與同業公會所舉辦之在職訓練", "(3)秉持守法、誠信原則，在所從事之業務行為上建立誠信與專業精神", "(4)以上皆是"], ans: 4, note: "持續進修與誠信執業。", law: "職業道德規範"},
{id: "金融職業道德-528", text: "金融從業人員之自律行為何者為非？", options: ["(1)未經許可，不得在公司工作時間內，兼任公司以外之任何職務", "(2)對於公司各項文件、函電、簿冊、圖表、典章制度、公物等，得以攜出並對外談論", "(3)對職務上所獲悉之任何未經公司同意公開之營業資訊負有絕對保密義務", "(4)非經主管許可，不得擅自對外發表任何有關公司業務之意見"], ans: 2, note: "公物文件不得擅自攜出或外洩。", law: "職業道德規範"},
{id: "金融職業道德-529", text: "金融服務業內部應加強宣導職業道德觀念，並且鼓勵員工於懷疑或發現有人違反法令規章或道德行為準則時之處理，下列何者不適當？", options: ["(1)隱忍不報", "(2)向監察人報告", "(3)向經理人報告", "(4)向內部稽核主管報告"], ans: 1, note: "隱匿不報會助長舞弊。", law: "上市上櫃公司誠信經營守則"},
{id: "金融職業道德-530", text: "金融從業人員為發揚自律精神，應共同信守之規範，下列何者除外？", options: ["(1)董監事對與本人有利害關係之交易，自行迴避", "(2)對客戶之資料，除基於法令規定外，應保守秘密", "(3)爭取業務時，與相關公司或人員間有不當利益之約定或收受", "(4)不以脅迫、利誘或其他不正當方式，獲取其他同業之行銷機密或其交易人相對資料"], ans: 3, note: "選項(3)是「不當行為」，是被規範禁止的，而非應信守的正面價值（或者說是應共同信守「不」做該行為，題目問「信守之規範...除外」，意指哪一項是違反規範的行為）。標準答案(3)。", law: "職業道德規範"},
{id: "金融職業道德-531", text: "關於金融服務業從事授信業務之規範，下列敘述何者有誤？", options: ["(1)對於授信客戶，應本公平誠信及權利義務對等原則，將有關約定事項訂明於契約並告知之", "(2)對授信案件應力求公正客觀並兼顧自身利益與社會公益", "(3)對人員之晉用應循正當途徑延攬，並長期有計畫培訓，以充實專業知識，並提高素質", "(4)為保障自身利益，對授信客戶重大不良訊息不宜互相通報"], ans: 4, note: "重大不良訊息應透過聯徵中心等機制通報，以維護金融安全。", law: "銀行公會授信準則"},
{id: "金融職業道德-532", text: "欲從事未經主管機關核定之業務時，應如何辦理？", options: ["(1)報請公會備查後辦理", "(2)俟呈報董事會通過後辦理", "(3)經股東大會通過後即可辦理", "(4)經主管機關核准後方得辦理"], ans: 4, note: "金融業為特許行業，新種業務須經核准。", law: "銀行法/證券交易法"},
{id: "金融職業道德-533", text: "金融相關從業人員之資格條件，下列何項不在優先考慮範圍之內?", options: ["(1)品德", "(2)專業", "(3)相關經驗", "(4)性別"], ans: 4, note: "性別平等。", law: "就業服務法"},
{id: "金融職業道德-534", text: "金融從業人員於尚未符合相關人員資格時：", options: ["(1)可經辦各項業務", "(2)代理經辦相關業務", "(3)不得經辦相關業務", "(4)於能力範圍內，仍可執行相關業務"], ans: 3, note: "未取得資格不得執行業務。", law: "各業別負責人與業務人員管理規則"},
{id: "金融職業道德-535", text: "關於金融從業人員之道德規範，下列敘述何者為正確？", options: ["(1)因為自身的安危，即使知道直屬主管違反法規也不能越級報告", "(2)為了同事間和諧的氣氛，我應該將同事私下向客戶收受回扣的事保密", "(3)雖然金融從業人員必須保守客戶的秘密，但若家人需要，可以透露一些無所謂", "(4)對於客戶的無禮要求，仍然必須依公司規定辦理"], ans: 4, note: "堅持原則，依規定辦理。(1)應報告 (2)應檢舉 (3)不可透露。", law: "職業道德規範"},
{id: "金融職業道德-536", text: "金融從業人員基於職務之故而獲悉與業務相關尚未公開之重大消息時，應如何處理？", options: ["(1)利用所得之資訊為自己取得最佳之利益", "(2)將該未公開資訊提供給自己的客戶，以牟取利益", "(3)基於職業道德規範，重大消息未公開之前不應利用該資訊獲取利益，且資訊之運用須符合法令規定", "(4)利用此未公開資訊為自己、客戶或自己的親友作內線交易以獲取利益"], ans: 3, note: "內線交易禁止。", law: "證券交易法"},
{id: "金融職業道德-537", text: "金融從業人員發現公司內部有涉嫌違反法紀活動時，需透過正當管道向主管機關舉發，下列何者為非法活動？", options: ["(1)內線交易", "(2)盜用資金", "(3)洗錢", "(4)以上皆是"], ans: 4, note: "皆為嚴重違法行為。", law: "刑法/證交法/洗錢防制法"},
{id: "金融職業道德-538", text: "近年來隨著對公眾利益的保護增加，從業人員除應遵守相關法律規範外，另有何種規範相應而生並隨之增加，其旨在藉由本業自我約束力量使市場秩序更臻完善?", options: ["(1)自律規範", "(2)作業標準", "(3)罰款", "(4)擔保"], ans: 1, note: "自律規範 (Self-Regulation)。", law: "金融監理"},
{id: "金融職業道德-539", text: "金融從業人員得遵守下列單位所訂規範？", options: ["(1)從業人員自律規範", "(2)政府機關命令", "(3)公司規章", "(4)以上皆是"], ans: 4, note: "法律、命令、自律規範、內規皆須遵守。", law: "金融法規"},
{id: "金融職業道德-540", text: "懲戒違反道德行為準則之員工時，應有下列何者考量？", options: ["(1)逕行公開譴責", "(2)逕行吊銷或撤銷相關資格者，不得於媒體公告之，以保障其工作權及隱私權", "(3)應給予申復機會及救濟管道", "(4)以上皆是"], ans: 3, note: "程序正義：應給予申訴機會。", law: "勞基法/工作規則"},
{id: "金融職業道德-541", text: "道德行為規範應包括何種原則？", options: ["(1)守法原則、誠信原則、自律原則", "(2)保密原則、能力原則、資訊公開原則", "(3)客戶利益優先原則、利益衝突原則、禁止不當得利原則", "(4)以上皆是"], ans: 4, note: "道德規範涵蓋上述所有原則。", law: "職業道德規範"},
{id: "金融職業道德-542", text: "金融從業人員在自己的工作領域中，應：", options: ["(1)專注自己及他人之升遷", "(2)不參加公司的教育訓練", "(3)不斷加強自己的專業知識", "(4)不涉獵本業以外之相關知識"], ans: 3, note: "持續精進專業。", law: "職業道德規範"},
{id: "金融職業道德-543", text: "道德行為規範適用之事業體為何？", options: ["(1)限於上市櫃公司", "(2)限於金融產業", "(3)限於營利事業", "(4)各種事業體均得適用"], ans: 4, note: "道德規範具普遍性。", law: "企業倫理"},
{id: "金融職業道德-544", text: "各公司道德行為準則規範之適用層級何者正確？", options: ["(1)董事長", "(2)總經理層級以上", "(3)部門主管以上", "(4)有為公司管理事務及簽名權利之人"], ans: 4, note: "適用於所有具管理權限者。", law: "上市上櫃公司訂定道德行為準則參考範例"},
{id: "金融職業道德-545", text: "對於一個真正專業人員的特質，下列敘述何者正確？", options: ["(1)具有專業才識", "(2)遵守最高執業倫理道德標準", "(3)具備「慈善」的基本優點及「愛」的觀點", "(4)以上皆是"], ans: 4, note: "專業、倫理與仁愛。", law: "職業道德規範"},
{id: "金融職業道德-546", text: "下列有關金融從業人員之敘述何者正確？", options: ["(1)向客戶據實告知商品相關內容", "(2)不得為所屬公司授權範圍以外之任何承諾", "(3)對因執行業務所取得之機密資料應遵守資料保護相關法令規定", "(4)以上皆是"], ans: 4, note: "據實、不越權、保密。", law: "職業道德規範"},
{id: "金融職業道德-547", text: "若僅通過金融市場常識與職業道德考試則可銷售下列何種金融商品？", options: ["(1)保險商品", "(2)基金", "(3)推介股票", "(4)以上皆非"], ans: 4, note: "此考試為共同科目，銷售特定商品仍需取得該商品之專業證照（如保險業務員、投信投顧業務員）。", law: "金融人員資格規範"},
{id: "金融職業道德-548", text: "金融從業人員要落實公平待客原則，必須先奠定從業人員認定公平待客之重要性，首要將下列何者列為宗旨", options: ["(1)優先保障公司權益", "(2)優先保障集團利益", "(3)優先保障金融消費者利益", "(4)以上皆是"], ans: 3, note: "公平待客核心為保障消費者權益。", law: "金融服務業公平待客原則"},
{id: "金融職業道德-549", text: "有關金融從業人員辦理投資型金融商品推介或銷售業務時，下列敘述何者正確？", options: ["(1)應保護投資者合法權益", "(2)應遵守相關法令規定", "(3)推廣文宣應清楚、公正及不誤導投資人", "(4)以上皆是"], ans: 4, note: "保護權益、守法、廣告誠實。", law: "投資型保險商品銷售應注意事項"},
{id: "金融職業道德-550", text: "對於金融從業人員之行為，下列何者為非？", options: ["(1)不應利用公司內部資訊為自己謀取利益", "(2)可與客戶約定分享利益或共同承擔損失", "(3)不可利用客戶帳戶或名義為自己從事交易", "(4)不可將他人或自己帳戶供客戶從事交易"], ans: 2, note: "禁止約定分享利益或共擔損失。", law: "證券商負責人與業務人員管理規則"},
{id: "金融職業道德-551", text: "對於金融從業人員之行為規範，下列何者正確？", options: ["(1)不得涉及賭博情事", "(2)應避免不當的交際應酬", "(3)應避免不當的餽贈", "(4)以上皆是"], ans: 4, note: "賭博、不當應酬與餽贈皆可能影響從業人員之公正性與廉潔。", law: "金融從業人員道德規範"},
{id: "金融職業道德-552", text: "金融從業人員對於往來客戶，於符合法令規定之範圍內，下列作為何者為是？", options: ["(1)提供客戶充足之資訊，以便其充分瞭解公司業務", "(2)當客戶合法權益受到侵害時，應正面回應，並作妥適之處理", "(3)確實依據相關法令、公司章程之規定，忠實履行職務", "(4)以上皆是"], ans: 4, note: "資訊揭露、權益維護、忠實履職。", law: "金融消費者保護法"},
{id: "金融職業道德-553", text: "信用卡發卡機構辦理催收欠款業務時，下列何項為應遵守之事項？", options: ["(1)不得違反公共利益", "(2)僅能對債務人本人及其保證人催收", "(3)不得對非債務之第三人之干擾或催討", "(4)以上皆是"], ans: 4, note: "催收行為不得騷擾無關之第三人。", law: "信用卡業務機構管理辦法"},
{id: "金融職業道德-554", text: "信用卡發卡機構之行銷人員從事下列行為何者不正確？", options: ["(1)自行勾選未經客戶同意申請之卡片", "(2)確認客戶申請之卡片", "(3)確認客戶資料無誤才送件", "(4)確認申請人本人身分，以免冒名申請"], ans: 1, note: "未經同意勾選申請項目涉及偽造文書與不當行銷。", law: "信用卡業務機構管理辦法"},
{id: "金融職業道德-555", text: "銀行辦理催收業務時，下列敘述何項為非？", options: ["(1)不得違反公共利益", "(2)僅能對債務人本人及其保證人催收", "(3)應有保密之義務", "(4)得對非債務之第三人干擾或催討"], ans: 4, note: "禁止對第三人干擾或催討。", law: "金融機構辦理應收債權催收作業委外處理要點"},
{id: "金融職業道德-556", text: "有關金融從業人員辦理衍生性金融商品業務應遵守事項，下列敘述何者有誤？", options: ["(1)應提供客戶有關商品之產品內容、交易條件及特性", "(2)應說明客戶投資本商品可能之預期收益", "(3)應於交易契約中揭示可能發生之風險，對客戶善盡風險告知義務", "(4)可與客戶約定分享利益或共同承擔損失"], ans: 4, note: "禁止與客戶約定分享利益或承擔損失。", law: "銀行辦理衍生性金融商品業務內部作業制度及程序管理辦法"},
{id: "金融職業道德-557", text: "有關金融從業人員辦理衍生性金融商品業務，應提醒客戶於交易前充分瞭解之事項，下列何者為正確？", options: ["(1)商品之性質", "(2)相關之財務、會計、稅制或法律等事宜", "(3)自行審度本身財務狀況及風險承受度", "(4)以上皆是"], ans: 4, note: "衍生性商品複雜度高，需全方位了解。", law: "銀行辦理衍生性金融商品業務內部作業制度及程序管理辦法"},
{id: "金融職業道德-558", text: "下列關於金融從業人員辦理投資型金融商品推介或銷售業務時，下列應遵守之事項何者有誤？", options: ["(1)依據客戶風險之承受度提供客戶適當之商品", "(2)避免不當銷售或推介之行為", "(3)不可販售客戶資料，惟可提供給自己親友開設的公司參考", "(4)廣泛了解客戶之家庭背景、生涯規劃"], ans: 3, note: "客戶資料除法令規定外，絕對禁止提供給親友或第三人。", law: "個人資料保護法"},
{id: "金融職業道德-559", text: "金融從業人員辦理投資型金融商品推介或銷售業務時，為避免糾紛，應遵守下列何種事項？", options: ["(1)應以善良管理人之注意義務及忠實義務，本誠實信用原則執行業務", "(2)應依據客戶風險之承受度銷售或推介客戶適當之商品或投資組合", "(3)不得銷售或推介逾越客戶財力狀況或合適之投資範圍以外之商品", "(4)以上皆是"], ans: 4, note: "誠信、適合度、不逾越財力。", law: "投資型保險商品銷售應注意事項"},
{id: "金融職業道德-560", text: "金融從業人員辦理徵信工作，以下敘述何者有誤？", options: ["(1)徵信人員應依誠信公正原則，辦理徵信工作", "(2)為謀徵信工作迅速完成，徵信單位對於經常往來客戶，毋需再辦理徵信", "(3)徵信人員對徵信資料應依法嚴守秘密", "(4)辦理徵信，除另有規定外，應以直接調查為主，間接調查為輔"], ans: 2, note: "經常往來客戶仍應定期辦理覆審或徵信更新，不可免除。", law: "銀行授信準則"},
{id: "金融職業道德-561", text: "金融從業人員於推介或銷售投資型金融商品時，不得有下列何者行為？", options: ["(1)向業者收受佣金回扣", "(2)未經客戶授權，擅自為客戶進行交易", "(3)私自挪用客戶款項", "(4)以上皆是"], ans: 4, note: "回扣、擅自交易、挪用皆為重大違規。", law: "金融消費者保護法"},
{id: "金融職業道德-562", text: "金融從業人員遇客戶結購外幣現鈔或旅行支票時，以下敘述何者正確？", options: ["(1)結購外幣現鈔或旅行支票後，請客戶當面點清", "(2)提醒客戶妥為保管，以免被竊或遺失", "(3)請客戶將旅行支票與購買合約書分開保管，避免兩者同時被竊或遺失而無法申請掛失", "(4)以上皆是"], ans: 4, note: "現金點收與保管提醒是櫃檯服務基本要求。", law: "銀行臨櫃作業規範"},
{id: "金融職業道德-563", text: "證券投信投顧公會會員自律公約，適用於：", options: ["(1)投信投顧業務人員", "(2)投顧事業負責人", "(3)證券投資信託事業", "(4)以上皆是"], ans: 4, note: "公會會員及其從業人員皆適用。", law: "投信投顧公會會員自律公約"},
{id: "金融職業道德-564", text: "金融服務業應共同信守的基本業務經營原則是：", options: ["(1)專業原則", "(2)保密原則", "(3)公平競爭原則", "(4)以上皆是"], ans: 4, note: "專業、保密、公平競爭。", law: "職業道德規範"},
{id: "金融職業道德-565", text: "下列何者不得接受上市、上櫃公司、證券承銷商所提供利益或其它利益?", options: ["(1)各金融事業公會會員", "(2)金融事業負責人", "(3)金融從業人員", "(4)以上皆是"], ans: 4, note: "禁止收受不當利益。", law: "上市上櫃公司誠信經營守則"},
{id: "金融職業道德-566", text: "投顧事業業務廣告如違反相關規範，投信投顧公會應進行查證，對於涉有違反規範之情事者將如何處理？", options: ["(1)提證期局審議", "(2)提消保會議處", "(3)直接報金管會", "(4)提公會自律委員會審議"], ans: 4, note: "公會具有自律處分權，先提自律委員會審議。", law: "投信投顧事業廣告及營業活動行為規範"},
{id: "金融職業道德-567", text: "金融從業人員懷疑公司同事涉及違法情事，應採取以下哪些行動？", options: ["(1)瞭解相關法令的規定避免自己涉及該違法情事", "(2)依公司規定報告，防阻非法行為發生", "(3)選項(1)及(2)", "(4)以上皆非"], ans: 3, note: "自保並通報。", law: "職業道德規範"},
{id: "金融職業道德-568", text: "以下哪一行為不違反投信投顧會員自律公約？", options: ["(1)基金經理人接受客戶旅遊招待", "(2)證券分析人員根據未公開訊息做出投資建議", "(3)新進的全權委託經理人依據報載及從友人同事處所得訊息管理代操資金", "(4)以在投信投顧公會登記的名稱進行業務招攬，並提供公司經主管機關核准之營業執照字號"], ans: 4, note: "使用登記名稱與核准字號是合規行為。", law: "投信投顧公會會員自律公約"},
{id: "金融職業道德-569", text: "下列何者不違反投信投顧公會會員自律公約？", options: ["(1)向上市公司募集基金，並將經理之基金投資於該上市公司股票", "(2)不洩露所管理的基金或委任人委任事項的相關資訊", "(3)向上櫃公司募集基金，且承諾將該資金投資於該上櫃公司服票", "(4)在未經核准前，接受客戶預約認購基金"], ans: 2, note: "保密不違反公約。(1)(3)涉及利益輸送與保證投資；(4)偷跑違規。", law: "投信投顧公會會員自律公約"},
{id: "金融職業道德-570", text: "金融從業人員自律規範中，有關個人交易須申報的帳戶規範對象為：", options: ["(1)以自己名義開立之帳戶", "(2)配偶之帳戶", "(3)配偶利用他人名義持有者之他人帳戶", "(4)以上皆是"], ans: 4, note: "申報範圍包含本人、配偶、未成年子女及利用他人名義之帳戶。", law: "證券投資信託事業負責人與業務人員管理規則"},
{id: "金融職業道德-571", text: "吳自強是一位證券分析人員，他從上市公司ABC 的員工處得知ABC 產品設計發生重大瑕疵，並且主要客戶因此已經取消大部分的訂單。吳自強發現該消息尚未公佈，吳自強應該：", options: ["(1)立即向公司指定人員或部門提出書面報告", "(2)透露消息給報章雜誌媒體", "(3)依據公平公正原則通知所有客戶", "(4)通知親朋好友放空該ABC 公司股票"], ans: 1, note: "發現內線消息應依內部程序報告並列管保密，不得對外洩漏或交易。", law: "證券交易法"},
{id: "金融職業道德-572", text: "為了保護金融消費者權益，讓金融消費爭議能公平、合理、有效的處理，下列何者是最重要且為金融業務整合性的專業法律？", options: ["(1)金融消費者保護法", "(2)消費者保護法", "(3)個人資料保護法", "(4)證券投資人及期貨交易人保護法"], ans: 1, note: "金融消費者保護法（金消法）是專為金融消費爭議設計的整合性法律。", law: "金融消費者保護法"},
{id: "金融職業道德-573", text: "下列何者是屬於金融消費者保護法所謂的金融消費爭議，而受金融消費者保護法的保護？", options: ["(1)金融消費者與金融服務業間因商品或服務所生之刑事爭議", "(2)金融消費者與金融服務業間因商品或服務所生之民事爭議", "(3)金融消費者與金融服務業間因商品或服務所生之刑事及民事爭議", "(4)金融消費者與金融服務業間所生之任何爭議"], ans: 2, note: "金消法處理的是「民事」爭議。", law: "金融消費者保護法第1條"},
{id: "金融職業道德-574", text: "下列何者為受金融消費者保護法保護之接受金融服務業提供金融商品或服務的金融消費者？", options: ["(1)專業投資機構", "(2)符合一定財力或專業能力之自然人或法人", "(3)前述兩項以外的一般自然人或法人", "(4)任何接受金融服務業提供金融商品或服務之金融消費者"], ans: 3, note: "專業投資機構及符合一定財力/專業能力者（專業投資人）不受金消法保護（視為有能力保護自己）。", law: "金融消費者保護法第4條"},
{id: "金融職業道德-575", text: "證券商接受法人、其他機構或特定自然人授權買賣有價證券，為避免交易紛爭及業務人員操縱舞弊，下列何者不是證券商應注意的事項?", options: ["(1)應提供特別資訊與服務", "(2)應確保客戶委託係依公平及衡平方式予以執行", "(3)應注意依相關規定適當保存完善之執行委託紀錄及交易憑證", "(4)應確定經紀部門及自營部門間應有適當之防火牆"], ans: 1, note: "應公平對待客戶，不應提供涉及不當利益的「特別」資訊或服務（可能涉及內線或不公）。", law: "證券商內部控制制度"},
{id: "金融職業道德-576", text: "依證券交易法規定，證券商非加入證券商同業公會不得開業，而加入證券商同業公會必須簽署會員自律公約並承諾共同信守之。證券商經營有價證券經紀業務，下列何者不是應共同信守的基本要求?", options: ["(1)不得散布不實資訊，誤導投資大眾", "(2)不得策動他人聯手炒作股票", "(3)不得從事非法之股票仲介交易", "(4)散播不實言論，中傷其他會員"], ans: 4, note: "題目問「下列何者不是...應信守的基本要求」，意指「哪一個選項是違反規範的行為」。(1)(2)(3)是「不得做」的規範描述（即要求會員不得做這些事），而(4)「散播不實言論」這個行為本身是錯的，是被禁止的，不是「要求信守」的正面價值（或者說，要求是「不得散播」）。本題邏輯選出「錯誤行為」。", law: "證券商同業公會會員自律公約"},
{id: "金融職業道德-577", text: "為公平合理、迅速有效處理金融消費爭議，以保護金融消費者權益，下列何者為依金融消費者保護法設立之金融消費爭議處理機構？", options: ["(1)財團法人證券投資人及期貨交易人保護中心", "(2)財團法人金融消費評議中心", "(3)財團法人中華民國證券暨期貨市場發展基金會", "(4)行政院消費者保護會"], ans: 2, note: "依金消法設立者為「金融消費評議中心」。", law: "金融消費者保護法第13條"},
{id: "金融職業道德-578", text: "金融服務業從事廣告、業務招攬及營業促銷活動，不得有下列何種情事？", options: ["(1)違反法令、主管機關之規定或自律規範", "(2)虛偽、不實、隱匿、或其他足致他人誤信", "(3)損害金融服務業或他人營業信譽", "(4)以上皆是"], ans: 4, note: "廣告招攬「三不得」。", law: "金融消費者保護法第8條"},
{id: "金融職業道德-579", text: "依證券交易法規定，證券商非加入證券商同業公會不得開業，而加入證券商同業公會必須簽署會員自律公約並承諾共同信守之。證券商經營有價證券經紀業務，下列何者不是應共同信守的基本要求?", options: ["(1)對客戶提供、揭露之資訊可依客戶之重要程度而有特殊不同之待遇", "(2)應主動發掘或舉發內部業務人員之違規事件﹔對同業之違規行為，若知情者，亦應主動檢舉", "(3)應盡協助維護市場交易秩序及防杜不法交易之義務", "(4)應落實洗錢防制注意事項及徵信制度"], ans: 1, note: "應公平對待所有客戶，資訊揭露不得有差別待遇。", law: "證券商同業公會會員自律公約"},
{id: "金融職業道德-580", text: "金融服務業從事廣告、業務招攬及營業促銷活動，不得有下列何種情事？", options: ["(1)故意截取報章雜誌不實之報導作為廣告內容", "(2)對於業績及績效作誇大之宣傳", "(3)使用之文字或訊息內容使人誤信能保證本金之安全或保證獲利", "(4)以上皆是"], ans: 4, note: "不得引用不實報導、不得誇大、不得保證獲利。", law: "金融消費者保護法"},
{id: "金融職業道德-581", text: "證券商業務人員辦理衍生性金融商品交易業務，於交易相對人要求確認其身分時，應如何處理?", options: ["(1)請客戶自行打電話給公司確認", "(2)應配合出示身分證明文件或識別證件", "(3)立刻報警處理", "(4)不予理會，要辦不辦隨客戶便"], ans: 2, note: "業務人員有義務出示證件證明身分。", law: "證券商辦理衍生性金融商品業務規範"},
{id: "金融職業道德-582", text: "金融消費者向財團法人金融消費評議中心申請金融消費爭議之評議，下述何種情形將會被決定不受理？", options: ["(1)未先向金融服務業申訴", "(2)非屬金融消費爭議", "(3)申請已逾法定期限", "(4)以上皆是"], ans: 4, note: "申訴前置原則、適格爭議、時效內申請。", law: "金融消費者保護法"},
{id: "金融職業道德-583", text: "財團法人金融消費評議中心對金融服務業與金融消費者間之金融消費爭議所作出的評議決定書，經送經法院核可者，其法律效力如何？", options: ["(1)與民事確定判決有同一之效力", "(2)金融服務業與金融消費者事後可再進行協商", "(3)金融服務業得就該事件再次申請評議", "(4)金融服務業事後後悔，可不接受評議決定"], ans: 1, note: "經法院核可之評議決定，具有與民事確定判決同一之效力（強制執行力）。", law: "金融消費者保護法第30條"},
{id: "金融職業道德-584", text: "證券商為證券市場的重要專業中介機構，是受高度監理的行業，基於公平、誠實、守信、透明原則從事證券商業活動。為落實誠信經營，並防範不誠信行為，下列何者屬於證券商規範從業人員於執行業務時應注意的事項?", options: ["(1)禁止公司人員直接或間接提供、收受、承諾或要求不正當利益", "(2)應避免與涉有不誠信行為之代理商、供應商、客戶或其他商業往來對象從事商業交易", "(3)禁止提供或承諾任何疏通費", "(4)以上皆是"], ans: 4, note: "誠信經營守則包含禁止賄賂、避免不誠信交易對象。", law: "上市上櫃公司誠信經營守則"},
{id: "金融職業道德-585", text: "下列何者是屬於金融消費者保護法所稱的金融服務業？", options: ["(1)證券業", "(2)銀行業", "(3)期貨業", "(4)以上皆是"], ans: 4, note: "金消法適用於銀行、證券、期貨、保險等金融服務業。", law: "金融消費者保護法第3條"},
{id: "金融職業道德-586", text: "金融消費爭議當事人、爭議處理機構及其人員，對於金融消費爭議事件所提出之申請、各種資料、協商讓步事項或評議過程有保密之義務，在何種狀況下，才可予以公開？", options: ["(1)已經公開者", "(2)依法令規定可公開者", "(3)經當事人同意者", "(4)以上皆是"], ans: 4, note: "保密是原則，公開是例外。", law: "金融消費者保護法"},
{id: "金融職業道德-587", text: "下列何者是證券商之業務人員執行業務符合法令規定之行為?", options: ["(1)與客戶約定替其操作股票，且每獲利達特定額度即可進行分潤", "(2)不代客戶保管存摺、印鑑、蓋妥章之空白取款條", "(3)辦理上市承銷案之詢價圈購配售作業，利用他人帳戶認購上開股票，並於上市首5 日賣出", "(4)為避免客戶發生違約交割，代為媒介他人借貸所需款項，以便交割"], ans: 2, note: "不代保管是正確且合規的行為。(1)全委/分潤違規；(3)人頭戶；(4)非法墊款。", law: "證券商負責人與業務人員管理規則"},
{id: "金融職業道德-588", text: "財團法人金融消費評議中心對於金融消費者申請評議之金融消費爭議案件，有那些處理機制？", options: ["(1)未先向該金融服務業經申訴的申請案，先移請該金融服務業先行處理", "(2)試行調處", "(3)進行評議", "(4)以上皆是"], ans: 4, note: "處理程序：移交申訴 -> 調處 -> 評議。", law: "金融消費者保護法"},
{id: "金融職業道德-589", text: "金融服務業招攬、播放廣告及進行業務招攬或營業促銷活動時，下列敘述何者為正確？", options: ["(1)對金融消費者所負擔之的義務不得低於所廣告之內容及進行業務招攬或營業促銷活動時對金融消費者所提示之資料或說明", "(2)不得有虛偽、詐欺、隱匿或其他足致他人誤信之情事", "(3)應確保其廣告內容之真實", "(4)以上皆為正確"], ans: 4, note: "廣告視為契約內容的一部分，且必須真實。", law: "金融消費者保護法第8條"},
{id: "金融職業道德-590", text: "金融服務業對金融消費者進行金融教育宣導，下列敘述何者為正確？", options: ["(1)不得引薦個別金融商品或服務", "(2)對金融消費者說金融商品或服務已獲主管機關核准或備查所以保證安全無虞", "(3)對應經而未經主管機關核准或備查之金融商品或服務預為宣傳促銷", "(4)使用能保證本金之安全或保證獲利之文字或訊息內容"], ans: 1, note: "純粹的金融教育宣導不應涉及特定商品推介，否則即為招攬廣告。", law: "金融服務業從事廣告業務招攬及營業促銷活動準則"},
{id: "金融職業道德-591", text: "金融服務業從事廣告、業務招攬及營業促銷活動，依法皆受到主管機關的監督管理，下列利用何種傳播媒體、宣傳工具或方式屬之？", options: ["(1)電腦、傳真、電話、手機簡訊、廣播、跑馬燈", "(2)宣傳單、布條、招牌、公車或其他交通工具上之廣告", "(3)與公共領域相關之網際網路、電子郵件及電子視訊等", "(4)以上皆是"], ans: 4, note: "凡是公開傳播的方式皆視為廣告。", law: "金融服務業從事廣告業務招攬及營業促銷活動準則"},
{id: "金融職業道德-592", text: "金融服務業從事廣告、業務招攬及營業促銷活動，下列敘述何者不是正確的作法？", options: ["(1)應訂定宣傳資料製作規範與散發公布之控管流程", "(2)宣傳資料於對外使用前，應按業務種類，先行審核", "(3)全權交付廣告公司處理就可以，有問題由廣告公司負全責", "(4)應先確認內容無不當、誤導金融消費者、違反法令後始得對外使用"], ans: 3, note: "金融機構對廣告負有最終責任，需審核管理，不可全推給廣告公司。", law: "金融服務業從事廣告業務招攬及營業促銷活動準則"},
{id: "金融職業道德-593", text: "金融服務業所提供之金融商品或服務，下列何者不屬於金融消費者保護法所稱之投資型金融商品或服務？", options: ["(1)信託業辦理特定金錢信託業務或特定有價證券信託業務，受託投資國內外有價證券、短期票券或結構型商品", "(2)受託買賣非集中市場交易且具衍生性商品性質之外國有價證券業務", "(3)受託買賣國內集中交易或櫃檯買賣市場之黃金業務及銀行辦理與客戶間之黃金現貨買賣及保管業務", "(4)證券投資信託基金及境外基金"], ans: 3, note: "黃金現貨買賣通常被視為商品交易，非金消法定義之複雜「投資型」金融商品（如衍生性商品、基金）。(*註：依金管會函釋，黃金現貨不屬投資型金融商品)", law: "金融消費者保護法"},
{id: "金融職業道德-594", text: "金融服務業與金融消費者訂立提供金融商品或服務之契約前，下列敘述何者為正確？", options: ["(1)應充分了解金融消費者之相關資料，以確保該商品或服務對金融消費者之適合度", "(2)應向金融消費者充分說明該金融商品、服務及契約之重要內容，並充分揭露其風險", "(3)金融服務業對於金融消費者個人資料之蒐集、處理及利用者，應向金融消費者充分說明個人資料保護之相關權利，以及拒絕同意可能之不利益", "(4)以上皆是"], ans: 4, note: "KYC、風險說明、個資告知皆為簽約前義務。", law: "金融消費者保護法"},
{id: "金融職業道德-595", text: "證券商之業務人員執行業務應本誠實及信用原則，下列何者不是其本於職業道德而不得有之行為?", options: ["(1)知悉客戶有利用公開發行公司尚未公開而對其股票價格有重大影響之消息或有操縱市場行為之意圖，而拒絕接受委託買賣", "(2)辦理有價證券承銷業務之人員與發行公司或其相關人員間有獲取不當利益之約定", "(3)向客戶或不特定多數人提供某種有價證券將上漲或下跌之判斷", "(4)向不特定多數人推介買賣特定之股票"], ans: 1, note: "拒絕違法交易（內線/操縱）是「正確」的道德行為，非「不得有」之行為。(2)(3)(4)均為禁止行為。", law: "證券商負責人與業務人員管理規則"},
{id: "金融職業道德-596", text: "證券商辦理基金銷售業務，為提升對基金投資人之服務並保障其權益，證券商及其基金銷售業務人員應有如何的自律規範?", options: ["(1)應盡善良管理人之注意義務，本誠實信用原則，辦理基金銷售業務", "(2)應充分了解客戶，並評估確認客戶對基金產品之適合度", "(3)證券商辦理基金銷售業務之人員應具備規定之資格條件", "(4)以上皆是"], ans: 4, note: "誠信、適合度、資格皆為自律規範要求。", law: "證券商辦理基金銷售業務規範"},
{id: "金融職業道德-597", text: "政府為更積極保護證券投資人，訂定多種專業法律，請問下列何者不屬於此種專業法律？", options: ["(1)證券交易法", "(2)組織犯罪防制條例", "(3)金融消費者保護法", "(4)證券投資人及期貨交易人保護法"], ans: 2, note: "組織犯罪防制條例非證券專業法律。", law: "證券法規"},
{id: "金融職業道德-598", text: "金融服務業在向金融消費者說明金融商品或服務契約之重要內容及揭露風險，下列何者不是應遵守的基本原則？", options: ["(1)應本於誠實信用原則，並以金融消費者能充分瞭解之文字或其他方式為之", "(2)任何說明或揭露之資訊均須應正確完整，不得有虛偽、詐欺、隱匿或其他足致他人誤信之情事", "(3)應以達到業績目標為最高指導原則", "(4)銷售文件之用語應以中文表達並力求淺顯易懂，必要時得附註原文"], ans: 3, note: "最高原則應為保護消費者權益，而非業績目標。", law: "金融消費者保護法"},
{id: "金融職業道德-599", text: "依金融消費者保護法之規定，金融服務業提供金融商品或服務前說明契約重要內容及揭露風險之金融消費者，是指下列何者？", options: ["(1)與金融服務業訂定金融商品或服務契約之契約相對人", "(2)契約相對人為無行為能力人者，其法定代理人", "(3)契約相對人為限制行為能力人、受輔助宣告人者，其法定代理人、輔助人", "(4)以上皆正確"], ans: 4, note: "說明對象包含契約當事人及其法定代理人/輔助人。", law: "金融消費者保護法"},
{id: "金融職業道德-600", text: "證券商經營有價證券承銷、自行買賣、受託買賣等業務，應由何人執行? ", options: ["(1)公司一般職員", "(2)公司董事或監察人", "(3)依證券商負責人及業務人員管理規則規定登記合格之業務人員", "(4)以上人員皆可"], ans: 3, note: "證券業務須由登記合格之業務人員執行。", law: "證券商負責人與業務人員管理規則"},
{id: "金融職業道德-601", text: "證券商經營業務應以公平、合理之方式為之，不得以不合理之收費招攬或從事業務，其收取費用應考量下列何種因素:", options: ["(1)應考量相關營運成本、交易風險、合理利潤及客戶總體貢獻度等因素", "(2)鑒於市場競爭激烈，為順利爭取到業務，不必多考慮公司的營運成本及獲利", "(3)應考量競爭同業收費情形，殺價跟進招攬客戶，爭取業務", "(4)任由證券商營業主管或營業人員自行決定"], ans: 1, note: "收費應考量成本與風險，不可惡性削價。", law: "證券商管理規則"},
{id: "金融職業道德-602", text: "老李至公務機關接洽業務時，下列敘述何者正確？", options: ["(1)花錢要求加快申請案件審理，沒有要求公務員違背職務，並不違法", "(2)唆使公務機關承辦採購人員配合浮報價額，僅屬偽造文書行為", "(3)口頭允諾行賄金額但還沒送錢，尚不構成犯罪", "(4)與公務員同謀之共犯，即便不具公務員身分，仍會依據貪污治罪條例處刑"], ans: 4, note: "(1)屬不違背職務行賄罪；(2)涉貪污治罪條例；(3)期約行賄亦有罪。與公務員共犯貪污罪，雖無身分仍依該條例處斷。", law: "貪污治罪條例"},
{id: "金融職業道德-603", text: "公司在本身合乎規定之情形下申請案件，僅為縮短辦理時程而對公家機關承辦公務員贈送高價禮品，是否合法？", options: ["(1)基於人情世故不構成違法", "(2)構成不違背職務行賄罪", "(3)構成違背職務行賄罪", "(4)送禮均不構成違法送錢才違法"], ans: 2, note: "對公務員關於不違背職務之行為行賄，仍構成犯罪（貪污治罪條例第11條）。", law: "貪污治罪條例"},
{id: "金融職業道德-604", text: "與公務機關有業務往來構成職務利害關係者，下列敘述何者正確？", options: ["(1)將餽贈之財物請公務員配偶代轉，該公務員亦已違反規定", "(2)與公務機關承辦人飲宴應酬為增進基本關係的必要方法", "(3)高級咖啡豆低價售予有利害關係之承辦公務員，有價購行為就不算違反法規", "(4)機關公務員藉子女婚宴廣邀業務往來廠商之行為，並無不妥"], ans: 1, note: "透過配偶收受賄賂或不正利益，視同公務員本人收受。", law: "公務員廉政倫理規範"},
{id: "金融職業道德-605", text: "行（受）賄罪成立要素之一為具有對價關係，而作為公務員職務之對價有「賄賂」或「不正利益」，下列何者不屬於「賄賂」或「不正利益」？", options: ["(1)招待至溫泉飯店住宿泡溫泉", "(2)介紹工作", "(3)免除債務", "(4)開工邀請觀禮"], ans: 4, note: "開工觀禮屬正常禮俗儀式，通常無對價關係或實質不當利益。", law: "貪污治罪條例"},
{id: "金融職業道德-606", text: "小張因案件申請業務至主管機關洽公，下列敘述何者正確？", options: ["(1)適逢農曆春節前夕，基於傳統禮俗應購買高價禮品贈與承辦人員", "(2)應備妥相關文件，依主管機關規定程序申請", "(3)洽公時間延誤承辦人員午休時間，為避免失禮，應請承辦人吃飯", "(4)事前送禮是違法行賄，但事後餽贈是為表達感謝，並無不可"], ans: 2, note: "依法行政，不送禮、不邀宴。", law: "公務員廉政倫理規範"},
{id: "金融職業道德-607", text: "有關向公務機關「請託關說」行為之敘述，下列何者不正確？", options: ["(1)請託關說是指其內容涉及機關業務具體事項之決定或執行，且因該事項之決定或執行致有不當影響特定權利義務之虞者", "(2)要求制訂徇私之特殊規格，以利取得獨家議價權利，進而藉機獲取利益是違法之請託關說", "(3)請民意代表向機關爭取採購標案，是選民服務的一種，並非請託關說", "(4)不當請託關說有可能涉及刑事責任"], ans: 3, note: "請民意代表不當影響採購標案，即使名為選民服務，實質上仍屬「請託關說」（甚至違法）。", law: "行政院及所屬機關機構請託關說登錄查察作業要點"},
